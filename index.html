<body>
<canvas id="aurora"></canvas>
<div class="grain"></div>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   1 — DATEN
   Eigener Schlüssel, damit der alte Tracker unberührt bleibt.
   Beim ersten Start werden die echten Daten übernommen.
   ============================================================ */
const KEY="nova_v1", OLD_KEY="routine_v1";
const CLOUD_ON="nova_cloud_on", CLOUD_TOK="nova_gh_token";
const GH_USER="mattiknp", GH_REPO="routine-tracker", GH_FILE="nova.json";
const GH_API=`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${GH_FILE}`;

const blank=()=>({habits:[],habitLog:{},metrics:{},sport:{},todos:[],planer:{},tplan:{},tplanWoche:{},events:[],pausen:[],
  dayCheck:{},planerTypes:[],planerHidden:[],tplanAus:{},sportTypes:[],sportHidden:[],
  goals:{sleep:8,study:3,phone:0,sport:300},zielTage:null,notes:{},mood:{},water:{},todoFocus:null});

/* Mitgelieferter Stand: dein Backup vom 1. August, direkt eingebacken.
   Greift nur beim allerersten Start oder auf ausdrückliche Anforderung. */
const SEED=null;   /* Diese Fassung enthält keine Daten. */

/* ── Garmin ─────────────────────────────────────────────
   Von der Uhr gelesen und hier abgelegt. Wird bei JEDEM Laden
   nachgetragen, aber nur in Lücken: was du selbst eingetippt
   hast, bleibt unangetastet. Jede Einheit hat ihre Garmin-Kennung,
   deshalb kann nichts doppelt landen.
   ──────────────────────────────────────────────────────── */
const GARMIN={"stand":"","schlaf":{},"training":[]};
const GARMIN_MAP={tennis_v2:"tennis",running:"laufen",treadmill_running:"laufen",
  indoor_cycling:"zone2",cycling:"zone2",strength_training:"kraft"};

function mergeGarmin(){
  if(typeof GARMIN==="undefined"||!GARMIN) return 0;
  let n=0;
  for(const [k,[h,sc,von,bis]] of Object.entries(GARMIN.schlaf||{})){
    const m=S.metrics[k]||(S.metrics[k]={});
    if(!nv(m.sleepHours)){ m.sleepHours=h; n++; }
    if(!nv(m.sleepScore)){ m.sleepScore=sc; n++; }
    if(von&&!m.sleepFrom){ m.sleepFrom=von; m.sleepTo=bis; }
  }
  const bekannt=new Set();
  Object.values(S.sport||{}).forEach(arr=>arr.forEach(e=>{ if(e.gid) bekannt.add(String(e.gid)); }));
  for(const [gid,k,typ,min,hr,name,von] of (GARMIN.training||[])){
    if(bekannt.has(String(gid))) continue;
    const tag=S.sport[k]||(S.sport[k]=[]);
    /* Von Hand erfasste Einheit derselben Art und Länge: die bekommt
       nur die Kennung, damit sie nicht ein zweites Mal auftaucht. */
    /* Garmin misst die reine Bewegungszeit, von Hand notiert man meist
       die ganze Einheit. Deshalb nicht über die Dauer abgleichen,
       sondern über Tag und Art — sonst entsteht ein zweiter Eintrag
       für dasselbe Training. */
    const treffer=tag.find(e=>!e.gid&&e.type===GARMIN_MAP[typ]);
    if(treffer){ treffer.gid=gid; if(!nv(treffer.hr)) treffer.hr=hr; if(von&&!treffer.start) treffer.start=von; continue; }
    tag.push({id:uid(),gid,type:GARMIN_MAP[typ]||"other",duration:min,hr,
              rpe:null,notes:name,kraftSubtype:null,start:von||null});
    n++;
  }
  return n;
}

let S=blank(), imported=false, garminNeu=0;
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){ S=Object.assign(blank(),JSON.parse(raw));
      if(tplanAufraeumen()) persist();
      return; }
    const old=localStorage.getItem(OLD_KEY);
    if(old){ S=Object.assign(blank(),JSON.parse(old)); imported="alt"; persist(); return; }
    if(typeof SEED!=="undefined"&&SEED&&SEED.habits){
      S=Object.assign(blank(),JSON.parse(JSON.stringify(SEED))); imported="seed"; persist(); return; }
  }catch(e){ console.warn("Laden fehlgeschlagen",e); }
  S=blank();
}
/* Erzwingt den mitgelieferten Stand, auch wenn schon Daten da sind. */
function loadSeed(){
  modal(`<h3>Mitgelieferten Stand laden</h3>
    <p style="color:var(--text-dim);font-size:var(--t-base);line-height:1.6">
      Ersetzt alles in NOVA durch dein Backup vom 1. August:
      ${SEED.habits.length} Gewohnheiten, ${Object.keys(SEED.metrics||{}).length} Tage Werte,
      ${Object.keys(SEED.sport||{}).length} Tage Training.</p>
    <div class="mo-act"><button class="b" onclick="closeModal()">Abbrechen</button>
    <button class="b b-1" id="sdOk">Ersetzen</button></div>`);
  document.getElementById("sdOk").onclick=()=>{
    S=Object.assign(blank(),JSON.parse(JSON.stringify(SEED)));
    persist(); closeModal(); toast("Stand geladen"); go(VIEW); paintOrb();
  };
}
/* ── Altlast im Trainingsplaner ─────────────────────────
   Früher ERSETZTE eine Wochenkopie den festen Plan, heute ERGÄNZT sie
   ihn. Wochen, die unter der alten Regel entstanden sind, enthalten
   deshalb eine vollständige Kopie aller angehefteten Blöcke — und
   alles stünde doppelt da. Solche Kopien hier einmalig entfernen.

   Erkannt wird ein Doppel an der Kennung oder, falls die Kopie eine
   eigene bekam, an vollständiger Gleichheit am selben Wochentag.
   Echte Einzeltermine unterscheiden sich in mindestens einem Punkt
   und bleiben unangetastet. */
function tplanAufraeumen(){
  if(!S.tplanWoche||!S.tplan) return 0;
  let weg=0;
  const festeIds=new Set();
  Object.values(S.tplan).forEach(l=>(l||[]).forEach(b=>festeIds.add(b.id)));
  const gleich=(a,b)=>a.type===b.type&&a.start===b.start&&a.end===b.end
                    &&((a.note||"")===(b.note||""));
  Object.keys(S.tplanWoche).forEach(mk=>{
    const W=S.tplanWoche[mk]||{};
    Object.keys(W).forEach(tag=>{
      const fest=S.tplan[tag]||[];
      const vor=W[tag].length;
      W[tag]=W[tag].filter(b=>!(festeIds.has(b.id)||fest.some(f=>gleich(f,b))));
      weg+=vor-W[tag].length;
      if(!W[tag].length) delete W[tag];
    });
    if(!Object.keys(W).length) delete S.tplanWoche[mk];
  });
  return weg;
}

function persist(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function save(){ persist(); if(cloudOn()) queueSync(); }

const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);

/* ── Datum ── */
const p2=n=>String(n).padStart(2,"0");
const dk=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const parsedk=s=>{ const[y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addD=(d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const today=()=>dk(new Date());
const sow=d=>{ const x=new Date(d); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); x.setHours(0,0,0,0); return x; };
const WD=["Mo","Di","Mi","Do","Fr","Sa","So"];
const WDL=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];

/* ── Trainingsplaner ────────────────────────────────────
   Anders als der Tagesplaner hängt er nicht am Datum, sondern am
   Wochentag: ein fester Stundenplan, der jede Woche gleich gilt.
   Deshalb 0..6 als Schlüssel (0 = Montag), nicht "2026-09-07".
   ──────────────────────────────────────────────────────── */
const TWD=["Mo","Di","Mi","Do","Fr","Sa","So"];
const TWDL=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const tplanTag=i=>((S.tplan&&S.tplan[i])||[]).slice()
  .sort((a,b)=>(a.start||"").localeCompare(b.start||""));
/* Montag als 0: getDay() liefert Sonntag als 0, das passt nicht zu
   einer Woche, die montags beginnt. */
const wtagIdx=d=>(d.getDay()+6)%7;
const MS=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const MSL=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const fmtLong=d=>`${WDL[d.getDay()]}, ${d.getDate()}. ${MSL[d.getMonth()]} ${d.getFullYear()}`;
const fmtShort=d=>`${d.getDate()}. ${MS[d.getMonth()]}`;
const nv=v=>v!==undefined&&v!==null&&!isNaN(v);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const f=n=>Number(n).toFixed(1).replace(".",",");
const stdDe=min=>String(Math.round(min/6)/10).replace(".",",")+" h";
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const avg=a=>{ const v=a.filter(x=>x!==null&&x!==undefined&&!isNaN(x)); return v.length?v.reduce((x,y)=>x+y,0)/v.length:null; };

/* ── Gewohnheiten ───────────────────────────────────────
   Zwei Dinge waren hier falsch gemessen.

   Erstens galt jede Gewohnheit als täglich. Fünf von neun hakst du
   aber nur zwei- bis dreimal die Woche ab — die standen damit
   dauerhaft als Versagen da, obwohl zweimal die Woche vielleicht
   genau das Richtige ist. Jetzt hat jede ein Wochenziel.

   Zweitens gab es nur die Serie, und die fällt bei einem
   ausgelassenen Tag auf null. Ein Tag wird damit so hart bestraft
   wie zehn. Daneben steht jetzt eine Stärke, die langsam zerfällt:
   Jede Wiederholung hebt sie, jeder leere Tag senkt sie ein wenig.
   Nach einer langen Serie ist ein Aussetzer damit ein Dämpfer,
   kein Totalverlust.
   ──────────────────────────────────────────────────────── */
const activeHabits=()=>(S.habits||[]).filter(h=>!h.archived);

/* Wie oft pro Woche ist die Gewohnheit vorgesehen? 7 heißt täglich
   und ist der Grundwert — alte Einträge verhalten sich damit
   genauso wie vorher. */
const habitSoll=h=>clamp(h.proWoche||7,1,7);

/* Treffer in der Woche, in der k liegt, bis einschließlich k. */
function wochenTreffer(h,k){
  const mo=sow(parsedk(k));
  let n=0;
  for(let i=0;i<7;i++){
    const t=dk(addD(mo,i));
    if(t>k) break;
    if(S.habitLog[t]?.[h.id]) n++;
  }
  return n;
}

/* Treffer in den sieben Tagen, die auf dem Startbildschirm auch zu
   sehen sind — also k und die sechs davor. Ein rollendes Fenster statt
   der Kalenderwoche: Sonst wäre das Ziel montags schlagartig wieder
   offen, obwohl man am Samstag zweimal abgehakt hat. */
function rollTreffer(h,k){
  let n=0;
  for(let i=0;i<7;i++){
    const t=dk(addD(parsedk(k),-i));
    if(S.habitLog[t]?.[h.id]) n++;
  }
  return n;
}

/* Steht sie an diesem Tag an? Eine Gewohnheit mit Wochenziel ist
   fällig, solange das Ziel in den letzten sieben Tagen noch nicht
   erreicht ist — danach zählt sie nicht mehr als offener Posten. */
function habitFaellig(h,k){
  if(h.createdAt>k) return false;
  if(S.habitLog[k]?.[h.id]) return true;      /* getan zählt immer */
  const soll=habitSoll(h);
  if(soll>=7) return true;
  return rollTreffer(h,k)<soll;
}

function completion(k){
  const hs=activeHabits().filter(h=>habitFaellig(h,k));
  const log=S.habitLog[k]||{};
  const done=hs.filter(h=>log[h.id]).length;
  return {done,total:hs.length,pct:hs.length?Math.round(done/hs.length*100):0};
}

/* ── Stärke ─────────────────────────────────────────────
   Gleitender Durchschnitt mit Halbwertszeit: Ohne jede Wiederholung
   halbiert sich die Stärke in STAERKE_HW Tagen. Der Gewinn je Haken
   ist am Wochenziel ausgerichtet, damit eine Gewohnheit, die ihr
   Ziel genau trifft, gegen 100 % läuft — egal ob täglich oder
   zweimal die Woche.
   ──────────────────────────────────────────────────────── */
const STAERKE_HW=14;

function emaStaerke(von,bis,ok,soll){
  const zerfall=Math.pow(.5,1/STAERKE_HW);
  const gewinn=(1-zerfall)*7/clamp(soll,1,7);
  let st=0;
  for(let d=parsedk(von); ; d=addD(d,1)){
    const k=dk(d);
    if(k>bis) break;
    st=st*zerfall+(ok(k)?gewinn:0);
    if(st>1) st=1;
  }
  return Math.round(st*100);
}

function habitStaerke(h,bis){
  const ende=bis||today();
  if(h.createdAt>ende) return 0;
  return emaStaerke(h.createdAt,ende,k=>!!S.habitLog[k]?.[h.id],habitSoll(h));
}

/* Treffer in der laufenden Woche für eine beliebige Bedingung. */
function wochenOk(ok,k){
  const mo=sow(parsedk(k));
  let n=0;
  for(let i=0;i<7;i++){ const t=dk(addD(mo,i)); if(t>k) break; if(ok(t)) n++; }
  return n;
}

/* Der erste Tag, an dem überhaupt etwas erfasst wurde. */
/* ── Pausen ──────────────────────────────────────────────
   Semesterferien, Urlaub, krank: Zeiträume, in denen NOVA nicht
   mitzählt. Ein Pausentag ist neutral — er verlängert keine Serie,
   reißt aber auch keine und verbraucht keinen Schutztag. Bewusst
   KEINE erfundenen Werte für die Lücke: die würden jeden Schnitt und
   jeden Vergleich verfälschen, ohne dass man es später noch sieht.
   ──────────────────────────────────────────────────────── */
const pausenAlle=()=>(S.pausen||[]).slice().sort((a,b)=>a.von.localeCompare(b.von));
const pauseAm=k=>(S.pausen||[]).find(p=>k>=p.von&&k<=p.bis)||null;
const istPause=k=>!!pauseAm(k);
/* Gilt eine Woche als Pause? Ab vier Pausentagen ja — eine Woche mit
   nur einem Ferientag soll ihr Wochenziel trotzdem schaffen müssen. */
function wocheIstPause(montagK){
  let n=0; const mo=parsedk(montagK);
  for(let i=0;i<7;i++) if(istPause(dk(addD(mo,i)))) n++;
  return n>=4;
}

function ersterTag(){
  const alle=[...Object.keys(S.metrics||{}),...Object.keys(S.habitLog||{}),
              ...Object.keys(S.sport||{})].sort();
  return alle[0]||today();
}

/* Eine Zahl über alle Gewohnheiten. Der Mittelwert der einzelnen
   Stärken — ungewichtet, weil keine Gewohnheit mehr wiegt als eine
   andere. Gewohnheiten, die es an dem Tag noch nicht gab, bleiben
   draußen, sonst würde eine neu angelegte den Schnitt drücken. */
function gesamtStaerke(bis){
  const ende=bis||today();
  const hs=activeHabits().filter(h=>h.createdAt<=ende);
  if(!hs.length) return null;
  return Math.round(hs.reduce((a,h)=>a+habitStaerke(h,ende),0)/hs.length);
}

/* Serie. Bei täglichen Gewohnheiten in Tagen, bei allen anderen in
   Wochen — eine Tagesserie wäre dort ohne Aussage. */
function habitSerie(h){
  const soll=habitSoll(h);
  if(soll>=7) return {n:streak(h), e:"Tage", kurz:"d"};
  let n=0, mo=sow(new Date());
  /* Die laufende Woche zählt nur, wenn das Ziel schon erreicht ist. */
  for(;;){
    const k=dk(addD(mo,6));
    if(dk(mo)<h.createdAt) break;
    if(wocheIstPause(dk(mo))){ mo=addD(mo,-7); continue; }
    const treffer=wochenTreffer(h, k>today()?today():k);
    if(treffer>=soll) n++;
    else if(dk(mo)!==dk(sow(new Date()))) break;
    mo=addD(mo,-7);
  }
  return {n, e:"Wochen", kurz:"W"};
}
function toggleHabit(k,id){
  if(!S.habitLog[k]) S.habitLog[k]={};
  S.habitLog[k][id]?delete S.habitLog[k][id]:S.habitLog[k][id]=true;
  save();
}
function streak(h){
  let n=0,d=new Date();
  if(!S.habitLog[dk(d)]?.[h.id]) d=addD(d,-1);
  for(;;){ const k=dk(d); if(k<h.createdAt) break;
    if(S.habitLog[k]?.[h.id]){ n++; d=addD(d,-1); }
    else if(istPause(k)){ d=addD(d,-1); }        /* Pause: überspringen */
    else break; }
  return n;
}
function habitRate(h,days){
  let hit=0,tot=0;
  for(let i=0;i<days;i++){ const k=dk(addD(new Date(),-i)); if(k<h.createdAt) continue;
    if(istPause(k)) continue;
    tot++; if(S.habitLog[k]?.[h.id]) hit++; }
  return tot?Math.round(hit/tot*100):0;
}

/* Was ist für einen Tag geplant? Seit dem Wochenplaner kommt das aus
   zwei Quellen: alte Einträge des früheren Tagesplaners (S.planer)
   und der Wochenplaner (angeheftet + wochen-eigen, ohne Ausgesetztes).
   Vorher las „Plan für heute" nur die alte Quelle und blieb leer,
   egal was man im Wochenplaner eintrug. */
const planDay=k=>{
  const alt=(S.planer&&S.planer[k])||[];
  const d=parsedk(k);
  const neu=wocheTag(wochenSchluessel(d),wtagIdx(d))
    .map(({fix,aus,...b})=>({...b,id:"wp_"+b.id}));
  return alt.concat(neu);
};
const hm2min=s=>{ const[h,m]=String(s||"0:0").split(":").map(Number); return h*60+(m||0); };
const min2hm=v=>`${p2(Math.floor(v/60)%24)}:${p2(Math.round(v%60))}`;
/* Ein Block darf über Mitternacht laufen: Ende kleiner oder gleich Start
   heißt, er reicht in den Folgetag. daySegments liefert alles, was an
   einem bestimmten Tag sichtbar ist — eigene Blöcke plus Ausläufer vom
   Vortag. Alle Ansichten rechnen darüber, damit sie sich einig sind. */
function daySegments(k,typeFilter){
  const out=[];
  /* Schlaf färbt unter „Alles“ die halbe Karte und erschlägt alles
     andere. Er erscheint nur, wenn man ihn ausdrücklich wählt —
     egal ob er aus dem Planer oder von der Uhr kommt. */
  const take=b=>{
    if(!typeFilter||typeFilter==="all") return b.type!=="schlafen";
    return b.type===typeFilter;
  };
  planDay(k).forEach(b=>{
    if(!take(b)) return;
    const s=hm2min(b.start), e=hm2min(b.end);
    if(e>s) out.push({b,from:s,to:e,cont:false,goesOver:false});
    else     out.push({b,from:s,to:1440,cont:false,goesOver:true});
  });
  planDay(dk(addD(parsedk(k),-1))).forEach(b=>{
    if(!take(b)) return;
    const s=hm2min(b.start), e=hm2min(b.end);
    if(e<=s && e>0) out.push({b,from:0,to:e,cont:true,goesOver:false});
  });
  return out.sort((a,b)=>a.from-b.from);
}
function planHours(k){ return daySegments(k).reduce((a,g)=>a+(g.to-g.from),0)/60; }

/* ── Tagesbewertung ── */
/* Hast du NOVA an diesem Tag benutzt? Weiter gefasst als dayHasData:
   auch ein Journaleintrag zählt. dayHasData bleibt eng, weil der
   Tageswert davon abhängt. */
const tagGenutzt=k=>dayHasData(k)||!!((S.mood||{})[k]);
/* Alte „Tag abgehakt"-Markierungen (dayCheck) zählen nicht mehr: Solide
   Tage ergeben sich jetzt aus den vier Zielen, und ein bloßer Haken im
   Planer ist kein Eintrag — sonst füllten sie Ferienlücken auf. */
const dayHasData=k=>!!(S.habitLog[k]&&Object.keys(S.habitLog[k]).length)||!!S.metrics[k]||!!S.sport[k];
const G=()=>Object.assign({sleep:8,study:3,phone:0,sport:300},S.goals||{});
function dayScore(k){
  /* Zukunft hat keinen Wert, und ein Tag ohne jede Eingabe ist keine
     Null, sondern unbekannt. Sonst zieht jeder künftige Tag den
     Monats- und Jahresschnitt nach unten. */
  if(k>today()) return null;
  if(!dayHasData(k)) return null;
  const m=S.metrics[k]||{}, g=G(), parts=[];
  const {pct,total}=completion(k);
  if(total) parts.push({w:.34,v:pct/100});
  if(nv(m.sleepHours)) parts.push({w:.24,v:clamp(m.sleepHours/g.sleep,0,1.1)});
  if(nv(m.study))      parts.push({w:.18,v:clamp(m.study/g.study,0,1.2)});
  if(nv(m.phone))      parts.push({w:.12,v:phoneAnteil(m.phone)});
  const sm=sportMin(k); if(sm) parts.push({w:.12,v:clamp(sm/60,0,1.2)});
  if(!parts.length) return null;
  const wsum=parts.reduce((a,p)=>a+p.w,0);
  return Math.round(clamp(parts.reduce((a,p)=>a+p.w*p.v,0)/wsum,0,1)*100);
}

const isChecked=k=>!!(S.dayCheck||{})[k];
function toggleCheck(k){ if(!S.dayCheck)S.dayCheck={}; S.dayCheck[k]?delete S.dayCheck[k]:S.dayCheck[k]=true; save(); }
function checkStreak(){ let n=0,d=new Date(); if(!isChecked(dk(d))) d=addD(d,-1);
  for(;;){ const k=dk(d);
    if(isChecked(k)){n++; d=addD(d,-1);}
    else if(istPause(k)&&k>=ersterTag()){ d=addD(d,-1); }
    else break; } return n; }
/* Längste je erreichte Serie: gibt dem laufenden Streak einen Maßstab.
   Ohne Rekord ist eine Zahl nur eine Zahl. */
function bestRun(ok){
  const days=new Set([...Object.keys(S.metrics||{}),...Object.keys(S.habitLog||{}),
                      ...Object.keys(S.sport||{})]);
  const list=[...days].sort();
  if(!list.length) return 0;
  let best=0,run=0,prev=null;
  for(const k of list){
    if(istPause(k)){ prev=k; continue; }
    if(prev){
      /* Lücke zwischen zwei Einträgen: nur wenn sie NICHT ganz aus
         Pausentagen besteht, reißt sie die Serie. */
      let echteLuecke=false;
      for(let d=addD(parsedk(prev),1); dk(d)<k; d=addD(d,1))
        if(!istPause(dk(d))){ echteLuecke=true; break; }
      if(echteLuecke) run=0; }
    run = ok(k) ? run+1 : 0;
    if(run>best) best=run;
    prev=k;
  }
  return best;
}

/* ── Ziele ──────────────────────────────────────────────
   Vorher: „jeden Tag" plus Serie. Das hatte denselben Fehler wie die
   Gewohnheiten — und beim Scrolling war es schlimmer als das: Das Ziel
   stand auf null Stunden, und in 46 erfassten Tagen lag der niedrigste
   Wert bei 0,2. Es war nicht schwer, es war unerreichbar, und die Serie
   stand folglich für immer auf null.

   Jetzt hat jedes Ziel eine Schwelle UND ein Wochenziel, dazu dieselbe
   zerfallende Stärke wie die Gewohnheiten. Beides ist einstellbar.
   ──────────────────────────────────────────────────────── */
const ZIEL_STD={ sleepTage:4, studyTage:5, phoneTage:3, phoneMax:1,
                  scoreMin:70, bettZiel:"23:00", aufZiel:"07:00" };
const ZG=()=>Object.assign({},ZIEL_STD,S.zielTage||{});

/* Scroll-Bewertung. Vorher wurde durch das Ziel geteilt. Stand das Ziel
   auf null — und bei dir stand es das —, war der Nenner null, das
   Ergebnis minus unendlich und der Handy-Anteil an JEDEM Tag null.
   Die Schwelle hat jetzt eine Untergrenze, damit das nicht wieder geht. */
function phoneAnteil(v){
  const max=Math.max(.25,ZG().phoneMax);
  return clamp(1-(v-max)/(max*2),0,1);
}

/* ── Serie mit Schutztagen ──────────────────────────────
   Eine harte Serie bestraft einen ausgelassenen Tag so hart wie zehn.
   Deshalb verdienst du dir Schutz: für je SCHUTZ_ALLE erfüllte Tage am
   Stück einen Schutztag, höchstens SCHUTZ_MAX auf Vorrat. Ein leerer
   Tag verbraucht einen davon — die Serie hält, wächst aber nicht.
   Erst ohne Vorrat reißt sie. (Nach dem Vorbild von Duolingo.)
   ──────────────────────────────────────────────────────── */
const SCHUTZ_ALLE=7, SCHUTZ_MAX=3;

function serieSchutz(ok,von,bis,pauseNeutral=true){
  let serie=0, schutz=0, best=0, seitSchutz=0, genutzt=0, gerettet=[];
  /* Der heutige Tag darf keine Serie reißen — er ist noch nicht vorbei.
     Erfüllt zählt er sofort, unerfüllt wird er einfach nicht bewertet. */
  const heuteOk=ok(bis);
  const ende=heuteOk?bis:dk(addD(parsedk(bis),-1));
  for(let d=parsedk(von); ; d=addD(d,1)){
    const k=dk(d);
    if(k>ende) break;
    if(pauseNeutral&&!ok(k)&&istPause(k)) continue;   /* Pause: neutral */
    if(ok(k)){
      serie++; seitSchutz++;
      if(seitSchutz>=SCHUTZ_ALLE&&schutz<SCHUTZ_MAX){ schutz++; seitSchutz=0; }
      if(serie>best) best=serie;
    } else if(schutz>0){
      schutz--; genutzt++; gerettet.push(k);   /* Serie bleibt stehen */
    } else {
      serie=0; schutz=0; seitSchutz=0; genutzt=0; gerettet=[];
    }
  }
  return {serie, schutz, best, genutzt, gerettet,
          bisSchutz: schutz<SCHUTZ_MAX ? SCHUTZ_ALLE-seitSchutz : null};
}

/* „Donnerstag gerettet" statt einer Zahl. Nur so erklärt sich der
   Puffer von selbst — nämlich in dem Moment, in dem er hilft. */
function gerettetText(tage){
  const letzter=tage[tage.length-1];
  const d=parsedk(letzter);
  const alt=Math.round((parsedk(today())-d)/86400000);
  const wann = alt===0 ? "Heute" : alt===1 ? "Gestern"
             : alt<7 ? WDL[d.getDay()] : fmtShort(d);
  return tage.length===1 ? `${wann} gerettet`
       : `${tage.length} Tage gerettet — zuletzt ${wann.toLowerCase()==="heute"||wann.toLowerCase()==="gestern"?wann.toLowerCase():wann}`;
}

/* ── Check-in morgens und abends ────────────────────────
   „Eingetragen" hieß bisher: irgendwann am Tag irgendetwas erfasst.
   Jetzt zählt ein Tag erst, wenn du zweimal reingeschaut hast:
     morgens  04:00–12:59  Schlaf eintragen, sehen was heute ansteht
     abends   ab 18:00     Lernzeit/Scrolling, Plan und Aufgaben für morgen
   Ein Abend-Check nach Mitternacht (bis 03:59) zählt noch für den
   Vortag. Außerhalb der Fenster geht es nicht — genau das ist der
   Zweck: zweimal am Tag bewusst hinschauen.
   Tage vor CHECKIN_AB werden nach der alten Regel bewertet, damit die
   bisherige Serie nicht rückwirkend verfällt.
   ──────────────────────────────────────────────────────── */
const CHECKIN_AB="2026-10-14";
const MORGEN_AB=4*60, MORGEN_BIS=13*60, ABEND_AB=18*60;
const checkinAm=k=>(S.checkin||{})[k]||{};
function checkinJetzt(){
  const d=new Date(), min=d.getHours()*60+d.getMinutes();
  if(min<MORGEN_AB)  return {k:dk(addD(d,-1)),teil:"a"};
  if(min<MORGEN_BIS) return {k:dk(d),teil:"m"};
  if(min>=ABEND_AB)  return {k:dk(d),teil:"a"};
  return {k:dk(d),teil:null};
}
function checkinSetzen(k,teil){
  S.checkin=S.checkin||{};
  S.checkin[k]=Object.assign({},S.checkin[k],{[teil]:Date.now()});
  save();
}
const eintragOk=k=> k<CHECKIN_AB ? tagGenutzt(k) : !!(checkinAm(k).m&&checkinAm(k).a);
/* Schlaf zählt nur mit genug Stunden UND einem Score über der Schwelle */
const schlafOk=k=>{ const m=S.metrics[k]||{}, z=ZG();
  return nv(m.sleepHours)&&m.sleepHours>=G().sleep&&nv(m.sleepScore)&&m.sleepScore>z.scoreMin; };

/* Die vier Tagesziele als reine Prüfungen — gebraucht von den Karten
   auf Heute, vom Rückblick und vom Planer. */
function zielPruefer(){
  const g=G(), z=ZG(), m=k=>S.metrics[k]||{};
  return {
    eintrag: eintragOk,
    sleep:   schlafOk,
    study:   k=>nv(m(k).study)&&m(k).study>=g.study,
    scroll:  k=>nv(m(k).phone)&&m(k).phone<=z.phoneMax
  };
}
/* Ein solider Tag ist einer, an dem alle vier Ziele erfüllt sind —
   nichts zum Abhaken mehr, er ergibt sich aus den Werten. */
function solideTag(k){
  const P=zielPruefer();
  return P.eintrag(k)&&P.sleep(k)&&P.study(k)&&P.scroll(k);
}
function solideSerie(){
  const S2=serieSchutz(solideTag,ersterTag(),today());
  const P=zielPruefer(), t=today();
  const heute=["eintrag","sleep","study","scroll"].filter(x=>P[x](t)).length;
  return {serie:S2.serie, best:S2.best, schutz:S2.schutz, bisSchutz:S2.bisSchutz,
          gerettet:S2.gerettet, heute, voll:heute===4};
}

function buildGoals(){
  const g=G(), z=ZG(), t=today(), von=ersterTag(), P=zielPruefer();

  const bau=(key,label,icon,color,ok,regel,pauseNeutral=true)=>{
    const S2=serieSchutz(ok,von,t,pauseNeutral);
    return {key,label,icon,color,regel,todayOk:ok(t),
            serie:S2.serie, schutz:S2.schutz, best:S2.best,
            genutzt:S2.genutzt, gerettet:S2.gerettet, bisSchutz:S2.bisSchutz};
  };

  /* „Eingetragen" steht vorn: Es misst genau das, worum es geht —
     NOVA jeden Tag benutzen. Deshalb rettet hier auch eine Pause
     nichts: wer nichts einträgt, beginnt von vorn. */
  return [
    bau("eintrag","Eingetragen","flame","var(--warn)",P.eintrag,"morgens und abends eingecheckt",false),
    bau("sleep","Geschlafen","moon","var(--m-sleep)",P.sleep,
        `${f(g.sleep)} h und Score über ${z.scoreMin}`),
    bau("study","Gelernt","book","var(--m-study)",P.study,
        `mindestens ${f(g.study)} h gelernt`),
    bau("scroll","Scroll-Ziel","phone","var(--m-phone)",P.scroll,
        `höchstens ${f(z.phoneMax)} h Scrolling`)
  ];
}

/* Wie viele Wochen am Stück wurde das Wochenziel erreicht? Die laufende
   Woche zählt nur mit, wenn sie schon voll ist — sonst stünde am Montag
   jede Serie auf null. */
function zielWochenSerie(ok,soll){
  let n=0, mo=sow(new Date());
  const von=ersterTag();
  for(;;){
    if(dk(mo)<von) break;
    if(wocheIstPause(dk(mo))){ mo=addD(mo,-7); continue; }
    const ende=dk(addD(mo,6));
    const treffer=wochenOk(ok, ende>today()?today():ende);
    if(treffer>=soll) n++;
    else if(dk(mo)!==dk(sow(new Date()))) break;
    mo=addD(mo,-7);
  }
  return n;
}

function goalStreak(fn){ let n=0,d=new Date();
  for(;;){ const k=dk(d); if(!S.metrics[k]) { if(n===0&&k===today()){ d=addD(d,-1); continue; } break; }
    if(fn(S.metrics[k])){ n++; d=addD(d,-1);} else break; } return n; }

/* Die Zahl im Nexus soll nicht bei jedem Haken springen. Sie zeigt den
   Schnitt der letzten drei Tage einschließlich heute; oben rechts steht
   weiterhin der reine Tageswert. Gerechnet wird unverändert. */
function score3(){
  const v=[0,1,2].map(i=>dayScore(dk(addD(new Date(),-i)))).filter(x=>x!==null);
  return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null;
}

/* ── Wochenaggregat ── */
function weekAgg(start){
  const days=[...Array(7)].map((_,i)=>addD(start,i));
  const sl=[],st=[],ph=[],sc=[]; let sp=0,hd=0,ht=0;
  days.forEach(d=>{ const k=dk(d),m=S.metrics[k]||{};
    if(nv(m.sleepHours))sl.push(m.sleepHours); if(nv(m.study))st.push(m.study);
    if(nv(m.phone))ph.push(m.phone); if(nv(m.sleepScore))sc.push(m.sleepScore);
    sp+=sportMin(k); const c=completion(k); hd+=c.done; ht+=c.total; });
  return {sleep:avg(sl),study:avg(st),phone:avg(ph),score:avg(sc),sport:sp,
          pct:ht?Math.round(hd/ht*100):0, days};
}

/* ── Aufgaben ───────────────────────────────────────────
   Die Liste war ein Friedhof: 15 offen, keine je abgehakt,
   die älteste über einen Monat alt, zwei Einträge doppelt.
   Eine Liste, die nur wächst, ist kein Werkzeug mehr, sondern
   ein Vorwurf. Drei Eingriffe dagegen: Alter sichtbar machen,
   Doppelte erkennen, und pro Tag nur drei Stück zeigen.
   ──────────────────────────────────────────────────────── */
const TODO_ALT=30;      /* ab so vielen Tagen fragt die App nach */
const TODO_FOKUS=3;     /* so viele Aufgaben stehen an einem Tag an */

const todoStart=t=>t.renewedAt||t.createdAt
  ||(t.date?parsedk(t.date).getTime():Date.now());
const todoAlter=t=>Math.max(0,Math.floor((Date.now()-todoStart(t))/86400000));
const todoOffen=()=>(S.todos||[]).filter(t=>!t.done&&!t.archived);
const todoAltlast=()=>todoOffen().filter(t=>todoAlter(t)>=TODO_ALT);

/* Zum Vergleichen: alles klein, ohne Satzzeichen und Leerzeichen.
   „trikots zurück schicken" und „trikots zurückschicken" fallen
   damit zusammen — genau der Fall, der doppelt in der Liste stand. */
const todoNorm=s=>String(s||"").toLowerCase().replace(/[^\p{L}\p{N}]+/gu,"");

function todoDoppelte(){
  const gr=new Map();
  todoOffen().forEach(t=>{
    const n=todoNorm(t.text); if(!n) return;
    if(!gr.has(n)) gr.set(n,[]);
    gr.get(n).push(t);
  });
  return [...gr.values()].filter(g=>g.length>1);
}

function todoZusammenlegen(){
  const RANG={high:0,mid:1,low:2};
  let weg=0;
  todoDoppelte().forEach(g=>{
    /* Der älteste Eintrag bleibt stehen — er trägt die längere
       Geschichte. Die dringlichste Einstufung der Gruppe gewinnt. */
    g.sort((a,b)=>todoStart(a)-todoStart(b));
    const bleibt=g[0];
    bleibt.priority=g.map(t=>t.priority||"mid")
      .sort((a,b)=>RANG[a]-RANG[b])[0];
    g.slice(1).forEach(t=>{ t.archived=true; t.mergedInto=bleibt.id; weg++; });
  });
  if(weg) save();
  return weg;
}

/* Die Auswahl für heute. Gilt nur für den heutigen Tag und wird
   morgen von selbst leer — sonst wäre es bloß eine zweite Liste. */
function fokusIds(){
  let f=S.todoFocus;
  /* Am Vorabend für heute Vorgemerktes greift, solange heute noch nichts gewählt wurde */
  if((!f||f.d!==today())&&S.todoFocusNext&&S.todoFocusNext.d===today()) f=S.todoFocusNext;
  if(!f||f.d!==today()) return [];
  const da=new Set(todoOffen().map(t=>t.id));
  return (f.ids||[]).filter(id=>da.has(id));
}
const imFokus=id=>fokusIds().includes(id);
function fokusToggle(id){
  const ids=fokusIds(), i=ids.indexOf(id);
  if(i>=0) ids.splice(i,1);
  else if(ids.length>=TODO_FOKUS){
    toast(`Drei reichen. Erst eine abwählen.`,"x"); return false;
  } else ids.push(id);
  S.todoFocus={d:today(),ids}; save(); return true;
}

function todoErledigt(id){
  const t=(S.todos||[]).find(x=>x.id===id); if(!t) return;
  t.done=true; t.doneAt=Date.now();
  S.todoFocus={d:today(),ids:fokusIds().filter(x=>x!==id)};
  save();
}
function todoVerlaengern(id){
  const t=(S.todos||[]).find(x=>x.id===id); if(!t) return;
  t.renewedAt=Date.now(); save();
}
function todoArchiv(id){
  const t=(S.todos||[]).find(x=>x.id===id); if(!t) return;
  t.archived=true; save();
}
const todoWocheFertig=()=>{
  const ab=sow(new Date()).getTime();
  return (S.todos||[]).filter(t=>t.done&&t.doneAt&&t.doneAt>=ab).length;
};
const todoArchivZahl=()=>(S.todos||[]).filter(t=>t.archived&&!t.done).length;


/* ── Einheiten aus SATZ ─────────────────────────────────
   SATZ ist die Trainings-App und legt ihre Einheiten als eigene
   Datei ab. NOVA liest sie und trägt nach, was hier noch fehlt —
   genau wie beim Garmin-Abgleich: nur ergänzen, nie überschreiben,
   und über die Kennung jedes Eintrags gegen Doppelte gesichert.
   Zwei getrennte Dateien heißt: Beide dürfen gleichzeitig offen
   sein, ohne sich die Arbeit des anderen zu löschen.
   ──────────────────────────────────────────────────────── */
const SATZ_FILE="training.json";
const SATZ_API=`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${SATZ_FILE}`;

function mergeSatz(daten){
  if(!daten) return 0;
  let n=0;
  n+=mergeSatzPlan(daten);
  if(!daten.sport) return n;
  Object.entries(daten.sport).forEach(([k,liste])=>{
    if(!Array.isArray(liste)) return;
    const vorhanden=new Set((S.sport[k]||[]).map(e=>e.id));
    liste.forEach(e=>{
      if(!e||!e.id||vorhanden.has(e.id)) return;
      if(!S.sport[k]) S.sport[k]=[];
      S.sport[k].push({id:e.id,type:e.type||"other",duration:e.duration||0,
        hr:e.hr??null, rpe:e.rpe??null, notes:e.notes??null,
        kraftSubtype:e.kraftSubtype??null});
      n++;
    });
  });
  return n;
}

/* Die Trainings-App plant ihre Einheiten als Zeitblöcke und schickt
   sie mit. Sie landen im selben Planer wie alles andere, sind aber an
   der Kennung „satz_" zweifelsfrei als von dort stammend erkennbar —
   und NUR solche Blöcke werden hier je angefasst. Eigene Blöcke aus
   NOVA bleiben unter allen Umständen unberührt.

   Anders als beim Sport wird hier auch geändert und entfernt: ein
   Training, das dort verschoben oder gestrichen wurde, muss auch hier
   verschwinden, sonst steht der Plan bald voller Leichen. */
function mergeSatzPlan(daten){
  if(!daten.planer&&!daten.planerWeg) return 0;
  if(!S.planer) S.planer={};          /* frischer Stand ohne Planer */
  let n=0;
  const weg=new Set(daten.planerWeg||[]);
  const fremd=new Map();                        /* id -> {tag, block} */
  Object.entries(daten.planer||{}).forEach(([k,liste])=>{
    (Array.isArray(liste)?liste:[]).forEach(b=>{
      if(b&&typeof b.id==="string"&&b.id.startsWith("satz_")) fremd.set(b.id,{k,b});
    });
  });

  /* Erst aufräumen: gestrichene und verschobene Blöcke aus allen Tagen
     entfernen — aber ausschließlich solche mit „satz_"-Kennung. */
  Object.keys(S.planer||{}).forEach(k=>{
    const vor=S.planer[k].length;
    S.planer[k]=S.planer[k].filter(b=>{
      if(!b||typeof b.id!=="string"||!b.id.startsWith("satz_")) return true;
      if(weg.has(b.id)) return false;            /* dort gelöscht */
      const f=fremd.get(b.id);
      if(!f) return true;                        /* nicht in dieser Lieferung */
      return f.k===k;                            /* verschoben? alter Tag raus */
    });
    n+=vor-S.planer[k].length;
    if(!S.planer[k].length) delete S.planer[k];
  });

  /* Dann eintragen und auffrischen. */
  fremd.forEach(({k,b},id)=>{
    if(weg.has(id)) return;
    if(!S.planer[k]) S.planer[k]=[];
    const i=S.planer[k].findIndex(x=>x&&x.id===id);
    const neu={id, type:b.type||"sport", start:b.start||"18:00",
               end:b.end||"19:00", note:b.note||""};
    if(i<0){ S.planer[k].push(neu); n++; }
    else if(JSON.stringify(S.planer[k][i])!==JSON.stringify(neu)){ S.planer[k][i]=neu; n++; }
  });
  return n;
}

async function holeSatz(){
  if(!cloudOn()) return 0;
  try{
    const r=await fetch(SATZ_API,{headers:{Authorization:"Bearer "+cloudTok(),
      Accept:"application/vnd.github+json"}});
    if(!r.ok) return 0;                       /* keine Datei = SATZ noch nicht benutzt */
    const j=await r.json();
    const daten=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,"")))));
    const n=mergeSatz(daten);
    if(n){ persist(); queueSync(); }
    return n;
  }catch(e){ return 0; }
}

/* ── Cloud ── */
const cloudOn=()=>localStorage.getItem(CLOUD_ON)==="1";
const cloudTok=()=>localStorage.getItem(CLOUD_TOK)||"";
let syncTimer=null, syncSha=null;
function setSync(state,txt){
  const el=document.getElementById("syncDot"); if(!el) return;
  const c={ok:"var(--good)",busy:"var(--warn)",err:"var(--bad)",off:"var(--text-faint)"}[state]||"var(--text-faint)";
  el.style.background=c; el.title=txt||"";
}
function queueSync(){ clearTimeout(syncTimer); syncTimer=setTimeout(pushCloud,1400); }
async function pushCloud(){
  if(!cloudOn()) return; const tok=cloudTok(); if(!tok) return;
  setSync("busy","Speichert…");
  try{
    let sha=syncSha;
    if(!sha){ const r=await fetch(GH_API,{headers:{Authorization:`token ${tok}`}});
      if(r.ok){ sha=(await r.json()).sha; } }
    const body={message:`nova ${new Date().toISOString()}`,
      content:btoa(unescape(encodeURIComponent(JSON.stringify(S)))), ...(sha?{sha}:{})};
    const r2=await fetch(GH_API,{method:"PUT",headers:{Authorization:`token ${tok}`,"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!r2.ok) throw new Error(r2.status);
    syncSha=(await r2.json()).content.sha;
    setSync("ok","Synchron");
  }catch(e){ setSync("err","Sync fehlgeschlagen"); }
}
/* Sagt genau, woran es lag — „keine Daten“ ist als Diagnose wertlos. */
let cloudFehler="";
async function pullCloud(){
  const tok=cloudTok(); if(!tok){ cloudFehler="Kein Token hinterlegt."; return false; }
  setSync("busy","Lädt…");
  try{
    const r=await fetch(GH_API+"?v="+Date.now(),{headers:{Authorization:`token ${tok}`}});
    if(r.status===404){ cloudFehler="datei-fehlt"; setSync("busy"); return false; }
    if(r.status===401||r.status===403){ cloudFehler="Token wird abgelehnt. Stimmen Rechte und Repo?"; setSync("err"); return false; }
    if(!r.ok){ cloudFehler="GitHub antwortet mit Fehler "+r.status; setSync("err"); return false; }
    const j=await r.json(); syncSha=j.sha;
    S=Object.assign(blank(),JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,""))))));
    tplanAufraeumen();          /* auch das, was vom anderen Gerät kommt */
    persist(); setSync("ok","Synchron"); cloudFehler=""; return true;
  }catch(e){
    /* Ein abgewiesener fetch ohne Statuscode heißt fast immer: die
       Umgebung lässt den Zugriff auf fremde Server nicht zu. */
    cloudFehler="gesperrt";
    setSync("err","Zugriff gesperrt"); return false;
  }
}

<script>
/* ============================================================
   3 — AURORA
   Weiches Lichtfeld im Grund. Rein dekorativ, deshalb sparsam
   gerechnet und bei Bewegungsverzicht sofort still.
   ============================================================ */
(function(){
  const cv=document.getElementById("aurora"); if(!cv) return;
  const ctx=cv.getContext("2d"); let w=0,h=0,dpr=1,raf=0,t=0;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const blobs=[
    {x:.22,y:.18,r:.46,c:[79,227,210],s:.00013,p:0},
    {x:.80,y:.30,r:.40,c:[90,157,237],s:.00009,p:2.1},
    {x:.55,y:.86,r:.42,c:[139,124,240],s:.00011,p:4.3},
  ];
  function size(){
    dpr=Math.min(2,devicePixelRatio||1);
    w=innerWidth; h=innerHeight;
    cv.width=w*dpr; cv.height=h*dpr; cv.style.width=w+"px"; cv.style.height=h+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    ctx.globalCompositeOperation="lighter";
    blobs.forEach(b=>{
      const dx=Math.sin(t*b.s*7+b.p)*.07, dy=Math.cos(t*b.s*5+b.p)*.06;
      const cx=(b.x+dx)*w, cy=(b.y+dy)*h, R=b.r*Math.max(w,h);
      const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R);
      g.addColorStop(0,`rgba(${b.c[0]},${b.c[1]},${b.c[2]},.16)`);
      g.addColorStop(.45,`rgba(${b.c[0]},${b.c[1]},${b.c[2]},.05)`);
      g.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,R,0,6.2832); ctx.fill();
    });
    ctx.globalCompositeOperation="source-over";
  }
  function loop(now){ t=now; draw(); raf=requestAnimationFrame(loop); }
  addEventListener("resize",()=>{ size(); if(reduce) draw(); });
  size(); draw();
  if(!reduce) raf=requestAnimationFrame(loop);
})();

/* Kurzmeldung */
let toastT=null;
function toast(msg,icon="check"){
  const el=document.getElementById("toast"); if(!el) return;
  el.innerHTML=ico(icon)+"<span>"+esc(msg)+"</span>";
  el.classList.add("on"); clearTimeout(toastT);
  toastT=setTimeout(()=>el.classList.remove("on"),2400);
}
</script>

      </div>
    </aside>
    <div class="stage">
      <header class="topbar">
        <button class="b b-i" data-act="rail" title="Seitenleiste">${ico("list")}</button>
        <div>
          <div class="tb-title" id="tbTitle">Heute</div>
          <div class="tb-date" id="tbDate"></div>
        </div>
        <div class="tb-spacer"></div>
        <span class="tb-clock" id="tbClock"></span>
        <button class="kbtn" data-act="cmdk">${ico("search")}<span>Schnellbefehl</span><kbd>⌘K</kbd></button>
        <span class="orb" id="tbOrb" title="Tagesbewertung"></span>
        <button class="b b-i" data-act="sync" title="Geräte abgleichen">${ico("orbit")}</button>
        <button class="b b-i" data-act="cloud" title="Cloud">${ico("cloud")}<i id="syncDot" style="position:absolute;width:6px;height:6px;border-radius:50%;background:var(--text-faint);margin:14px 0 0 14px;"></i></button>
      </header>
      <div class="views" id="views"></div>
    </div>
  </div>
  <div class="cmdk-ov" id="cmdkOv"><div class="cmdk">
    <div class="cmdk-in">${ico("search")}<input id="cmdkIn" placeholder="Befehl, Ansicht oder Eintrag …" autocomplete="off"></div>
    <div class="cmdk-list" id="cmdkList"></div>
  </div></div>
  <div class="mv" id="modal"></div>`;
  document.getElementById("views").innerHTML=NAV.map(n=>`<section class="view" id="v-${n.id}"></section>`).join("");
  wireShell();
  go(VIEW);
  tickClock();
}

function wireShell(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll('[data-act="cmdk"]').forEach(b=>b.onclick=openCmdk);
  document.querySelectorAll('[data-act="rail"]').forEach(b=>b.onclick=()=>
    document.getElementById("shell").classList.toggle("rail-min"));
  document.querySelectorAll('[data-act="cloud"]').forEach(b=>b.onclick=cloudModal);
  document.querySelectorAll('[data-act="more"]').forEach(b=>b.onclick=moreSheet);
  document.querySelectorAll('[data-act="sync"]').forEach(b=>b.onclick=syncNow);
  document.querySelectorAll('[data-act="settings"]').forEach(b=>b.onclick=settingsModal);
}

const R={};   /* Renderer je Ansicht */
function go(v){
  /* Ein Ziel, das es nicht (mehr) gibt — etwa Nexus oder Rhythmus aus
     einem alten Kurzbefehl — führt nach „Heute" statt auf eine leere
     Seite. */
  if(!NAV.some(n=>n.id===v)) v="heute";
  VIEW=v;
  document.querySelectorAll(".rl[data-go]").forEach(b=>b.classList.toggle("on",b.dataset.go===v));
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  const n=NAV.find(x=>x.id===v);
  document.getElementById("tbTitle").textContent=n?n.t:"";
  document.getElementById("tbDate").textContent=fmtLong(new Date());
  try{ R[v]&&R[v](); }catch(e){ console.error("Render "+v,e); }
  paintOrb();
  document.getElementById("views").scrollTop=0;
}

function paintOrb(){
  const el=document.getElementById("tbOrb"); if(!el) return;
  const s=dayScore(today());
  const p=(s??0)/100, r=15, c=2*Math.PI*r;
  const col=s===null?"var(--text-faint)":s>=75?"var(--good)":s>=45?"var(--c1)":"var(--warn)";
  el.innerHTML=`<svg width="38" height="38" viewBox="0 0 38 38">
    <circle cx="19" cy="19" r="${r}" fill="none" stroke="var(--track)" stroke-width="3.4"/>
    <circle cx="19" cy="19" r="${r}" fill="none" stroke="${col}" stroke-width="3.4" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-p)).toFixed(1)}"
      style="transition:stroke-dashoffset .7s var(--ez)"/>
  </svg><b style="color:${col}">${s===null?"–":s}</b>`;
}

function tickClock(){
  const el=document.getElementById("tbClock");
  const upd=()=>{ if(!el)return; const d=new Date();
    el.textContent=`${p2(d.getHours())}:${p2(d.getMinutes())}`; };
  upd(); setInterval(upd,20000);
}

/* Holt den Stand aus der Cloud, führt ihn mit dem hiesigen zusammen und
   schreibt ihn zurück. So sehen Handy und Rechner dasselbe.
   Garmin selbst kann diese Seite nicht abfragen — dafür fehlen ihr die
   Zugangsdaten. Neue Garmin-Werte kommen über eine Aktualisierung der
   App herein und werden beim Laden ergänzt. */
async function syncNow(){
  if(!cloudOn()){ cloudModal(); return; }
  toast("Gleiche ab…","orbit");
  cloudFehler="";
  const lokal=JSON.parse(JSON.stringify(S));
  const ok=await pullCloud();
  if(ok){
    /* Zusammenführen statt überschreiben: was hier neuer ist, bleibt. */
    ["metrics","habitLog","sport","planer","dayCheck"].forEach(feld=>{
      for(const [k,v] of Object.entries(lokal[feld]||{})){
        if(!S[feld][k]) S[feld][k]=v;
        else if(feld==="sport"){
          const da=new Set(S[feld][k].map(e=>e.gid||e.id));
          v.forEach(e=>{ if(!da.has(e.gid||e.id)) S[feld][k].push(e); });
        }
        else if(feld==="planer"){
          const da=new Set(S[feld][k].map(e=>e.id));
          v.forEach(e=>{ if(!da.has(e.id)) S[feld][k].push(e); });
        }
        else if(typeof v==="object") S[feld][k]=Object.assign({},v,S[feld][k]);
      }
    });
    const ids=new Set((S.todos||[]).map(t=>t.id));
    (lokal.todos||[]).forEach(t=>{ if(!ids.has(t.id)) S.todos.push(t); });
    (lokal.habits||[]).forEach(h=>{ if(!(S.habits||[]).some(x=>x.id===h.id)) S.habits.push(h); });
  }
  if(cloudFehler==="gesperrt"){
    toast("Zugriff auf GitHub ist hier gesperrt","x"); return;
  }
  mergeGarmin();
  persist(); await pushCloud();
  toast(cloudFehler?"Abgleich unvollständig":"Geräte sind gleich",cloudFehler?"x":"check");
  go(VIEW); paintOrb();
}

/* Weitere Ansichten als Blatt: auf dem Handy passen nicht zehn
   Einträge nebeneinander, ohne dass die Beschriftungen kollidieren. */
function moreSheet(){
  const rest=NAV.filter(n=>n.g>=2);
  modal(`<h3>Weitere Ansichten</h3>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px">
      ${rest.map(n=>`<button class="b" data-mg="${n.id}" style="justify-content:flex-start;padding:14px 13px">
        ${ico(n.i)}<span>${n.t}</span></button>`).join("")}
    </div>
    <div style="display:flex;gap:9px;margin-top:14px;border-top:1px solid var(--line);padding-top:14px">
      <button class="b" style="flex:1" onclick="closeModal();openCmdk()">${ico("search")}Suchen</button>
      <button class="b" style="flex:1" onclick="closeModal();settingsModal()">${ico("gear")}Einstellungen</button>
    </div>`);
  document.querySelectorAll("[data-mg]").forEach(b=>b.onclick=()=>{ closeModal(); go(b.dataset.mg); });
}

/* ── Kommandopalette ── */
let cmdkItems=[], cmdkSel=0;
function cmdkSource(){
  const a=[];
  NAV.forEach(n=>a.push({g:"Ansichten",t:n.t,i:n.i,run:()=>go(n.id)}));
  a.push({g:"Eintragen",t:"Schlaf eintragen",i:"moon",run:()=>quickPrompt("sleepHours","Schlaf in Stunden","z. B. 7.5")});
  a.push({g:"Eintragen",t:"Lernzeit eintragen",i:"book",run:()=>quickPrompt("study","Lernzeit in Stunden","z. B. 2.5")});
  a.push({g:"Eintragen",t:"Scrolling eintragen",i:"phone",run:()=>quickPrompt("phone","Scrolling in Stunden","z. B. 0")});
  a.push({g:"Eintragen",t:"Sleep Score eintragen",i:"heart",run:()=>quickPrompt("sleepScore","Sleep Score 0–100","z. B. 78")});
  a.push({g:"Eintragen",t:"Training hinzufügen",i:"run",run:()=>{go("sport");}});
  a.push({g:"Eintragen",t:"Gewohnheit anlegen",i:"plus",run:()=>habitModal(null)});
  activeHabits().forEach(h=>a.push({g:"Heute abhaken",t:h.name,i:"check",
    run:()=>{ toggleHabit(today(),h.id); toast(h.name+" umgeschaltet"); go(VIEW); }}));
  a.push({g:"Daten",t:"Backup herunterladen",i:"down",run:exportData});
  a.push({g:"Daten",t:"Backup einspielen",i:"up",run:importData});
  a.push({g:"Daten",t:"Aus altem Tracker neu laden",i:"cloud",run:reimportOld});
  a.push({g:"Daten",t:"Mitgelieferten Stand laden",i:"down",run:loadSeed});
  return a;
}
function openCmdk(){
  const ov=document.getElementById("cmdkOv"); ov.classList.add("on");
  const inp=document.getElementById("cmdkIn"); inp.value=""; cmdkSel=0;
  renderCmdk(""); setTimeout(()=>inp.focus(),30);
}
function closeCmdk(){ document.getElementById("cmdkOv").classList.remove("on"); }
function renderCmdk(q){
  const all=cmdkSource();
  const s=q.trim().toLowerCase();
  cmdkItems = s ? all.filter(x=>(x.t+" "+x.g).toLowerCase().includes(s)) : all;
  cmdkSel=Math.min(cmdkSel,Math.max(0,cmdkItems.length-1));
  let html="",lastG="";
  cmdkItems.forEach((x,i)=>{
    if(x.g!==lastG){ html+=`<div class="cmdk-grp">${x.g}</div>`; lastG=x.g; }
    html+=`<button class="cmdk-i${i===cmdkSel?" sel":""}" data-i="${i}">${ico(x.i)}<b>${esc(x.t)}</b></button>`;
  });
  const L=document.getElementById("cmdkList");
  L.innerHTML=html||`<div class="empty">Nichts gefunden.</div>`;
  L.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>runCmdk(+b.dataset.i));
  L.querySelector(".sel")?.scrollIntoView({block:"nearest"});
}
function runCmdk(i){ const x=cmdkItems[i]; if(!x) return; closeCmdk(); x.run(); }

addEventListener("keydown",e=>{
  const open=document.getElementById("cmdkOv")?.classList.contains("on");
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); open?closeCmdk():openCmdk(); return; }
  if(!open) return;
  if(e.key==="Escape"){ closeCmdk(); }
  else if(e.key==="ArrowDown"){ e.preventDefault(); cmdkSel=Math.min(cmdkSel+1,cmdkItems.length-1); renderCmdk(document.getElementById("cmdkIn").value); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); cmdkSel=Math.max(cmdkSel-1,0); renderCmdk(document.getElementById("cmdkIn").value); }
  else if(e.key==="Enter"){ e.preventDefault(); runCmdk(cmdkSel); }
});
document.addEventListener("input",e=>{ if(e.target.id==="cmdkIn"){ cmdkSel=0; renderCmdk(e.target.value); } });
document.addEventListener("click",e=>{ if(e.target.id==="cmdkOv") closeCmdk(); if(e.target.id==="modal") closeModal(); });

/* ── Modal-Hilfen ── */
function modal(html){ const m=document.getElementById("modal"); m.innerHTML=`<div class="mo">${html}</div>`; m.classList.add("on"); }
function closeModal(){ document.getElementById("modal").classList.remove("on"); }
function quickPrompt(field,label,ph){
  modal(`<h3>${esc(label)}</h3>
    <label>Datum</label><input type="date" id="qpDate" value="${today()}">
    <label>Wert</label><input type="number" step="0.1" id="qpVal" placeholder="${esc(ph)}">
    <div class="mo-act"><button class="b" onclick="closeModal()">Abbrechen</button>
    <button class="b b-1" id="qpSave">Speichern</button></div>`);
  setTimeout(()=>document.getElementById("qpVal").focus(),40);
  document.getElementById("qpSave").onclick=()=>{
    const d=document.getElementById("qpDate").value||today();
    const v=parseFloat(document.getElementById("qpVal").value);
    if(isNaN(v)){ toast("Kein gültiger Wert","x"); return; }
    S.metrics[d]=Object.assign({},S.metrics[d],{[field]:v});
    save(); closeModal(); toast(label+" gespeichert"); go(VIEW);
  };
  document.getElementById("qpVal").onkeydown=e=>{ if(e.key==="Enter") document.getElementById("qpSave").click(); };
}

/* ── Daten raus und rein ── */
function exportData(){
  const b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=`nova-${today()}.json`; a.click();
  URL.revokeObjectURL(a.href); toast("Backup erstellt","down");
}
function importData(){
  const i=document.createElement("input"); i.type="file"; i.accept=".json";
  i.onchange=()=>{ const f2=i.files[0]; if(!f2) return;
    const r=new FileReader();
    r.onload=()=>{ try{ S=Object.assign(blank(),JSON.parse(r.result)); persist(); toast("Backup eingespielt","up"); go(VIEW); }
      catch(e){ toast("Datei nicht lesbar","x"); } };
    r.readAsText(f2); };
  i.click();
}
function reimportOld(){
  const old=localStorage.getItem(OLD_KEY);
  if(!old){ toast("Kein alter Tracker gefunden","x"); return; }
  modal(`<h3>Aus altem Tracker laden</h3>
    <p style="color:var(--text-dim);font-size:var(--t-base);line-height:1.6;">
      Das überschreibt alles in NOVA mit dem Stand aus deinem laufenden Tracker.
      Der alte Tracker selbst bleibt unverändert.</p>
    <div class="mo-act"><button class="b" onclick="closeModal()">Abbrechen</button>
    <button class="b b-1" id="reSure">Überschreiben</button></div>`);
  document.getElementById("reSure").onclick=()=>{
    try{ S=Object.assign(blank(),JSON.parse(old)); persist(); closeModal();
      toast("Daten übernommen"); go(VIEW); }
    catch(e){ toast("Übernahme fehlgeschlagen","x"); }
  };
}

function settingsModal(){
  const g=G(), z=ZG();
  modal(`<h3>Einstellungen</h3>
    <label>Schlafziel (Std.)</label><input type="number" step=".5" id="gSleep" value="${g.sleep}">
    <label>Sleep-Score muss über … liegen</label><input type="number" step="1" min="0" max="100" id="gScore" value="${z.scoreMin}">
    <div style="display:flex;gap:10px">
      <div style="flex:1"><label>Ziel: ins Bett um</label><input type="time" id="gBett" value="${z.bettZiel}"></div>
      <div style="flex:1"><label>Ziel: aufstehen um</label><input type="time" id="gAuf" value="${z.aufZiel}"></div></div>
    <label>Lernziel (Std.)</label><input type="number" step=".5" id="gStudy" value="${g.study}">
    <label>Scrolling-Obergrenze (Std.)</label><input type="number" step=".25" id="gPhone" value="${z.phoneMax}">
    <label>Trainingsziel pro Woche (Min.)</label><input type="number" step="15" id="gSport" value="${g.sport}">
    <div style="margin:16px 0 4px;border-top:1px solid var(--line);padding-top:14px">
      <div style="font-size:var(--t-sm);font-weight:600;margin-bottom:4px">An wie vielen Tagen pro Woche?</div>
      <div style="font-size:var(--t-xs);color:var(--text-faint);line-height:1.55;margin-bottom:11px">
        Ein Ziel, das jeden Tag gelten soll, steht nach einem Ausrutscher für immer
        auf null. Mit einem Wochenziel misst NOVA, was du dir vornimmst.</div>
    </div>
    <div class="grid c3" style="gap:10px">
      ${[["zSleep","Geschlafen",z.sleepTage],["zStudy","Gelernt",z.studyTage],
         ["zPhone","Scroll-Ziel",z.phoneTage]].map(([id,l,v])=>
        `<div><label style="margin-top:0">${l}</label>
         <input type="number" min="1" max="7" step="1" id="${id}" value="${v}"></div>`).join("")}
    </div>
    <div class="mo-act">
      <button class="b" onclick="closeModal()">Abbrechen</button>
      <button class="b b-1" id="gSave">Speichern</button>
    </div>
    <div style="margin-top:18px;border-top:1px solid var(--line);padding-top:14px;display:flex;gap:8px;flex-wrap:wrap;">
      <button class="b b-sm b-1" onclick="closeModal();schemaModal()">${ico("spark")}Schema übernehmen</button>
      <button class="b b-sm" onclick="closeModal();kurzbefehlModal()">${ico("phone")}Kurzbefehle</button>
      <button class="b b-sm" onclick="exportData()">${ico("down")}Backup</button>
      <button class="b b-sm" onclick="importData()">${ico("up")}Einspielen</button>
      <button class="b b-sm" onclick="reimportOld()">${ico("cloud")}Aus altem Tracker</button>
      <button class="b b-sm" onclick="loadSeed()">${ico("down")}Mitgelieferter Stand</button>
    </div>`);
  document.getElementById("gSave").onclick=()=>{
    const nz=n=>clamp(parseInt(document.getElementById(n).value,10)||1,1,7);
    S.goals={sleep:+document.getElementById("gSleep").value||8,
             study:+document.getElementById("gStudy").value||3,
             phone:parseFloat(document.getElementById("gPhone").value)||0,
             sport:+document.getElementById("gSport").value||300};
    S.zielTage={ sleepTage:nz("zSleep"), studyTage:nz("zStudy"), phoneTage:nz("zPhone"),
                 scoreMin:clamp(parseInt(document.getElementById("gScore").value,10)||70,0,100),
                 bettZiel:document.getElementById("gBett").value||"23:00",
                 aufZiel:document.getElementById("gAuf").value||"07:00",
                 phoneMax:Math.max(0,parseFloat(document.getElementById("gPhone").value)||0) };
    save(); closeModal(); toast("Ziele gespeichert"); go(VIEW);
  };
}

function cloudModal(){
  const on=cloudOn();
  modal(`<h3>Cloud-Sync</h3>
    <p style="color:var(--text-dim);font-size:var(--t-sm);line-height:1.6;margin-bottom:6px;">
      Synchronisiert über eine private Datei in deinem GitHub-Repository
      <code style="font-family:var(--f-mono);font-size:.85em;">${GH_USER}/${GH_REPO}</code>.</p>
    <label>Persönliches Zugriffstoken</label>
    <input type="password" id="ghTok" placeholder="ghp_…" value="${esc(cloudTok())}">
    <div class="mo-act">
      ${on?`<button class="b" id="ghOff">Trennen</button>`:""}
      <button class="b" onclick="closeModal()">Abbrechen</button>
      <button class="b b-1" id="ghOn">${on?"Jetzt laden":"Verbinden"}</button>
    </div>`);
  document.getElementById("ghOn").onclick=async()=>{
    const t=document.getElementById("ghTok").value.trim();
    if(!t){ toast("Kein Token angegeben","x"); return; }
    localStorage.setItem(CLOUD_TOK,t); localStorage.setItem(CLOUD_ON,"1");
    closeModal(); const ok=await pullCloud();
    if(ok){ toast("Cloud verbunden"); go(VIEW); paintOrb(); return; }
    if(cloudFehler==="gesperrt"){
      modal(`<h3>Zugriff gesperrt</h3>
        <p style="color:var(--text-dim);font-size:var(--t-base);line-height:1.65">
          Diese Umgebung lässt keine Verbindung zu fremden Servern zu, deshalb
          erreicht die App GitHub nicht. Das liegt nicht an deinem Token.</p>
        <p style="color:var(--text-dim);font-size:var(--t-base);line-height:1.65;margin-top:10px">
          Der Abgleich funktioniert nur, wenn die App von einer eigenen Adresse
          läuft, etwa über GitHub Pages. Bis dahin hilft der Weg über
          <b>Backup</b> und <b>Einspielen</b> in den Einstellungen.</p>
        <div class="mo-act"><button class="b b-1" onclick="closeModal()">Verstanden</button></div>`);
      return;
    }
    if(cloudFehler==="datei-fehlt"){ toast("Lege die Datei neu an…","cloud"); await pushCloud(); go(VIEW); return; }
    modal(`<h3>Verbindung fehlgeschlagen</h3>
      <p style="color:var(--text-dim);font-size:var(--t-base);line-height:1.65">${esc(cloudFehler||"Unbekannter Fehler.")}</p>
      <div class="mo-act"><button class="b b-1" onclick="closeModal()">Schließen</button></div>`);
  };
  const off=document.getElementById("ghOff");
  if(off) off.onclick=()=>{ localStorage.removeItem(CLOUD_ON); localStorage.removeItem(CLOUD_TOK);
    setSync("off"); closeModal(); toast("Cloud getrennt"); };
}
</script>
<script>
/* ============================================================
   5 — DIAGRAMME
   Eine Achse pro Bild. Lücke statt Rahmen zwischen Segmenten.
   ============================================================ */

const noData=t=>`<div class="empty">${ico("chart")}<div>${esc(t)}</div></div>`;

function sparkline(vals,col,h=30){
  const v=vals.filter(x=>x!==null&&!isNaN(x));
  if(v.length<2) return `<div style="height:${h}px"></div>`;
  const W=120, mn=Math.min(...v), mx=Math.max(...v), sp=mx-mn||1;
  const pts=vals.map((x,i)=>x===null||isNaN(x)?null:[i/(vals.length-1)*W,h-((x-mn)/sp)*(h-4)-2]).filter(Boolean);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const last=pts[pts.length-1];
  const id="sg"+Math.random().toString(36).slice(2,7);
  return `<svg viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block;overflow:visible">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".28"/><stop offset="1" stop-color="${col}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${d} L${W},${h} L0,${h} Z" fill="url(#${id})"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.6" fill="${col}"/>
  </svg>`;
}

function lineChart(labels,series,opt={}){
  const W=680,H=opt.h||210,pL=40,pR=14,pT=16,pB=30;
  const pw=W-pL-pR, ph=H-pT-pB, n=labels.length;
  if(!n) return noData("Keine Daten im Zeitraum.");
  const all=series.flatMap(s=>s.data).filter(v=>v!==null&&!isNaN(v));
  if(!all.length) return noData("Keine Daten im Zeitraum.");
  let mn=opt.min!==undefined?opt.min:Math.min(...all);
  let mx=opt.max!==undefined?opt.max:Math.max(...all);
  if(mx===mn) mx=mn+1;
  const X=i=>pL+(n>1?pw/(n-1)*i:pw/2);
  const Y=v=>pT+ph-((v-mn)/(mx-mn))*ph;
  let g="";
  for(let i=0;i<=4;i++){
    const y=pT+ph/4*i, v=mx-(mx-mn)/4*i;
    g+=`<line x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}" stroke="var(--track)" stroke-width="1" ${i<4?'stroke-dasharray="3 5"':''}/>
        <text x="${pL-8}" y="${y+3.5}" text-anchor="end" font-family="var(--f-mono)" font-size="9.5" fill="var(--text-faint)">${(+v.toFixed(1))}</text>`;
  }
  let paths="";
  series.forEach((s,si)=>{
    const seg=[]; let cur=[];
    s.data.forEach((v,i)=>{ if(v===null||isNaN(v)){ if(cur.length)seg.push(cur); cur=[]; } else cur.push([X(i),Y(v)]); });
    if(cur.length) seg.push(cur);
    const id="lg"+si+Math.random().toString(36).slice(2,6);
    seg.forEach(pts=>{
      const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
      if(s.fill!==false&&pts.length>1)
        paths+=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${s.color}" stop-opacity=".22"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs>
          <path d="${d} L${pts[pts.length-1][0].toFixed(1)},${pT+ph} L${pts[0][0].toFixed(1)},${pT+ph} Z" fill="url(#${id})"/>`;
      paths+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
      if(pts.length===1) paths+=`<circle cx="${pts[0][0]}" cy="${pts[0][1]}" r="3" fill="${s.color}"/>`;
    });
  });
  let xs="";
  /* Gleichmäßiger Schritt, aber der letzte Eintrag verdrängt einen zu
     nahen Vorgänger, statt sich mit ihm zu überlappen. */
  const step=Math.max(1,Math.ceil(n/8));
  const zeig=new Set(); for(let i=0;i<n;i+=step) zeig.add(i);
  if(n>1){ const groesster=Math.max(...zeig);
    if(n-1-groesster<step*0.6) zeig.delete(groesster);
    zeig.add(n-1); }
  labels.forEach((l,i)=>{ if(zeig.has(i))
    xs+=`<text x="${X(i)}" y="${H-9}" text-anchor="middle" font-family="var(--f-mono)" font-size="9.5" fill="var(--text-faint)">${esc(l)}</text>`; });
  if(opt.band) g=`<rect x="${pL}" y="${Y(opt.band[1])}" width="${pw}" height="${Math.abs(Y(opt.band[0])-Y(opt.band[1]))}" fill="${opt.bandCol||"var(--c1)"}" opacity=".07"/>`+g;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}${paths}${xs}</svg>`;
}

/* ── Säulen-Tooltip ─────────────────────────────────────
   Ein einziger Zuhörer am Dokument statt einer Verdrahtung nach jedem
   Zeichnen: der Chart wird an mehreren Stellen neu gebaut, und eine
   Bindung, die man dabei vergisst, fällt erst beim Nutzer auf.
   Berührung und Maus laufen über dieselbe Stelle. */
/* Inhalt eines Wochen-Tooltips: Summe oben, darunter die Arten mit
   ihrer Dauer, absteigend. Stunden ab einer Stunde, darunter Minuten —
   „0.3 h" sagt niemandem etwas. */
function sbDauer(min){
  if(min<60) return Math.round(min)+" min";
  const h=Math.floor(min/60), m=Math.round(min%60);
  /* Bewusst „5 h 30" statt „5:30 h": Letzteres liest sich wie eine
     Uhrzeit, und im Chart geht es um Dauern. */
  return m? `${h} h ${String(m).padStart(2,"0")}` : `${h} h`;
}
function wochenTip(label,tot,typen){
  const zeilen=typen.filter(t=>tot[t.id])
    .sort((a,b)=>tot[b.id]-tot[a.id])
    .map(t=>`<div class="sb-tip-r"><i style="background:${t.color}"></i>${esc(t.label)}
      <span class="sb-tip-z">${sbDauer(tot[t.id])}</span></div>`).join("");
  const summe=Object.values(tot).reduce((a,b)=>a+b,0);
  const n=typen.filter(t=>tot[t.id]).length;
  if(!summe) return `<b>Woche ab ${esc(label)}</b><div class="sb-tip-r">kein Training</div>`;
  return `<b>Woche ab ${esc(label)}<span class="sb-tip-z">${sbDauer(summe)}</span></b>${zeilen}`
    + (n>1?`<div class="sb-tip-s">${n} Arten</div>`:"");
}

function sbZeigen(feld){
  const wrap=feld.closest(".sb-wrap"); if(!wrap) return;
  const tip=wrap.querySelector(".sb-tip"); if(!tip) return;
  let tips; try{ tips=JSON.parse(wrap.dataset.sbtips||"[]"); }catch(e){ return; }
  const i=+feld.dataset.sbi, inhalt=tips[i];
  if(inhalt==null){ sbWeg(wrap); return; }
  tip.innerHTML=inhalt;
  tip.hidden=false;
  /* Das SVG skaliert auf die Breite des Behälters; die x-Angabe steht
     aber in SVG-Einheiten. Deshalb umrechnen statt raten. */
  const breite=+wrap.dataset.sbbreite||680;
  const faktor=wrap.clientWidth/breite;
  const mitte=(+feld.dataset.sbx)*faktor;
  const halb=tip.offsetWidth/2;
  const links=Math.max(4,Math.min(wrap.clientWidth-tip.offsetWidth-4,mitte-halb));
  tip.style.left=links+"px";
  wrap.querySelectorAll(".sb-feld").forEach(f=>f.classList.remove("an"));
  feld.classList.add("an");
}
function sbWeg(wrap){
  if(!wrap) return;
  const tip=wrap.querySelector(".sb-tip"); if(tip) tip.hidden=true;
  wrap.querySelectorAll(".sb-feld").forEach(f=>f.classList.remove("an"));
}
document.addEventListener("pointerover",ev=>{
  const feld=ev.target.closest?.(".sb-feld");
  if(feld) sbZeigen(feld);
});
document.addEventListener("pointerdown",ev=>{
  const feld=ev.target.closest?.(".sb-feld");
  if(feld){ sbZeigen(feld); return; }
  document.querySelectorAll(".sb-wrap").forEach(sbWeg);
});
document.addEventListener("pointerout",ev=>{
  const wrap=ev.target.closest?.(".sb-wrap");
  /* Nur ausblenden, wenn der Zeiger den Chart wirklich verlässt —
     beim Wechsel zwischen zwei Säulen soll er stehen bleiben. */
  if(wrap && !wrap.contains(ev.relatedTarget)) sbWeg(wrap);
});

function stackBar(labels,series,opt={}){
  const W=680,H=opt.h||210,pL=40,pR=14,pT=16,pB=30;
  const pw=W-pL-pR, ph=H-pT-pB, n=labels.length;
  if(!n) return noData("Keine Daten.");
  const tot=labels.map((_,i)=>series.reduce((a,s)=>a+(s.data[i]||0),0));
  const raw=Math.max(...tot,1);
  const unit=opt.unit||1;
  const max=Math.max(unit,Math.ceil(raw/(unit*3))*unit*3);
  if(!raw) return noData(opt.emptyText||"Nichts erfasst.");
  const bw=Math.min(46,(pw/n)*.62), GAP=2, RAD=4;
  let g="";
  for(let i=0;i<=3;i++){
    const y=pT+ph/3*i, v=(max-(max/3)*i)/unit;
    g+=`<line x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}" stroke="var(--track)" stroke-width="1" ${i<3?'stroke-dasharray="3 5"':''}/>
        <text x="${pL-8}" y="${y+3.5}" text-anchor="end" font-family="var(--f-mono)" font-size="9.5" fill="var(--text-faint)">${Math.round(v*10)/10}</text>`;
  }
  let bars="";
  /* Beschriftung: gleichmäßiger Schritt, aber der letzte Eintrag
     verdrängt einen zu nahen Vorgänger statt sich damit zu überlappen. */
  const st0=Math.max(1,Math.ceil(n/9));
  const shown=new Set();
  for(let i=0;i<n;i+=st0) shown.add(i);
  if(n>1){ shown.delete(n-1-((n-1)%st0)===n-1?-1:n-1);
    if(n-1-Math.max(...shown)<st0*0.6) shown.delete(Math.max(...shown));
    shown.add(n-1); }
  labels.forEach((l,i)=>{
    const x=pL+(pw/n)*(i+.5);
    const segs=series.map(s=>({v:s.data[i]||0,c:s.color})).filter(s=>s.v>0);
    let yb=pT+ph;
    segs.forEach((sg,si)=>{
      const h0=(sg.v/max)*ph; yb-=h0;
      const top=si===segs.length-1;
      const h=Math.max(1,h0-(top?0:GAP)), y=yb+(top?0:GAP), xl=x-bw/2;
      if(top){ const r=Math.min(RAD,h,bw/2);
        bars+=`<path d="M${xl},${y+h} L${xl},${y+r} Q${xl},${y} ${xl+r},${y} L${xl+bw-r},${y} Q${xl+bw},${y} ${xl+bw},${y+r} L${xl+bw},${y+h} Z" fill="${sg.c}"/>`;
      } else bars+=`<rect x="${xl}" y="${y}" width="${bw}" height="${h}" fill="${sg.c}"/>`;
    });
    if(shown.has(i))
      bars+=`<text x="${x}" y="${H-9}" text-anchor="middle" font-family="var(--f-mono)" font-size="9.5" fill="var(--text-faint)">${esc(l)}</text>`;
  });
  /* Antippen und Überfahren: je Säule ein unsichtbares Feld über der
     vollen Höhe. Es liegt zuletzt im SVG, damit es über den Balken
     liegt, und deckt auch die leere Fläche darüber ab — sonst müsste
     man eine niedrige Säule millimetergenau treffen. */
  let felder="";
  if(opt.tip){
    labels.forEach((l,i)=>{
      const x=pL+(pw/n)*(i+.5);
      felder+=`<rect class="sb-feld" data-sbi="${i}" data-sbx="${x.toFixed(1)}"
        x="${(x-(pw/n)/2).toFixed(1)}" y="${pT}" width="${(pw/n).toFixed(1)}" height="${ph}"
        fill="transparent" style="cursor:pointer"/>`;
    });
  }
  const svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}${bars}${felder}</svg>`;
  if(!opt.tip) return svg;
  /* Die Inhalte hängen am Behälter, nicht an jedem Feld — so steht der
     Text genau einmal im Dokument, egal wie viele Säulen es sind. */
  return `<div class="sb-wrap" data-sbbreite="${W}" data-sbtips="${esc(JSON.stringify(opt.tip))}">
    ${svg}<div class="sb-tip" hidden></div></div>`;
}

const legend=items=>`<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;">
  ${items.map(i=>`<span style="display:flex;align-items:center;gap:6px;font-size:var(--t-sm);color:var(--text-dim)">
    <i style="width:8px;height:8px;border-radius:2px;background:${i.color};display:inline-block"></i>${esc(i.label)}</span>`).join("")}</div>`;

function ring(pct,size=112,stroke=9,col="var(--c1)",label=""){
  const r=(size-stroke)/2, c=2*Math.PI*r, p=clamp(pct/100,0,1);
  return `<div style="position:relative;width:${size}px;height:${size}px;flex:0 0 auto">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-linecap="round"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-p)).toFixed(1)}"
        style="transition:stroke-dashoffset .8s var(--ez);filter:drop-shadow(0 0 6px ${col})"/>
    </svg>
    <div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center">
      <div><div style="font-family:var(--f-disp);font-size:${size>96?"1.8rem":"1.2rem"};font-weight:700;line-height:1;font-variant-numeric:tabular-nums">${Math.round(pct)}<span style="font-size:.5em">%</span></div>
      ${label?`<div style="font-size:var(--t-xs);color:var(--text-faint);margin-top:2px">${esc(label)}</div>`:""}</div>
    </div></div>`;
}

function trendBadge(cur,prev,invert=false){
  if(cur===null||prev===null||prev===0) return "";
  const d=((cur-prev)/Math.abs(prev))*100;
  if(Math.abs(d)<3) return `<span class="trend t-fl">gleich</span>`;
  const up=d>0, good=invert?!up:up;
  return `<span class="trend ${good?"t-up":"t-dn"}">${up?"+":""}${d.toFixed(0)} %</span>`;
}

function smartCapture(raw){
  raw=(raw||"").trim(); if(!raw) return null;
  let low=raw.toLowerCase().replace(",","."), t=today(), when="";
  if(/\bvorgestern\b/.test(low)){ t=dk(addD(new Date(),-2)); when=" (vorgestern)"; low=low.replace(/\bvorgestern\b/,""); }
  else if(/\bgestern\b/.test(low)){ t=dk(addD(new Date(),-1)); when=" (gestern)"; low=low.replace(/\bgestern\b/,""); }
  const num=(low.match(/(\d+(?:\.\d+)?)/)||[])[1];
  const m=Object.assign({},S.metrics[t]);
  if(/(sleep\s*score|schlafscore|score)/.test(low)&&num){ m.sleepScore=+num; S.metrics[t]=m; save(); return `Sleep Score ${num}${when}`; }
  if(/(schlaf|sleep)/.test(low)&&num){ m.sleepHours=+num; S.metrics[t]=m; save(); return `Schlaf ${num} h${when}`; }
  if(/(lern|study|studium|anki)/.test(low)&&num){ m.study=+num; S.metrics[t]=m; save(); return `Lernzeit ${num} h${when}`; }
  if(/(handy|phone|screen|scroll)/.test(low)&&num){ m.phone=+num; S.metrics[t]=m; save(); return `Scrolling ${num} h${when}`; }
  const sp=sportTypes().find(x=>low.includes(x.label.toLowerCase())||low.includes(x.id));
  if(sp&&num){ addSport(t,{id:uid(),type:sp.id,duration:+num,hr:null,rpe:null,notes:null,kraftSubtype:null});
    return `${sp.label} ${num} min${when}`; }
  S.todos.push({id:uid(),text:raw,done:false,type:"short",priority:"mid",date:t,createdAt:Date.now()});
  save(); return `Aufgabe angelegt`;
}

const PALETTE=["#4fe3d2","#5a9ded","#9d7bff","#ff6b9d","#ff7a5c","#d9a441","#34d99a","#7dd87d","#8b96a8","#e879f9"];

/* Zwei Vorschläge je Gewohnheit.

   „Passend" ist dein eigener Schnitt, gerundet — ein Spiegel. Wer den
   nimmt, steht sofort bei 90 % und bleibt dort: fair gemessen, aber
   ohne Zug. „Fordernd" liegt eine Wiederholung darüber. Nah genug,
   dass es erreichbar bleibt, weit genug, dass es etwas kostet.
   Gesetzt wird nichts von selbst. */
function zielVorschlaege(){
  return activeHabits().map(h=>{
    const tage=Math.max(7,Math.round((new Date()-parsedk(h.createdAt))/86400000));
    const treffer=Object.values(S.habitLog||{}).filter(t=>t[h.id]).length;
    const proWoche=treffer/tage*7;
    const passend =clamp(Math.round(proWoche),1,7);
    const fordernd=clamp(passend+1,1,7);
    return {h, ist:proWoche, passend, fordernd,
            aendert:treffer>=4&&(passend!==habitSoll(h)||fordernd!==habitSoll(h))};
  }).filter(v=>v.aendert);
}

/* Wie oft pro Woche wird eine Bedingung tatsächlich erfüllt? */
function istProWoche(ok){
  const von=ersterTag(), bis=today();
  const tage=Math.max(7,Math.round((parsedk(bis)-parsedk(von))/86400000)+1);
  let n=0;
  for(let d=parsedk(von); ; d=addD(d,1)){
    const k=dk(d); if(k>bis) break; if(ok(k)) n++;
  }
  return n/tage*7;
}

/* Vorschlag für die drei Ziele nach demselben Schema wie bei den
   Gewohnheiten: eine Wiederholung über dem, was du bisher schaffst.
   Beim Scrolling kommt die Schwelle dazu — die stand auf null, und
   null hast du an keinem einzigen erfassten Tag erreicht. Deshalb
   wird sie auf den nächsten Wert gesetzt, den du überhaupt triffst. */
function zielSchemaVorschlag(){
  const g=G(), z=ZG(), m=k=>S.metrics[k]||{};
  const raus=[];

  const sleepIst=istProWoche(schlafOk);
  raus.push({id:"sleepTage", label:"Geschlafen", ist:sleepIst,
    alt:z.sleepTage, neu:clamp(Math.round(sleepIst)+1,1,7),
    text:t=>`an ${t} Tagen ${f(g.sleep)} h und Score über ${z.scoreMin}`});

  const studyIst=istProWoche(k=>nv(m(k).study)&&m(k).study>=g.study);
  raus.push({id:"studyTage", label:"Gelernt", ist:studyIst,
    alt:z.studyTage, neu:clamp(Math.round(studyIst)+1,1,7),
    text:t=>`an ${t} Tagen mindestens ${f(g.study)} h`});

  /* Erreichbare Scroll-Schwelle: die kleinste aus einer festen Leiter,
     die du wenigstens einmal pro Woche schaffst. */
  const leiter=[.5,1,1.5,2,2.5,3];
  let schwelle=leiter[leiter.length-1];
  for(const sw of leiter){
    if(istProWoche(k=>nv(m(k).phone)&&m(k).phone<=sw)>=1){ schwelle=sw; break; }
  }
  const phoneIst=istProWoche(k=>nv(m(k).phone)&&m(k).phone<=schwelle);
  raus.push({id:"phoneTage", label:"Scroll-Ziel", ist:phoneIst,
    alt:z.phoneTage, neuMax:schwelle, altMax:z.phoneMax,
    neu:clamp(Math.round(phoneIst)+1,1,7),
    text:t=>`an ${t} Tagen höchstens ${f(schwelle)} h`});

  return raus;
}

        </div>
      </div>`).join("")}
    </div>

  const weg=id=>{ M.querySelector(`[data-zrow="${id}"]`)?.remove();
    if(!M.querySelector("[data-zrow]")){ closeModal(); R.habits(); } };

    if(h){ h.proWoche=habitSoll(h); save(); }   /* Wunsch festhalten, nicht erneut fragen */
    weg(bt.dataset.zskip); });
}
