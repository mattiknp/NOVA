<script>
/* ============================================================
   9 — NEXUS
   Rotierende Sphäre: jeder Hauptknoten ein Lebensbereich,
   Trabanten sind die einzelnen Gewohnheiten. Tiefe entscheidet
   über Größe, Deckkraft und Unschärfe.
   ============================================================ */
/* Mehrere Nexus-Instanzen möglich: eine große Ansicht, eine kleine
   auf der Startseite. Jede hält ihren eigenen Zustand. */
function nexusData(){
  const k=today(), m=S.metrics[k]||{}, g=G();
  const {done,total,pct}=completion(k);
  const sm=sportMin(k);
  const openTodos=(S.todos||[]).filter(t=>!t.done).length;
  const plan=planDay(k).length;
  /* Wie viele Tage liegt der letzte Eintrag in diesem Bereich zurück?
     Vernachlässigtes soll auffallen, nicht still bleiben. */
  const stale=(fn)=>{ for(let i=0;i<30;i++){ if(fn(dk(addD(new Date(),-i)))) return i; } return 30; };
  const N=[
    {key:"Gewohnheiten",sub:total?`${done}/${total}`:"–",v:total?pct/100:0,color:"#4fe3d2",
     lat:.30,lon:0.0, stale:stale(d=>Object.keys(S.habitLog[d]||{}).length>0)},
    {key:"Schlaf",sub:nv(m.sleepHours)?f(m.sleepHours)+" h":"–",v:nv(m.sleepHours)?clamp(m.sleepHours/g.sleep,0,1):0,color:"#5a9ded",
     lat:-.36,lon:0.9, stale:stale(d=>nv((S.metrics[d]||{}).sleepHours))},
    {key:"Lernen",sub:nv(m.study)?f(m.study)+" h":"–",v:nv(m.study)?clamp(m.study/g.study,0,1):0,color:"#9d7bff",
     lat:.54,lon:1.9, stale:stale(d=>nv((S.metrics[d]||{}).study)&&(S.metrics[d]||{}).study>0)},
    {key:"Handy",sub:nv(m.phone)?f(m.phone)+" h":"–",v:nv(m.phone)?clamp(1-(m.phone-g.phone)/(g.phone*2),0,1):0,color:"#ff7a5c",
     lat:-.18,lon:2.8, stale:stale(d=>nv((S.metrics[d]||{}).phone))},
    {key:"Training",sub:sm?sm+" min":"–",v:clamp(sm/60,0,1),color:"#34d99a",
     lat:.12,lon:3.8, stale:stale(d=>sportMin(d)>0)},
    {key:"Planer",sub:plan?plan+" Blöcke":"–",v:clamp(plan/5,0,1),color:"#7c5cff",
     lat:-.48,lon:4.7, stale:stale(d=>planDay(d).length>0)},
    {key:"Aufgaben",sub:openTodos?openTodos+" offen":"frei",v:openTodos?clamp(1-openTodos/8,0,1):1,color:"#ff6b9d",
     lat:.46,lon:5.5, stale:0},
  ];
  const log=S.habitLog[k]||{};
  const hs=activeHabits();
  const sats=hs.map((h,i)=>{
    const a=i/Math.max(1,hs.length)*6.2832;
    return {label:h.name.replace(/[^\p{L}\p{N} ]/gu,"").trim().slice(0,13),
      color:h.color,on:!!log[h.id],parent:0,art:"habit",
      lat:N[0].lat+Math.sin(a)*.44, lon:N[0].lon+Math.cos(a)*.66};
  });
  /* Heutige Trainingseinheiten umkreisen den Trainingsknoten */
  sportOn(k).forEach((e,i,arr)=>{
    const t=typeInfo(e.type), a=i/Math.max(1,arr.length)*6.2832+.7;
    sats.push({label:t.label,color:t.color,on:true,parent:4,art:"sport",
      lat:N[4].lat+Math.sin(a)*.34, lon:N[4].lon+Math.cos(a)*.5});
  });
  /* Offene Aufgaben als kleine Begleiter am Aufgabenknoten */
  (S.todos||[]).filter(t=>!t.done).slice(0,10).forEach((t,i,arr)=>{
    const a=i/Math.max(1,arr.length)*6.2832+1.4;
    const c=t.priority==="high"?"#e0697c":t.priority==="low"?"#7d8899":"#d9a441";
    sats.push({label:t.text.slice(0,11),color:c,on:false,parent:6,art:"todo",
      lat:N[6].lat+Math.sin(a)*.30, lon:N[6].lon+Math.cos(a)*.44});
  });
  /* Freie Partikel als Tiefenstaffelung, Menge nach Tagesfüllung */
  const dichte=Math.round(10+ (score3()??0)/100*16);
  const motes=[...Array(dichte)].map((_,i)=>{
    const a=i/dichte*6.2832*3.1;
    return {lat:Math.sin(i*1.7)*1.2, lon:a, color:i%3===0?"#4fe3d2":i%3===1?"#8b7cf0":"#d488b8",
            r:.55+((i*37)%40)/60};
  });
  return {nodes:N,sats,motes,score:score3()??0};
}

function makeNexus(cv,opt={}){
  const X={cv,ctx:cv.getContext("2d"),w:0,h:0,dpr:1,eng:false,
    yaw:.6,pitch:-.36,vy:0,vp:0,drag:false,lx:0,ly:0,
    stars:[],dust:[],hover:-1,mx:-1,my:-1,run:false,t0:performance.now(),
    mini:!!opt.mini, ratio:opt.ratio||.62, maxH:opt.maxH||660,
    onHover:opt.onHover||null, P:[] };
  const D=nexusData();
  X.nodes=D.nodes; X.sats=D.sats; X.motes=D.motes||[]; X.score=D.score;

  function size(){
    const wrap=cv.parentElement; if(!wrap) return;
    const r=wrap.getBoundingClientRect();
    const dpr=Math.min(2,devicePixelRatio||1);
    const w=Math.max(200,r.width);
    const h=Math.max(X.mini?230:340,Math.min(X.maxH,w*X.ratio));
    if(w===X.w&&h===X.h&&dpr===X.dpr) return;
    X.w=w; X.h=h; X.dpr=dpr;
    /* Auf schmalen Schirmen ist kein Platz für Trabantennamen und
       Kerntext — sie überlagern sonst die Zahl. */
    X.eng = w<430;
    cv.width=w*dpr; cv.height=h*dpr;
    cv.style.width=w+"px"; cv.style.height=h+"px";
    const sn=X.mini?110:150;
    X.stars=[...Array(sn)].map(()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.1+.25,a:Math.random()*.5+.15,p:Math.random()*6.28}));
    X.dust=[...Array(X.mini?46:64)].map(()=>({a:Math.random()*6.28,rad:.6+Math.random()*.75,sp:.0002+Math.random()*.0005,lat:(Math.random()-.5)*1.6}));
  }

  function proj(lat,lon,cx,cy,R){
    const cl=Math.cos(lat);
    const x0=cl*Math.cos(lon+X.yaw), y0=Math.sin(lat), z0=cl*Math.sin(lon+X.yaw);
    const cp=Math.cos(X.pitch), sp=Math.sin(X.pitch);
    const y=y0*cp-z0*sp, z=y0*sp+z0*cp;
    const s=1/(1-z*.36);
    return {x:cx+x0*R*s, y:cy+y*R*s*.92, z, s};
  }

  function draw(now){
    if(!X.run) return;
    const wrap=cv.parentElement;
    if(!wrap||!wrap.offsetParent){ X.run=false; return; }
    size();
    const ctx=X.ctx,w=X.w,h=X.h,cx=w/2,cy=h/2;
    const R=Math.min(w*(X.mini?.30:.30),h*(X.mini?.34:.40));
    ctx.setTransform(X.dpr,0,0,X.dpr,0,0);
    ctx.clearRect(0,0,w,h);
    const tm=(now-X.t0)*.001;

    if(!X.drag){
      X.yaw+=X.vy; X.pitch+=X.vp; X.vy*=.94; X.vp*=.9;
      if(Math.abs(X.vy)<.0011) X.yaw+=X.mini?.0009:.0013;
      X.pitch=clamp(X.pitch,-1.05,.5);
    }

    X.stars.forEach(s=>{
      ctx.globalAlpha=s.a*(.55+.45*Math.sin(tm*1.2+s.p));
      ctx.fillStyle="#bfe8ea";
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.2832); ctx.fill();
    });
    ctx.globalAlpha=1;

    {
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(tm*.06);
      const N=72, RR=R*(X.mini?1.58:1.42);
      for(let i=0;i<N;i++){
        const a=i/N*6.2832, long=i%6===0;
        const r2=RR+(long?(X.mini?7:9):(X.mini?3.5:4.5));
        ctx.strokeStyle=`rgba(79,227,210,${long?.26:.11})`;
        ctx.lineWidth=long?1.2:.75;
        ctx.beginPath(); ctx.moveTo(Math.cos(a)*RR,Math.sin(a)*RR);
        ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2); ctx.stroke();
      }
      ctx.restore();
    }

    const lats=X.mini?[-.95,-.62,-.31,0,.31,.62,.95]:[-.95,-.62,-.31,0,.31,.62,.95];
    const lons=[0,.524,1.047,1.571,2.094,2.618];
    const grid=[];
    lats.forEach(la=>{ const rg=[]; for(let i=0;i<=40;i++) rg.push(proj(la,i*.1571,cx,cy,R)); grid.push(rg); });
    lons.forEach(lo=>{ const rg=[]; for(let i=0;i<=40;i++) rg.push(proj(-1.5708+i*.0785,lo,cx,cy,R)); grid.push(rg); });
    grid.forEach(rg=>{ for(let i=0;i<rg.length-1;i++){
      const a=rg[i],b=rg[i+1],z=(a.z+b.z)/2;
      ctx.strokeStyle=`rgba(110,190,200,${(.03+.115*(z+1)/2).toFixed(3)})`;
      ctx.lineWidth=.85; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }});

    X.dust.forEach(d=>{ d.a+=d.sp*16;
      const p=proj(d.lat,d.a,cx,cy,R*d.rad*1.25);
      ctx.globalAlpha=.16+.34*(p.z+1)/2; ctx.fillStyle="#8fe3e0";
      ctx.beginPath(); ctx.arc(p.x,p.y,1.1*p.s,0,6.2832); ctx.fill(); });
    ctx.globalAlpha=1;

    /* In der kleinen Fassung kreisen die Knoten weiter außen, sonst
       schiebt sich einer vor die Zahl im Kern. */
    const NR=R*(X.eng?1.62:X.mini?1.48:1);
    const P=X.nodes.map(n=>proj(n.lat,n.lon,cx,cy,NR)); X.P=P;
    const PS=X.sats.map(s=>proj(s.lat,s.lon,cx,cy,NR*(s.art==="todo"?.86:s.art==="sport"?.94:1.0)));

    /* Freie Partikel auf einer eigenen, weiteren Bahn */
    (X.motes||[]).forEach((m,i)=>{
      const p=proj(m.lat, m.lon + tm*.045*(1+(i%3)*.35), cx,cy, R*1.16);
      const al=(.10+.34*(p.z+1)/2);
      ctx.globalAlpha=al; ctx.fillStyle=m.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,m.r*p.s,0,6.2832); ctx.fill();
    });
    ctx.globalAlpha=1;

    /* Ring, der die Bereiche der Reihe nach verbindet */
    if(!X.eng){
      ctx.lineWidth=.8;
      for(let i=0;i<P.length;i++){
        const a=P[i], c2=P[(i+1)%P.length];
        const z=(a.z+c2.z)/2;
        ctx.strokeStyle=`rgba(140,190,205,${(.04+.13*(z+1)/2).toFixed(3)})`;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(c2.x,c2.y); ctx.stroke();
      }
    }

    X.nodes.forEach((n,i)=>{
      const p=P[i], al=.14+.4*(p.z+1)/2;
      const mx=(cx+p.x)/2+(p.x-cx)*.18, my=(cy+p.y)/2+(p.y-cy)*.18;
      ctx.strokeStyle=n.color; ctx.globalAlpha=al*(.4+.6*n.v); ctx.lineWidth=.9+1.5*n.v;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.quadraticCurveTo(mx,my,p.x,p.y); ctx.stroke();
      const flows=X.mini?1:1+Math.round(n.v*2);
      for(let q=0;q<flows;q++){
        const t2=(tm*.16+i*.31+q/flows)%1, u=1-t2;
        const bx=u*u*cx+2*u*t2*mx+t2*t2*p.x, by=u*u*cy+2*u*t2*my+t2*t2*p.y;
        ctx.globalAlpha=al*1.7; ctx.fillStyle=n.color;
        ctx.beginPath(); ctx.arc(bx,by,1.4+1.1*n.v,0,6.2832); ctx.fill();
      }
      ctx.globalAlpha=1;
    });

    {
      PS.map((p,i)=>({p,i})).sort((a,b)=>a.p.z-b.p.z).forEach(({p,i})=>{
        const s=X.sats[i], pp=P[s.parent], al=.2+.65*(p.z+1)/2;
        ctx.strokeStyle=s.color; ctx.globalAlpha=al*(s.art==="todo"?.16:.26); ctx.lineWidth=s.art==="todo"?.5:.7;
        ctx.beginPath(); ctx.moveTo(pp.x,pp.y); ctx.lineTo(p.x,p.y); ctx.stroke();
        ctx.globalAlpha=al;
        if(s.on){ ctx.shadowColor=s.color; ctx.shadowBlur=9; }
        const gr=s.art==="todo" ? (X.mini?1.5:1.9)
               : s.art==="sport"? (X.mini?2.8:3.6)
               : (s.on?(X.mini?2.4:3.1):(X.mini?1.7:2.1));
        ctx.fillStyle=s.on?s.color:"rgba(140,160,180,.5)";
        if(s.art==="sport"){
          /* Trainingseinheiten als kleine Rauten, damit sie sich
             von den Gewohnheiten unterscheiden */
          ctx.beginPath();
          ctx.moveTo(p.x,p.y-gr*p.s); ctx.lineTo(p.x+gr*p.s,p.y);
          ctx.lineTo(p.x,p.y+gr*p.s); ctx.lineTo(p.x-gr*p.s,p.y);
          ctx.closePath(); ctx.fill();
        } else {
          ctx.beginPath(); ctx.arc(p.x,p.y,gr*p.s,0,6.2832); ctx.fill();
        }
        ctx.shadowBlur=0;
        if(!X.eng&&p.z>(X.mini?.55:.25)&&s.label){
          ctx.globalAlpha=al*.75; ctx.fillStyle="#8ea3b5";
          ctx.font=`${X.mini?7.5:9}px ui-monospace, monospace`; ctx.textAlign="center";
          ctx.fillText(s.label,p.x,p.y+11*p.s);
        }
        ctx.globalAlpha=1;
      });
    }

    P.map((p,i)=>({p,i})).sort((a,b)=>a.p.z-b.p.z).forEach(({p,i})=>{
      const n=X.nodes[i], al=.38+.62*(p.z+1)/2;
      const base=X.mini?6.5:9, add=X.mini?4.5:7;
      const r=(base+add*n.v)*p.s, hov=i===X.hover;
      /* Vernachlässigte Bereiche atmen sichtbar */
      const neglect=n.stale>=3?(.5+.5*Math.sin(tm*2.2+i)):1;
      ctx.globalAlpha=al;
      const gr=ctx.createRadialGradient(p.x,p.y,r*.4,p.x,p.y,r*2.6);
      gr.addColorStop(0,n.color+(n.stale>=3?"22":"44")); gr.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(p.x,p.y,r*2.6,0,6.2832); ctx.fill();
      ctx.shadowColor=n.color; ctx.shadowBlur=hov?22:(X.mini?7:11)*neglect;
      ctx.beginPath();
      for(let q=0;q<6;q++){ const a=(60*q-30)*Math.PI/180;
        const px=p.x+r*Math.cos(a), py=p.y+r*Math.sin(a); q?ctx.lineTo(px,py):ctx.moveTo(px,py); }
      ctx.closePath();
      ctx.fillStyle="rgba(7,10,16,.9)"; ctx.fill();
      ctx.strokeStyle=n.color; ctx.globalAlpha=al*(n.stale>=3?neglect:1);
      ctx.lineWidth=hov?2.4:1.6; ctx.stroke();
      ctx.shadowBlur=0; ctx.globalAlpha=al;
      if(n.v>0){
        ctx.beginPath();
        const ri=r*.62*Math.max(.18,n.v);
        for(let q=0;q<6;q++){ const a=(60*q-30)*Math.PI/180;
          const px=p.x+ri*Math.cos(a), py=p.y+ri*Math.sin(a); q?ctx.lineTo(px,py):ctx.moveTo(px,py); }
        ctx.closePath(); ctx.fillStyle=n.color; ctx.globalAlpha=al*.9; ctx.fill();
      }
      ctx.globalAlpha=al;
      {
        const below=p.y>cy;
        const ly=below?p.y+r+(X.mini?11:14):p.y-r-(X.mini?13:18);
        ctx.textAlign="center";
        if(X.eng){
          /* Auf schmalen Schirmen bleibt die Kugel stumm — die Werte
             stehen darunter als Leiste, dort kollidiert nichts. */
        } else {
          ctx.fillStyle="#93a7b8"; ctx.font=`${X.mini?8.5:10}px system-ui, sans-serif`;
          ctx.fillText(n.key,p.x,ly);
          ctx.fillStyle="#eaf2f6"; ctx.font=`700 ${X.mini?10:12}px system-ui, sans-serif`;
          ctx.fillText(n.sub,p.x,ly+(X.mini?11:14));
        }
        if(!X.mini&&n.stale>=3){
          ctx.fillStyle="#c48a3a"; ctx.font='9px system-ui, sans-serif';
          ctx.fillText(n.stale>=30?"lange nichts":`${n.stale} Tage her`,p.x,ly+27);
        }
      }
      ctx.globalAlpha=1;
    });

    const coreR=Math.min(X.mini?24:46,R*(X.mini?.36:.42)), ratio=clamp(X.score/100,0,1);
    const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,coreR*1.8);
    cg.addColorStop(0,"rgba(79,227,210,.20)"); cg.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(cx,cy,coreR*1.8,0,6.2832); ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.07)"; ctx.lineWidth=X.mini?3.4:5;
    ctx.beginPath(); ctx.arc(cx,cy,coreR,0,6.2832); ctx.stroke();
    const col=X.score>=75?"#52c98a":X.score>=45?"#4fe3d2":"#d9a441";
    ctx.strokeStyle=col; ctx.shadowColor=col; ctx.shadowBlur=X.mini?10:17;
    ctx.lineCap="round"; ctx.lineWidth=X.mini?3.4:5;
    ctx.beginPath(); ctx.arc(cx,cy,coreR,-Math.PI/2,-Math.PI/2+ratio*6.2832); ctx.stroke();
    ctx.shadowBlur=0; ctx.lineCap="butt";
    ctx.strokeStyle="rgba(79,227,210,.22)"; ctx.lineWidth=1;
    [0,3.14].forEach(o=>{ ctx.beginPath(); ctx.arc(cx,cy,coreR+(X.mini?8:10),tm*.42+o,tm*.42+o+1.15); ctx.stroke(); });
    ctx.textAlign="center";
    ctx.fillStyle=col; ctx.font=`700 ${X.mini?26:30}px system-ui, sans-serif`;
    ctx.fillText(String(X.score),cx,cy+(X.mini?9:6));
    if(!X.eng){
      ctx.fillStyle="#7d92a4"; ctx.font=`${X.mini?7.5:9}px system-ui, sans-serif`;
      ctx.fillText("3-TAGE-SCHNITT",cx,cy+(X.mini?21:22));
    }

    let hv=-1;
    if(X.mx>=0){ let best=1e9;
      P.forEach((p,i)=>{ const d=Math.hypot(p.x-X.mx,p.y-X.my); if(d<(X.mini?18:26)&&d<best){best=d;hv=i;} }); }
    if(hv!==X.hover){ X.hover=hv; X.onHover&&X.onHover(hv>=0?X.nodes[hv]:null, hv>=0?P[hv]:null); }
    cv.style.cursor=X.drag?"grabbing":(X.hover>=0?"pointer":"grab");

    requestAnimationFrame(draw);
  }

  const pos=e=>{ const r=cv.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left,y:t.clientY-r.top}; };
  cv.addEventListener("mousedown",e=>{ X.drag=true; const p=pos(e); X.lx=p.x; X.ly=p.y; });
  cv.addEventListener("mousemove",e=>{ const p=pos(e); X.mx=p.x; X.my=p.y;
    if(X.drag){ const dx=p.x-X.lx, dy=p.y-X.ly;
      X.yaw+=dx*.0065; X.pitch=clamp(X.pitch+dy*.005,-1.05,.5);
      X.vy=dx*.0065; X.vp=dy*.005; X.lx=p.x; X.ly=p.y; e.preventDefault(); } });
  cv.addEventListener("mouseleave",()=>{ X.mx=-1; X.my=-1; });
  addEventListener("mouseup",()=>{ X.drag=false; });
  cv.addEventListener("touchstart",e=>{ X.drag=true; const p=pos(e); X.lx=p.x; X.ly=p.y; },{passive:true});
  cv.addEventListener("touchmove",e=>{ const p=pos(e);
    if(X.drag){ const dx=p.x-X.lx, dy=p.y-X.ly;
      X.yaw+=dx*.0065; X.pitch=clamp(X.pitch+dy*.005,-1.05,.5);
      X.vy=dx*.0065; X.vp=dy*.005; X.lx=p.x; X.ly=p.y; e.preventDefault(); } },{passive:false});
  cv.addEventListener("touchend",()=>{ X.drag=false; });

  X.start=()=>{ if(X.run) return; X.run=true; X.w=0; X.h=0; X.t0=performance.now(); requestAnimationFrame(draw); };
  X.refresh=()=>{ const D2=nexusData(); X.nodes=D2.nodes; X.sats=D2.sats; X.motes=D2.motes||[]; X.score=D2.score; };
  return X;
}

/* ============================================================
   11 — RHYTHMUS
   Wann im Tag passiert was. Aus Planer-Blöcken der letzten
   12 Wochen, aufgeschlüsselt nach Wochentag und Stunde.
   ============================================================ */
let rhyMode="all", rhyView="heat", rhyWeeks=12, rhyPick=null;

/* Baut das Raster aus den Planer-Blöcken: Minuten je Wochentag und
   Stunde, plus wie viele Wochen überhaupt etwas dort lag. */
/* Der Rhythmus soll zeigen, wann dein Tag wirklich stattfindet — nicht
   nur, was du in den Planer geschrieben hast. Deshalb kommen Schlaf und
   Training als eigene Quellen dazu, sofern eine Uhrzeit bekannt ist.
   Schlaf über Mitternacht wird wie ein Planerblock aufgeteilt. */
function extraSegments(k,typeFilter){
  const out=[];
  const nimm=id=>!typeFilter||typeFilter==="all"||typeFilter===id;

  const add=(id,von,bis,label)=>{
    if(von===null||bis===null) return;
    if(bis>von) out.push({b:{type:id,note:label},from:von,to:bis,cont:false,goesOver:false,virt:true});
    else{ out.push({b:{type:id,note:label},from:von,to:1440,cont:false,goesOver:true,virt:true}); }
  };

  /* Schlaf würde unter „Alles“ die halbe Karte färben und alles andere
     erschlagen. Er erscheint nur, wenn man ihn gezielt auswählt. */
  if(typeFilter==="schlafen"){
    /* Garmin führt eine Nacht unter dem Aufwachdatum. Ein Eintrag
       „22:54 bis 07:15“ am 4. heißt also: eingeschlafen am 3. abends.
       Der Abendteil gehört deshalb auf den Vortag, der Morgenteil auf
       den Tag des Eintrags. */
    const m=S.metrics[k]||{};
    if(m.sleepFrom&&m.sleepTo){
      const v=hm2min(m.sleepFrom), bis=hm2min(m.sleepTo);
      if(bis>v) out.push({b:{type:"schlafen",note:"Schlaf"},from:v,to:bis,cont:false,goesOver:false,virt:true});
      else if(bis>0) out.push({b:{type:"schlafen",note:"Schlaf"},from:0,to:bis,cont:true,goesOver:false,virt:true});
    }
    /* Der Abend, an dem die kommende Nacht beginnt */
    const nm2=S.metrics[dk(addD(parsedk(k),1))]||{};
    if(nm2.sleepFrom&&nm2.sleepTo){
      const v=hm2min(nm2.sleepFrom), bis=hm2min(nm2.sleepTo);
      if(bis<=v) out.push({b:{type:"schlafen",note:"Schlaf"},from:v,to:1440,cont:false,goesOver:true,virt:true});
    }
  }

  sportOn(k).forEach(e=>{
    if(!e.start) return;
    const id=({tennis:"tennis",kraft:"gym",zone2:"zone2",laufen:"sport",mobility:"mobility"})[e.type]||"sport";
    if(!nimm(id)) return;
    const von=hm2min(e.start);
    add(id,von,von+(e.duration||0),typeInfo(e.type).label);
  });
  return out;
}

function rhyBuild(weeks,typeFilter,untilWeeksAgo=0){
  const mins={}, hits={};
  const start=addD(sow(new Date()),-(weeks-1+untilWeeksAgo)*7);
  const endEx=addD(sow(new Date()),-(untilWeeksAgo-1)*7);
  const activeWeeks=new Set();
  for(let i=0;;i++){
    const d=addD(start,i); if(d>=endEx) break;
    const k=dk(d), wd=(d.getDay()+6)%7, wIdx=Math.floor(i/7);
    const seen={};
    daySegments(k,typeFilter).concat(extraSegments(k,typeFilter)).forEach(g=>{
      activeWeeks.add(wIdx);
      for(let mnt=g.from;mnt<g.to;mnt+=15){
        const hr=Math.floor(mnt/60)%24, key=wd+"-"+hr;
        mins[key]=(mins[key]||0)+15;
        if(!seen[key]){ seen[key]=1; hits[key]=(hits[key]||0)+1; }
      }
    });
  }
  /* Nur Wochen mit Einträgen zählen. Sonst verwässern leere Wochen
     jeden Schnitt und alles sieht nach „kaum etwas“ aus. */
  return {mins,hits,weeks,active:Math.max(1,activeWeeks.size)};
}

R.rhythmus=function(){
  const el=document.getElementById("v-rhythmus");
  const types=blockTypes();
  /* Muster enthält die laufende Woche, sonst tauchen frische Einträge
     nicht auf. Für den Vergleich dient ein Grundmuster ohne diese Woche. */
  const A=rhyBuild(rhyWeeks,rhyMode,0);
  const BASE=rhyBuild(rhyWeeks,rhyMode,1);
  const cw=rhyBuild(1,rhyMode,0);
  const maxA=Math.max(1,...Object.values(A.mins));
  const hours=[...Array(24)].map((_,h)=>h);
  const rgb=rhyMode==="all"?"79,227,210":hexRgb(blockById(rhyMode).bg);

  /* ── Befunde ── */
  const WDS=[0,1,2,3,4,5,6];
  const perWd=WDS.map(wd=>hours.reduce((a,h)=>a+(A.mins[wd+"-"+h]||0),0)/A.active/60);
  const perHr=hours.map(h=>WDS.reduce((a,wd)=>a+(A.mins[wd+"-"+h]||0),0)/A.active/60);
  let peak={v:-1}; for(const wd of WDS) for(const h of hours){
    const v=(A.mins[wd+"-"+h]||0)/A.active/60; if(v>peak.v) peak={v,wd,h}; }
  /* Verlässlichkeit: in wie vielen aktiven Wochen lag zu dieser Zeit etwas */
  let solid=[]; for(const wd of WDS) for(const h of hours){
    const c=A.hits[wd+"-"+h]||0; if(c>=Math.ceil(A.active*.5)) solid.push({wd,h,c}); }
  solid.sort((a,b)=>b.c-a.c);
  /* Längstes wiederkehrend freies Fenster zwischen 7 und 22 Uhr */
  let bestGap={len:0};
  for(const wd of WDS){ let run=0,st=null;
    for(let h=7;h<=22;h++){
      const busy=(A.mins[wd+"-"+h]||0)/A.active/60>.12;
      if(!busy){ if(st===null) st=h; run++; if(run>bestGap.len) bestGap={len:run,wd,from:st}; }
      else { run=0; st=null; }
    } }
  /* Training je Wochentag — echte Einheiten, ohne erfundene Uhrzeit */
  const trainWd=[...Array(7)].map(()=>0);
  for(let i=0;i<rhyWeeks*7;i++){ const d=addD(addD(sow(new Date()),-(rhyWeeks-1)*7),i);
    trainWd[(d.getDay()+6)%7]+=sportMin(dk(d)); }
  const trainMax=Math.max(1,...trainWd);

  const cell=(wd,hr)=>{
    const key=wd+"-"+hr;
    const a=(BASE.mins[key]||0)/BASE.active, c=(cw.mins[key]||0);
    if(rhyView==="diff"){
      const d=c-a;                                   /* Minuten über oder unter dem Schnitt */
      const mag=clamp(Math.abs(d)/30,0,1);
      const col=Math.abs(d)<5?"rgba(255,255,255,.04)"
        :d>0?`rgba(74,222,128,${(mag*.85+.15).toFixed(2)})`
             :`rgba(251,113,133,${(mag*.85+.15).toFixed(2)})`;
      return `<button class="rc" data-c="${key}" title="${WD[wd]} ${p2(hr)}:00 — diese Woche ${Math.round(c)} min, sonst ${Math.round(a)} min"
        style="background:${col}"></button>`;
    }
    const p=maxA?(A.mins[key]||0)/maxA:0;
    return `<button class="rc" data-c="${key}" title="${WD[wd]} ${p2(hr)}:00 — Ø ${Math.round(a)} min pro Woche, in ${A.hits[key]||0} von ${A.active} Wochen"
      style="background:${p>0?`rgba(${rgb},${(p*.9+.1).toFixed(2)})`:"rgba(255,255,255,.03)"}"></button>`;
  };

  const anyData=Object.keys(A.mins).length>0||Object.keys(cw.mins).length>0;

  el.innerHTML=`
  <div class="p-head" style="margin-bottom:14px">
    <div><div style="font-family:var(--f-disp);font-size:var(--t-xl);font-weight:600">Rhythmus</div>
    <div class="p-note">Aus Planer, gemessenem Schlaf und Training. ${A.active} Wochen mit Einträgen, Fenster ${rhyWeeks} Wochen.</div></div>
    <div class="rhy-seg" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <div class="seg">
        <button class="${rhyView==="heat"?"on":""}" data-rv="heat">Muster</button>
        <button class="${rhyView==="diff"?"on":""}" data-rv="diff">Diese Woche</button>
      </div>
      <div class="seg">${[4,12,26].map(n=>`<button class="${rhyWeeks===n?"on":""}" data-rw="${n}">${n} W</button>`).join("")}</div>
    </div>
  </div>

/* Zelle angeklickt: welche Tage haben dazu beigetragen */
function rhyDetail(wd,hr){
  const rows=[];
  const start=addD(sow(new Date()),-(rhyWeeks-1)*7);
  for(let i=0;i<rhyWeeks*7;i++){
    const d=addD(start,i); if((d.getDay()+6)%7!==wd) continue;
    const k=dk(d);
    const bs=daySegments(k,rhyMode).concat(extraSegments(k,rhyMode))
      .filter(g=>g.from<(hr+1)*60&&g.to>hr*60)
      .map(g=>({type:g.b.type,note:g.b.note,start:min2hm(g.from),end:min2hm(g.to),virt:g.virt}));
    if(bs.length) rows.push({k,d,bs});
  }
  modal(`<h3>${WDL[(wd+1)%7]}, ${p2(hr)}:00 Uhr</h3>
    <div class="p-note" style="margin-bottom:12px">An ${rows.length} Terminen lag hier etwas.</div>
    ${rows.length?`<div style="display:flex;flex-direction:column;gap:7px;max-height:46vh;overflow-y:auto">
      ${rows.reverse().map(r=>`<div style="padding:9px 11px;border-radius:var(--r);background:rgba(255,255,255,.04)">
        <div style="font-size:var(--t-sm);color:var(--text-dim);margin-bottom:4px">${fmtShort(r.d)}</div>
        ${r.bs.map(b=>{const t=blockById(b.type);
          return `<div style="display:flex;align-items:center;gap:8px;font-size:var(--t-sm)">
            <i style="width:7px;height:7px;border-radius:2px;background:${t.bg};flex:0 0 auto"></i>
            <span style="flex:1">${esc(b.note||t.label)}${b.virt?` <span style="color:var(--text-faint);font-size:var(--t-xs)">gemessen</span>`:""}</span>
            <span style="font-family:var(--f-mono);font-size:var(--t-xs);color:var(--text-faint)">${b.start}–${b.end}</span></div>`;}).join("")}
      </div>`).join("")}</div>`
    :`<div class="empty">${ico("cal")}<div>Zu dieser Zeit lag nie etwas an.</div></div>`}
    <div class="mo-act"><button class="b" onclick="closeModal()">Schließen</button></div>`);
}

function hexRgb(h){
  const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h||"#4fe3d2");
  return m?[parseInt(m[1],16),parseInt(m[2],16),parseInt(m[3],16)].join(","):"79,227,210";
}

<script>
/* ============================================================
   11b — JOURNAL
   Stimmung und Tageslernen. Bewusst schmal gehalten: eine Zahl,
   ein Textfeld, und danach die Rückschau.
   ============================================================ */
const MOODS=[
  {v:1,l:"mies",   c:"#e0697c", i:"face1"},
  {v:2,l:"zäh",    c:"#d9a441", i:"face2"},
  {v:3,l:"okay",   c:"#8b96a8", i:"face2"},
  {v:4,l:"gut",    c:"#3fc9a4", i:"face3"},
  {v:5,l:"stark",  c:"#4fe3d2", i:"face3"},
];
const moodOf=k=>(S.mood||{})[k]||null;
function setMood(k,v){ if(!S.mood)S.mood={}; const e=S.mood[k]||(S.mood[k]={});
  e.v=(e.v===v?null:v); if(e.v===null) delete e.v;
  if(!e.v&&!e.note) delete S.mood[k]; save(); }
function setNote(k,t){ if(!S.mood)S.mood={}; const e=S.mood[k]||(S.mood[k]={});
  t=t.trim(); if(t) e.note=t; else delete e.note;
  if(!e.v&&!e.note) delete S.mood[k]; save(); }

let jDate=today(), jFilter="";

R.journal=function(){
  const k=jDate, m=moodOf(k)||{};
  const alle=Object.entries(S.mood||{}).filter(([,e])=>e.note||e.v)
    .sort((a,b)=>b[0].localeCompare(a[0]));
  const suche=jFilter.trim().toLowerCase();
  const liste=suche?alle.filter(([d,e])=>(e.note||"").toLowerCase().includes(suche)):alle;

  /* Stimmungsverlauf der letzten acht Wochen */
  const tage=[...Array(56)].map((_,i)=>addD(new Date(),-55+i));
  const werte=tage.map(d=>{const e=moodOf(dk(d));return e&&e.v?e.v:null;});
  const mitWert=werte.filter(v=>v!==null);
  const schnitt=mitWert.length?avg(mitWert):null;

  /* Wie hängt Stimmung mit Schlaf zusammen? Nur zeigen, wenn genug da ist. */
  let paare=[];
  Object.entries(S.mood||{}).forEach(([d,e])=>{
    const mm=S.metrics[d]||{};
    if(e.v&&nv(mm.sleepHours)) paare.push([mm.sleepHours,e.v]);
  });
  let hinweis="";
  if(paare.length>=8){
    const gut=paare.filter(p=>p[1]>=4), schlecht=paare.filter(p=>p[1]<=2);
    if(gut.length>=3&&schlecht.length>=3){
      const sg=avg(gut.map(p=>p[0])), ss=avg(schlecht.map(p=>p[0]));
      if(Math.abs(sg-ss)>=.4)
        hinweis=`An guten Tagen hast du im Schnitt ${f(sg)} h geschlafen, an schlechten ${f(ss)} h.`;
    }
  }

  document.getElementById("v-journal").innerHTML=`
  <div class="p-head" style="margin-bottom:14px">
    <div><div style="font-family:var(--f-disp);font-size:var(--t-xl);font-weight:600">Journal</div>
    <div class="p-note">${alle.length} Einträge${schnitt!==null?` · Stimmung ${f(schnitt)} von 5`:""}</div></div>
    <div style="display:flex;gap:6px;align-items:center">
      <button class="b b-i" id="jPrev">${ico("left")}</button>
      <input type="date" id="jDate" value="${k}" style="width:auto;padding:7px 10px;font-size:var(--t-sm)">
      <button class="b b-i" id="jNext">${ico("right")}</button></div>
  </div>

  <div class="grid zwei-spalten">
    <div class="grid">
      <div class="p">
        <div class="p-title" style="margin-bottom:14px">${ico("smile")}Wie war ${k===today()?"heute":fmtShort(parsedk(k))}?</div>
        <div class="mood-row">
          ${MOODS.map(x=>`<button class="mood${m.v===x.v?" on":""}" data-mv="${x.v}" style="--mc:${x.c}">
            ${ico(x.i)}<span>${x.l}</span></button>`).join("")}
        </div>
        <label style="display:flex;align-items:center;gap:7px;font-size:var(--t-sm);color:var(--text-dim);margin:18px 0 7px">
          ${ico("bulb").replace("<svg",'<svg width="14" height="14"')}Was hast du heute gelernt?</label>
        <textarea id="jNote" rows="5" placeholder="Eine Sache reicht. Auch Kleinigkeiten zählen."
          style="resize:vertical;line-height:1.6">${esc(m.note||"")}</textarea>
        <div style="display:flex;gap:8px;margin-top:10px;align-items:center">
          <button class="b b-1" id="jSave">Speichern</button>
          <span class="p-note" id="jHint"></span>
        </div>
      </div>

      <div class="p">
        <div class="p-head"><div class="p-title">${ico("spark")}Stimmung, acht Wochen</div>
          <span class="p-note">${mitWert.length} Tage bewertet</span></div>
        ${mitWert.length>1
          ? lineChart(tage.map(d=>d.getDate()===1||d.getDay()===1?fmtShort(d):""),
              [{data:werte,color:"var(--c1)"}],{min:1,max:5,h:150})
          : `<div class="empty">${ico("smile")}<div>Bewerte ein paar Tage, dann entsteht hier eine Kurve.</div></div>`}
        ${hinweis?`<div class="j-hint">${ico("bulb")}<span>${esc(hinweis)}</span></div>`:""}
      </div>
    </div>

    <div class="p">
      <div class="p-head">
        <div class="p-title">${ico("note")}Rückschau</div>
        <input id="jSuche" placeholder="Suchen…" value="${esc(jFilter)}" class="j-suche">
      </div>
      ${liste.length?`<div class="j-list">${liste.slice(0,60).map(([d,e])=>{
        const mo=MOODS.find(x=>x.v===e.v);
        return `<button class="j-item" data-jd="${d}">
          <div class="j-item-top">
            <span class="j-date">${fmtShort(parsedk(d))}<span class="j-wd">${WD[(parsedk(d).getDay()+6)%7]}</span></span>
            ${mo?`<span class="j-mood" style="color:${mo.c}">${ico(mo.i).replace("<svg",'<svg width="14" height="14"')}${mo.l}</span>`:""}
          </div>
          ${e.note?`<p class="j-text">${esc(e.note)}</p>`:`<p class="j-text j-empty">nur bewertet</p>`}
        </button>`;}).join("")}</div>`
      :`<div class="empty">${ico("note")}<div>${suche?"Nichts gefunden.":"Noch keine Einträge.<br>Schreib links deine erste Notiz."}</div></div>`}
    </div>
  </div>`;

  const V=document.getElementById("v-journal");
  V.querySelector("#jPrev").onclick=()=>{ jDate=dk(addD(parsedk(jDate),-1)); R.journal(); };
  V.querySelector("#jNext").onclick=()=>{ jDate=dk(addD(parsedk(jDate),1)); R.journal(); };
  V.querySelector("#jDate").onchange=e=>{ jDate=e.target.value||today(); R.journal(); };
  V.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{ setMood(k,+b.dataset.mv); R.journal(); });
  V.querySelectorAll("[data-jd]").forEach(b=>b.onclick=()=>{ jDate=b.dataset.jd; R.journal(); });
  const ta=V.querySelector("#jNote"), hint=V.querySelector("#jHint");
  const sichern=()=>{ setNote(k,ta.value); hint.textContent="gespeichert"; setTimeout(()=>hint.textContent="",1800); };
  V.querySelector("#jSave").onclick=sichern;
  ta.onblur=()=>{ if((moodOf(k)||{}).note!==ta.value.trim()) sichern(); };
  ta.onkeydown=e=>{ if((e.metaKey||e.ctrlKey)&&e.key==="Enter") sichern(); };
  const su=V.querySelector("#jSuche");
  su.oninput=()=>{ jFilter=su.value; const p=su.selectionStart; R.journal();
    const n=document.getElementById("jSuche"); n.focus(); n.setSelectionRange(p,p); };
};

/* Sammelt alles, was ein Zeitraum hergibt: Werte, Reihen, Schnitt. */
function spanStats(days){
  const pick=f2=>days.map(d=>{const m=S.metrics[dk(d)]||{};return nv(m[f2])?m[f2]:null;});
  const hp=days.map(d=>{const c=completion(dk(d));return c.total?c.pct:null;});
  const sm=days.map(d=>sportMin(dk(d))||null);
  const ds=days.map(d=>dayScore(dk(d)));
  return {sleep:pick("sleepHours"),score:pick("sleepScore"),study:pick("study"),
          phone:pick("phone"),habit:hp,sport:sm,day:ds,
          sportSum:sm.reduce((a,b)=>a+(b||0),0),
          solid:days.filter(d=>isChecked(dk(d))).length};
}
const kpi=(v,l,sub)=>`<div class="p p-tight"><div class="stat-v">${v}</div>
  <div class="stat-l">${l}</div>${sub||""}</div>`;

R.jahr=function(){

  });
  const alle=months.flatMap(m=>m.st.day).filter(x=>x!==null);
  const sportTot=months.reduce((a,m)=>a+m.st.sportSum,0);
  const solidTot=months.reduce((a,m)=>a+m.st.solid,0);
  const erfasst=months.reduce((a,m)=>a+m.st.day.filter(x=>x!==null).length,0);
  const mLab=months.map(m=>MS[m.mth]);

  let grids="";
  months.forEach(m=>{
    const off=(new Date(CY,m.mth,1).getDay()+6)%7;

    m.days.forEach(d=>{ const k=dk(d), s=dayScore(k);
      const col=s===null?"rgba(255,255,255,.05)":s>=80?"#52c98a":s>=60?"#4fe3d2":s>=40?"#5a9ded":s>=20?"#d9a441":"#e0697c";

    const a=avg(m.st.day);
    grids+=`<button class="ym" data-ym="${m.mth}">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
        <b style="font-family:var(--f-disp);font-size:var(--t-base)">${MS[m.mth]}</b>
        <span style="font-size:var(--t-xs);color:${a!==null?"var(--text-dim)":"var(--text-faint)"};font-variant-numeric:tabular-nums">${a!==null?Math.round(a):"–"}</span></div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2.5px">${c}</div></button>`;

  document.getElementById("v-jahr").innerHTML=`
  <div class="p-head" style="margin-bottom:14px">
    <div><div style="font-family:var(--f-disp);font-size:var(--t-xl);font-weight:600">${CY}</div>
    <div class="p-note">${erfasst} Tage erfasst</div></div>
    <div style="display:flex;gap:6px">

  <div class="grid c4" style="margin-bottom:14px">

    ${kpi(Math.round(sportTot/60)+" h","Training gesamt")}
    ${kpi(solidTot,"Solide Tage")}
    ${kpi((()=>{const b=months.filter(m=>avg(m.st.day)!==null).sort((x,z)=>avg(z.st.day)-avg(x.st.day))[0];
      return b?MS[b.mth]:"–";})(),"Bester Monat")}
  </div>

  <div class="grid zwei-spalten" style="margin-bottom:14px">
    <div class="p">
      <div class="p-head"><div class="p-title">${ico("spark")}Tageswert je Monat</div></div>
      ${lineChart(mLab,[{data:months.map(m=>{const a=avg(m.st.day);return a===null?null:Math.round(a);}),color:"var(--c1)"}],{min:0,max:100,h:170})}
    </div>

      <div class="p-head"><div class="p-title">${ico("run")}Training je Monat</div><span class="p-note">Stunden</span></div>
      ${stackBar(mLab,sportTypes().map(ty=>({color:ty.color,
        data:months.map(m=>m.days.reduce((a,d)=>a+sportOn(dk(d)).filter(e=>e.type===ty.id).reduce((x,e)=>x+e.duration,0),0))})),

      <span class="p-note">Stunden im Schnitt</span></div>
    ${(()=>{
      /* Kalenderwochen des Jahres: feiner als Monatsmittel, dadurch
         sieht man Einbrüche, die im Monatsschnitt verschwinden. */
      const w=[]; let d=sow(new Date(CY,0,4));
      while(d.getFullYear()<=CY){
        if(d.getFullYear()===CY||addD(d,6).getFullYear()===CY){
          const days=[...Array(7)].map((_,i)=>addD(d,i)).filter(x=>x.getFullYear()===CY);

        d=addD(d,7);
        if(d.getFullYear()>CY) break;

      if(!w.length) return noData("Keine Daten in diesem Jahr.");
      return lineChart(w.map(x=>x.l),[

        {data:w.map(x=>avg(x.st.phone)),color:"var(--m-phone)",fill:false}

    })()}

    background:var(--panel);border:1px solid var(--glass-edge);transition:border-color var(--d2) var(--ez)}
  #v-jahr .ym:hover{border-color:var(--line-2)}</style>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(158px,1fr))">${grids}</div>`;

  const V=document.getElementById("v-jahr");
  V.querySelector("#yPrev").onclick=()=>{ CY--; R.jahr(); };
  V.querySelector("#yNext").onclick=()=>{ CY++; R.jahr(); };
  V.querySelectorAll("[data-ym]").forEach(b=>b.onclick=()=>{ CM=new Date(CY,+b.dataset.ym,1); go("monat"); });
};

let MR=30;

let plDate=today(), plSel=0, plDragType=null, plDragTodo=null, todoPrio="mid";
const PL_H0=6, PL_H1=24, PL_HH=34;

R.planer=function(){
  const base=parsedk(plDate);
  const cols=[0,1].map(o=>{ const d=addD(base,o); return {d,k:dk(d)}; });
  const RANG={high:0,mid:1,low:2};
  const todos=(S.todos||[]).filter(t=>!t.done)
    .sort((a,b)=>(RANG[a.priority]??1)-(RANG[b.priority]??1)||(b.createdAt||0)-(a.createdAt||0));

  const colHtml=(c,idx)=>{
    const segs=daySegments(c.k);
    const isT=c.k===today();
    let rows="";
    for(let h=PL_H0;h<PL_H1;h++)
      rows+=`<div data-slot="${idx}|${h}" style="height:${PL_HH}px;border-top:1px solid var(--line);position:relative;cursor:pointer">
        <span style="position:absolute;left:5px;top:2px;font-family:var(--f-mono);font-size:9px;color:var(--text-faint)">${p2(h)}</span></div>`;
    let bl="";
    segs.forEach(g=>{
      const t=blockById(g.b.type);
      const from=Math.max(g.from,PL_H0*60), to=Math.max(from+15,g.to);
      if(to<=PL_H0*60) return;
      const top=(from/60-PL_H0)*PL_HH, hh=Math.max(16,(to-from)/60*PL_HH);
      const owner=g.cont?dk(addD(parsedk(c.k),-1)):c.k;
      const marks=(g.cont?"↑ ":"")+(g.goesOver?"":"");
      bl+=`<div data-blk="${owner}|${g.b.id}" title="${esc(g.b.note||t.label)} · ${g.b.start}–${g.b.end}${g.cont?" (vom Vortag)":g.goesOver?" (läuft weiter)":""}"
        style="position:absolute;left:38px;right:5px;top:${top}px;height:${hh-2}px;border-radius:var(--r-xs);
        ${g.cont?"border-top-left-radius:0;border-top-right-radius:0;":""}${g.goesOver?"border-bottom-left-radius:0;border-bottom-right-radius:0;":""}
        background:${t.bg};opacity:${g.cont?.72:1};padding:${hh>30?"5px 8px":"1px 8px"};overflow:hidden;cursor:pointer;
        box-shadow:var(--sh-1);color:#08111a;font-size:${hh>30?"var(--t-sm)":"10px"};line-height:1.25">
        <b style="font-weight:700">${marks}${esc(g.b.note||t.label)}</b>${hh>44?`<div style="opacity:.75;font-size:10px;margin-top:1px">${g.b.start}–${g.b.end}${g.goesOver?" +1":""}</div>`:""}</div>`;
    });
    const hrs=planHours(c.k);
    return `<div class="p" style="padding:0;overflow:hidden;${isT?"border-color:rgba(79,227,210,.35)":""}" data-col="${idx}">
      <div style="padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:9px;${isT?"background:rgba(79,227,210,.07)":""}">
        <div><div style="font-weight:700;font-size:var(--t-base);${isT?"color:var(--c1)":""}">${WDL[c.d.getDay()]}</div>
        <div style="font-size:var(--t-sm);color:var(--text-dim)">${fmtShort(c.d)} · ${Math.round(hrs*10)/10} h geplant</div></div>
        <button class="b b-sm ${isChecked(c.k)?"b-1":""}" data-chk="${c.k}">${isChecked(c.k)?"Erledigt":"Abhaken"}</button>
      </div>
      <div style="position:relative;max-height:600px;overflow-y:auto" data-drop="${idx}">
        <div style="position:relative">${rows}${bl}</div>
      </div></div>`;
  };

  document.getElementById("v-planer").innerHTML=`
  <div class="p-head" style="margin-bottom:14px">
    <div><div style="font-family:var(--f-disp);font-size:var(--t-xl);font-weight:600">Planer</div>
    <div class="p-note">Block wählen, dann in eine Spalte klicken. Aufgaben lassen sich hineinziehen.</div></div>
    <div style="display:flex;gap:6px;align-items:center">
      <button class="b b-i" id="plPrev">${ico("left")}</button>
      <input type="date" id="plDate" value="${plDate}" style="width:auto;padding:7px 10px;font-size:var(--t-sm)">
      <button class="b b-sm" id="plNow">Heute</button>
      <button class="b b-i" id="plNext">${ico("right")}</button></div>
  </div>
  <div class="p" style="margin-bottom:14px">
    <div class="p-title" style="margin-bottom:10px;font-size:var(--t-base)">Blöcke</div>
    <div class="chips">${blockTypes().map(t=>
      `<button class="chip" data-bt="${t.id}" draggable="true"
        style="border-color:${t.bg}66;background:${t.bg}1f;color:${t.bg}">${esc(t.label)}</button>`).join("")}</div>
  </div>
  <div class="grid pl-grid">
    ${colHtml(cols[0],0)}${colHtml(cols[1],1)}
    <div class="p pl-todo" style="padding:0;overflow:hidden">
      <div style="padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:var(--t-base)">Offene Aufgaben</div>
      <div style="padding:11px">
        <div style="display:flex;gap:6px;margin-bottom:10px">
          <input id="tdIn" placeholder="Neue Aufgabe" style="font-size:var(--t-sm);padding:8px 10px">
          <button class="b b-1 b-i" id="tdAdd" style="width:34px;height:34px">${ico("plus")}</button></div>
        <div class="chips" style="margin-bottom:9px">
          ${[["high","Wichtig","var(--bad)"],["mid","Normal","var(--warn)"],["low","Später","var(--good)"]]
            .map(([p,l,c])=>`<button class="chip${todoPrio===p?" on":""}" data-tp="${p}"
              style="${todoPrio===p?`border-color:${c};color:${c};background:color-mix(in srgb, ${c} 14%, transparent)`:""}">
              <i style="width:8px;height:8px;border-radius:50%;background:${c};display:inline-block;margin-right:6px"></i>${l}</button>`).join("")}
        </div>
        ${todos.length?`<div style="display:flex;flex-direction:column;gap:5px;max-height:460px;overflow-y:auto">
          ${todos.map(t=>{
            const pc=t.priority==="high"?"var(--bad)":t.priority==="low"?"var(--good)":"var(--warn)";
            const gewaehlt = plDragTodo===t.id;
            return `<div draggable="true" data-todo="${t.id}" class="td-row${gewaehlt?" gewaehlt":""}"
              style="border-left-color:${pc}">
              <button data-tdone="${t.id}" style="width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line-2);flex:0 0 auto;margin-top:1px"></button>
              <span style="flex:1;font-size:var(--t-sm);line-height:1.4;min-width:0;word-break:break-word">${esc(t.text)}</span>
              <button data-tcyc="${t.id}" title="Priorität wechseln" style="color:${pc};flex:0 0 auto;font-size:14px;line-height:1">●</button>
              <button data-tdel="${t.id}" style="color:var(--text-faint);flex:0 0 auto">${ico("x").replace("<svg",'<svg width="13" height="13"')}</button>
            </div>`;}).join("")}</div>`
          :`<div class="empty" style="padding:20px 8px">${ico("check")}<div>Nichts offen.</div></div>`}
      </div></div>
  </div>`;

  const V=document.getElementById("v-planer");
  V.querySelector("#plPrev").onclick=()=>{ plDate=dk(addD(parsedk(plDate),-1)); R.planer(); };
  V.querySelector("#plNext").onclick=()=>{ plDate=dk(addD(parsedk(plDate),1)); R.planer(); };
  V.querySelector("#plNow").onclick=()=>{ plDate=today(); R.planer(); };
  V.querySelector("#plDate").onchange=e=>{ plDate=e.target.value||today(); R.planer(); };
  V.querySelectorAll("[data-chk]").forEach(b=>b.onclick=()=>{ toggleCheck(b.dataset.chk); R.planer(); paintOrb(); });
  V.querySelectorAll("[data-bt]").forEach(b=>{
    b.onclick=()=>{ plDragType=b.dataset.bt; plDragTodo=null;
      V.querySelectorAll("[data-bt]").forEach(x=>x.classList.remove("on")); b.classList.add("on");
      toast(blockById(plDragType).label+" gewählt, jetzt Spalte anklicken"); };
    b.ondragstart=()=>{ plDragType=b.dataset.bt; };
  });
  V.querySelectorAll("[data-slot]").forEach(s=>s.onclick=()=>{
    const [idx,h]=s.dataset.slot.split("|").map(Number);
    const k2=dk(addD(parsedk(plDate),idx));
    if(plDragTodo){
      const auf=(S.todos||[]).find(x=>x.id===plDragTodo);
      plDragTodo=null;
      openBlock(k2,"todo",p2(h)+":00",p2(Math.min(23,h+1))+":00",auf?auf.text:"",null);
      return;
    }
    if(!plDragType){ toast("Erst einen Block oder eine Aufgabe wählen","x"); return; }
    openBlock(k2,plDragType,p2(h)+":00",p2(Math.min(23,h+1))+":00",null,null);
  });
  V.querySelectorAll("[data-blk]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const [k,id]=b.dataset.blk.split("|");
    const bl=planDay(k).find(x=>x.id===id); if(bl) openBlock(k,bl.type,bl.start,bl.end,bl.note,id);
  });
  V.querySelectorAll("[data-drop]").forEach(d=>{
    d.ondragover=e=>e.preventDefault();
    d.ondrop=e=>{ e.preventDefault();
      const idx=+d.dataset.drop, r=d.getBoundingClientRect();
      const h=clamp(Math.floor((e.clientY-r.top+d.scrollTop)/PL_HH)+PL_H0,PL_H0,PL_H1-1);
      const k=dk(addD(parsedk(plDate),idx));
      if(plDragTodo){ const t=(S.todos||[]).find(x=>x.id===plDragTodo);
        if(t) openBlock(k,"todo",p2(h)+":00",p2(Math.min(23,h+1))+":00",t.text,null);
        plDragTodo=null; }
      else if(plDragType) openBlock(k,plDragType,p2(h)+":00",p2(Math.min(23,h+1))+":00",null,null); };
  });
  /* Ziehen gibt es auf dem Handy nicht. Deshalb: Aufgabe antippen,
     dann eine Stunde im Tagesplan antippen. Gilt auch am Rechner. */
  V.querySelectorAll("[data-todo]").forEach(t=>{
    t.ondragstart=()=>{ plDragTodo=t.dataset.todo; plDragType=null; };
    t.onclick=e=>{
      if(e.target.closest("[data-tdone],[data-tdel],[data-tcyc]")) return;
      const id=t.dataset.todo;
      plDragTodo = plDragTodo===id ? null : id;
      if(plDragTodo){ plDragType=null;
        const auf=(S.todos||[]).find(x=>x.id===plDragTodo);
        toast(`„${auf?auf.text.slice(0,22):""}“ gewählt, jetzt Uhrzeit antippen`); }
      R.planer();
    };
  });
  V.querySelectorAll("[data-tdone]").forEach(b=>b.onclick=()=>{
    const t=(S.todos||[]).find(x=>x.id===b.dataset.tdone); if(t){ t.done=true; save(); toast("Erledigt"); R.planer(); } });
  V.querySelectorAll("[data-tdel]").forEach(b=>b.onclick=()=>{
    S.todos=(S.todos||[]).filter(x=>x.id!==b.dataset.tdel); save(); R.planer(); });
  V.querySelectorAll("[data-tp]").forEach(b=>b.onclick=()=>{ todoPrio=b.dataset.tp; R.planer(); });
  V.querySelectorAll("[data-tcyc]").forEach(b=>b.onclick=()=>{
    const t=(S.todos||[]).find(x=>x.id===b.dataset.tcyc); if(!t) return;
    t.priority=({high:"mid",mid:"low",low:"high"})[t.priority||"mid"];
    save(); R.planer(); });
  const ti=V.querySelector("#tdIn");
  const addT=()=>{ const v=ti.value.trim(); if(!v) return;
    S.todos.push({id:uid(),text:v,done:false,type:"short",priority:todoPrio,date:today(),createdAt:Date.now()});
    save(); ti.value=""; R.planer(); };
  V.querySelector("#tdAdd").onclick=addT;
  ti.onkeydown=e=>{ if(e.key==="Enter") addT(); };
};

function openBlock(k,type,start,end,note,id){
  modal(`<h3>${id?"Block bearbeiten":"Block einfügen"}</h3>
    <label>Art</label>
    <select id="blType">${blockTypes().map(t=>`<option value="${t.id}"${t.id===type?" selected":""}>${esc(t.label)}</option>`).join("")}</select>
    <div style="display:flex;gap:10px">
      <div style="flex:1"><label>Von</label><input type="time" id="blS" value="${start}"></div>
      <div style="flex:1"><label>Bis</label><input type="time" id="blE" value="${end}"></div></div>
    <label>Notiz</label><input id="blN" value="${esc(note||"")}" placeholder="optional">
    <div class="mo-act">
      ${id?`<button class="b" id="blDel" style="margin-right:auto;color:var(--bad)">${ico("trash")}Löschen</button>`:""}
      <button class="b" onclick="closeModal()">Abbrechen</button>
      <button class="b b-1" id="blSave">Speichern</button></div>`);
  document.getElementById("blSave").onclick=()=>{
    const t=document.getElementById("blType").value;
    const s=document.getElementById("blS").value||start;
    const e=document.getElementById("blE").value||end;
    const n=document.getElementById("blN").value.trim();
    if(!S.planer[k]) S.planer[k]=[];
    if(id){ const b=S.planer[k].find(x=>x.id===id); if(b) Object.assign(b,{type:t,start:s,end:e,note:n}); }
    else S.planer[k].push({id:uid(),type:t,start:s,end:e,note:n});
    save(); closeModal(); toast(id?"Gespeichert":"Block eingefügt"); R.planer();
  };
  const del=document.getElementById("blDel");
  if(del) del.onclick=()=>{ S.planer[k]=(S.planer[k]||[]).filter(x=>x.id!==id);
    if(!S.planer[k].length) delete S.planer[k];
    save(); closeModal(); toast("Gelöscht"); R.planer(); };
}

/* ============================================================
   15 — START
   ============================================================ */
load();
garminNeu=mergeGarmin();
if(garminNeu) persist();
shell();
if(cloudOn()){ setSync("busy"); pullCloud().then(ok=>{ if(ok) go(VIEW); }); } else setSync("off");
if(garminNeu) setTimeout(()=>toast(`${garminNeu} Werte von Garmin ergänzt`,"heart"),1400);
if(imported) setTimeout(()=>toast(imported==="seed"
  ? "Dein Stand vom 1. August geladen" : "Daten aus deinem Tracker übernommen","cloud"),600);
</script>
</body>
</html>
