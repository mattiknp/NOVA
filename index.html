.lu-fach span{ display:flex; align-items:center; gap:8px; font-weight:650; color:var(--text); font-size:var(--t-md); }
.lu-fach span i{ width:10px; height:10px; border-radius:50%; background:var(--fc); flex:0 0 auto; }
.lu-fach em{ font-style:normal; font-size:var(--t-xs); color:var(--text-faint); padding-left:18px; }
.lu-fach.on{ border-color:color-mix(in srgb, var(--fc) 70%, transparent); background:color-mix(in srgb, var(--fc) 14%, transparent); }
.lu-fach:active{ transform:scale(.97); }
@media (hover:hover){ .lu-fach:hover{ background:rgba(var(--ov),.07); } }
.lu-fach-name{ color:var(--fc); }
.lf-zwei{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
.lf-teil{ min-width:0; padding:14px 14px 10px; border-radius:var(--r); background:rgba(var(--ov),.025); border:1px solid var(--line); }
.lf-kopf{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px; }
.lf-kopf span{ font-size:var(--t-sm); color:var(--text-dim); }
.lf-kopf b{ font-family:var(--f-disp); font-size:var(--t-lg); font-weight:650; font-variant-numeric:tabular-nums; color:var(--text); }
.lf-leer{ min-height:120px; display:grid; place-items:center; text-align:center; }
@media (max-width:640px){ .lf-zwei{ grid-template-columns:minmax(0,1fr); gap:10px; } }
.lf-balken{ height:190px; margin-top:4px; }
.lf-balken .un-b-s{ max-width:46px; }
.lf-balken .un-b-t{ color:var(--text); font-weight:600; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lf-balken .un-b.ohne .un-b-t{ color:var(--text-dim); font-weight:500; }
.lf-pz{ font-size:10.5px; color:var(--text-faint); margin-top:-3px; font-variant-numeric:tabular-nums; }
.lf-z{ display:grid; grid-template-columns:12px minmax(70px,auto) minmax(0,1fr) auto; gap:10px; align-items:center; padding:7px 0; }
.lf-z + .lf-z{ border-top:1px solid var(--line); }
.lf-z i{ width:10px; height:10px; border-radius:50%; }
.lf-n{ font-weight:600; font-size:var(--t-sm); color:var(--text); white-space:nowrap; }
.lf-bar{ height:8px; border-radius:4px; background:rgba(var(--ov),.05); overflow:hidden; }
.lf-bar b{ display:block; height:100%; border-radius:4px; }
.lf-h{ font-size:var(--t-sm); font-variant-numeric:tabular-nums; color:var(--text); text-align:right; white-space:nowrap; }
.lf-h small{ color:var(--text-faint); margin-left:6px; }
.lf-z.ohne .lf-n, .lf-z.ohne .lf-h{ color:var(--text-dim); font-weight:500; }
.lu-dauer{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:end; }
.lu-dauer input{ font-variant-numeric:tabular-nums; }
.lu-sitz{ display:flex; flex-direction:column; gap:6px; }
.lu-sitz-z{ display:flex; align-items:center; gap:10px; padding:8px 10px 8px 12px; border-radius:var(--r); background:rgba(var(--ov),.03); border:1px solid var(--line); font-size:var(--t-sm); }
.lu-sitz-z b{ font-variant-numeric:tabular-nums; font-weight:650; min-width:44px; }
.lu-sitz-z span{ flex:1; color:var(--text-faint); font-size:var(--t-xs); }
.lu-sitz-z button{ width:30px; height:30px; display:grid; place-items:center; border-radius:50%; border:0; background:none; color:var(--text-faint); cursor:pointer; }
.lu-sitz-z button svg{ width:15px; height:15px; }
@media (hover:hover){ .lu-sitz-z button:hover{ color:var(--bad); background:rgba(var(--ov),.06); } }
.lu-karte.an .lu-knopf{ color:#fff; background:linear-gradient(135deg,#ff7a7a,#d9485a); box-shadow:0 12px 30px -10px rgba(217,72,90,.8); }
@media (max-width:640px){
  .lu-karte{ grid-template-columns:minmax(0,1fr); justify-items:center; gap:16px; padding:22px 18px; text-align:center; }
  .lu-ring{ width:210px; height:210px; }
  .lu-zeit{ font-size:34px; }
  .lu-rechts{ display:flex; flex-direction:column; align-items:center; width:100%; }
  .lu-titel{ font-size:22px; }
  .lu-zahlen{ grid-template-columns:repeat(2,minmax(0,1fr)); width:100%; text-align:left; margin:14px 0 16px; }
  .lu-knopf{ width:100%; }
  .lu-knoepfe{ width:100%; flex-direction:column; gap:8px; }
  .lu-nach{ width:100%; justify-content:center; height:46px; }
}
@media (prefers-reduced-motion:reduce){ .lu-karte.an::before{ animation:none; } }
.tb-clock{ font-family:var(--f-mono); font-size:var(--t-sm); color:var(--text-dim); font-variant-numeric:tabular-nums; }

.kbtn{
  display:inline-flex; align-items:center; gap:8px;
  padding:7px 12px; border-radius:var(--r); border:1px solid var(--line-2);
  background:rgba(var(--ov),.03); color:var(--text-dim); font-size:var(--t-sm);
  transition:border-color var(--d2) var(--ez), color var(--d2) var(--ez),
             background-color var(--d2) var(--ez), transform var(--d1) var(--ez);
}
@media (hover:hover) and (pointer:fine){ .kbtn:hover{ color:var(--text); border-color:var(--line-2); background:rgba(var(--ov),.07); } }

.kbtn:active{ transform:scale(.97); }
.kbtn kbd{ font-family:var(--f-mono); font-size:10px; border:1px solid var(--line); border-radius:4px; padding:1px 5px; color:var(--text-faint); }

/* Tages-Orb in der Kopfzeile */
.orb{ position:relative; width:38px; height:38px; flex:0 0 auto; }
.orb svg{ transform:rotate(-90deg); }
.orb b{
  position:absolute; inset:0; display:grid; place-items:center;
  font-family:var(--f-disp); font-size:var(--t-sm); font-weight:700;
  font-variant-numeric:tabular-nums;
}

.views{ flex:1; overflow-y:auto; overflow-x:hidden; padding:22px; }
.view{ display:none; max-width:1240px; margin:0 auto; }
.view.on{ display:block; animation:vin .32s var(--ez) both; }
/* Handy: Ziele und Check-in zuerst — das ist, wofür man morgens und abends reinschaut */
@media(max-width:700px){
  #v-heute.on{ display:flex; flex-direction:column; }
  #v-heute .hd-ziele{ order:-1; }
}
@keyframes vin{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }

/* ── Panels ────────────────────────────────────────────── */
.p{
  position:relative; border-radius:var(--r-lg); padding:18px;
  background:var(--panel);
  border:1px solid var(--glass-edge);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  box-shadow:var(--sh-2), inset 0 1px 0 rgba(var(--ov),.05);
}
.p-tight{ padding:14px; }
.p-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
.p-title{ font-family:var(--f-disp); font-size:var(--t-md); font-weight:600; display:flex; align-items:center; gap:9px; }
.p-title svg{ width:16px; height:16px; color:var(--text-faint); stroke-width:1.7; }
.p-note{ font-size:var(--t-sm); color:var(--text-dim); }

.grid{ display:grid; gap:14px; }
.c2{ grid-template-columns:repeat(2,minmax(0,1fr)); }
.c3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
.c4{ grid-template-columns:repeat(4,minmax(0,1fr)); }
@media(max-width:1080px){ .c3,.c4{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media(max-width:720px){ .c2,.c3,.c4{ grid-template-columns:minmax(0,1fr); } }

/* ── Knöpfe ────────────────────────────────────────────── */
.b{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:9px 15px; border-radius:var(--r); font-size:var(--t-base); font-weight:500;
  border:1px solid var(--line-2); background:rgba(var(--ov),.04); color:var(--text-dim);
  white-space:nowrap;
  transition:border-color var(--d2) var(--ez), color var(--d2) var(--ez),
             background-color var(--d2) var(--ez), transform var(--d1) var(--ez);
}
@media (hover:hover) and (pointer:fine){ .b:hover{ color:var(--text); background:rgba(var(--ov),.08); } }

.b:active{ transform:scale(.97); }
.b svg{ width:15px; height:15px; stroke-width:1.8; flex-shrink:0; }
.b-i.b-sm,.b-i.b-xs{ padding:0; }
.b-1{
  background:linear-gradient(135deg, var(--c1), var(--c1-deep));
  border-color:transparent; color:var(--auf-c1); font-weight:700;
  box-shadow:0 4px 16px var(--c1-glow);
}
@media (hover:hover) and (pointer:fine){ .b-1:hover{ background:linear-gradient(135deg, var(--c1), var(--c1-deep)); filter:brightness(1.08); color:var(--auf-c1); } }

.b-i{ width:36px; height:36px; padding:0; }
.b-sm{ padding:6px 11px; font-size:var(--t-sm); }
.b:disabled{ opacity:.4; cursor:not-allowed; transform:none; }

/* ── Kennzahlen ───────────────────────────────────────── */
.stat{ position:relative; overflow:hidden; }
.stat-v{ font-family:var(--f-disp); font-size:1.9rem; font-weight:700; letter-spacing:-.02em; line-height:1.05; font-variant-numeric:tabular-nums; }
.stat-l{ font-size:var(--t-sm); color:var(--text-dim); margin-top:3px; }
.stat-spark{ margin-top:10px; height:30px; }
.trend{ display:inline-flex; align-items:center; gap:3px; font-size:var(--t-xs); font-weight:700; padding:2px 7px; border-radius:var(--r-pill); margin-top:7px; font-variant-numeric:tabular-nums; }
.t-up{ color:var(--good); background:rgba(74,222,128,.14); }
.t-dn{ color:var(--bad); background:rgba(251,113,133,.14); }
.t-fl{ color:var(--text-faint); background:rgba(var(--ov),.06); }

.bar{ height:5px; border-radius:var(--r-pill); background:var(--track); overflow:hidden; margin-top:9px; }
.bar > i{ display:block; height:100%; border-radius:var(--r-pill); transition:width .6s var(--ez); }

/* ── Gewohnheiten ─────────────────────────────────────── */
.hb{
  position:relative; display:flex; align-items:center; gap:12px; width:100%;
  padding:11px 12px; border-radius:var(--r); text-align:left;
  border:1px solid transparent;
  transition:background-color var(--d2) var(--ez), border-color var(--d2) var(--ez), transform var(--d1) var(--ez);
}
@media (hover:hover) and (pointer:fine){ .hb:hover{ background:rgba(var(--ov),.045); border-color:var(--line); } }

.hb:active{ transform:scale(.99); }
.hb.on{ background:rgba(var(--c1r),.08); border-color:rgba(var(--c1r),.26); }
.hb-box{
  width:23px; height:23px; flex:0 0 auto; border-radius:7px;
  border:1.5px solid var(--line-2); display:grid; place-items:center;
  transition:background-color var(--d1) var(--ez), border-color var(--d1) var(--ez), box-shadow var(--d1) var(--ez);
}
.hb-box svg{ width:13px; height:13px; opacity:0; stroke:#04231f; stroke-width:3; transition:opacity var(--d1) var(--ez); }
.hb.on .hb-box{ background:var(--c1); border-color:var(--c1); box-shadow:0 0 14px var(--c1-glow); }
.hb.on .hb-box svg{ opacity:1; }
.hb-dot{ width:7px; height:7px; border-radius:50%; flex:0 0 auto; }
.hb-n{ flex:1; font-size:var(--t-base); font-weight:500; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.hb.on .hb-n{ color:var(--text-dim); }
/* Wochenziel in der Wochenansicht: direkt dort verstellbar, wo man
   sieht, ob es passt. */
.wz{
  display:flex; align-items:center; gap:2px; justify-content:flex-end;
}
.wz button{
  width:22px; height:26px; border-radius:var(--r-xs); flex:0 0 auto;
  color:var(--text-faint); font-size:15px; line-height:1;
  border:1px solid transparent; transition:all var(--d1) var(--ez);
}
@media (hover:hover) and (pointer:fine){ .wz button:hover:not(:disabled){ color:var(--wc); border-color:color-mix(in srgb, var(--wc) 34%, transparent); } }

.wz button:disabled{ opacity:.25; cursor:default; }
.wz-v{
  font-family:var(--f-mono); font-size:var(--t-xs); font-variant-numeric:tabular-nums;
  min-width:38px; text-align:center; padding:3px 0; border-radius:var(--r-pill);
  color:var(--text-dim); border:1px solid var(--line);
}
.wz-v.voll{
  color:var(--wc); border-color:color-mix(in srgb, var(--wc) 38%, transparent);
  background:color-mix(in srgb, var(--wc) 13%, transparent);
}

/* ── Gewohnheitszeile im Stil von uhabits ─────────────────
   Die letzten sieben Tage stehen dauerhaft in der Zeile und sind
   einzeln antippbar. Vorher gab es nur den heutigen Haken und sieben
   dünne Striche zum Ansehen — gestern nachtragen ging gar nicht. */
.hb-kopf{
  display:flex; align-items:center; gap:12px; padding:0 12px 7px;
  border-bottom:1px solid var(--line); margin-bottom:5px;
  font-size:var(--t-xs); color:var(--text-faint);
}
.hb-kopf-n{ flex:1; min-width:0; }
.hb-kopf-s{ flex:0 0 auto; min-width:44px; text-align:right; }
.hb2{
  display:flex; align-items:center; gap:12px; width:100%;
  padding:8px 12px; border-radius:var(--r);
  border:1px solid transparent;
  transition:background-color var(--d2) var(--ez), border-color var(--d2) var(--ez);
}
@media (hover:hover) and (pointer:fine){ .hb2:hover{ background:rgba(var(--ov),.04); border-color:var(--line); } }

.hb2.on{ background:rgba(var(--c1r),.07); border-color:rgba(var(--c1r),.22); }
.hb2.fertig{ opacity:.6; }
@media (hover:hover) and (pointer:fine){ .hb2.fertig:hover{ opacity:1; } }

.hb-tage{ display:flex; gap:4px; flex:0 0 auto; }
.ht-l{
  width:24px; text-align:center; font-family:var(--f-mono);
  font-size:9.5px; letter-spacing:-.03em; color:var(--text-faint);
}
.ht-l.heute{ color:var(--c1); }
.ht{
  width:24px; height:24px; border-radius:7px; flex:0 0 auto;
  border:1.5px solid var(--line-2); background:transparent;
  transition:background-color var(--d1) var(--ez), border-color var(--d1) var(--ez), transform var(--d1) var(--ez);
}
@media (hover:hover) and (pointer:fine){ .ht:hover:not(:disabled){ border-color:var(--hc); transform:scale(1.08); } }

.ht svg{ width:13px; height:13px; stroke-width:3; }
.ht.an{ background:var(--hc); border-color:var(--hc); }
.ht.an svg{ stroke:#08131a; }
/* Nur zur Anzeige: Ziel ist erreicht, dieser Tag zählt nicht gegen dich.
   Gestrichelter Rand und blasser Haken — damit man ihn nie mit einem
   echten Eintrag verwechselt. Gespeichert wird hier nichts. */
.ht.schein{
  border-style:dashed;
  border-color:color-mix(in srgb, var(--hc) 68%, transparent);
  background:color-mix(in srgb, var(--hc) 20%, transparent);
}
.ht.schein svg{ stroke:var(--hc); opacity:.9; }
.ht.heute{ box-shadow:0 0 0 2px rgba(var(--c1r),.28); }
.ht.aus{ border-color:transparent; background:rgba(var(--ov),.02); cursor:default; }

@media(max-width:640px){
  /* Auf dem Handy bekommen die Tage eine eigene Zeile — nebeneinander
     bliebe für den Namen nichts übrig. Größere Felder, besser zu treffen.
     Die Wochentage bleiben stehen, sonst weiß man nicht, welche Spalte
     welcher Tag ist. */
  .hb-kopf{ padding:0 12px 6px; }
  .hb-kopf-n, .hb-kopf-s{ display:none; }
  .hb-kopf .hb-tage{ flex:1 1 100%; justify-content:space-between; gap:5px; }
  .hb-kopf .ht-l{ width:34px; }
  .hb2{ flex-wrap:wrap; gap:8px 10px; padding:11px 12px; }
  .hb-n{ flex:1 1 auto; }
  .hb-tage{ order:3; flex:1 1 100%; justify-content:space-between; gap:5px; }
  .ht{ width:34px; height:30px; border-radius:8px; }
}

/* Stärke: die Zahl bekommt eine eigene Fläche, deren Füllung den
   Wert nochmal zeigt — so liest man sie auch im Vorbeigehen. */
.hb-s{
  font-family:var(--f-mono); font-size:var(--t-xs); font-variant-numeric:tabular-nums;
  flex:0 0 auto; min-width:44px; text-align:right; padding:3px 7px;
  border-radius:var(--r-pill); color:var(--text-dim); position:relative; overflow:hidden;
  background:rgba(var(--ov),.04);
}
.hb-s::before{
  content:""; position:absolute; inset:0; width:var(--kf,0%);
  background:var(--c1); opacity:.16;
}
/* Wochenziel schon erfüllt: die Zeile tritt zurück, verschwindet aber
   nicht — sonst wäre unklar, wo sie hin ist. */
.hb-w{
  font-family:var(--f-mono); font-size:var(--t-xs); flex:0 0 auto;
  padding:2px 7px; border-radius:var(--r-pill); color:var(--text-faint);
  border:1px solid var(--line);
}
.hb-w.voll{
  color:var(--good); border-color:color-mix(in srgb, var(--good) 34%, transparent);
  background:color-mix(in srgb, var(--good) 12%, transparent);
}
.hb.fertig{ opacity:.55; }
@media (hover:hover) and (pointer:fine){ .hb.fertig:hover{ opacity:1; } }


/* Stärke in der Gewohnheiten-Ansicht */
.hk-kraft{ display:flex; align-items:center; gap:14px; margin-bottom:13px; }
.hk-z{
  font-family:var(--f-disp); font-size:1.9rem; font-weight:700; line-height:1;
  letter-spacing:-.02em; color:var(--kc); font-variant-numeric:tabular-nums;
  flex:0 0 auto; min-width:74px;
}
.hk-bar{ height:6px; border-radius:var(--r-pill); background:var(--track); overflow:hidden; }
.hk-bar i{ display:block; height:100%; border-radius:var(--r-pill); }
.hk-u{ font-size:var(--t-xs); color:var(--text-faint); margin-top:7px; line-height:1.45; }
.hb-mini{ display:flex; gap:2px; flex:0 0 auto; }
.hb-mini i{ width:4px; height:14px; border-radius:2px; background:var(--track); }
.hb-mini i.f{ background:var(--c1); opacity:.75; }

/* ── Leerzustand ──────────────────────────────────────── */
.empty{ padding:26px 14px; text-align:center; color:var(--text-faint); font-size:var(--t-base); line-height:1.6; }
.empty svg{ width:26px; height:26px; margin-bottom:8px; opacity:.5; stroke-width:1.4; }

/* ── Kommandopalette ──────────────────────────────────── */
.cmdk-ov{
  position:fixed; inset:0; z-index:90; display:none;
  background:rgba(3,5,9,.62); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  align-items:flex-start; justify-content:center; padding:14vh 20px 20px;
}
.cmdk-ov.on{ display:flex; animation:fin .16s var(--ez) both; }
@keyframes fin{ from{opacity:0} to{opacity:1} }
.cmdk{
  width:100%; max-width:600px; border-radius:var(--r-lg);
  background:rgba(16,21,32,.94); border:1px solid var(--line-2);
  box-shadow:var(--sh-3); overflow:hidden;
  animation:cin .22s var(--ez) both;
}
@keyframes cin{ from{opacity:0; transform:scale(.97) translateY(-6px)} to{opacity:1; transform:none} }
.cmdk-in{ display:flex; align-items:center; gap:11px; padding:15px 17px; border-bottom:1px solid var(--line); }
.cmdk-in svg{ width:18px; height:18px; color:var(--text-faint); flex:0 0 auto; }
.cmdk-in input{ border:none; background:none; padding:0; font-size:var(--t-md); }
.cmdk-in input:focus{ box-shadow:none; background:none; }
.cmdk-list{ max-height:min(52vh,420px); overflow-y:auto; padding:7px; }
.cmdk-i{
  display:flex; align-items:center; gap:12px; width:100%;
  padding:10px 12px; border-radius:var(--r); text-align:left; color:var(--text-dim);
}
.cmdk-i svg{ width:17px; height:17px; flex:0 0 auto; stroke-width:1.7; }
.cmdk-i.sel{ background:rgba(var(--c1r),.12); color:var(--text); }
.cmdk-i b{ font-weight:500; font-size:var(--t-base); }
.cmdk-i span{ margin-left:auto; font-size:var(--t-xs); color:var(--text-faint); }
.cmdk-grp{ padding:9px 13px 5px; font-size:var(--t-xs); color:var(--text-faint); letter-spacing:.08em; text-transform:uppercase; }

/* ── Modal ────────────────────────────────────────────── */
.mv{
  position:fixed; inset:0; z-index:80; display:none;
  background:rgba(3,5,9,.66); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
  align-items:center; justify-content:center; padding:20px;
}
.mv.on{ display:flex; animation:fin .16s var(--ez) both; }
.mo{
  width:100%; max-width:430px; border-radius:var(--r-lg); padding:22px;
  background:rgba(18,23,35,.96); border:1px solid var(--line-2); box-shadow:var(--sh-3);
  animation:cin .22s var(--ez) both; max-height:88vh; overflow-y:auto;
}
.mo h3{ font-family:var(--f-disp); font-size:var(--t-lg); font-weight:600; margin-bottom:15px; }
.mo label{ display:block; font-size:var(--t-sm); color:var(--text-dim); margin:13px 0 5px; font-weight:500; }
.mo label:first-of-type{ margin-top:0; }
.mo .sl-felder label{ display:flex; margin:0; font-size:var(--t-xs); color:var(--text-faint); }
.mo-act{ display:flex; gap:8px; justify-content:flex-end; margin-top:20px; }

/* ── Diverses ─────────────────────────────────────────── */
.chips{ display:flex; gap:7px; flex-wrap:wrap; }
.chip{
  padding:6px 12px; border-radius:var(--r-pill); font-size:var(--t-sm);
  border:1px solid var(--line-2); background:rgba(var(--ov),.03); color:var(--text-dim);
  transition:all var(--d2) var(--ez);
}
@media (hover:hover) and (pointer:fine){ .chip:hover{ color:var(--text); background:rgba(var(--ov),.07); } }

.chip.on{ background:rgba(var(--c1r),.14); border-color:rgba(var(--c1r),.4); color:var(--c1); font-weight:600; }
.seg{ display:inline-flex; gap:2px; padding:3px; border-radius:var(--r); background:rgba(var(--ov),.04); border:1px solid var(--line); }
.seg button{ padding:5px 12px; border-radius:7px; font-size:var(--t-sm); color:var(--text-dim); transition:all var(--d2) var(--ez); }
.seg button.on{ background:rgba(var(--c1r),.16); color:var(--c1); font-weight:600; }
.tag{ display:inline-block; padding:2px 8px; border-radius:var(--r-pill); font-size:var(--t-xs); border:1px solid var(--line-2); color:var(--text-dim); }

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(120%);
  z-index:120; padding:12px 20px; border-radius:var(--r-pill);
  background:rgba(18,24,36,.96); border:1px solid var(--line-2);
  box-shadow:var(--sh-3); font-size:var(--t-base); display:flex; align-items:center; gap:9px;
  transition:transform var(--d3) var(--ez);
}
.toast.on{ transform:translateX(-50%) translateY(0); }
.toast svg{ width:16px; height:16px; color:var(--c1); }

/* ── Startseite: Auftakt ──────────────────────────────── */
.hd-top{ grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); margin-bottom:14px; }
.hd-hero{ display:flex; flex-direction:column; gap:14px; }
.hd-hero-in{ display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
.hd-greet{ font-family:var(--f-disp); font-size:var(--t-2xl); font-weight:700; letter-spacing:-.02em; line-height:1.1; }
.hd-sub{ color:var(--text-dim); font-size:var(--t-sm); margin-top:4px; }
.hd-acts{ display:flex; gap:7px; margin-top:10px; flex-wrap:wrap; align-items:center; }
.hd-streaks{ display:flex; gap:8px; flex-wrap:wrap; padding-top:12px; border-top:1px solid var(--line); }
.hd-streak{ flex:1; min-width:96px; display:flex; flex-direction:column; gap:1px; }
.hd-streak b{ font-family:var(--f-disp); font-size:1.3rem; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums; }
.hd-streak span{ font-size:var(--t-xs); color:var(--text-dim); }
.hd-nexus{ padding:16px 16px 14px; display:flex; flex-direction:column; }
.hd-nx-t{ font-family:var(--f-disp); font-size:var(--t-lg); font-weight:700; letter-spacing:-.01em; }
.hd-streak-pill{
  display:inline-flex; align-items:center; gap:6px; padding:7px 12px;
  border-radius:var(--r-pill); background:rgba(var(--ov),.04);
  border:1px solid var(--line); font-size:var(--t-sm); color:var(--text-dim);
}
.hd-streak-pill b{ font-family:var(--f-disp); font-size:var(--t-md); font-weight:700; font-variant-numeric:tabular-nums; }
.hd-nx-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:2px; }
.hd-plan-list{ display:flex; flex-direction:column; gap:5px; max-height:270px; overflow-y:auto; }
.hd-plan-row{
  display:flex; align-items:center; gap:10px; padding:8px 10px;
  border-radius:var(--r); background:rgba(var(--ov),.03); border-left:3px solid;
}
.hd-plan-row.live{ background:rgba(var(--c1r),.10); box-shadow:inset 0 0 0 1px rgba(var(--c1r),.22); }
.hd-plan-t{ font-family:var(--f-mono); font-size:var(--t-sm); color:var(--text-dim); font-variant-numeric:tabular-nums; }
.hd-plan-n{ flex:1; font-size:var(--t-base); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hd-main{ grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); align-items:start; }
@media(max-width:1180px){ .hd-top{ grid-template-columns:minmax(0,1fr); } }



/* Zeile im Ziel-Dialog: Name oben, Knöpfe darunter. Nebeneinander
   quetschten drei Knöpfe den Namen auf zwei Zeilen. */
.zl-row{ padding:11px 12px; border-radius:var(--r); background:rgba(var(--ov),.035); }
.zl-akt{ display:flex; gap:6px; margin-top:9px; flex-wrap:wrap; }
.zl-akt .b{ flex:1; min-width:92px; justify-content:center; }

/* ── Schema-Übernahme ─────────────────────────────────── */
.sm-kopf{
  font-size:var(--t-xs); color:var(--text-faint); letter-spacing:.06em;
  text-transform:uppercase; margin:14px 0 7px;
}
.sm-kopf:first-of-type{ margin-top:0; }
.sm-z{
  display:flex; align-items:center; gap:9px; flex-wrap:wrap;
  padding:9px 11px; border-radius:var(--r); margin-bottom:5px;
  background:rgba(var(--ov),.035); font-size:var(--t-sm);
}
.sm-n{ flex:1 1 130px; min-width:0; word-break:break-word; }
.sm-v{ color:var(--text-faint); }
.ti-pfeil{ font-style:normal; color:var(--text-faint); }
.sm-b{ color:var(--c1); font-weight:600; }
.sm-r{ flex-basis:100%; font-size:var(--t-xs); color:var(--text-faint); }
.sm-leer{ font-size:var(--t-sm); color:var(--text-faint); padding:8px 2px; }

/* ── Gesamtstärke ─────────────────────────────────────── */
.gs{ margin:2px 0 12px; }
.gs-kopf{ display:flex; align-items:baseline; gap:9px; margin-bottom:7px; flex-wrap:wrap; }
.gs-l{ font-size:var(--t-sm); color:var(--text-dim); }
.gs-z{
  font-family:var(--f-disp); font-size:var(--t-lg); font-weight:700;
  font-variant-numeric:tabular-nums; color:var(--c1);
}
.gs-d{
  font-size:var(--t-xs); font-weight:600; padding:2px 7px; border-radius:var(--r-pill);
  margin-left:auto;
}
.gs-d.auf{ color:var(--good); background:color-mix(in srgb, var(--good) 13%, transparent); }
.gs-d.ab{ color:var(--warn); background:color-mix(in srgb, var(--warn) 13%, transparent); }
.gs-bar{ height:5px; border-radius:var(--r-pill); background:var(--track); overflow:hidden; }
.gs-bar i{ display:block; height:100%; border-radius:var(--r-pill); background:var(--c1); }

/* ── Kurzbefehl-Adressen ──────────────────────────────── */
.kb-z{
  display:flex; align-items:center; gap:10px; padding:9px 11px;
  border-radius:var(--r); background:rgba(var(--ov),.035);
}
.kb-t{ font-size:var(--t-sm); }
.kb-u{
  font-family:var(--f-mono); font-size:10px; color:var(--text-faint);
  margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

/* ── Ziele: das Herzstück der Startseite ──────────────── */
.hd-ziele{ position:relative; isolation:isolate; overflow:hidden; margin-bottom:14px; padding:12px;
  border-radius:calc(var(--r) + 6px); border:1px solid var(--line); background-color:#0b0f17;
  transition:border-color .5s var(--ez), box-shadow .5s var(--ez); }
.hd-ziele::before{ content:""; position:absolute; inset:0; z-index:-2;
  background-repeat:no-repeat; background-size:max(100%, 560px) auto; background-position:44% 0; }
.hd-ziele::after{ content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
  background:
    linear-gradient(90deg, rgba(var(--dk),.05) 0%, rgba(var(--dk),.25) 45%, rgba(var(--dk),.70) 80%),
    linear-gradient(180deg, rgba(var(--dk),.10) 0, rgba(var(--dk),.45) 120px, rgba(var(--dk),.86) 210px, rgba(var(--dk),.93) 100%); }
.hd-ziele.voll{ border-color:color-mix(in srgb, var(--gold) 70%, transparent);
  box-shadow:0 0 0 1px color-mix(in srgb, var(--gold) 35%, transparent),
             0 0 34px -6px color-mix(in srgb, var(--gold) 38%, transparent); }
.hd-ziele.voll::after{ background:
    linear-gradient(180deg, color-mix(in srgb, var(--gold) 10%, transparent), transparent 60%),
    linear-gradient(90deg, rgba(var(--dk),.05) 0%, rgba(var(--dk),.25) 45%, rgba(var(--dk),.70) 80%),
    linear-gradient(180deg, rgba(var(--dk),.10) 0, rgba(var(--dk),.45) 120px, rgba(var(--dk),.86) 210px, rgba(var(--dk),.93) 100%); }
.hz-kopf{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:2px 4px 12px; }
.hz-ico{ display:grid; place-items:center; width:30px; height:30px; border-radius:50%;
  color:var(--text-faint); background:rgba(var(--ov),.04); border:1px solid var(--line); }
.hz-ico svg{ width:15px; height:15px; }
.voll .hz-ico{ color:var(--gold); border-color:color-mix(in srgb, var(--gold) 50%, transparent);
  background:color-mix(in srgb, var(--gold) 14%, transparent); }
.voll .hz-ico svg{ fill:var(--gold); }
.hz-t{ display:flex; flex-direction:column; gap:1px; min-width:0; }
.hz-t b{ font-size:var(--t-base); font-weight:650; }
.voll .hz-t b{ color:var(--gold); }
.hz-t span{ font-size:var(--t-xs); color:var(--text-faint); }
.hz-pips{ display:flex; gap:4px; }
.hz-pips i{ width:18px; height:5px; border-radius:var(--r-pill); background:var(--track); }
.hz-pips i.an{ background:var(--gold); }
.hz-serie{ margin-left:auto; font-size:var(--t-sm); color:var(--text-dim); font-variant-numeric:tabular-nums; }
.hz-serie b{ font-family:var(--f-disp); font-size:var(--t-lg); color:var(--text); margin-right:2px; }
.voll .hz-serie b{ color:var(--gold); }
.hz-serie em{ font-style:normal; font-size:var(--t-xs); color:var(--text-faint); margin-left:8px; }
@media(max-width:560px){ .hz-serie{ margin-left:0; width:100%; } }
.hd-goals{ margin-bottom:0; }
.goal{
  position:relative; overflow:hidden; padding:16px 17px;
  border-color:color-mix(in srgb, var(--gc) 22%, transparent);
}
.goal::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--gc) 9%, transparent), transparent 60%);
}
.goal.hit{ border-color:color-mix(in srgb, var(--gc) 42%, transparent); }
.goal-top{ display:flex; align-items:center; gap:9px; margin-bottom:11px; }
.goal-ico{ display:grid; place-items:center; color:var(--gc); }
.goal-ico svg{ width:17px; height:17px; }
.goal-name{ font-size:var(--t-base); font-weight:600; }
.goal-badge{
  margin-left:auto; font-size:var(--t-xs); font-weight:600; padding:3px 8px;
  border-radius:var(--r-pill); color:var(--gc);
  background:color-mix(in srgb, var(--gc) 15%, transparent);
}
.goal-num{ display:flex; align-items:baseline; gap:8px; }
.goal-num b{
  font-family:var(--f-disp); font-size:2.5rem; font-weight:700; line-height:1;
  letter-spacing:-.03em; color:var(--gc); font-variant-numeric:tabular-nums;
}
.goal-num span{ font-size:var(--t-sm); color:var(--text-dim); }
.goal-rettung{
  display:flex; align-items:center; gap:8px; margin-top:10px;
  padding:7px 10px; border-radius:var(--r); font-size:var(--t-xs);
  color:var(--gc); background:color-mix(in srgb, var(--gc) 11%, transparent);
  border:1px solid color-mix(in srgb, var(--gc) 24%, transparent);
}
.goal-rettung svg{ width:13px; height:13px; flex:0 0 auto; }

/* Puffer. Drei anonyme Punkte musste man erst deuten — ein Schild mit
   Zahl liest sich sofort, und der Tooltip sagt, was er bewirkt. */
.goal-schutz{
  margin-left:auto; display:flex; align-items:center; gap:5px; cursor:help;
  font-family:var(--f-mono); font-size:var(--t-xs); font-variant-numeric:tabular-nums;
  padding:3px 9px 3px 7px; border-radius:var(--r-pill);
  color:var(--text-faint); border:1px solid var(--line);
}
.goal-schutz svg{ width:12px; height:12px; }
.goal-schutz.hat{
  color:var(--gc); border-color:color-mix(in srgb, var(--gc) 34%, transparent);
  background:color-mix(in srgb, var(--gc) 12%, transparent);
}
.goal-num{ flex-wrap:wrap; }
.goal-bar{ height:5px; border-radius:var(--r-pill); background:var(--track); overflow:hidden; margin:12px 0 8px; }
.goal-bar > i{ display:block; height:100%; border-radius:var(--r-pill); background:var(--gc);
  transition:width .7s var(--ez); }
.goal-foot{ display:flex; justify-content:space-between; gap:10px; font-size:var(--t-xs); color:var(--text-faint); }
/* Check-in morgens/abends */
.ck-row{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:11px; }
.ck{ display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:var(--r); text-align:left;
  border:1px solid var(--line); background:rgba(var(--ov),.03); color:var(--text-dim); min-width:0; }
.ck-i{ display:grid; place-items:center; flex:0 0 auto; }
.ck-i svg{ width:14px; height:14px; }
.ck-t{ display:flex; flex-direction:column; min-width:0; line-height:1.2; }
.ck-t b{ font-size:var(--t-xs); font-weight:650; white-space:nowrap; }
.ck-t span{ font-size:10.5px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ck.offen{ cursor:pointer; color:var(--gc); border-color:color-mix(in srgb, var(--gc) 55%, transparent);
  background:color-mix(in srgb, var(--gc) 13%, transparent); animation:ckPuls 2.4s ease-in-out infinite; }
.ck.offen b{ color:var(--text); }
.ck.fertig{ color:var(--gc); border-color:color-mix(in srgb, var(--gc) 30%, transparent); background:color-mix(in srgb, var(--gc) 8%, transparent); }
.ck.verpasst{ opacity:.55; } .ck.verpasst .ck-t span{ color:var(--bad); }
.ck.spaeter{ opacity:.7; }
@keyframes ckPuls{ 0%,100%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--gc) 0%, transparent); }
  50%{ box-shadow:0 0 0 4px color-mix(in srgb, var(--gc) 16%, transparent); } }
@media (prefers-reduced-motion:reduce){ .ck.offen{ animation:none; } }
.ck-hinweis{ font-size:10.5px; color:var(--text-faint); margin-top:6px; }
.ck-sek{ font-size:var(--t-xs); color:var(--text-faint); text-transform:uppercase; letter-spacing:.07em; margin:16px 0 7px;
  display:flex; justify-content:space-between; }
.mo h3 + .ck-sek{ margin-top:0; }
.ck-liste{ display:flex; flex-direction:column; gap:3px; }
.ck-z{ display:flex; align-items:center; gap:9px; font-size:var(--t-sm); padding:5px 8px; border-radius:var(--r-xs); background:rgba(var(--ov),.03); }
.ck-z i{ width:7px; height:7px; border-radius:2px; flex:0 0 auto; }
.ck-zt{ font-family:var(--f-mono); color:var(--text-faint); font-size:var(--t-xs); min-width:38px; }
.ck-leer{ font-size:var(--t-sm); color:var(--text-faint); line-height:1.5; }
.ck-todos{ display:flex; flex-direction:column; gap:4px; max-height:240px; overflow-y:auto; }
.ck-todo{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--r); text-align:left;
  background:rgba(var(--ov),.03); border:1px solid var(--line); color:var(--text-dim); font-size:var(--t-sm); }
.ck-box{ width:17px; height:17px; flex:0 0 auto; border-radius:5px; border:1.5px solid var(--line-2); display:grid; place-items:center; color:transparent; }
.ck-box svg{ width:11px; height:11px; stroke-width:3; }
.ck-todo.an{ border-color:color-mix(in srgb, var(--warn) 50%, transparent); background:color-mix(in srgb, var(--warn) 10%, transparent); color:var(--text); }
.ck-todo.an .ck-box{ background:var(--warn); border-color:var(--warn); color:#141008; }

/* ── Wochenzeilen mit Kurve ───────────────────────────── */
.wk-grid{ display:flex; flex-direction:column; }
.wk-row{
  display:grid; grid-template-columns:98px minmax(0,1fr) auto;
  align-items:center; gap:14px; padding:9px 0;
  border-bottom:1px solid var(--line);
}
.wk-row:last-child{ border-bottom:none; }
.wk-l{ font-size:var(--t-sm); color:var(--text-dim); }
.wk-spark{ min-width:0; }
.wk-v{ display:flex; align-items:center; gap:8px; }
.wk-v b{ font-family:var(--f-disp); font-size:var(--t-md); font-variant-numeric:tabular-nums; }

/* ── Journal ──────────────────────────────────────────── */
.mood-row{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:7px; }
.mood{
  display:flex; flex-direction:column; align-items:center; gap:6px;
  padding:13px 6px; border-radius:var(--r); border:1px solid var(--line);
  background:rgba(var(--ov),.03); color:var(--text-faint);
  transition:border-color var(--d2) var(--ez), color var(--d2) var(--ez),
             background-color var(--d2) var(--ez), transform var(--d1) var(--ez);
}
.mood svg{ width:24px; height:24px; }
.mood span{ font-size:var(--t-xs); }
@media (hover:hover) and (pointer:fine){ .mood:hover{ color:var(--text-dim); border-color:var(--line-2); } }

.mood:active{ transform:scale(.96); }
.mood.on{
  color:var(--mc); border-color:color-mix(in srgb, var(--mc) 48%, transparent);
  background:color-mix(in srgb, var(--mc) 13%, transparent);
}
.mood.on span{ font-weight:600; }
.j-hint{
  display:flex; gap:9px; align-items:flex-start; margin-top:12px; padding:11px 13px;
  border-radius:var(--r); background:rgba(var(--c1r),.08);
  border:1px solid rgba(var(--c1r),.2); font-size:var(--t-sm); color:var(--text-dim); line-height:1.55;
}
.j-hint svg{ width:15px; height:15px; color:var(--c1); flex:0 0 auto; margin-top:1px; }
.j-list{ display:flex; flex-direction:column; gap:7px; max-height:620px; overflow-y:auto; }
.j-item{
  width:100%; text-align:left; padding:11px 13px; border-radius:var(--r);
  background:rgba(var(--ov),.03); border:1px solid transparent;
  transition:border-color var(--d2) var(--ez), background-color var(--d2) var(--ez);
}
@media (hover:hover) and (pointer:fine){ .j-item:hover{ border-color:var(--line-2); background:rgba(var(--ov),.05); } }

.j-item-top{ display:flex; align-items:center; justify-content:space-between; gap:9px; margin-bottom:5px; }
.j-date{ font-size:var(--t-sm); font-weight:600; display:flex; align-items:baseline; gap:6px; }
.j-wd{ font-weight:400; color:var(--text-faint); font-size:var(--t-xs); }
.j-mood{ display:flex; align-items:center; gap:5px; font-size:var(--t-xs); font-weight:600; }
.j-text{ font-size:var(--t-sm); color:var(--text-dim); line-height:1.55;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.j-empty{ font-style:italic; color:var(--text-faint); }
.j-suche{ width:auto; max-width:170px; padding:6px 10px; font-size:var(--t-sm); }
@media(max-width:860px){ .j-suche{ max-width:none; width:100%; margin-top:8px; } }

/* ── Monatszellen ─────────────────────────────────────── */
.mcell{
  aspect-ratio:1; border-radius:var(--r-xs); padding:6px 5px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  background:rgba(var(--ov),.03); border:1px solid var(--line);
  transition:border-color var(--d2) var(--ez), transform var(--d1) var(--ez);
}
@media (hover:hover) and (pointer:fine){ .mcell:hover{ border-color:var(--line-2); transform:scale(1.05); } }

.mcell.td{ border-color:var(--c1); box-shadow:0 0 0 1px rgba(var(--c1r),.25); }
.mcell-d{ font-family:var(--f-mono); font-size:9.5px; color:var(--text-faint); font-variant-numeric:tabular-nums; }
.mcell.td .mcell-d{ color:var(--c1); }
.mcell-s{ font-family:var(--f-disp); font-weight:700; font-size:var(--t-base); line-height:1; font-variant-numeric:tabular-nums; }
.mcell-mk{ display:flex; gap:2px; height:4px; }
.mcell-mk i{ width:4px; height:4px; border-radius:50%; display:block; }

/* Raster, die auf schmalen Schirmen einspaltig werden. Fest gesetzte
   Pixelbreiten in Inline-Stilen lassen sich nicht überschreiben,
   deshalb stehen sie hier als Klassen. */
.rhy-grid{ grid-template-columns:minmax(0,1fr) 300px; align-items:start; }
.zwei-spalten{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); align-items:start; }
@media(max-width:900px){
  .rhy-grid,.zwei-spalten{ grid-template-columns:minmax(0,1fr); }
}

/* Filterreihe: auf dem Handy seitlich schiebbar statt drei Zeilen hoch */
@media(max-width:640px){
  .rhy-filter{ flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none;
               padding-bottom:4px; margin-left:-2px; padding-left:2px; }
  .rhy-filter::-webkit-scrollbar{ display:none; }
  .rhy-filter .chip{ flex:0 0 auto; }
  .rhy-seg{ flex-wrap:wrap; gap:7px; }
}

/* Planer: drei Spalten am Rechner, gestapelt auf dem Handy */
.pl-grid{ grid-template-columns:minmax(0,1fr) minmax(0,1fr) 250px; align-items:start; }
@media(max-width:900px){ .pl-grid{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
  .pl-todo{ grid-column:1/-1; } }
@media(max-width:640px){ .pl-grid{ grid-template-columns:minmax(0,1fr); } }

/* Trainingsplaner: die ganze Woche als Stundenplan. Sieben Spalten
   passen auf keinem Handy nebeneinander — deshalb waagerecht
   scrollbar, mit der Stundenspalte fest am linken Rand, damit man
   beim Schieben nie die Uhrzeit verliert. */
/* Sperre: gestreift, nie flächig. Eine gesperrte Stunde ist kein
   Training, sie sieht deshalb bewusst anders aus. */
.tp-sperre{
  background:repeating-linear-gradient(45deg,
    rgba(125,136,153,.42) 0 5px, rgba(125,136,153,.14) 5px 10px);
  border:1px solid rgba(125,136,153,.5);
}
/* Dieselbe Sperre im Zwei-Tage-Planer oben — nur Anzeige, kein
   Eintrag: nicht anklickbar, liegt hinter den echten Blöcken. */
.pl-sperre{
  position:absolute; left:38px; right:5px; z-index:0; pointer-events:none;
  border-radius:var(--r-xs); overflow:hidden;
  background:repeating-linear-gradient(45deg,
    rgba(125,136,153,.30) 0 5px, rgba(125,136,153,.10) 5px 10px);
  border:1px dashed rgba(125,136,153,.45);
  display:flex; align-items:center;
}
.pl-sperre span{
  font-size:10px; color:var(--text-faint); padding:0 7px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* Zwei Wochen: nebeneinander, sobald der Bildschirm es hergibt —
   sonst untereinander. Auf dem Handy sind vierzehn Spalten
   nebeneinander nicht lesbar, dort ist Stapeln die einzige ehrliche
   Antwort. */
.tp-doppel{ display:grid; gap:14px; grid-template-columns:minmax(0,1fr); }
@media(min-width:1100px){ .tp-doppel{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); } }
/* Nebeneinander wird es eng: schmalere Spalten, damit beide Wochen
   ohne Seitwärtsschieben nebeneinander passen. */
@media(min-width:1100px){ .tp-doppel .tp-sp{ width:74px; } }
@media(min-width:1500px){ .tp-doppel .tp-sp{ width:96px; } }

.tp-titel{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:11px 13px; border-bottom:1px solid var(--line);
}
/* Das Abzeichen gehört zur ganzen Woche. Rechtsbündig landete es
   über der Sonntagsspalte und sah aus, als gehörte es zu Sonntag —
   deshalb steht es jetzt direkt neben dem Wochennamen. */
.tp-titel-n{ flex:0 1 auto; min-width:0; font-weight:700; font-size:var(--t-base); }

/* Leiste über den Wochen: erst filtern, dann Baustein wählen. */
.pl-leiste{
  background:var(--surf); border:1px solid var(--line); border-radius:var(--r);
  padding:10px 12px; margin-bottom:14px;
  display:flex; flex-direction:column; gap:9px;
}
.pl-filter{ padding-bottom:9px; border-bottom:1px solid var(--line); }
.pl-kat .chip i{ font-style:normal; margin-left:5px; opacity:.6; }
.pl-arten{ padding-top:2px; }
.chip-neu{ border-style:dashed; color:var(--text-faint); }
/* Farbpalette: nach Familien gestapelt, damit man gezielt einen
   weiteren Blauton findet. Schon vergebene Töne bleiben wählbar, sind
   aber gekennzeichnet — verbieten wäre bevormundend, verschweigen
   führt zu zwei gleichen Bausteinen. */
.na-fam{ display:flex; align-items:center; gap:9px; margin-bottom:6px; }
.na-fam-n{ flex:0 0 52px; font-size:var(--t-xs); color:var(--text-faint); }
.na-reihe{ display:flex; gap:5px; flex-wrap:wrap; }
.na-farbe{
  width:26px; height:24px; border-radius:var(--r-xs); flex:0 0 auto;
  border:1px solid rgba(0,0,0,.25); position:relative;
  transition:transform var(--d1) var(--ez);
}
@media (hover:hover) and (pointer:fine){ .na-farbe:hover{ transform:scale(1.12); } }

.na-farbe.on{ box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c1); }
/* Schon vergeben: ein kleiner Punkt in der Ecke statt einer Schraffur
   über die ganze Fläche — man soll die Farbe noch beurteilen können. */
.na-farbe.belegt::after{
  content:""; position:absolute; top:2px; right:2px;
  width:5px; height:5px; border-radius:50%;
  background:rgba(0,0,0,.5); box-shadow:0 0 0 1px rgba(var(--ov),.35);
}

/* Solider Tag im Spaltenkopf: ergibt sich aus den vier Zielen, nichts zum Anklicken */
.tp-solid{ display:grid; place-items:center; color:var(--gold); flex:0 0 auto; }
.tp-solid svg{ width:14px; height:14px; fill:var(--gold); stroke:var(--gold); }

/* Ausgesetztes wird NICHT blass hinterlegt — ausgesetzt heißt weg.
   Der Weg zurück führt über das Abzeichen im Wochenkopf. */
.tp-aus-z{
  color:var(--text-faint); cursor:pointer;
  transition:color var(--d2) var(--ez),border-color var(--d2) var(--ez);
}
@media (hover:hover) and (pointer:fine){ .tp-aus-z:hover{ color:var(--text); border-color:var(--line-2); } }

.aus-liste{ display:flex; flex-direction:column; gap:6px; margin-bottom:6px; }
.aus-zeile{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:9px 11px; border-radius:var(--r-xs); background:rgba(var(--ov),.035);
  transition:background-color var(--d2) var(--ez);
}
@media (hover:hover) and (pointer:fine){ .aus-zeile:hover{ background:rgba(var(--ov),.07); } }

.aus-zeile i{ width:9px; height:9px; border-radius:2px; flex:0 0 auto; }
.aus-zeile span{ flex:1; min-width:0; font-size:var(--t-sm); }
.aus-zeile small{ display:block; color:var(--text-faint); font-size:var(--t-xs); margin-top:1px; }
.aus-zeile b{ flex:0 0 auto; font-size:var(--t-xs); color:var(--c1); font-weight:600; }

/* Aufgaben quer unter den Wochen statt als schmale Spalte daneben.
   Die Darstellung steht bewusst hier und nicht im style-Attribut —
   sonst gewinnt die eingebettete Angabe gegen jede Medienregel. */
.td-quer{ margin-top:14px; }
.td-liste{ display:flex; flex-direction:column; gap:5px; max-height:460px; overflow-y:auto; }
@media(min-width:900px){
  .td-liste{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:6px; max-height:none; overflow:visible;
  }
}
.tp-titel .tag{ margin-right:auto; }
.tp-titel-n i{ font-style:normal; font-weight:400; color:var(--text-dim); font-size:var(--t-sm); margin-left:7px; }
/* Säulen-Tooltip: steht über dem Chart, folgt der angetippten Säule. */
.sb-wrap{ position:relative; }
.sb-feld{ transition:fill var(--d1) var(--ez); }
.sb-feld.an{ fill:rgba(var(--ov),.05); }
.sb-tip{
  position:absolute; top:0; z-index:5; pointer-events:none;
  background:#131b26; border:1px solid var(--line-2); border-radius:var(--r-xs);
  padding:8px 10px; box-shadow:0 10px 28px rgba(0,0,0,.5);
  font-size:var(--t-xs); line-height:1.45; white-space:nowrap;
}
.sb-tip b{ display:block; font-size:var(--t-sm); margin-bottom:4px; }
.sb-tip-z{ float:right; margin-left:14px; font-family:var(--f-mono); color:var(--text); }
.sb-tip-r{ display:flex; align-items:center; gap:6px; color:var(--text-dim); }
.sb-tip-r i{ width:7px; height:7px; border-radius:2px; flex:0 0 auto; }
.sb-tip-s{
  margin-top:5px; padding-top:5px; border-top:1px solid var(--line);
  color:var(--text-faint);
}

/* Angeheftet: kleine Nadel oben rechts im Block. Bewusst zurück-
   haltend — die Information ist wichtig, soll aber den Namen des
   Trainings nicht verdrängen. */
.tp-fix{ position:relative; }
.tp-nadel{
  position:absolute; top:1px; right:2px; font-size:8px; line-height:1;
  opacity:.75; pointer-events:none;
}
.tp-fix b{ padding-right:9px; display:inline-block; }
.tb-fix{ display:flex; gap:9px; align-items:flex-start; cursor:pointer; }
.tb-fix input{ width:auto; margin-top:3px; flex:0 0 auto; }
.tb-fix i{ display:block; font-style:normal; font-size:var(--t-xs); color:var(--text-faint); margin-top:2px; }
.b-xs{ padding:4px 9px; font-size:var(--t-xs); }
.b-i.b-xs{ width:26px; height:26px; padding:0; }
.tp-kopf i{ font-style:normal; font-weight:400; color:var(--text-faint); font-size:9.5px; margin-left:3px; }
.tb-hinweis{
  font-size:var(--t-sm); color:var(--text-dim); line-height:1.5;
  background:rgba(var(--c1r),.08); border:1px solid rgba(var(--c1r),.22);
  border-radius:var(--r-xs); padding:9px 11px; margin-bottom:14px;
}

.tp-scroll{
  overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
  /* Ohne diese Zeile schluckt der waagerechte Scrollbereich auch das
     senkrechte Wischen: er selbst kann nicht nach unten scrollen
     (overflow-y:hidden), und die Geste wird trotzdem nicht an die
     Seite weitergereicht — man bleibt am Stundenplan kleben.
     pan-x sagt dem Browser: hier wird nur waagerecht geschoben,
     alles Senkrechte gehört der Seite. */
  touch-action:pan-x pinch-zoom;
  overscroll-behavior-x:contain;
}
.tp-raster{ display:flex; min-width:max-content; }
.tp-uhr{
  flex:0 0 auto; width:26px; position:sticky; left:0; z-index:2;
  background:var(--surf); border-right:1px solid var(--line);
}
.tp-sp{ flex:0 0 auto; width:104px; border-right:1px solid var(--line); }
.tp-sp:last-child{ border-right:0; }
.tp-sp.heute{ background:rgba(var(--c1r),.05); }
.tp-kopf{
  min-height:30px; display:flex; align-items:center; justify-content:center; gap:5px;
  padding:3px 5px; font-size:var(--t-sm); font-weight:700;
  border-bottom:1px solid var(--line); color:var(--text-dim);
}
.tp-sp.heute .tp-kopf{ color:var(--c1); }
.tp-spalte{ position:relative; }
.tp-jetzt{ position:absolute; left:0; right:0; height:2px; margin-top:-1px; z-index:4; pointer-events:none;
  background:#ff7a90; box-shadow:0 0 8px rgba(255,122,144,.75); }
.tp-jetzt::before{ content:""; position:absolute; left:-1px; top:-4px; width:10px; height:10px; border-radius:50%; background:#ff7a90; }
.tp-jetzt span{ position:absolute; right:2px; top:-17px; font-family:var(--f-mono); font-size:9.5px; font-weight:700;
  color:#ff9db0; background:rgba(var(--dk),.85); padding:1px 4px; border-radius:4px; font-variant-numeric:tabular-nums; }
.tp-jetzt.leise{ height:1px; margin-top:0; background:rgba(255,122,144,.38); box-shadow:none; }
.tp-jetzt.leise::before{ display:none; }

@media(max-width:640px){ .tp-sp{ width:88px; } }

/* Aufgabenzeile im Planer */
.td-row{
  display:flex; align-items:flex-start; gap:8px; padding:9px 10px;
  border-radius:var(--r); background:rgba(var(--ov),.035);
  cursor:pointer; border-left:3px solid;
  transition:background-color var(--d2) var(--ez), box-shadow var(--d2) var(--ez);
}
@media (hover:hover) and (pointer:fine){ .td-row:hover{ background:rgba(var(--ov),.06); } }

.td-row.gewaehlt{
  background:rgba(var(--c1r),.13);
  box-shadow:inset 0 0 0 1px rgba(var(--c1r),.42);
}
/* Für heute vorgemerkt: deutlich hervorgehoben, damit die drei
   sich vom Rest der Liste klar abheben. */
.td-row.fokus{ background:rgba(217,164,65,.10); }
@media (hover:hover) and (pointer:fine){ .td-row.fokus:hover{ background:rgba(217,164,65,.16); } }

.td-alt{
  font-style:normal; font-size:var(--t-xs); color:var(--text-faint);
  font-variant-numeric:tabular-nums; margin-left:6px; white-space:nowrap;
}
.td-alt.warn{ color:var(--warn); }
/* Der Merker für „heute dran". Nur die Strichfarbe zu ändern reicht
   nicht — angetippt bekommt er deshalb eine eigene Fläche. */
.td-stern{
  flex:0 0 auto; width:23px; height:23px; border-radius:7px;
  display:grid; place-items:center; color:var(--text-faint);
  border:1px solid transparent; transition:all var(--d2) var(--ez);
}
@media (hover:hover) and (pointer:fine){ .td-stern:hover{
  color:var(--warn);
  border-color:color-mix(in srgb, var(--warn) 32%, transparent);
} }

.td-stern.on{
  color:var(--warn);
  background:color-mix(in srgb, var(--warn) 18%, transparent);
  border-color:color-mix(in srgb, var(--warn) 42%, transparent);
}
.td-trenn{
  font-size:var(--t-xs); color:var(--text-faint); letter-spacing:.06em;
  text-transform:uppercase; margin:8px 0 2px 2px;
}
.td-hinweis{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:8px 10px; margin-bottom:8px; border-radius:var(--r);
  font-size:var(--t-xs); color:var(--text-dim);
  background:rgba(var(--c1r),.09); border:1px solid rgba(var(--c1r),.20);
}
.td-hinweis.alt{
  background:color-mix(in srgb, var(--warn) 10%, transparent);
  border-color:color-mix(in srgb, var(--warn) 26%, transparent);
}
.td-fuss{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  margin-top:10px; padding-top:9px; border-top:1px solid var(--line);
  font-size:var(--t-xs); color:var(--text-faint);
}
.td-alt-row{
  display:flex; align-items:center; gap:9px; padding:9px 11px;
  border-radius:var(--r); background:rgba(var(--ov),.035);
}
/* Die drei für heute, auf der Startseite ── */
.hd-fokus-row{
  display:flex; align-items:flex-start; gap:10px; padding:10px 2px;
  border-top:1px solid var(--line); cursor:pointer;
}
.hd-fokus-row:first-child{ border-top:0; }
.hd-fokus-box{
  width:19px; height:19px; border-radius:6px; flex:0 0 auto; margin-top:1px;
  border:1.5px solid var(--line-2); display:grid; place-items:center;
  color:transparent; transition:all var(--d2) var(--ez);
}
@media (hover:hover) and (pointer:fine){ .hd-fokus-row:hover .hd-fokus-box{ border-color:var(--c1); color:var(--c1); } }

.hd-fokus-t{ flex:1; min-width:0; font-size:var(--t-base); line-height:1.45; word-break:break-word; }

.hd-nx-stage{ position:relative; }
/* Werteleiste: auf großen Schirmen überflüssig, dort beschriftet
   die Kugel sich selbst. */
.nx-werte{ display:none; }
.nx-wert{ display:flex; align-items:baseline; gap:5px; min-width:0; }
.nx-wert i{ width:6px; height:6px; border-radius:2px; flex:0 0 auto; align-self:center; }
.nx-wert b{ font-family:var(--f-disp); font-size:var(--t-sm); font-weight:700;
  font-variant-numeric:tabular-nums; white-space:nowrap; }
.nx-wert em{ font-style:normal; font-size:10px; color:var(--text-faint);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* Keine Kante: Die Kugel läuft zu allen Seiten weich in den Block aus,
   statt als dunkles Rechteck darin zu stehen. */
/* Nur ein schmaler Streifen am Rand läuft aus — die Kugel selbst bleibt
   voll sichtbar und darf den Rahmen fast ganz nutzen. */
.hd-nx-stage canvas{
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 11%, #000 89%, transparent 100%),
                     linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%);
  -webkit-mask-composite:source-in;
          mask-image:linear-gradient(to bottom, transparent 0, #000 11%, #000 89%, transparent 100%),
                     linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%);
          mask-composite:intersect; }

/* ── Mobil ────────────────────────────────────────────── */
@media(max-width:860px){
  .hd-top,.hd-main{ grid-template-columns:minmax(0,1fr); }
  .wk-row{ grid-template-columns:78px minmax(0,1fr) auto; gap:9px; }

  /* Kugel kompakter, Werte darunter in zwei Spalten */
  .hd-nexus{ padding:14px 14px 12px; }
  .nx-werte{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
             gap:6px 12px; margin-top:10px; padding-top:11px;
             border-top:1px solid var(--line); }

  /* Ziele als 2×2 statt vier volle Bildschirme untereinander */
  .hd-goals{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; }
  .goal{ padding:11px 9px; }
  .goal-top{ margin-bottom:7px; gap:6px; }
  .goal-name{ font-size:var(--t-xs); font-weight:600; }
  .goal-ico svg{ width:14px; height:14px; }
  .goal-badge{ display:none; }
  .goal-num{ flex-direction:column; align-items:flex-start; gap:0; }
  .goal-num b{ font-size:1.7rem; }
  .goal-num span{ font-size:10px; }
  .goal-bar{ margin:8px 0 6px; height:4px; }
  .goal-foot{ flex-direction:column; gap:2px; font-size:10px; }
  .goal-act{ width:100%; margin-top:8px; padding:7px 6px; font-size:var(--t-xs); }

  /* Leerzustände sollen keine halbe Bildschirmhöhe verbrauchen */
  .empty{ padding:16px 12px; font-size:var(--t-sm); }
  .empty svg{ width:20px; height:20px; margin-bottom:5px; }
  .hd-plan .empty{ padding:12px; }

  /* Kopfzeile: nur das Nötigste */
  .topbar{ gap:7px; }
  .topbar .kbtn{ padding:8px 9px; }
  .orb{ width:34px; height:34px; }

  /* Journal */
  .mood-row{ gap:5px; }
  .mood{ padding:10px 3px; gap:4px; }
  .mood svg{ width:20px; height:20px; }
  .mood span{ font-size:10px; }
  .j-list{ max-height:none; }
  
}

/* Sehr schmal: jedes Ziel eine Zeile, Knopf darunter über die Breite */
@media(max-width:430px){
  .hd-goals{ grid-template-columns:minmax(0,1fr); gap:7px; }
  .goal{ display:grid; grid-template-columns:auto minmax(0,1fr);
         align-items:center; gap:1px 11px; padding:12px 13px; }
  .goal-top{ margin:0; grid-column:1; grid-row:1/3; }
  .goal-ico svg{ width:19px; height:19px; }
  .goal-name{ display:block; grid-column:2; grid-row:1; font-size:var(--t-sm); }
  .goal-num{ grid-column:2; grid-row:2; flex-direction:row; align-items:baseline;
             gap:6px; min-width:0; }
  .goal-num b{ font-size:1.4rem; }
  .goal-num span{ font-size:10.5px; color:var(--text-faint); }
  .goal-bar{ grid-column:1/-1; margin:10px 0 0; }
  .goal-foot{ grid-column:1/-1; flex-direction:row; justify-content:space-between;
              margin-top:6px; gap:10px; }
  .goal-foot span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .goal-act{ grid-column:1/-1; width:100%; margin-top:10px; padding:9px; font-size:var(--t-sm); }
  .goal-rettung{ grid-column:1/-1; margin-top:8px; }
  .ck-row,.ck-hinweis{ grid-column:1/-1; }
  /* Das Schild rutscht in die Zahlenzeile, sonst sprengt es die Spalte. */
  .goal-schutz{ padding:2px 7px 2px 5px; }
}

/* Leere Karten sollen nicht ganze Bildschirme belegen */
@media(max-width:860px){
  .hd-plan{ padding-bottom:10px; }
  .hd-plan .empty{ padding:6px 4px 8px; text-align:left; font-size:var(--t-sm); }
  .hd-plan .empty svg{ display:none; }
  .hd-plan .p-head{ margin-bottom:4px; }
}
@media(max-width:860px){
  .shell{ grid-template-columns:1fr; }
  .rail{
    position:fixed; left:0; right:0; bottom:0; top:auto; z-index:60;
    flex-direction:row; gap:2px; padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    border-right:none; border-top:1px solid var(--line);
    overflow-x:auto; overflow-y:hidden;
  }
  .mark,.rail-sep,.rail-foot,.rl-kbd{ display:none; }
  /* Nur die vier täglichen Ansichten plus „Mehr“ — zehn Beschriftungen
     nebeneinander überlappen auf 375 px. */
  .rl[data-g="2"],.rl[data-g="3"],.rl[data-g="4"]{ display:none; }
  .rl-more{ display:flex !important; }
  /* Beschriftung bleibt: Symbole allein sind auf dem Handy zu raten */
  .rl{ flex-direction:column; gap:3px; padding:7px 6px; min-width:0; flex:1; border-radius:var(--r-xs); }
  .rl svg{ width:20px; height:20px; }
  .rl-txt{ font-size:9.5px; font-weight:500; letter-spacing:-.01em; }
  .rl.on::before{ display:none; }
  .rl.on{ background:rgba(var(--c1r),.14); }
  .rl.on .rl-txt{ color:var(--c1); }
  .views{ padding:14px 12px 96px; }

  /* Kopfzeile aufräumen: nur Datum, Wert und Suche */
  .topbar{ padding:11px 14px; gap:10px; }
  .tb-title{ font-size:var(--t-md); }
  .tb-date{ font-size:var(--t-xs); }
  .tb-clock,.kbtn span{ display:none; }
  /* Läuft der Lern-Timer, weicht ⌘K der Pille — sonst bricht die Kopfleiste um */
  .tb-date{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* Lange Tage („Samstag, 24. Oktober …“) kürzen statt die Knöpfe umzubrechen */
  .topbar{ flex-wrap:nowrap; }
  .topbar > div:first-of-type{ min-width:0; flex:0 1 auto; }
  .tb-title{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topbar > .b-i, .topbar > .kbtn, .topbar > .orb{ flex:0 0 auto; }
  .lu-leiste{ padding:7px 14px; gap:8px; }
  .lu-l-label{ display:none; }
  .lu-l-zeit{ font-size:20px; }
  .lu-l-bar{ flex:1 1 60px; }
  html.lernt .rl[data-go="uni"]::after{ top:6px; right:calc(50% - 18px); }
  .kbtn{ padding:8px 10px; }
  .topbar > .b-i:first-child{ display:none; }

  /* Panels ruhiger und großzügiger antippbar */
  .p{ padding:15px; border-radius:var(--r); }
  .p-tight{ padding:13px; }
  .grid{ gap:11px; }
  .hd-greet{ font-size:1.5rem; }
  .hd-hero-in{ gap:14px; }
  .hd-plan-list{ max-height:none; }
  .hd-nexus{ padding:13px 13px 4px; }

  /* Fingerfreundliche Ziele */
  .hb{ padding:13px 11px; }
  .hb-box{ width:26px; height:26px; }
  .hb-mini{ display:none; }
  .b{ padding:10px 14px; }
  .b-sm{ padding:8px 12px; }
  .b-i{ width:40px; height:40px; }
  input,select,textarea{ padding:12px 13px; font-size:16px; }  /* 16px verhindert Zoom beim Fokus */
  .chip{ padding:8px 13px; }
  .seg button{ padding:7px 13px; }

  /* Modal von unten statt mittig */
  .mv{ align-items:flex-end; padding:0; }
  .mo{ max-width:none; border-radius:var(--r-lg) var(--r-lg) 0 0; max-height:88vh;
       padding:20px 18px calc(20px + env(safe-area-inset-bottom)); animation:sheet .26s var(--ez) both; }
  @keyframes sheet{ from{ transform:translateY(100%); } to{ transform:none; } }
  .cmdk-ov{ padding:8vh 12px 12px; }
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

/* ── One Life: Foto hinter dem Zielblock ──
   Oben sichtbar mit Schriftzug, nach unten abgedunkelt, damit die
   vier Karten lesbar bleiben. */
.hz-ol{ display:flex; flex-direction:column; align-items:flex-end; line-height:.84;

.hd-ziele .hz-t span{ color:var(--text-dim); }
@media(max-width:700px){
  .hz-ol{ padding:26px 12px 14px; } .ol-2{ -webkit-text-stroke-width:1.2px; }
  .hd-ziele::after{ background:
    linear-gradient(90deg, rgba(var(--dk),.05) 0%, rgba(var(--dk),.30) 50%, rgba(var(--dk),.65) 85%),
    linear-gradient(180deg, rgba(var(--dk),.10) 0, rgba(var(--dk),.62) 110px, rgba(var(--dk),.90) 190px, rgba(var(--dk),.94) 100%); }

    linear-gradient(180deg, rgba(var(--dk),.10) 0, rgba(var(--dk),.62) 110px, rgba(var(--dk),.90) 190px, rgba(var(--dk),.94) 100%); }
}

/* ── Feinschliff: Bewegung und Knöpfe ──────────────────────
   Federn statt linearer Übergänge, Druck spürbar, Werte laufen nur,
   wenn sie sich ändern. Häufige Aktionen bleiben schnell (unter 300 ms),
   der eine besondere Moment (solider Tag) darf länger glänzen. */
:root{
  --spring:linear(0,0.0162,0.0599,0.1239,0.202,0.2889,0.38,0.4716,0.5607,0.645,0.723,0.7935,0.8558,0.9097,0.9552,0.9927,1.0226,1.0456,1.0625,1.0738,1.0805,1.0833,1.083,1.08,1.0752,1.0691,1.062,1.0545,1.0468,1.0393,1.0321,1.0254,1.0193,1.0138,1.0091,1.005,1.0016,0.9989,0.9968,0.9952,1);
  --spring-s:linear(0,0.0261,0.0919,0.1815,0.2831,0.3877,0.4894,0.584,0.6692,0.7437,0.8072,0.8601,0.9032,0.9374,0.9638,0.9837,0.9981,1.008,1.0144,1.0181,1.0197,1.0198,1.0189,1.0174,1.0155,1.0134,1.0114,1.0094,1.0076,1.006,1.0046,1.0034,1);
}
/* Knöpfe: Druck in 80 ms, Loslassen federt zurück */
.b{ transition:border-color var(--d2) var(--ez), color var(--d2) var(--ez), background-color var(--d2) var(--ez),
  box-shadow var(--d2) var(--ez), filter var(--d2) var(--ez), transform .45s var(--spring); }

  .b:not(.b-1):hover{ border-color:rgba(120,160,190,.36); }
}
.b:active,.b-1:active{ transform:scale(.96); transition:transform .08s var(--ez); }
.chip{ transition:color var(--d2) var(--ez), background-color var(--d2) var(--ez), border-color var(--d2) var(--ez), transform .4s var(--spring); }
.chip:active{ transform:scale(.94); transition:transform .08s var(--ez); }

.seg button:active{ transform:scale(.94); transition:transform .08s var(--ez); }

.ht:active:not(:disabled){ transform:scale(.86); transition:transform .08s var(--ez); }

/* Haken springen beim Setzen kurz auf und zeichnen sich */

@keyframes knall{ 0%{ transform:scale(.72); } 45%{ transform:scale(1.16); } 100%{ transform:scale(1); } }

/* Fenster: federt herein, geht schneller wieder */
.mv.on{ animation:fin .22s var(--ez) both; }
.mo{ animation:moIn .42s var(--spring-s) both; }
@keyframes moIn{ from{ opacity:0; transform:translateY(16px) scale(.96); filter:blur(6px); } }

@keyframes fout{ to{ opacity:0; } }
@keyframes moOut{ to{ opacity:0; transform:translateY(8px) scale(.98); } }
/* Hinweis unten: kommt mit Feder, geht weich */
.toast{ transform:translateX(-50%) translateY(18px) scale(.94); opacity:0; filter:blur(4px); pointer-events:none;
  transition:transform .5s var(--spring), opacity .2s var(--ez), filter .25s var(--ez); }

<style id="thema-glas">

/* ═══════════════════════════════════════════════════════════════
   NOVA · Thema „Glas“ (Fenster wie unter visionOS)
   Hinter allem steht das 3D-Modell der Lichtwiese (bei Training das
   TSG-Gelände). Davor schwebt ein großes, neutrales Glasfenster mit
   eigener Seitenleiste. Im Fenster liegen hellere Glasplatten.
   Quelle zum Nachlesen: proben/glas/thema.css (eingebaut mit einbauen.py).

   Regeln dieser Welt
   · Glas ist neutral (warmes Grau), nie orange getönt
   · Titel und große Zahlen in Newsreader (Serife), alles andere in Geist
   · ein Akzent (Blau) für Hauptaktionen und Auswahl, Farbe sonst nur für Daten
   · Fenster 34 px, Platten 22 px, Felder 12 px, Antippbares ist Pille oder Kreis
   · Linien statt Kästen: Platten haben eine helle Oberkante, keine harten Ränder
   ═══════════════════════════════════════════════════════════════ */

@property --fen{ syntax:"<length>"; inherits:false; initial-value:0px; }
@property --fade{ syntax:"<length>"; inherits:false; initial-value:0px; }

:root{
  --void:#0b0e14; --deep:#080a10;
  /* Kanäle aus bau.py: Aufhellung, Akzent, Abdunklung, Mischgrund, Schrift auf Akzent */
  --ov:255,255,255; --c1r:76,134,247; --dk:14,17,24; --mix:#1c212b; --auf-c1:#ffffff;

  --panel:rgba(255,255,255,.06); --panel-2:rgba(48,45,43,.9); --panel-3:rgba(58,55,52,.94);
  --glass-edge:rgba(255,255,255,.1);
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --text:#f7f5f2; --text-dim:#bdb7b1; --text-faint:#8f8a85;

  /* Akzent: Blau wie in der Vorlage */
  --c1:#4c86f7; --c1-deep:#2f69e6; --c1-glow:rgba(76,134,247,.35);
  --c2:#a594f7; --c3:#e59ac4;
  --good:#5fcf8c; --warn:#efb756; --gold:#f2c55e; --gift:#ef8bab; --bad:#f07786;
  --m-sleep:#a594f7; --m-study:#62b0f5; --m-phone:#f2906b; --m-sport:#5fcf8c; --m-habit:#4cd3c0;
  --track:rgba(255,255,255,.1);

  --f-ui:"Geist","SF Pro Text",system-ui,sans-serif;
  --f-disp:"Newsreader","Iowan Old Style",Georgia,serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;

  --r-xs:8px; --r:12px; --r-lg:22px; --r-xl:28px;
  --aus:cubic-bezier(.23,1,.32,1);

  /* Materialien */
  /* Liquid Glass: klar statt grau. Der Hintergrund kommt gesättigt durch, eine Glanzfläche liegt schräg darüber,
     die Kanten fangen Licht. Nur so viel Tönung, dass weiße Schrift auch über dem hellen Modell steht. */
  --fenster:
    linear-gradient(128deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.05) 18%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 72%, rgba(255,255,255,.07) 100%),
    radial-gradient(120% 70% at 85% 110%, rgba(255,255,255,.05), transparent 60%),
    rgba(15,19,27,.4);
  --platte:linear-gradient(165deg, rgba(255,255,255,.11), rgba(255,255,255,.045) 55%, rgba(255,255,255,.06)), rgba(14,17,24,.12);
  --platte-solo:linear-gradient(128deg, rgba(255,255,255,.16), rgba(255,255,255,.04) 40%, rgba(255,255,255,.06)), rgba(17,21,29,.42);
  --dicht:linear-gradient(170deg, rgba(255,255,255,.1), rgba(255,255,255,.03) 60%), rgba(26,31,40,.92);
  --knopf:rgba(255,255,255,.08);
  --knopf-hover:rgba(255,255,255,.13);
  --mulde:rgba(0,0,0,.2);
  --kante:inset 1px 1px 0 rgba(255,255,255,.16), inset -1px -1px 0 rgba(255,255,255,.05);
  --kante-hell:inset 1px 1px 0 rgba(255,255,255,.3), inset -1px -1px 0 rgba(255,255,255,.08), inset 0 0 0 1px rgba(255,255,255,.04);
  --unscharf:blur(30px) saturate(190%) brightness(.84);
  --unscharf-leicht:blur(18px) saturate(170%);
  --sh-2:0 18px 40px -26px rgba(0,0,0,.55);
  --sh-3:0 2px 6px rgba(0,0,0,.18), 0 40px 90px -36px rgba(0,0,0,.75);
  --rand:rgba(255,255,255,.11);
}
body{ background:var(--void); font-variant-numeric:tabular-nums; letter-spacing:-.004em; }

.topbar{ transition:background-color .3s ease; }
body.gl-ohne{ background:radial-gradient(120% 90% at 60% 0%, #2c3a52 0%, #131a27 55%, #090c12 100%) fixed; }
