    document.getElementById("lwTagL").textContent=takt===2?"Fällig alle 2 Wochen am":"Fällig jede Woche am";
    document.getElementById("lwHinweis").textContent=takt===2
      ?"Jede Aufgabe hat zwei Wochen Zeit und steht in beiden Wochen im Plan. Die vorlesungsfreie Zeit wird übersprungen, gezählt wird fortlaufend (1, 2, 3 …)."
      :"Die vorlesungsfreie Zeit wird übersprungen, gezählt wird fortlaufend (1, 2, 3 …). NOVA schlägt dir jeweils den ruhigsten Tag vor der Frist vor."; });
  document.getElementById("lwOk").onclick=()=>{
    const titel=document.getElementById("lwT").value.trim(), v=document.getElementById("lwV").value, b=document.getElementById("lwB").value;
    if(!modul||!titel||!v||!b||b<v){ toast("Modul, Text und Zeitraum angeben","x"); return; }
    const l=lp().schritte; let n=0, frei=dk(sow(parsedk(v)));
    for(let mo=sow(parsedk(v)); dk(mo)<=b; mo=addD(mo,7)){
      if(wocheIstPause(dk(mo))||wocheVlfrei(dk(mo))) continue;
      const d=dk(addD(mo,tag)); if(d<v||d>b||istVlfrei(d)) continue;
      /* Alle 2 Wochen: Zeitfenster schließen lückenlos aneinander an, beginnend in der Startwoche */
      let ab=null;
      if(takt===2){ ab=lpZweiAb(d); if(ab<frei) continue; frei=dk(addD(parsedk(ab),14));
        /* Nach den Ferien beginnt das Zeitfenster erst mit der ersten Vorlesungswoche */
        while(wocheVlfrei(ab)&&ab<dk(sow(addD(parsedk(d),-3)))) ab=dk(addD(parsedk(ab),7)); }
      const id=`lw_${modul}_${lpSlug(titel)}_${d}`;
      if(l.some(x=>x.id===id)) continue;
      l.push(Object.assign({id,modul,datum:d,art:"woche",basis:titel,titel,detail:"",neu:null,gesamt:null,fertig:null},takt===2?{takt:2,ab}:{}));
      n++;
    }
    lpWochenNummern();
    save(); closeModal(); toast(`${n} ${takt===2?"Aufgaben alle 2 Wochen":"Wochen"} angelegt, die vorlesungsfreie Zeit ausgelassen`,"check"); R.uni();
  };
}

/* ── Import aus einer Excel-Tabelle (.xlsx) ──
   Erwartete Spalten (Kopfzeile, Reihenfolge egal): Datum, Termin,
   Aufgabe, Neue Ankis, Ankis gesamt. Übernommen werden nur die
   Anki-Schritte (Zeilen mit neuen Ankis) und eine Zeile „Klausur" als
   Termin. Alles andere — Übungen, Blätter, Altklausuren — bleibt
   draußen. Erneutes Laden behält die Häkchen. */
async function zipLeser(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf), td=new TextDecoder();
  let eocd=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--) if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; }
  if(eocd<0) throw new Error("Das ist keine Excel-Datei (.xlsx).");
  const n=dv.getUint16(eocd+10,true); let p=dv.getUint32(eocd+16,true); const dat={};
  for(let i=0;i<n&&dv.getUint32(p,true)===0x02014b50;i++){
    const meth=dv.getUint16(p+10,true), cs=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true),
          el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), off=dv.getUint32(p+42,true);
    dat[td.decode(u8.subarray(p+46,p+46+nl))]={meth,cs,off}; p+=46+nl+el+cl;
  }
  return async name=>{
    const f=dat[name]; if(!f) return null;
    const s=f.off+30+dv.getUint16(f.off+26,true)+dv.getUint16(f.off+28,true), roh=u8.subarray(s,s+f.cs);
    if(f.meth===0) return td.decode(roh);
    if(typeof DecompressionStream==="undefined") throw new Error("Dieser Browser kann die Datei nicht entpacken.");
    const aus=await new Response(new Blob([roh]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
    return td.decode(aus);
  };
}
async function xlsxZeilen(buf){
  const lies=await zipLeser(buf), P=new DOMParser();
  /* erstes Tabellenblatt über die Arbeitsmappe finden, sonst sheet1 */
  let pfad="xl/worksheets/sheet1.xml";
  try{
    const wb=P.parseFromString(await lies("xl/workbook.xml")||"","application/xml"), rels=P.parseFromString(await lies("xl/_rels/workbook.xml.rels")||"","application/xml");
    const rid=wb.querySelector("sheet")?.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");
    const ziel=[...rels.querySelectorAll("Relationship")].find(r=>r.getAttribute("Id")===rid)?.getAttribute("Target");
    if(ziel) pfad=ziel.startsWith("/")?ziel.slice(1):"xl/"+ziel.replace(/^\.\//,"");
  }catch(e){}
  const ssX=await lies("xl/sharedStrings.xml"), shX=await lies(pfad);
  if(!shX) throw new Error("Keine Tabelle in der Datei gefunden.");
  const ss=[]; if(ssX) P.parseFromString(ssX,"application/xml").querySelectorAll("si").forEach(si=>ss.push([...si.querySelectorAll("t")].map(t=>t.textContent).join("")));
  const zeilen=[];
  P.parseFromString(shX,"application/xml").querySelectorAll("sheetData row").forEach(r=>{
    const z={};
    r.querySelectorAll("c").forEach(c=>{ const col=(c.getAttribute("r")||"").replace(/\d+/g,""), t=c.getAttribute("t");
      let v=c.querySelector("v")?.textContent??"";
      if(t==="s") v=ss[+v]??""; else if(t==="inlineStr") v=[...c.querySelectorAll("t")].map(x=>x.textContent).join("");
      z[col]=v; });
    zeilen.push(z);
  });
  return zeilen;
}
/* „13.10.2026", Excel-Zahl, oder Spanne „16.12.2026–11.01.2027" → Ende der Spanne */
function lpDatum(v){
  v=String(v||"").trim(); if(!v) return null;
  if(/^\d{5}(\.\d+)?$/.test(v)){ const d=new Date(Math.round((+v-25569)*86400000)); return dk(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())); }
  const teile=v.split(/\s*[–—-]\s*/); const letzt=teile[teile.length-1];
  const m=letzt.match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/); if(!m) return null;
  const y=+m[3]<100?2000+ +m[3]:+m[3];
  return `${y}-${p2(+m[2])}-${p2(+m[1])}`;
}
function lpAusZeilen(zeilen,modul){
  const kopfI=zeilen.findIndex(z=>Object.values(z).some(v=>/^datum$/i.test(String(v).trim())));
  if(kopfI<0) throw new Error("Keine Kopfzeile mit „Datum“ gefunden.");
  const kopf=zeilen[kopfI], spalte=re=>Object.keys(kopf).find(k=>re.test(String(kopf[k])));
  const cD=spalte(/^datum/i), cT=spalte(/termin|veranstaltung/i), cA=spalte(/aufgabe|inhalt|thema/i),
        cN=spalte(/neue/i), cG=spalte(/gesamt|summe/i);
  if(!cD||!cN) throw new Error("Spalten „Datum“ und „Neue Ankis“ werden gebraucht.");
  const schritte=[], termine=[], blaetter=[], uebungen={};
  zeilen.slice(kopfI+1).forEach(z=>{
    const datum=lpDatum(z[cD]), termin=String(z[cT]||"").trim(), aufg=String(z[cA]||"").trim();
    if(!datum) return;
    const ue=termin.match(/^übung\s*(\d+)/i); if(ue) uebungen[ue[1]]=datum;
    const bl=aufg.match(/blatt\s*(\d+)/i);
    if(bl){ const roh=String(z[cD]||""), spanne=/[–—-]/.test(roh)&&roh.split(/\s*[–—-]\s*/).length===2;
      let ab=datum; if(spanne){ const t0=roh.split(/\s*[–—-]\s*/)[0].match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})?/);
        if(t0){ const y=t0[3]?(+t0[3]<100?2000+ +t0[3]:+t0[3]):+datum.slice(0,4)-(+t0[2]>+datum.slice(5,7)?1:0); ab=`${y}-${p2(+t0[2])}-${p2(+t0[1])}`; } }
      blaetter.push({nr:bl[1], ab, empf:spanne?null:datum}); }
    if(/^klausur$/i.test(termin)){ const zt=aufg.match(/(\d{1,2}[:.]\d{2})/); termine.push({datum,zeit:zt?zt[1].replace(".",":"):null,notiz:aufg}); return; }
    const neu=parseInt(z[cN],10); if(!(neu>0)) return;
    const gesamt=parseInt(z[cG],10)||null;
    /* „Kap. 1 Nachfrage + abends Blatt 1 rechnen" → nur der Anki-Teil */
    const thema=aufg.split(/\s+\+\s+/)[0].replace(/\s*\(.*?\)\s*/g," ").trim();
    const vl=(termin.match(/(\d+)/)||[])[1];
    const titel=`${vl?"VL "+vl+" · ":""}${thema||termin}`;
    schritte.push({id:`la_${modul}_${datum}_${lpSlug(titel)}`,modul,datum,art:"anki",titel,detail:aufg,neu,gesamt,fertig:null});
  });
  /* fehlende Gesamtzahlen hochzählen */
  let summe=0; schritte.forEach(s=>{ summe+=s.neu; if(!s.gesamt) s.gesamt=summe; });
  /* Blatt N ist zur Übung N fällig; ohne Übung eine Woche nach dem Plantag */
  blaetter.forEach(b=>{ const frist=uebungen[b.nr]||dk(addD(parsedk(b.empf||b.ab),7));
    schritte.push({id:`lb_${modul}_blatt-${b.nr}`,modul,datum:frist,ab:b.ab,empf:b.empf,art:"blatt",
      titel:`Blatt ${b.nr} rechnen`,detail:uebungen[b.nr]?`zur Übung ${b.nr}`:"",neu:null,gesamt:null,fertig:null}); });
  return {schritte,termine};
}
function lpImportStart(){
  const i=document.createElement("input"); i.type="file";
  i.accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  i.onchange=async()=>{
    const datei=i.files[0]; if(!datei) return;
    try{
      const zeilen=await xlsxZeilen(await datei.arrayBuffer());
      lpImportModal(zeilen,datei.name);
    }catch(e){ toast(e.message||"Datei nicht lesbar","x"); }
  };
  i.click();
}

        <div><b>${nAnki?fmtShort(parsedk(vor.schritte.filter(s=>s.art==="anki").slice(-1)[0].datum)):"–"}</b><span>letzte Vorlesung</span></div>
        ${vor.termine.length?`<div><b>${fmtShort(parsedk(vor.termine[0].datum))}</b><span>Klausur</span></div>`:""}
      </div>
      <p class="p-note" style="margin-top:10px">Übernommen werden die Ankis je Vorlesung${nBlatt?", die Übungsblätter (fällig zur jeweiligen Übung)":""}${vor.termine.length?" und der Klausurtermin":""}. Altklausuren und Klausurphase bleiben draußen.
        ${lpAlle().some(x=>x.modul===modul&&(x.art==="anki"||x.art==="blatt"))?"Schon vorhandene Schritte behalten ihre Häkchen.":""}</p>`:""}
      <div class="mo-act"><button class="b" onclick="closeModal()">Abbrechen</button><button class="b b-1" id="liOk"${vor&&vor.schritte.length?"":" disabled"}>Übernehmen</button></div>`);
    document.querySelectorAll("#liM [data-m]").forEach(b=>b.onclick=()=>{ modul=b.dataset.m; zeichne(); });
    document.getElementById("liOk").onclick=()=>{

      const alt=new Map(l.schritte.filter(importiert).map(x=>[x.id,x]));

        .concat(vor.schritte.map(s=>{ const a=alt.get(s.id); return {...s,fertig:a?a.fertig:null,...(a&&a.korr?{neu:a.neu,korr:1}:{})}; }));
      lpGesamtNeu(modul);
      vor.termine.forEach(t=>{
        S.uniTermine=S.uniTermine||[];
        const da=S.uniTermine.find(x=>x.modul===modul&&x.datum===t.datum&&x.art==="klausur");
        if(da){ if(!da.zeit&&t.zeit) da.zeit=t.zeit; }
        else S.uniTermine.push({id:uid(),titel:`Klausur ${lpName(modul)}`,datum:t.datum,art:"klausur",modul,zeit:t.zeit});
      });
      save(); closeModal(); lpMk=dk(sow(new Date()));
      toast(`${nAnki} Anki-Schritte${nBlatt?` und ${nBlatt} Blätter`:""} für ${lpKurz(modul)} übernommen`,"check"); R.uni();
    };
  };
  zeichne();
}

/* ── Lern-Timer ──
   Start und Stopp fürs Lernen. Gespeichert wird nur der Startzeitpunkt
   (S.lernUhr.start): Die Zeit läuft weiter, wenn die App zu ist, und
   der Timer erscheint auf jedem Gerät, das abgleicht. Beim Stoppen
   kommt die Zeit auf die Lernstunden des Tages — über Mitternacht
   anteilig auf beide Tage. Wer das Stoppen vergisst, wird gefragt. */
const LU_FRAGEN_AB=240; /* Minuten */
const luLaeuft=()=>!!(S.lernUhr&&S.lernUhr.start);
const luMin=()=>luLaeuft()?Math.max(0,(Date.now()-S.lernUhr.start)/60000):0;
const luHM=min=>{ const m=Math.round(min); return `${Math.floor(m/60)}:${p2(m%60)}`; };
/* Für die große Karte: unter einer Stunde nur Minuten:Sekunden */
const luGrossUhr=()=>{ const u=luUhr(); return u.startsWith("0:")?u.slice(2):u; };
const luUhr=()=>{ const s=Math.floor(luMin()*60); return `${Math.floor(s/3600)}:${p2(Math.floor(s/60)%60)}:${p2(s%60)}`; };
/* Heute gelernt in Stunden — samt dem Teil der laufenden Einheit, der
   auf heute fällt (eine Einheit seit gestern Abend zählt nur ab 0 Uhr). */
function luHeuteH(){
  const k=today(), m=(S.metrics[k]||{}).study; let h=nv(m)?m:0;
  if(luLaeuft()){ const mitt=parsedk(k).getTime(); h+=Math.max(0,Date.now()-Math.max(S.lernUhr.start,mitt))/3600000; }
  return h;
}
const LU_R=88, LU_U=2*Math.PI*LU_R;
function luKarte(){
  const an=luLaeuft(), ziel=G().study||3, h=luHeuteH(), anteil=Math.min(1,h/ziel), d=an?new Date(S.lernUhr.start):null;
  const heuteN=(S.lernSitz||[]).filter(x=>dk(new Date(x.bis))===today()).length;
  const woche=[...Array(7)].map((_,i)=>(S.metrics[dk(addD(sow(new Date()),i))]||{}).study).reduce((a,v)=>a+(nv(v)?v:0),0);
  return `<div class="p lu-karte${an?" an":""}${anteil>=1?" voll":""}">
    <div class="lu-ring">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs><linearGradient id="luVerlauf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#3683db"/></linearGradient></defs>
        <circle cx="100" cy="100" r="${LU_R}" class="lu-spur"/>
        <circle cx="100" cy="100" r="${LU_R}" class="lu-fort" data-luring stroke-dasharray="${LU_U}" stroke-dashoffset="${LU_U*(1-anteil)}"/>
      </svg>
      <div class="lu-mitte">
        <span class="lu-klein">${an?"diese Einheit":"heute gelernt"}</span>
        <b class="lu-zeit" ${an?"data-lugross":""}>${an?luGrossUhr():luHM(h*60)}</b>
        <span class="lu-klein" data-luprozent>${Math.round(anteil*100)} % vom Tagesziel</span>
      </div>
    </div>
    <div class="lu-rechts">
      <div class="lu-titel">${an?(S.lernUhr.modul?`Du lernst <span class="lu-fach-name" style="--fc:${luFachFarbe(S.lernUhr.modul)}">${esc(luFachName(S.lernUhr.modul))}</span>`:"Du lernst gerade"):"Lernzeit"}</div>
      <div class="lu-unter">${an?`seit ${p2(d.getHours())}:${p2(d.getMinutes())} Uhr · der Timer läuft auch bei geschlossener App weiter`
        :anteil>=1?"Tagesziel geschafft — alles ab jetzt ist Bonus.":`Noch ${luHM(Math.max(0,ziel-h)*60)} h bis zu deinem Ziel von ${f(ziel)} h.`}</div>
      <div class="lu-zahlen">
        <div><b data-luheute>${f(h)}</b><span>h heute</span></div>
        <div><b>${f(ziel)}</b><span>h Ziel</span></div>
        <div><b>${f(woche)}</b><span>h diese Woche</span></div>
        <div><b>${heuteN}</b><span>${heuteN===1?"Einheit":"Einheiten"} heute</span></div>
      </div>
      <div class="lu-knoepfe">
        <button class="lu-knopf" id="luGross">${an?`${ico("stop")}Stoppen`:`${ico("play")}Lernen starten`}</button>
        ${an?`<button class="lu-nach" id="luFach">${ico("orbit")}Fach wechseln</button>`:`<button class="lu-nach" id="luNach">${ico("plus")}Zeit nachtragen</button>`}
      </div>
    </div>
  </div>`;
}
/* Lernzeit je Fach ab einem Zeitpunkt. Zeit ohne Fach wird auf die Fächer verteilt:
   nach den Aufgaben, die im selben Zeitraum je Fach erledigt wurden (Lernplan-Schritte
   und tägliche Aufgaben). Gibt es keine, nach den fälligen, sonst nach der gemessenen Zeit. */
function luFachStand(von){
  const jetzt=Date.now(), min=luFachMinuten(von,jetzt);
  let gesamt=0; for(let t=new Date(von); dk(t)<=today(); t=addD(t,1)){ const v=(S.metrics[dk(t)]||{}).study; if(nv(v)) gesamt+=v*60; }
  if(luLaeuft()) gesamt+=Math.max(0,jetzt-Math.max(S.lernUhr.start,parsedk(today()).getTime()))/60000;
  const zugeordnet=Object.entries(min).filter(([k])=>k).reduce((a,[,v])=>a+v,0);
  const ohne=Math.max(0,gesamt-zugeordnet), verteilt={};
  if(ohne>=1){
    const gew={}, plus=(m,w)=>{ if(m&&lpMod(m)) gew[m]=(gew[m]||0)+w; }, summeG=()=>Object.values(gew).reduce((a,b)=>a+b,0);
    lpAlle().forEach(x=>{ if(x.fertig&&x.fertig>=von&&x.fertig<=jetzt) plus(x.modul,1); });
    tgl().forEach(t=>Object.values(t.erledigt||{}).forEach(ts=>{ if(ts>=von&&ts<=jetzt) plus(t.modul,1); }));
    if(!summeG()) lpAlle().forEach(x=>{ const t=parsedk(x.datum).getTime(); if(t>=von&&t<=jetzt) plus(x.modul,1); });
    if(!summeG()) Object.entries(min).forEach(([k,v])=>plus(k,v));
    const g=summeG(); if(g) Object.entries(gew).forEach(([k,w])=>verteilt[k]=ohne*w/g);
  }
  const out={};
  [...new Set([...Object.keys(min).filter(k=>k),...Object.keys(verteilt)])].forEach(id=>{ const v=(min[id]||0)+(verteilt[id]||0); if(v>=1) out[id]=v; });
  return out;
}
/* Woche und Semester nebeneinander, die Fächer in beiden in derselben Reihenfolge */
function luFachKarte(){
  const sem=semesterWoche();
  const woche=luFachStand(sow(new Date()).getTime());
  const semester=luFachStand(sem?sem.start.getTime():addD(new Date(),-120).getTime());
  const reihe=Object.keys(semester).sort((a,b)=>semester[b]-semester[a]);
  Object.keys(woche).forEach(id=>{ if(!reihe.includes(id)) reihe.push(id); });
  const diagramm=(werte,titel,leer)=>{
    const ids=reihe.filter(id=>werte[id]), summe=ids.reduce((a,id)=>a+werte[id],0), max=Math.max(1,...ids.map(id=>werte[id]));
    return `<div class="lf-teil"><div class="lf-kopf"><span>${titel}</span><b>${luHM(summe)} h</b></div>
      ${ids.length?`<div class="un-balken lf-balken" style="grid-template-columns:repeat(${ids.length},minmax(0,1fr))">${ids.map(id=>`<div class="un-b" title="${esc(luFachName(id))} · ${luHM(werte[id])} h · ${Math.round(werte[id]/summe*100)} %">
        <span class="un-b-v">${luHM(werte[id])}</span>
        <div class="un-b-s"><i style="height:${Math.max(3,werte[id]/max*100).toFixed(1)}%;background:${luFachFarbe(id)}"></i></div>
        <span class="un-b-t">${esc(luFachName(id))}</span><span class="lf-pz">${Math.round(werte[id]/summe*100)} %</span></div>`).join("")}</div>`
      :`<p class="p-note lf-leer">${leer}</p>`}</div>`;
  };
  return `<div class="p">
    <div class="p-head"><div class="p-title">${ico("book")}Lernzeit nach Fach</div></div>
    <div class="lf-zwei">
      ${diagramm(woche,"Diese Woche","Diese Woche noch keine Lernzeit.")}
      ${diagramm(semester,sem?`Semester · seit ${fmtShort(sem.start)}`:"Letzte 4 Monate","Noch keine Lernzeit.")}
    </div>
  </div>`;
}
const NOVA_TITEL=document.title;
function luZeichnen(){
  const an=luLaeuft(), root=document.documentElement;
  /* Lernmodus: ganz NOVA wird blau, atmet und zeigt oben die Zeit */
  root.classList.toggle("lernt",an); if(window.weltLernen) window.weltLernen(an);
  const lst=document.getElementById("luLeiste"); if(lst) lst.hidden=!an||VIEW==="uni";
  const lab=document.querySelector(".lu-l-label");
  if(lab){ const t=an&&S.lernUhr.modul?`Lernmodus · ${luFachName(S.lernUhr.modul)}`:"Lernmodus"; if(lab.textContent!==t) lab.textContent=t; }
  if(an){ const a=Math.min(1,luHeuteH()/(G().study||3));
    root.style.setProperty("--lu-anteil",a.toFixed(4));
    const pz=document.querySelector("[data-luprozent2]"); if(pz) pz.textContent=`${Math.round(a*100)} %`;
    document.title=`${luGrossUhr()} · Lernen — NOVA`; }
  else if(document.title!==NOVA_TITEL) document.title=NOVA_TITEL;
  const ring=document.querySelector("[data-luring]");
  if(ring&&luLaeuft()){ const ziel=G().study||3, h=luHeuteH(), a=Math.min(1,h/ziel);
    ring.setAttribute("stroke-dashoffset",LU_U*(1-a));
    const pz=document.querySelector("[data-luprozent]"); if(pz) pz.textContent=`${Math.round(a*100)} % vom Tagesziel`;
    const hz=document.querySelector("[data-luheute]"); if(hz) hz.textContent=f(h);
    const k=document.querySelector(".lu-karte"); if(k) k.classList.toggle("voll",a>=1); }
  const u=luUhr();
  document.querySelectorAll("[data-lu]").forEach(e=>e.textContent=u);
  document.querySelectorAll("[data-lugross]").forEach(e=>e.textContent=luGrossUhr());
}
function luNachher(){
  luZeichnen();
  if(VIEW==="uni"||VIEW==="heute"){ const v=document.getElementById("views"), y=v.scrollTop; R[VIEW](); v.scrollTop=y; }
}
/* Fächer zum Auswählen: was im Lernplan steht und anstehende Klausuren, dazu „Anderes“ */
const LU_ANDERS="anders";
function luFaecher(){
  const ids=[], dazu=id=>{ if(id&&lpMod(id)&&!ids.includes(id)) ids.push(id); };
  lpAlle().forEach(x=>dazu(x.modul));
  (S.uniTermine||[]).filter(t=>t.datum>=today()).forEach(t=>dazu(t.modul));
  return ids;
}
const luFachName=id=>id===LU_ANDERS?"Anderes":id?lpKurz(id):"Ohne Fach";
const luFachFarbe=id=>id&&id!==LU_ANDERS?lpFarbe(id):"#8a93a6";
/* Minuten je Fach in einem Zeitraum, aus den Einheiten (die laufende zählt mit) */
function luFachMinuten(von,bis){
  const out={}, dazu=(a,b,m)=>{ const x=Math.max(a,von), y=Math.min(b,bis); if(y>x) out[m||""]=(out[m||""]||0)+(y-x)/60000; };
  (S.lernSitz||[]).forEach(x=>dazu(x.von,x.bis,x.modul));
  if(luLaeuft()) dazu(S.lernUhr.start,Date.now(),S.lernUhr.modul);
  return out;
}
function luFachWahl(wechsel){
  const ids=[...luFaecher(),LU_ANDERS], akt=wechsel&&luLaeuft()?S.lernUhr.modul:S.lernZuletzt;
  const woche=luFachMinuten(sow(new Date()).getTime(),Date.now());
  modal(`<h3>${wechsel?"Fach wechseln":"Was lernst du?"}</h3>
    <div class="lu-faecher">${ids.map(id=>`<button class="lu-fach${id===akt?" on":""}" data-fach="${id}" style="--fc:${luFachFarbe(id)}">
      <span><i></i>${esc(luFachName(id))}</span><em>${woche[id]?`${luHM(woche[id])} h diese Woche`:"diese Woche noch nichts"}</em></button>`).join("")}</div>
    <div class="mo-act"><button class="b" onclick="closeModal()">Abbrechen</button></div>`);
  document.querySelectorAll("#modal [data-fach]").forEach(b=>b.onclick=()=>{ closeModal(); wechsel?luWechsel(b.dataset.fach):luStartMit(b.dataset.fach); });
}
function luStart(){ if(!luLaeuft()) luFachWahl(false); }
function luStartMit(modul){
  if(luLaeuft()) return;
  S.lernUhr={start:Date.now(),modul}; S.lernZuletzt=modul; save();
  toast(`Lernmodus an · ${luFachName(modul)}`,"play"); luNachher();
}
/* Fach wechseln, ohne die Uhr anzuhalten: das Bisherige zählt fürs alte Fach */
function luWechsel(neu){
  if(!luLaeuft()||neu===S.lernUhr.modul) return;
  const alt=S.lernUhr.modul, jetzt=Date.now();
  if(jetzt-S.lernUhr.start>=60000) luBuchen(S.lernUhr.start,jetzt,alt);
  S.lernUhr={start:jetzt,modul:neu}; S.lernZuletzt=neu; save();
  toast(`Weiter mit ${luFachName(neu)}`,"play"); luNachher(); paintOrb();
}
function luBuchen(von,bis,modul){
  let t=von, h=0;
  while(t<bis){
    const d=new Date(t), k=dk(d), nacht=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime();
    const ende=Math.min(bis,nacht), dh=(ende-t)/3600000, m=Object.assign({},S.metrics[k]);
    m.study=Math.round(((nv(m.study)?m.study:0)+dh)*100)/100; S.metrics[k]=m;
    h+=dh; t=ende;
  }
  S.lernSitz=(S.lernSitz||[]).concat([{von,bis,...(modul?{modul}:{})}]).slice(-400);
  return h;
}
function luFertig(von,bis){
  const modul=S.lernUhr&&S.lernUhr.modul, h=luBuchen(von,bis,modul); S.lernUhr=null; save();
  const hh=(S.metrics[today()]||{}).study;
  toast(`${luHM(h*60)} h${modul?` ${luFachName(modul)}`:""} gelernt${nv(hh)?` · heute ${f(hh)} h`:""}`,"check"); luNachher(); paintOrb();
}
function luStopp(){
  if(!luLaeuft()) return;
  const von=S.lernUhr.start, bis=Date.now(), min=(bis-von)/60000;
  if(min<1){ S.lernUhr=null; save(); toast("Unter einer Minute — nicht gezählt","x"); luNachher(); return; }
  if(min>LU_FRAGEN_AB){ luKorrektur(von,bis); return; }
  luFertig(von,bis);
}
function luKorrektur(von,bis){
  const min=(bis-von)/60000, d=new Date(von);
  modal(`<h3>So lange gelernt?</h3>
    <p class="p-note" style="margin-bottom:12px">Der Timer läuft seit ${dk(d)===today()?"heute":tagLang(dk(d))} ${p2(d.getHours())}:${p2(d.getMinutes())} — das sind ${luHM(min)} h. Falls du das Stoppen vergessen hast: trag ein, wie lange du wirklich gelernt hast.</p>
    <label>Gelernt (Std.)</label><input type="text" inputmode="decimal" autocomplete="off" id="luH" value="${String(Math.round(min/15)/4).replace(".",",")}">
    <div class="mo-act"><button class="b" id="luWeg" style="margin-right:auto;color:var(--bad)">Verwerfen</button>
      <button class="b" onclick="closeModal()">Weiterlaufen</button><button class="b b-1" id="luOk">Eintragen</button></div>`);
  document.getElementById("luOk").onclick=()=>{
    const h=parseFloat(document.getElementById("luH").value.replace(",","."));
    if(isNaN(h)||h<=0){ toast("Stunden angeben","x"); return; }
    closeModal(); luFertig(von,Math.min(bis,von+h*3600000)); };
  document.getElementById("luWeg").onclick=()=>{ S.lernUhr=null; save(); closeModal(); toast("Timer verworfen","x"); luNachher(); };
}
/* Gegenstück zu luBuchen: nimmt eine Einheit wieder aus den Tageswerten */
function luAbbuchen(von,bis){
  let t=von;
  while(t<bis){
    const d=new Date(t), k=dk(d), nacht=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime();
    const ende=Math.min(bis,nacht), m=Object.assign({},S.metrics[k]);
    if(nv(m.study)) m.study=Math.max(0,Math.round((m.study-(ende-t)/3600000)*100)/100);
    S.metrics[k]=m; t=ende;
  }
  S.lernSitz=(S.lernSitz||[]).filter(x=>!(x.von===von&&x.bis===bis));
}
/* "1,5", "1.5", "1:30", "90 min" oder "90m" → Stunden */
function luDauerLesen(v){
  v=String(v||"").trim().toLowerCase().replace(",",".");
  let m=/^(\d+)\s*(?::|h)\s*(\d{1,2})\s*(?:m|min)?$/.exec(v); if(m) return +m[1]+ +m[2]/60;
  m=/^(\d+(?:\.\d+)?)\s*(m|min)$/.exec(v); if(m) return +m[1]/60;
  m=/^(\d+(?:\.\d+)?)\s*h?$/.exec(v); return m?+m[1]:NaN;
}
/* Vergessen, den Timer anzumachen? Zeit für einen der letzten 7 Tage nachtragen. */

  const sitz=(S.lernSitz||[]).filter(x=>dk(new Date(x.bis))===k||dk(new Date(x.von))===k).sort((a,b)=>a.von-b.von);

    <label>Tag</label>
    <div class="chips" id="luNT">${tage.map(x=>`<button class="chip${x===k?" on":""}" data-t="${x}">${label(x)}</button>`).join("")}</div>
    <label for="luNH">Wie lange?</label>
    <div class="chips" id="luNQ" style="margin-bottom:8px">${[[.5,"30 min"],[1,"1 h"],[1.5,"1,5 h"],[2,"2 h"],[3,"3 h"]].map(([h,t])=>`<button class="chip" data-h="${h}">${t}</button>`).join("")}</div>
    <div class="lu-dauer">
      <div><input type="text" inputmode="decimal" autocomplete="off" id="luNH" placeholder="Stunden"></div>
      <div><input type="time" id="luNB" value="${bisVor}" aria-label="Ende ungefähr" title="Ende ungefähr"></div>
    </div>
    <p class="p-note" style="margin-top:6px">Rechts: wann du ungefähr aufgehört hast.</p>
    <label>An diesem Tag${nv(bisher)?` · ${f(bisher)} h`:""}</label>
    ${sitz.length?`<div class="lu-sitz">${sitz.map(x=>`<div class="lu-sitz-z"><b>${luHM((x.bis-x.von)/60000)}</b><span>${uhr(x.von)}–${uhr(x.bis)}${x.modul?` · ${esc(luFachName(x.modul))}`:""}${x.nach?" · nachgetragen":""}</span>
        <button data-weg="${x.von}_${x.bis}" aria-label="Einheit entfernen">${ico("trash")}</button></div>`).join("")}</div>`
      :`<p class="p-note">${nv(bisher)&&bisher>0?"Ohne einzelne Einheiten eingetragen.":"Noch nichts gelernt."}</p>`}
    <div class="mo-act"><button class="b" onclick="closeModal()">Abbrechen</button><button class="b b-1" id="luNOk">Eintragen</button></div>`);
  const m=document.getElementById("modal"), feld=m.querySelector("#luNH");
  m.querySelectorAll("#luNT [data-t]").forEach(b=>b.onclick=()=>{ const v=feld.value; luNachtragen(b.dataset.t); document.getElementById("luNH").value=v; });
  m.querySelectorAll("#luNF [data-f]").forEach(b=>b.onclick=()=>{ luNachFach=b.dataset.f; m.querySelectorAll("#luNF .chip").forEach(c=>c.classList.toggle("on",c===b)); });
  m.querySelectorAll("#luNQ [data-h]").forEach(b=>b.onclick=()=>{
    feld.value=String(b.dataset.h).replace(".",",");
    m.querySelectorAll("#luNQ .chip").forEach(c=>c.classList.toggle("on",c===b)); });
  feld.oninput=()=>m.querySelectorAll("#luNQ .chip").forEach(c=>c.classList.remove("on"));
  m.querySelectorAll("[data-weg]").forEach(b=>b.onclick=()=>{
    const [von,bis]=b.dataset.weg.split("_").map(Number);
    luAbbuchen(von,bis); save(); toast(`${luHM((bis-von)/60000)} h entfernt`,"trash"); luNachher(); paintOrb(); luNachtragen(); });
  const ok=()=>{
    const h=luDauerLesen(feld.value);

  m.querySelector("#luNOk").onclick=ok;
  feld.onkeydown=e=>{ if(e.key==="Enter") ok(); };
}
setInterval(()=>{ if(!document.hidden) luZeichnen(); },1000);

/* ── Klausuren im Jahr ──
   Statt einer Liste das Jahr als Raster wie im Rückblick: Vergangenes
   zeigt die Lernzeit, rote Punkte die Klausuren, orange die Abgaben,
   der weiß umrandete Tag ist heute. */
function klausurJahrHtml(){
  /* Von der letzten Woche bis Ende April: die vergangene Woche bleibt sichtbar,
     damit man sieht, wie viel man gelernt hat; danach ist Sommer */
  const h=parsedk(today()), sem=semesterWoche(); let start=addD(sow(h),-7);
  { const ab=sow(sem?sem.start:addD(h,-120)); if(ab<start) start=ab;
    for(let d=addD(start,-1), bis=addD(start,-56); d>=bis; d=addD(d,-1)){ const v=(S.metrics[dk(d)]||{}).study; if(nv(v)&&v>0) start=sow(d); } }
  let ende=new Date(h.getMonth()>=4?h.getFullYear()+1:h.getFullYear(),3,30);
  const ter=uniTermine(), proTag={};
  /* Liegt eine Klausur später (Sommersemester), wächst das Raster bis zu
     ihrem Monatsende mit — sonst wäre sie eingetragen, aber unsichtbar. */
  const spaet=ter.map(t=>t.datum).filter(k=>k>dk(ende)).sort().pop();
  if(spaet){ const d=parsedk(spaet); ende=new Date(d.getFullYear(),d.getMonth()+1,0); }
  const wochen=Math.max(4,Math.ceil(((ende-start)/86400000+1)/7));
  ter.forEach(t=>{ (proTag[t.datum]=proTag[t.datum]||[]).push(t); });
  const zellen=[], monate=[]; let letzt=-1;
  for(let w=0;w<wochen;w++) for(let t=0;t<7;t++){
    const d=addD(start,w*7+t), k=dk(d), m=S.metrics[k]||{}, ts=proTag[k]||[];
    /* Stufen in festen Stunden, wie bei Anki: hell = wenig, dunkel = viel */
    let st;
    if(dk(d)>dk(ende)) st="sz";
    else if(k>today()) st=istVlfrei(k)?"vf":"zk";
    /* Wer in Ferien oder Pause lernt, sieht das auch: Lernzeit schlägt Schraffur */
    else if(nv(m.study)&&m.study>0) st="l"+(m.study>=5?4:m.study>=3?3:m.study>=1.5?2:1);
    else if(istPause(k)) st="sp";
    else if(istVlfrei(k)) st="vf";
    else st="sx";
    const kl=ts.some(x=>x.art==="klausur")?" kj-k":ts.length?" kj-a":"";
    zellen.push(`<i class="rb-z ${st}${kl}${k===today()?" kj-heute":""}${k===kjTag?" sel":""}" data-kjk="${k}"
      title="${tagLang(k)}${ts.map(x=>" · "+esc(x.titel)).join("")}${nv(m.study)&&m.study>0?` · ${f(m.study)} h gelernt`:""}"></i>`);
    if(t===0&&d.getMonth()!==letzt){ monate.push(`<span style="grid-column:${w+1}">${MS[d.getMonth()]}</span>`); letzt=d.getMonth(); }
  }
  const kommend=ter.filter(t=>t.datum>=today());
  const det=kjTag?(()=>{ const ts=proTag[kjTag]||[], m=S.metrics[kjTag]||{};
    const n=tageBis(kjTag);
    return `<b class="rb-dt">${tagLang(kjTag)}</b>${ts.map(t=>`<button class="kj-tag ${t.art==="klausur"?"k":"a"}" data-kjt="${t.id}" title="Bearbeiten">${esc(t.titel)}${t.zeit?` · ${t.zeit}`:""}${ico("edit")}</button>`).join("")}
      ${nv(m.study)&&m.study>0?`<span><b>${f(m.study)} h</b> gelernt</span>`:""}${!ts.length&&!(m.study>0)&&n<0?`<span class="rb-hinweis">Nichts eingetragen.</span>`:""}
      ${n>=0?`<button class="b b-sm" data-kjneu="${kjTag}" style="margin-left:auto">${ico("plus")}${ts.length?"Noch etwas":"Klausur oder Abgabe"} an diesem Tag</button>`:""}`; })()
    :`<span class="rb-hinweis">Tippe auf einen Tag — dort kannst du direkt eine Klausur eintragen.</span>`;
  const spalten=`grid-template-columns:repeat(${wochen},minmax(0,1fr))`;
  return `<div class="p kj">
    <div class="p-head"><div class="p-title">${ico("cal")}Klausuren bis ${MSL[ende.getMonth()]}</div>
      <span class="p-note">${kommend.length?`${kommend.length} anstehend`:"noch keine eingetragen"}</span></div>
    <div class="rb-karte">
      <div class="rb-scroll" id="kjScroll"><div class="rb-innen" style="min-width:calc(${wochen} * 10px + 30px);max-width:none">
        <div class="rb-monate" style="${spalten}">${monate.join("")}</div>
        <div class="rb-zeile"><div class="rb-wt"><span>Mo</span><span></span><span>Mi</span><span></span><span>Fr</span><span></span><span></span></div>
          <div class="rb-raster" style="${spalten}">${zellen.join("")}</div></div>
      </div></div>
      <div class="rb-fuss"><span class="rb-leg">gelernt <i class="rb-z l1"></i><i class="rb-z l2"></i><i class="rb-z l3"></i><i class="rb-z l4"></i>
        <small class="kj-stufen">&lt;1,5 · 3 · 5+ h</small>
        <i class="rb-z zk kj-k" style="margin-left:10px"></i> Klausur <i class="rb-z zk kj-a" style="margin-left:8px"></i> Abgabe
        <i class="rb-z zk kj-heute" style="margin-left:8px"></i> heute
        <i class="rb-z vf" style="margin-left:8px"></i> vorlesungsfrei</span></div>
    </div>
    <div class="rb-detail">${det}</div>
  </div>`;
}

/* Gewählten Tag im (auf dem Handy waagerecht scrollenden) Raster zeigen */
function kjZeige(k){

}

        :sem?`Semesterwoche ${sem.w} · seit ${fmtShort(sem.start)}`:"Semesterwoche erscheint, sobald die Semesterferien als Pause eingetragen sind"}</div></div>

    ${stackBar(wochen.map(w=>w.label),[{color:"var(--m-study)",data:wochen.map(w=>w.h)}],
      {unit:1,emptyText:"Noch keine Lernzeit in diesem Semester.",h:190,
       tip:wochen.map(w=>`<b>Semesterwoche ${w.label.slice(1)}<span class="sb-tip-z">ab ${esc(w.ab)}</span></b><div class="sb-tip-r">${w.zukunft?"kommt noch":w.h?f(w.h)+" h gelernt":"nichts erfasst"}</div>`)})}
  </div>

  el.querySelector("#unNeu").onclick=()=>terminModal();

function terminModal(id,datumVor){

  if(id&&!alt) return;
  let art=alt?alt.art:"klausur", modul=alt?alt.modul:null;

    <label>Titel</label><input id="unTitel" value="${alt?esc(alt.titel):""}" placeholder="${esc(autoVon())}" autocomplete="off">

      <div style="flex:1"><label>Uhrzeit (optional)</label><input type="time" id="unZeit" value="${alt&&alt.zeit?alt.zeit:""}"></div></div>
    <div class="p-note" id="unWann" style="margin-top:8px;min-height:1.2em"></div>

  da.addEventListener("input",zeigWann); da.addEventListener("change",zeigWann); zeigWann();

/* ============================================================
   16 — GESCHENKE
   Für jeden Menschen: Geburtstag, Notizen (was mag sie, Größen,
   Wünsche, die nebenbei fallen) und Geschenkideen mit Stand —
   Idee, gekauft, verschenkt. Was verschenkt ist, bleibt mit Jahr
   stehen, damit nichts doppelt kommt.
   Ablage: S.geschenke = [{id, name, tag, monat, jahr|null, notiz,
                           ideen:[{id, text, status, preis|null, jahr|null, t}]}]
   ============================================================ */
const GS_STATUS=[["idee","Idee"],["gekauft","gekauft"],["verschenkt","verschenkt"]];
const MONATE=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const gsPersonen=()=>(S.geschenke||[]);

/* Nächster Geburtstag ab heute: Datum, Tage bis dahin, welches Alter */
function gsNaechster(p){
  if(!p.tag||!p.monat) return null;
  const h=parsedk(today());
  let d=new Date(h.getFullYear(),p.monat-1,p.tag);
  if(d<h) d=new Date(h.getFullYear()+1,p.monat-1,p.tag);
  const tage=Math.round((d-h)/86400000);
  return {d, tage, alter:p.jahr?d.getFullYear()-p.jahr:null};
}
const gsCountdown=n=> n===0?"heute": n===1?"morgen": n<14?`in ${n} Tagen`: n<60?`in ${Math.round(n/7)} Wochen`:`in ${Math.round(n/30)} Monaten`;
const gsDatum=p=>p.tag&&p.monat?`${p.tag}. ${MONATE[p.monat-1]}${p.jahr?" "+p.jahr:""}`:"kein Geburtstag eingetragen";
/* Bald Geburtstag, aber nichts gekauft? (Weihnachtsgeschenke zählen hier nicht) */
const gsOffenBald=p=>{ const n=gsNaechster(p);
  const vor21=Date.now()-21*86400000;
  return n&&n.tage<=21&&!(p.ideen||[]).some(i=>i.anlass!=="xmas"&&(i.status==="gekauft"||(i.status==="verschenkt"&&(i.st||0)>vor21))); };

/* ── Weihnachten ──
   Ein zweiter Anlass neben dem Geburtstag. Jede Person ist dabei, außer
   man nimmt sie heraus; Ideen tragen ihren Anlass mit. */
function gsXmas(){ const h=parsedk(today()); let d=new Date(h.getFullYear(),11,24); if(d<h) d=new Date(h.getFullYear()+1,11,24);
  return {d, tage:Math.round((d-h)/86400000), jahr:d.getFullYear()}; }
const gsXmasDabei=p=>p.xmas!==false;
function gsXmasStand(p){
  const j=gsXmas().jahr, l=(p.ideen||[]).filter(i=>i.anlass==="xmas");
  if(l.some(i=>i.status==="gekauft"||(i.status==="verschenkt"&&i.jahr===j))) return "gekauft";
  if(l.some(i=>i.status==="idee")) return "idee";
  return "nichts";
}
/* Welcher Anlass ist für neue Ideen vorgewählt? Der nähere. */
const gsAnlassWahl={};
const gsAnlassVor=p=>{ if(gsAnlassWahl[p.id]) return gsAnlassWahl[p.id];
  const n=gsNaechster(p), x=gsXmas(); return gsXmasDabei(p)&&(!n||x.tage<n.tage)?"xmas":"geb"; };

/* Für „Heute": wer hat in den nächsten 14 Tagen Geburtstag */
function gsBald(tage=14){
  return gsPersonen().map(p=>({p,n:gsNaechster(p)})).filter(x=>x.n&&x.n.tage<=tage)
    .sort((a,b)=>a.n.tage-b.n.tage);
}

/* ── Planer teilen ───────────────────────────────────────
   NOVA legt nur einen Auszug des Planers ab (Datum, Uhrzeit, Titel,
   Farbe, ohne Schlaf) und liest nur ihren Auszug. Beides liegt im
   privaten Repo Woche-daten, ihre App kommt an nova.json nie heran. */
const TEIL_REPO="Woche-daten", TEIL_MEIN="matti-planer.json", TEIL_IHR="woche-planer.json";
const TEIL_CACHE="nova_teil_ihr", TEIL_LETZT="nova_teil_letzt", TEIL_NAME="nova_teil_name";
const teilUrl=pfad=>`https://api.github.com/repos/${GH_USER}/${TEIL_REPO}/${pfad?`contents/${pfad}`:""}`;
const teilIhr=()=>{ try{ return JSON.parse(localStorage.getItem(TEIL_CACHE)||"null"); }catch(e){ return null; } };
const teilMeinName=()=>localStorage.getItem(TEIL_NAME)||"Matti";
const teilGenitiv=n=>/[sßxz]$/i.test(n)?`${n}’`:`${n}s`;
function teilLabel(){
  const d=teilIhr(), n=d&&String(d.von||"").trim();
  const nav=NAV.find(x=>x.id==="partner"); if(nav) nav.t=n?`${teilGenitiv(n)} Woche`:"Freundin";
  return nav?nav.t:"Freundin";
}
teilLabel();
function teilAuszug(){
  const tage={}, h=parsedk(today());
  for(let i=-7;i<=62;i++){ const k=dk(addD(h,i));
    const b=planDay(k).filter(x=>x&&x.type!=="schlafen").map(x=>{ const t=blockById(x.type);
      return {start:x.start||"",end:x.end||"",titel:x.note||t.label,farbe:t.bg,...(x.note?{art:t.label}:{}),...(x.raum?{ort:x.raum}:{})}; })
      .sort((a,b)=>a.start.localeCompare(b.start));
    const g=[...ganzAm(k).map(x=>({titel:x.titel,farbe:x.farbe||GANZ_FARBEN[0]})),
      ...(S.uniTermine||[]).filter(t=>t.datum===k).map(t=>({titel:`${t.titel}${t.zeit?` · ${t.zeit}`:""}`,farbe:"#e35d6a"}))];
    if(b.length||g.length) tage[k]={b,g};
  }
  return {v:1,app:"nova",von:teilMeinName(),tage};
}
let teilSha=null, teilFehler="";
async function teilHoch(){
  if(!cloudOn()) return; const tok=cloudTok(); if(!tok) return;
  const a=teilAuszug(), roh=JSON.stringify(a);
  if(localStorage.getItem(TEIL_LETZT)===roh) return;
  const kopf={Authorization:`token ${tok}`};
  const shaHolen=async()=>{ const r=await fetch(teilUrl(TEIL_MEIN)+"?v="+Date.now(),{headers:kopf}); teilSha=r.ok?(await r.json()).sha:null; };
  if(!teilSha) await shaHolen();
  const senden=()=>fetch(teilUrl(TEIL_MEIN),{method:"PUT",headers:{...kopf,"Content-Type":"application/json"},
    body:JSON.stringify({message:`planer ${new Date().toISOString()}`,content:btoa(unescape(encodeURIComponent(JSON.stringify({...a,stand:new Date().toISOString()})))),...(teilSha?{sha:teilSha}:{})})});
  let r=await senden();
  if(r.status===409||r.status===422){ await shaHolen(); r=await senden(); }
  if(!r.ok){ teilFehler=(r.status===403||r.status===404)?"zugriff":String(r.status); throw new Error(r.status); }
  teilSha=(await r.json()).content.sha; localStorage.setItem(TEIL_LETZT,roh);
}
async function teilHolen(){
  if(!cloudOn()||!cloudTok()){ teilFehler="aus"; return false; }
  const kopf={Authorization:`token ${cloudTok()}`};
  try{
    const r=await fetch(teilUrl(TEIL_IHR)+"?v="+Date.now(),{headers:kopf});
    if(r.status===404){ const repo=await fetch(teilUrl(""),{headers:kopf}); teilFehler=repo.ok?"fehlt":"zugriff"; return false; }
    if(r.status===401||r.status===403){ teilFehler="zugriff"; return false; }
    if(!r.ok){ teilFehler=String(r.status); return false; }
    const roh=decodeURIComponent(escape(atob((await r.json()).content.replace(/\n/g,""))));
    teilFehler=""; if(roh===localStorage.getItem(TEIL_CACHE)) return false;
    localStorage.setItem(TEIL_CACHE,roh);
    const vorher=document.querySelector('.rl[data-go="partner"] .rl-txt')?.textContent, jetzt=teilLabel();

/* Ihre Woche als Zeitraster wie ein normaler Kalender: Pausen bleiben als
   Lücken sichtbar. Am Handy erst ein Tag, am Rechner die ganze Woche. */
let pwDatum=null, pwModus=null;
const pwModusAkt=()=>pwModus||(innerWidth<=640?"tag":"woche");
const pwTagAkt=()=>pwDatum||today();
function pwSchritt(r){
  const modus=pwModusAkt(), ziel=dk(addD(parsedk(pwTagAkt()),r*(modus==="woche"?7:1)));
  const von=dk(addD(new Date(),-7)), bis=dk(addD(new Date(),62));
  if(modus==="woche"){ const m=sow(parsedk(ziel)); if(dk(addD(m,6))<von||dk(m)>bis) return false; }
  else if(ziel<von||ziel>bis) return false;
  pwDatum=ziel; return true;
}
function pwSpalten(l){
  const out=l.map(b=>{ const s=hm2min(b.start); let e=hm2min(b.end); if(e<=s) e=1440; return {b,s,e:Math.max(e,s+15),col:0,cols:1}; })
    .sort((a,b)=>a.s-b.s||b.e-a.e);
  let grp=[], ende=-1;
  const fertig=()=>{ const n=Math.max(1,...grp.map(x=>x.col+1)); grp.forEach(x=>x.cols=n); grp=[]; };
  out.forEach(x=>{ if(x.s>=ende&&grp.length) fertig();
    const belegt=new Set(grp.filter(y=>y.e>x.s).map(y=>y.col)); let c=0; while(belegt.has(c)) c++;
    x.col=c; grp.push(x); ende=Math.max(ende,x.e); });
  if(grp.length) fertig();
  return out;
}
function pwRaster(tage,d){
  const n=tage.length, t0=today(), tagD=k=>(d.tage&&d.tage[k])||{b:[],g:[]};
  const bl=tage.map(k=>pwSpalten(tagD(k).b||[])), alle=bl.flat();
  const H0=Math.max(0,Math.min(8,...alle.map(x=>Math.floor(x.s/60))));
  const H1=Math.min(24,Math.max(20,...alle.map(x=>Math.ceil(x.e/60))));
  const pwh=innerWidth<=640?50:46, hoehe=(H1-H0)*pwh, jd=new Date(), jetzt=jd.getHours()*60+jd.getMinutes();
  const jetztDrin=tage.includes(t0)&&jetzt>=H0*60&&jetzt<=H1*60, y=min=>(min-H0*60)/60*pwh;
  const kopfZ=tage.map(k=>{ const dd=parsedk(k), inner=`${TWD[wtagIdx(dd)]}<b>${dd.getDate()}</b>`;
    return n>1?`<button class="pw-tagk${k===t0?" heute":""}" data-pwtag="${k}" aria-label="${tagLang(k)} ansehen">${inner}</button>`
      :`<div class="pw-tagk${k===t0?" heute":""}">${inner}</div>`; }).join("");
  const gl=tage.map(k=>tagD(k).g||[]), zeilen=Math.max(0,...gl.map(l=>l.length));
  const ganz=zeilen?`<div class="pw-ganz"><div class="pw-ganz-l">ganztags</div><div class="pw-ganz-r" style="--n:${n}">
    ${gl.map((l,i)=>l.map((g,j)=>`<div class="pw-gz" style="--bc:${esc(g.farbe||"#f4a6c0")};grid-column:${i+1};grid-row:${j+1}" title="${esc(g.titel)}">${esc(g.titel)}</div>`).join("")).join("")}</div></div>`:"";
  const uhrSp=`<div class="pw-uhr" style="height:${hoehe}px">${[...Array(H1-H0)].map((_,i)=>i?`<span style="top:${i*pwh}px">${p2(H0+i)}:00</span>`:"").join("")}
    ${jetztDrin?`<span class="jetzt" style="top:${y(jetzt)}px">${p2(jd.getHours())}:${p2(jd.getMinutes())}</span>`:""}</div>`;
  const sp=tage.map((k,i)=>{ const dd=parsedk(k), we=wtagIdx(dd)>=5;
    const bloecke=bl[i].map(x=>{ const top=y(x.s), h=Math.max(20,(x.e-x.s)/60*pwh-2), breite=100/x.cols, kurz=h<38;
      const zusatz=[x.b.art,x.b.ort].filter(Boolean).join(" · "), bis=x.e>=1440?"24:00":x.b.end;
      return `<div class="pw-blk${kurz?" kurz":""}" style="--bc:${esc(x.b.farbe||"#f4a6c0")};top:${top+1}px;height:${h}px;left:calc(${x.col*breite}% + 2px);width:calc(${breite}% - 4px)" title="${esc(`${x.b.start}–${bis} ${x.b.titel}${zusatz?` · ${zusatz}`:""}`)}">
        <b>${esc(x.b.titel)}</b><span>${kurz?esc(x.b.start):esc(`${x.b.start}–${bis}${zusatz?` · ${zusatz}`:""}`)}</span></div>`; }).join("");
    return `<div class="pw-sp${we?" we":""}${k===t0?" heute":""}" style="height:${hoehe}px">${bloecke}${k===t0&&jetztDrin?`<div class="pw-jetzt" style="top:${y(jetzt)}px"></div>`:""}</div>`; }).join("");
  return `<div class="pw-kal${n===1?" pw-einzeln":""}" style="--pwh:${pwh}px">
    <div class="pw-kopf" style="--n:${n}"><div></div>${kopfZ}</div>${ganz}
    <div class="pw-body" style="--n:${n}">${uhrSp}${sp}</div></div>`;
}

    S.geschenke=(S.geschenke||[]).filter(x=>x.id!==id); save(); closeModal(); toast("Gelöscht"); R.geschenke();
  });
  setTimeout(()=>document.getElementById("gpName")?.focus(),50);
}

/* ============================================================
   14 — PLANER
   ============================================================ */
let plDate=today(), plSel=0, plDragType=null, plDragTodo=null, todoPrio="mid";
let planFilter=null, katOffen="sport";
const PL_H0=6, PL_H1=24, PL_HH=34;

const TP_HH=30;                       /* etwas flacher als der Tagesplan: 7 Spalten */

/* ── Zwei Wochen nebeneinander ──────────────────────────
   Kein Vorlagen-Stundenplan mehr, sondern zwei echte Wochen — wie im
   Tagesplaner oben, nur eine Stufe gröber. Was sich wiederholt,
   heftest du an: angeheftete Blöcke stehen in jeder Woche, alles
   andere gilt nur für die Woche, in der es steht.

   Ablage:
     S.tplan[wochentag]        angeheftet, gilt immer
     S.tplanWoche[montag][tag] nur diese eine Woche
   ──────────────────────────────────────────────────────── */
let tpWoche=dk(sow(new Date()));          /* linke Spalte = diese Woche */
const wochenSchluessel=d=>dk(sow(d));
const monatsSchluessel=d=>dk(new Date(d.getFullYear(),d.getMonth(),1));
let tpModus=(()=>{ try{ return localStorage.getItem("nova_tp_modus")==="monat"?"monat":"woche"; }catch(e){ return "woche"; } })();
let tpMonat=monatsSchluessel(new Date());
let tpMark=null;                          /* erster angestrichener Tag im Monat */

/* Alles, was in einer bestimmten Woche an einem Tag steht. */
const istAus=(mk,id)=>((S.tplanAus||{})[mk]||[]).includes(id);
function wocheTag(mk,i,mitAusgesetzten){
  /* In der vorlesungsfreien Zeit finden angeheftete Vorlesungen und Übungen
     nicht statt — eigene Lernblöcke und Einträge nur dieser Woche schon. */
  const frei=typeof istVlfrei==="function"&&istVlfrei(dk(addD(parsedk(mk),i)));
  const fest=tplanTag(i).map(b=>({...b,fix:true,aus:istAus(mk,b.id)}))
    .filter(b=>mitAusgesetzten||!b.aus)
    .filter(b=>!frei||katVon(blockById(b.type))!=="uni"||b.type==="lernen");
  const eigen=(((S.tplanWoche||{})[mk]||{})[i]||[]).map(b=>({...b,fix:false,aus:false}));
  return fest.concat(eigen).sort((a,b)=>(a.start||"").localeCompare(b.start||""));
}
/* Angeheftetes für eine Woche aussetzen, ohne die Anheftung zu
   verlieren: der Block bleibt in der Vorlage, steht aber in dieser
   einen Woche auf der Ausnahmeliste. */
function ausSchalten(mk,id,an){
  S.tplanAus=S.tplanAus||{};
  const l=S.tplanAus[mk]=S.tplanAus[mk]||[];
  const i=l.indexOf(id);
  if(an&&i<0) l.push(id);
  if(!an&&i>=0) l.splice(i,1);
  if(!l.length) delete S.tplanAus[mk];
  save();
}
/* Zeigt der Filter diesen Baustein gerade? */
const imFilter=b=>!planFilter||katVon(blockById(b.type))===planFilter;
function blockSuchen(mk,i,id){
  return wocheTag(mk,i,true).find(b=>b.id===id)||null;
}
/* Aus beiden Ablagen entfernen — beim Umhängen, Anheften und Löschen
   ist das der sichere Weg, sonst bliebe eine Kopie zurück. */
function blockRaus(mk,id){
  for(let x=0;x<7;x++){
    if(S.tplan&&S.tplan[x]){ S.tplan[x]=S.tplan[x].filter(b=>b.id!==id);
      if(!S.tplan[x].length) delete S.tplan[x]; }
    const W=(S.tplanWoche||{})[mk];
    if(W&&W[x]){ W[x]=W[x].filter(b=>b.id!==id);
      if(!W[x].length) delete W[x]; }
  }
  if(S.tplanWoche&&S.tplanWoche[mk]&&!Object.keys(S.tplanWoche[mk]).length)
    delete S.tplanWoche[mk];
}

function tplanStunden(){
  /* Beide gezeigten Wochen zusammen, damit die Raster gleich hoch
     bleiben und man sie nebeneinander lesen kann. */
  let von=24, bis=0;
  const mk2=dk(addD(parsedk(tpWoche),7));
  const sieh=b=>{ von=Math.min(von,Math.floor(hm2min(b.start)/60));
                  bis=Math.max(bis,Math.ceil(hm2min(b.end)/60)); };
  for(let i=0;i<7;i++){ wocheTag(tpWoche,i).forEach(sieh); wocheTag(mk2,i).forEach(sieh); }
  if(von>bis) return [6,23];
  return [Math.max(0,Math.min(von-1,22)), Math.min(24,Math.max(bis+1,von+3))];
}

/* ── Ganztägig ──
   Wie in der Woche-App: Einträge ohne Uhrzeit, die einen oder mehrere
   ganze Tage belegen (Urlaub, Turnier, Klausurphase). Sie stehen im
   Planer in einer eigenen Zeile über den Stunden, bei „Plan für heute“,
   im Check-in und im geteilten Planer. */
const GANZ_FARBEN=["#4fe3d2","#8b7cf0","#d488b8","#f0c04e","#3683db","#5ec47a","#e0697c"];
const ganzAm=k=>(S.ganz||[]).filter(g=>g&&g.von&&g.von<=k&&(g.bis||g.von)>=k)
  .sort((a,b)=>a.von.localeCompare(b.von)||(a.titel||"").localeCompare(b.titel||""));
/* Für die Woche jedem Eintrag eine feste Bahn geben, damit mehrtägige
   Einträge über die Spalten hinweg auf einer Linie liegen */
function ganzBahnen(mk,feste=[]){
  const tage=[...Array(7)].map((_,i)=>dk(addD(parsedk(mk),i)));
  const items=[...feste,...(S.ganz||[]).filter(g=>g&&g.von&&g.von<=tage[6]&&(g.bis||g.von)>=tage[0])]
    .sort((a,b)=>a.von.localeCompare(b.von)||(b.bis||b.von).localeCompare(a.bis||a.von));
  const ende=[], bahn={};
  items.forEach(g=>{ let b=ende.findIndex(e=>e<g.von); if(b<0){ b=ende.length; ende.push(""); } ende[b]=g.bis||g.von; bahn[g.id]=b; });
  return {bahn, n:ende.length, tage};
}
function ganzModal(id,tag,bisTag){

    <div class="mo-act">${g?`<button class="b" id="gzDel" style="margin-right:auto;color:var(--bad)">Löschen</button>`:""}

    if(g) Object.assign(g,{titel,von,bis,farbe}); else S.ganz.push({id:uid(),titel,von,bis,farbe});

  };
  document.getElementById("gzDel")?.addEventListener("click",()=>{
    S.ganz=(S.ganz||[]).filter(x=>x.id!==id); save(); closeModal(); toast("Gelöscht"); neuZeichnen(); });
  document.getElementById("gzT").onkeydown=e=>{ if(e.key==="Enter") document.getElementById("gzOk").click(); };
  setTimeout(()=>document.getElementById("gzT")?.focus(),60);

/* ── Monatsansicht ──
   Zeigt die ganztägigen Einträge als durchgehende Balken und lässt
   längere Termine anstreichen: ersten und letzten Tag antippen (geht
   auch über einen Monatswechsel) oder mit der Maus darüberziehen. Am
   Handy bleibt Wischen fürs Scrollen frei, deshalb dort nur Antippen. */
/* Feste Termine kommen aus den Geschenken und dem Kalender, nicht aus
   S.ganz: Sie wiederholen sich jedes Jahr und folgen der Personenliste. */
function monatFeste(tage){
  const jahre=[...new Set([tage[0].slice(0,4),tage[6].slice(0,4)])].map(Number), out=[];
  const liegtDrin=(von,bis)=>von<=tage[6]&&bis>=tage[0];
  jahre.forEach(j=>{
    gsPersonen().forEach(p=>{ if(!p.tag||!p.monat) return;
      const k=dk(new Date(j,p.monat-1,p.tag)); if(!liegtDrin(k,k)) return;
      const alter=p.jahr?j-p.jahr:null;
      out.push({id:`geb_${p.id}_${j}`,titel:`${p.name}${alter?` ${alter}`:""}`,von:k,bis:k,farbe:"var(--gift)",
        fest:`${p.name}${alter?` wird ${alter}`:""} · Geburtstag`}); });
    const von=`${j}-12-24`, bis=`${j}-12-26`;
    if(liegtDrin(von,bis)) out.push({id:`xmas_${j}`,titel:"Weihnachten",von,bis,farbe:"#5ec47a",fest:"Weihnachten · 24. bis 26. Dezember"});
  });
  return out;
}
function monatRaster(mk){
  const erster=parsedk(mk), letzter=new Date(erster.getFullYear(),erster.getMonth()+1,0), h=today(), wochen=[];
  for(let mo=sow(erster); mo<=letzter; mo=addD(mo,7)){
    const tageW=[...Array(7)].map((_,i)=>dk(addD(mo,i))), feste=monatFeste(tageW);
    const GB=ganzBahnen(dk(mo),feste), tage=GB.tage;
    const zellen=tage.map(k=>{
      const d=parsedk(k);
      const uni=(S.uniTermine||[]).filter(t=>t.datum===k).map(()=>"#e35d6a");
      const bl=planDay(k).map(b=>blockById(b.type).bg);
      const punkte=[...uni,...bl], zuViel=punkte.length>5;
      return `<button class="mn-tag${d.getMonth()!==erster.getMonth()?" fremd":""}${k===h?" heute":""}" data-mtag="${k}" aria-label="${fmtShort(d)}">
        <span class="mn-zahl">${d.getDate()}</span>
        ${punkte.length?`<span class="mn-punkte">${punkte.slice(0,zuViel?4:5).map(c=>`<i style="background:${c}"></i>`).join("")}${zuViel?`<em>+${punkte.length-4}</em>`:""}</span>`:""}</button>`;
    }).join("");
    const balken=[...feste,...(S.ganz||[]).filter(g=>g&&g.von&&g.von<=tage[6]&&(g.bis||g.von)>=tage[0])].map(g=>{
      const bis=g.bis||g.von, an=g.von>=tage[0], en=bis<=tage[6];
      const i0=an?tage.indexOf(g.von):0, i1=en?tage.indexOf(bis):6;
      return `<button class="mn-bar${an?" a":""}${en?" e":""}${g.fest?" fest":""}" ${g.fest?"data-mfest":`data-ganz="${g.id}"`} style="--gc:${g.farbe||GANZ_FARBEN[0]};--i:${i0};--n:${i1-i0+1};--b:${GB.bahn[g.id]||0}"
        title="${esc(g.fest||`${g.titel}${bis!==g.von?` · ${fmtShort(parsedk(g.von))} bis ${fmtShort(parsedk(bis))}`:" · ganztags"}`)}">${esc(g.titel)}</button>`;
    }).join("");
    wochen.push(`<div class="mn-woche" style="--bahnen:${GB.n}">${zellen}${balken}</div>`);
  }
  return `<div class="mn-kopf">
      <div class="mn-titel">${MONATE[erster.getMonth()]} <span>${erster.getFullYear()}</span></div>
      <div class="mn-status" id="mnStatus"></div></div>
    <div class="mn-wt">${["Mo","Di","Mi","Do","Fr","Sa","So"].map(t=>`<span>${t}</span>`).join("")}</div>
    <div class="mn-raster">${wochen.join("")}</div>`;
}
function monatWiring(V){
  const raster=V.querySelector(".mn-raster"); if(!raster) return;
  const zellen=[...raster.querySelectorAll("[data-mtag]")], status=V.querySelector("#mnStatus");
  raster.querySelectorAll("[data-mfest]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); go("geschenke"); });
  const malen=(a,b)=>{
    const [x,y]=a&&b?(a<=b?[a,b]:[b,a]):["",""];
    zellen.forEach(z=>{ const k=z.dataset.mtag;
      z.classList.toggle("mark",!!x&&k>=x&&k<=y); z.classList.toggle("mark-a",k===x); z.classList.toggle("mark-e",k===y); });
  };
  const fertig=(a,b)=>{ const [von,bis]=a<=b?[a,b]:[b,a]; tpMark=null; R.planer(); ganzModal(null,von,bis); };
  const zeigen=()=>{
    raster.classList.toggle("markiert",!!tpMark);
    malen(tpMark,tpMark);
    status.innerHTML=tpMark?`<span><b>Ab ${fmtShort(parsedk(tpMark))}</b><i class="mn-hilfe"> · jetzt den letzten Tag antippen</i></span>
      <button class="b b-sm" id="mnEin">Nur dieser Tag</button><button class="b b-sm" id="mnWeg">Abbrechen</button>`:"";
    status.querySelector("#mnEin")?.addEventListener("click",()=>fertig(tpMark,tpMark));
    status.querySelector("#mnWeg")?.addEventListener("click",()=>{ tpMark=null; zeigen(); });
  };
  let zug=null, schluckenBis=0;
  const unterMaus=e=>{ const el=document.elementFromPoint(e.clientX,e.clientY); return el&&el.closest("[data-mtag]"); };
  raster.onpointerdown=e=>{
    if(e.pointerType==="touch"||e.button!==0) return;
    const z=e.target.closest("[data-mtag]"); if(!z) return;
    zug={von:z.dataset.mtag,bis:z.dataset.mtag};
    raster.classList.add("markiert");    /* Balken lassen den Zug durch */
    addEventListener("pointerup",()=>{
      const r=zug; zug=null;
      if(r.bis!==r.von){ schluckenBis=performance.now()+300; fertig(r.von,r.bis); }
      else if(!tpMark) raster.classList.remove("markiert");
    },{once:true});
  };
  raster.onpointermove=e=>{
    if(e.pointerType==="touch") return;
    const z=unterMaus(e);
    if(zug){ if(z) zug.bis=z.dataset.mtag; if(zug.bis!==zug.von) malen(zug.von,zug.bis); }
    else if(tpMark&&z) malen(tpMark,z.dataset.mtag);
  };
  raster.onclick=e=>{
    if(performance.now()<schluckenBis) return;
    const z=e.target.closest("[data-mtag]"); if(!z) return;
    if(tpMark) fertig(tpMark,z.dataset.mtag); else { tpMark=z.dataset.mtag; zeigen(); }
  };
  zeigen();
}
function wochenRaster(mk,H0,H1){
  const mo=parsedk(mk), GB=ganzBahnen(mk), GH=Math.max(1,GB.n)*22+8;
  let stunden="";
  for(let h=H0;h<H1;h++)
    stunden+=`<div style="height:${TP_HH}px;border-top:1px solid var(--line);font-family:var(--f-mono);
      font-size:9px;color:var(--text-faint);padding-right:5px;text-align:right;line-height:1">${p2(h)}</div>`;

  const spalte=i=>{
    const tag=dk(addD(mo,i));
    let rows="";
    for(let h=H0;h<H1;h++)
      rows+=`<div data-wslot="${mk}|${i}|${h}" style="height:${TP_HH}px;border-top:1px solid var(--line);cursor:pointer"></div>`;
    let bl="";
    wocheTag(mk,i).filter(imFilter).forEach(b=>{
      const t=blockById(b.type), sperre=IST_SPERRE(b.type);
      const von=hm2min(b.start), bis=Math.max(von+15,hm2min(b.end));
      const top=(von/60-H0)*TP_HH, hh=Math.max(15,(bis-von)/60*TP_HH);
      bl+=`<div data-wblk="${mk}|${i}|${b.id}" class="${sperre?"tp-sperre":""}${b.fix?" tp-fix":""}"
        title="${esc(b.note||t.label)} · ${b.start}–${b.end}${b.raum?` · ${esc(b.raum)}`:""}${
          b.fix?" · angeheftet, steht jede Woche":""}${sperre?" · gesperrte Zeit":""}"
        style="position:absolute;left:2px;right:2px;top:${top}px;height:${hh-2}px;border-radius:var(--r-xs);
        ${sperre?"":`background:${t.bg};`}padding:${hh>28?"4px 6px":"0 6px"};overflow:hidden;cursor:pointer;
        box-shadow:var(--sh-1);color:${sperre?"var(--text-dim)":"#08111a"};font-size:${hh>28?"11px":"9.5px"};line-height:1.2">
        ${b.fix?`<span class="tp-nadel" aria-label="angeheftet">📌</span>`:""}
        <b style="font-weight:700">${esc(b.note||t.label)}</b>${
          hh>40?`<div style="opacity:.75;font-size:9px;margin-top:1px">${b.start}–${b.end}</div>`:""}${
          b.raum&&hh>52?`<div style="opacity:.75;font-size:9px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(b.raum)}</div>`:""}</div>`;
    });
    return `<div class="tp-sp${tag===today()?" heute":""}">
      <div class="tp-kopf">
        <span>${TWD[i]} <i>${addD(mo,i).getDate()}.</i></span>
        ${tag<=today()&&solideTag(tag)?`<span class="tp-solid" title="Solider Tag — alle vier Ziele erfüllt">${ico("star")}</span>`:""}
      </div>
      <div class="tp-ganz" data-ganzneu="${tag}" style="height:${GH}px" title="Ganztägig planen">${ganzAm(tag).map(g=>{
        const an=g.von===tag||i===0, en=(g.bis||g.von)===tag||i===6;
        return `<button class="tp-gz${an?" a":""}${en?" e":""}" data-ganz="${g.id}" style="--gc:${g.farbe||GANZ_FARBEN[0]};top:${(GB.bahn[g.id]||0)*22+4}px"
          title="${esc(g.titel)} · ganztags${g.bis&&g.bis!==g.von?` bis ${fmtShort(parsedk(g.bis))}`:""}">${an?esc(g.titel):"&nbsp;"}</button>`; }).join("")}</div>
      <div class="tp-spalte">${rows}${bl}${jetztLinie(mk,i,H0,H1)}</div>
    </div>`;
  };
  return `<div class="tp-scroll"><div class="tp-raster">
    <div class="tp-uhr"><div class="tp-kopf">&nbsp;</div><div class="tp-ganz-l" style="height:${GH}px">ganz&shy;tags</div>${stunden}</div>
    ${[...Array(7)].map((_,i)=>spalte(i)).join("")}
  </div></div>`;
}

/* Jetzt-Strich: in der aktuellen Woche zeigt eine Linie die Uhrzeit,
   kräftig in der Spalte von heute, leise in den übrigen Tagen. */
function jetztLinie(mk,i,H0,H1){
  if(mk!==wochenSchluessel(new Date())) return "";
  const heute=dk(addD(parsedk(mk),i))===today();
  return `<div class="tp-jetzt${heute?"":" leise"}" data-h0="${H0}" data-h1="${H1}" aria-hidden="true">${heute?"<span></span>":""}</div>`;
}
function jetztStrich(){
  const d=new Date(), h=d.getHours()+d.getMinutes()/60, txt=`${p2(d.getHours())}:${p2(d.getMinutes())}`;
  document.querySelectorAll(".tp-jetzt").forEach(el=>{
    const h0=+el.dataset.h0, h1=+el.dataset.h1;
    el.hidden=h<h0||h>=h1;
    el.style.top=((h-h0)*TP_HH)+"px";
    const sp=el.querySelector("span"); if(sp) sp.textContent=txt;
  });
}
function wochenTitel(mk){
  const mo=parsedk(mk), so=addD(mo,6);
  const jetzt=wochenSchluessel(new Date());
  const diff=Math.round((mo-parsedk(jetzt))/604800000);
  const name = diff===0?"Diese Woche" : diff===1?"Nächste Woche"
             : diff===-1?"Letzte Woche" : diff>0?`In ${diff} Wochen` : `Vor ${-diff} Wochen`;
  /* Beide Zahlen müssen dasselbe meinen: Sperren sind kein Training,
     also zählen sie weder zur Anzahl noch zu den Stunden. Vorher war
     die Anzahl inklusive Sperren — das passte nicht zusammen. */
  const training=[...Array(7)].flatMap((_,i)=>wocheTag(mk,i))
    .filter(imFilter).filter(b=>!IST_SPERRE(b.type));
  const ausgesetzt=((S.tplanAus||{})[mk]||[]).length;
  const anzahl=training.length;
  const min=training.reduce((x,b)=>x+Math.max(0,hm2min(b.end)-hm2min(b.start)),0);
  const std=Math.round(min/6)/10;
  return `<div class="tp-titel">
    <span class="tp-titel-n">${name}<i>${fmtShort(mo)} – ${fmtShort(so)}</i></span>
    <span class="tag" title="Geplante Trainings dieser Woche und ihre Dauer zusammengerechnet. Gesperrte Zeiten zählen nicht mit.">${
      anzahl?`${anzahl} ${anzahl===1?"Eintrag":"Einträge"} · ${std} h`:"nichts geplant"}</span>
    ${ausgesetzt?`<button class="tag tp-aus-z" data-ausz="${mk}"
      title="Angeheftetes, das in dieser Woche nicht stattfindet — antippen zum Zurückholen">${ausgesetzt} ausgesetzt</button>`:""}
  </div>`;
}

function tplanWiring(V){
  V.querySelectorAll("[data-bt]").forEach(b=>{
    b.onclick=()=>{ plDragType=b.dataset.bt;
      V.querySelectorAll("[data-bt]").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      toast(blockById(plDragType).label+" gewählt, jetzt eine Stunde antippen"); };
    b.ondragstart=()=>{ plDragType=b.dataset.bt; };
  });
  /* Ein Feld im Raster nimmt entweder einen gewählten Baustein oder eine
     gewählte Aufgabe auf — per Antippen oder per Ziehen. Die Aufgabe
     wurde früher nur gemerkt, aber hier nie abgefragt. */
  const slotNimmt=s=>{
    const [mk,i,h]=s.dataset.wslot.split("|");
    const von=p2(+h)+":00", bis=p2(Math.min(23,+h+1))+":00";
    if(plDragTodo){
      const t=(S.todos||[]).find(x=>x.id===plDragTodo);
      plDragTodo=null;
      if(t){ openTBlock(mk,+i,"todo",von,bis,t.text,null,false); return; }
    }
    if(!plDragType){ toast("Erst einen Baustein oder eine Aufgabe wählen","x"); return; }
    openTBlock(mk,+i,plDragType,von,bis,null,null,false);
  };
  V.querySelectorAll("[data-wslot]").forEach(s=>{
    s.onclick=()=>slotNimmt(s);
    s.ondragover=e=>{ if(plDragTodo||plDragType) e.preventDefault(); };
    s.ondrop=e=>{ e.preventDefault(); slotNimmt(s); };
  });
  V.querySelectorAll("[data-wblk]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const [mk,i,id]=b.dataset.wblk.split("|");
    const bl=blockSuchen(mk,+i,id);
    if(bl) openTBlock(mk,+i,bl.type,bl.start,bl.end,bl.note,id,bl.fix,bl.raum);
  });
}

/* Eigener Baustein, etwa ein Uni-Modul. Farbe aus einer Palette, die
   sich von den bestehenden abhebt — freie Farbwahl führt erfahrungs-
   gemäß zu zwei kaum unterscheidbaren Tönen. */
/* Palette für eigene Bausteine: nach Farbfamilien sortiert, damit man
   gezielt „noch ein Blau" findet statt zwischen Zufallstönen zu suchen.
   Jede Zeile ist eine Familie von hell nach kräftig. Alle Töne sind auf
   Lesbarkeit der dunklen Blockschrift geprüft. */
const FARB_FAMILIEN=[
  ["Blau",   ["#9dd5f2","#6ab7e8","#3091c1","#3683db","#5f7fe0","#9db4f2"]],
  ["Grün",   ["#a8e0b4","#7ad194","#5ec47a","#3fae63","#4d9e6e","#7fc9a8"]],
  ["Türkis", ["#9df0e6","#4fe3d2","#35bfb2","#3fc9a4","#6fd9c0","#2aa697"]],
  ["Gelb",   ["#f0d58a","#e8c35c","#d9a441","#c9892e","#b2906e","#e0b878"]],
  ["Orange", ["#f5c0a8","#eda893","#ed7134","#e8825e","#d4612c","#c47a4a"]],
  ["Rot",    ["#f09aa2","#e35d6a","#cf4453","#e07a85","#b83d4a","#f0b5bb"]],
  ["Violett",["#c9b0f5","#9d8cf0","#8b7cf0","#a86fe0","#7c5fd0","#bb70e0"]],
  ["Rosa",   ["#f0b8d8","#d488b8","#c96fa8","#e09ec9","#b05890","#f0a0c8"]],
  ["Grau",   ["#b8c2cc","#9aa6b2","#7d8899","#5f6b7a","#a8b4c0","#6e7a88"]],
];
const EIGEN_FARBEN=FARB_FAMILIEN.flatMap(([,l])=>l);

/* Was ist in dieser Woche ausgesetzt — und wie hole ich es zurück?
   Ohne diesen Weg wäre „nur diese Woche aussetzen" eine Einbahnstraße,
   seit das Ausgesetzte nicht mehr blass im Raster steht. */
function ausgesetztModal(mk){
  const ids=((S.tplanAus||{})[mk]||[]);
  const liste=ids.map(id=>{
    for(let i=0;i<7;i++){
      const b=(tplanTag(i)||[]).find(x=>x.id===id);
      if(b) return {b,tag:i};
    }
    return null;
  }).filter(Boolean);
  if(!liste.length){ toast("Nichts ausgesetzt"); return; }
  modal(`<h3>Diese Woche ausgesetzt</h3>
    <p style="color:var(--text-dim);font-size:var(--t-sm);line-height:1.5;margin-bottom:12px">
      Angeheftetes, das in der Woche ab ${fmtShort(parsedk(mk))} nicht stattfindet.
      Es steht weiter in jeder anderen Woche.</p>
    <div class="aus-liste">${liste.map(({b,tag})=>{
      const t=blockById(b.type);
      return `<button class="aus-zeile" data-zurueck="${b.id}">
        <i style="background:${t.bg}"></i>
        <span>${esc(b.note||t.label)}<small>${TWDL[tag]} · ${b.start}–${b.end}</small></span>
        <b>zurückholen</b></button>`;}).join("")}</div>
    <div class="mo-act">
      <button class="b" onclick="closeModal()">Schließen</button>
      ${liste.length>1?`<button class="b b-1" id="ausAlle">Alle zurückholen</button>`:""}</div>`);
  document.querySelectorAll("[data-zurueck]").forEach(b=>b.onclick=()=>{
    ausSchalten(mk,b.dataset.zurueck,false);
    closeModal(); toast("Wieder in dieser Woche"); R.planer();
  });
  document.getElementById("ausAlle")?.addEventListener("click",()=>{
    delete S.tplanAus[mk]; save(); closeModal();
    toast("Alles zurückgeholt"); R.planer();
  });
}

function neueArt(kat){
  const belegt=new Set(blockTypes().map(t=>t.bg));
  /* Vorschlag: erster freier Ton der Familie, die zur Kategorie passt —
     Uni-Module bekommen also von sich aus ein Blau. */
  const heim={uni:"Blau",sport:"Grün",alltag:"Gelb"}[kat]||"Blau";
  const heimfam=FARB_FAMILIEN.find(([n])=>n===heim)[1];
  let farbe=heimfam.find(c=>!belegt.has(c))||EIGEN_FARBEN.find(c=>!belegt.has(c))||EIGEN_FARBEN[0];
  modal(`<h3>Eigener Baustein</h3>
    <p style="color:var(--text-dim);font-size:var(--t-sm);margin-bottom:12px">
      Kommt unter „${esc(KATEGORIEN.find(k=>k[0]===kat)?.[1]||kat)}".</p>
    <label>Name</label><input id="naName" placeholder="z. B. Technische Mechanik" autofocus>
    <label>Farbe</label>
    <div id="naFarben">${FARB_FAMILIEN.map(([name,liste])=>
      `<div class="na-fam"><span class="na-fam-n">${name}</span>
        <div class="na-reihe">${liste.map(c=>
          `<button class="na-farbe${c===farbe?" on":""}${belegt.has(c)?" belegt":""}" data-naf="${c}"
            style="background:${c}" title="${c}${belegt.has(c)?" — schon vergeben":""}"></button>`).join("")}</div>
      </div>`).join("")}</div>
    <div class="mo-act">
      <button class="b" onclick="closeModal()">Abbrechen</button>
      <button class="b b-1" id="naOk">Anlegen</button></div>`);
  const M=document.getElementById("naFarben");
  M.querySelectorAll("[data-naf]").forEach(b=>b.onclick=()=>{
    farbe=b.dataset.naf;
    M.querySelectorAll("[data-naf]").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); });
  document.getElementById("naOk").onclick=()=>{
    const name=document.getElementById("naName").value.trim();
    if(!name){ toast("Name fehlt","x"); return; }
    S.planerTypes=S.planerTypes||[];
    S.planerTypes.push({id:"c_"+uid(),label:name,bg:farbe,kat});
    save(); closeModal(); toast(`„${name}" angelegt`); katOffen=kat; R.planer();
  };
}

function openTBlock(mk,i,type,start,end,note,id,fix,raum){
  modal(`<h3>${id?"Block bearbeiten":"Einplanen"}</h3>
    <label>Art</label>
    <select id="tbType">${KATEGORIEN.map(([kid,kl])=>{
      const l=blockTypes().filter(t=>katVon(t)===kid);
      return l.length?`<optgroup label="${kl}">${l.map(t=>
        `<option value="${t.id}"${t.id===type?" selected":""}>${esc(t.label)}</option>`).join("")}</optgroup>`:"";
    }).join("")}</select>
    <label>Wochentag</label>
    <select id="tbTag">${TWDL.map((l,x)=>`<option value="${x}"${x===i?" selected":""}>${l}</option>`).join("")}</select>
    <div style="display:flex;gap:10px">
      <div style="flex:1"><label>Von</label><input type="time" id="tbS" value="${start}"></div>
      <div style="flex:1"><label>Bis</label><input type="time" id="tbE" value="${end}"></div></div>
    <label>Notiz</label><input id="tbN" value="${esc(note||"")}" placeholder="z. B. TM3 Vorlesung, mit Andreas …">
    <label>Raum</label><input id="tbR" value="${esc(raum||"")}" placeholder="z. B. S1|01 A1" autocomplete="off">
    <label class="tb-fix"><input type="checkbox" id="tbFix" ${fix?"checked":""}>
      <span>📌 Anheften<i>Steht dann in jeder Woche. Ohne Haken gilt es nur für die Woche ab ${fmtShort(parsedk(mk))}.</i></span></label>
    <div class="mo-act">
      ${id?`<button class="b" id="tbDel" style="margin-right:auto;color:var(--bad)">${ico("trash")}Löschen</button>`:""}
      <button class="b" onclick="closeModal()">Abbrechen</button>
      <button class="b b-1" id="tbSave">Speichern</button></div>`);

  document.getElementById("tbSave").onclick=()=>{
    const t=document.getElementById("tbType").value;
    const tag=+document.getElementById("tbTag").value;
    const st=document.getElementById("tbS").value||start;
    const en=document.getElementById("tbE").value||end;
    const n=document.getElementById("tbN").value.trim();
    const raumNeu=document.getElementById("tbR").value.trim();
    const anheften=document.getElementById("tbFix").checked;
    const kennung=id||uid();
    if(id) blockRaus(mk,id);              /* erst überall weg, dann neu ablegen */
    const block={id:kennung,type:t,start:st,end:en,note:n,...(raumNeu?{raum:raumNeu}:{})};
    if(anheften){ S.tplan=S.tplan||{}; (S.tplan[tag]=S.tplan[tag]||[]).push(block); }
    else {
      S.tplanWoche=S.tplanWoche||{};
      const W=S.tplanWoche[mk]=S.tplanWoche[mk]||{};
      (W[tag]=W[tag]||[]).push(block);
    }
    save(); closeModal();
    toast(id?(anheften?"Gespeichert und angeheftet":"Gespeichert"):(anheften?"Angeheftet — steht jede Woche":"Eingeplant"));
    R.planer();
  };
  const del=document.getElementById("tbDel");
  if(del) del.onclick=()=>{
    if(!fix){ blockRaus(mk,id); save(); closeModal(); toast("Gelöscht"); R.planer(); return; }
    /* Angeheftetes: fast immer will man es nur für diese eine Woche
       loswerden, nicht für alle. Deshalb zuerst gefragt statt geraten. */
    modal(`<h3>Angeheftetes entfernen</h3>
      <p style="color:var(--text-dim);font-size:var(--t-sm);line-height:1.5;margin-bottom:14px">
        Dieser Eintrag steht in jeder Woche. Was soll passieren?</p>
      <div class="mo-act" style="flex-wrap:wrap">
        <button class="b" onclick="closeModal()">Abbrechen</button>
        <button class="b b-1" id="tbAus">Nur diese Woche aussetzen</button>
        <button class="b" id="tbWeg" style="color:var(--bad)">Überall entfernen</button></div>`);
    document.getElementById("tbAus").onclick=()=>{
      ausSchalten(mk,id,true); closeModal(); toast("Diese Woche ausgesetzt"); R.planer(); };
    document.getElementById("tbWeg").onclick=()=>{
      blockRaus(mk,id); save(); closeModal(); toast("Überall entfernt"); R.planer(); };
  };
}

R.planer=function(){
  const RANG={high:0,mid:1,low:2};
  const todos=todoOffen().sort((a,b)=>
    (imFokus(b.id)-imFokus(a.id))
    ||(RANG[a.priority]??1)-(RANG[b.priority]??1)
    ||todoStart(a)-todoStart(b));
  const dopp=todoDoppelte(), altlast=todoAltlast(), fokus=fokusIds();

  const [H0,H1]=tplanStunden();
  const mk1=tpWoche, mk2=dk(addD(parsedk(tpWoche),7));
  const jetzt=wochenSchluessel(new Date());
  const monatlich=tpModus==="monat";

  document.getElementById("v-planer").innerHTML=`
  <div class="p-head" style="margin-bottom:12px">
    <div style="flex:1 1 240px;min-width:0"><div style="font-family:var(--f-disp);font-size:var(--t-xl);font-weight:600">Planer</div>
    <div class="p-note">${monatlich?`Längere Termine anstreichen: ersten und letzten Tag antippen.`
      :`Baustein wählen, dann eine Stunde antippen.
      Angeheftetes (📌) steht in jeder Woche.`}</div></div>
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <div class="seg" role="tablist" aria-label="Ansicht">${[["woche","Woche"],["monat","Monat"]].map(([m,l])=>
        `<button role="tab" aria-selected="${tpModus===m}" class="${tpModus===m?"on":""}" data-tpm="${m}">${l}</button>`).join("")}</div>
      <button class="b b-i" id="tpwPrev" aria-label="${monatlich?"Monat":"Woche"} zurück">${ico("left")}</button>
      <button class="b b-sm" id="tpGanz" title="Etwas für den ganzen Tag planen">${ico("plus")}Ganztägig</button>
      ${(monatlich?tpMonat===monatsSchluessel(new Date()):mk1===jetzt)?"":`<button class="b b-sm" id="tpwNow">Heute</button>`}
      <button class="b b-i" id="tpwNext" aria-label="${monatlich?"Monat":"Woche"} vor">${ico("right")}</button></div>
  </div>

  ${monatlich?`<div class="p mn-p" style="padding:0;overflow:hidden">${monatRaster(tpMonat)}</div>`:`<div class="pl-leiste">
    <div class="chips pl-filter">
      <button class="chip${planFilter?"":" on"}" data-pf="">Alles</button>
      ${KATEGORIEN.map(([id,l])=>`<button class="chip${planFilter===id?" on":""}" data-pf="${id}">${l}</button>`).join("")}
    </div>
    <div class="chips pl-kat">
      ${KATEGORIEN.map(([id,l])=>`<button class="chip${katOffen===id?" on":""}" data-pk="${id}">${l}<i>${katOffen===id?"▾":"▸"}</i></button>`).join("")}
    </div>
    ${katOffen?`<div class="chips pl-arten">
      ${blockTypes().filter(t=>katVon(t)===katOffen).map(t=>
        `<button class="chip${plDragType===t.id?" on":""}" data-bt="${t.id}" draggable="true"
          style="border-color:${t.bg}66;background:${t.bg}${plDragType===t.id?"33":"1f"};color:${t.bg}">${esc(t.label)}</button>`).join("")}
      <button class="chip chip-neu" data-neuart="${katOffen}">+ eigener</button>
    </div>`:""}
  </div>

  <div class="tp-doppel">
    <div class="p" style="padding:0;overflow:hidden">${wochenTitel(mk1)}${wochenRaster(mk1,H0,H1)}</div>
    <div class="p" style="padding:0;overflow:hidden">${wochenTitel(mk2)}${wochenRaster(mk2,H0,H1)}</div>
  </div>`}

  <div class="p td-quer" style="padding:0;overflow:hidden">
      <div style="padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px">
        <span style="font-weight:700;font-size:var(--t-base)">Offene Aufgaben</span>
        <span class="tag">${todos.length}</span></div>
      <div style="padding:11px">
        <div style="display:flex;gap:6px;margin-bottom:10px">
          <input id="tdIn" placeholder="Neue Aufgabe" style="font-size:var(--t-sm);padding:8px 10px">
          <button class="b b-1 b-i" id="tdAdd" style="width:34px;height:34px">${ico("plus")}</button></div>
        <div class="chips" style="margin-bottom:9px">
          ${[["high","Wichtig","var(--bad)"],["mid","Normal","var(--warn)"],["low","Später","var(--good)"]]
            .map(([p,l,c])=>`<button class="chip${todoPrio===p?" on":""}" data-tp="${p}"
              style="${todoPrio===p?`border-color:${c};color:${c};background:color-mix(in srgb, ${c} 14%, transparent)`:""}">
              <i style="width:8px;height:8px;border-radius:50%;background:${c};display:inline-block;margin-right:6px"></i>${l}</button>`).join("")}
        </div>
        ${dopp.length?`<div class="td-hinweis">
          <span>${dopp.reduce((a,g)=>a+g.length-1,0)} doppelt eingetragen</span>
          <button class="b b-sm" id="tdMerge">Zusammenlegen</button></div>`:""}
        ${altlast.length?`<div class="td-hinweis alt">
          <span>${altlast.length} ${altlast.length===1?"Aufgabe liegt":"Aufgaben liegen"} über ${TODO_ALT} Tage</span>
          <button class="b b-sm" id="tdAufraeum">Durchgehen</button></div>`:""}
        ${todos.length?`<div class="td-liste">
          ${todos.map((t,i)=>{
            const pc=t.priority==="high"?"var(--bad)":t.priority==="low"?"var(--good)":"var(--warn)";
            const gewaehlt = plDragTodo===t.id;
            const auf = imFokus(t.id);
            const alter = todoAlter(t);
            const trenner = !auf && i>0 && imFokus(todos[i-1].id);
            return `${trenner?`<div class="td-trenn">übrige Liste</div>`:""}
            <div draggable="true" data-todo="${t.id}" class="td-row${gewaehlt?" gewaehlt":""}${auf?" fokus":""}"
              style="border-left-color:${pc}">
              <button data-tdone="${t.id}" style="width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line-2);flex:0 0 auto;margin-top:1px"></button>
              <span style="flex:1;font-size:var(--t-sm);line-height:1.4;min-width:0;word-break:break-word">${esc(t.text)}
                <i class="td-alt${alter>=TODO_ALT?" warn":""}">${alter===0?"heute":alter+" T"}</i></span>
              <button data-tfok="${t.id}" title="${auf?"Von heute nehmen":"Für heute vormerken"}"
                class="td-stern${auf?" on":""}">${ico("flame").replace("<svg",'<svg width="13" height="13"')}</button>
              <button data-tcyc="${t.id}" title="Priorität wechseln" style="color:${pc};flex:0 0 auto;font-size:14px;line-height:1">●</button>
              <button data-tdel="${t.id}" style="color:var(--text-faint);flex:0 0 auto">${ico("x").replace("<svg",'<svg width="13" height="13"')}</button>
            </div>`;}).join("")}</div>`
          :`<div class="empty" style="padding:20px 8px">${ico("check")}<div>Nichts offen.</div></div>`}
        <div class="td-fuss">
          <span>${fokus.length}/${TODO_FOKUS} für heute${todoWocheFertig()?` · ${todoWocheFertig()} diese Woche erledigt`:""}</span>
          ${todoArchivZahl()?`<button class="b b-sm" id="tdArchiv">Archiv ${todoArchivZahl()}</button>`:""}
        </div>
      </div></div>
  </div>`;

  const V=document.getElementById("v-planer");
  const blaettern=n=>{
    if(monatlich){ const d=parsedk(tpMonat); tpMonat=dk(new Date(d.getFullYear(),d.getMonth()+n,1)); }
    else tpWoche=dk(addD(parsedk(tpWoche),7*n));
    R.planer();
  };
  V.querySelector("#tpwPrev").onclick=()=>blaettern(-1);
  V.querySelector("#tpwNext").onclick=()=>blaettern(1);
  V.querySelector("#tpwNow")?.addEventListener("click",()=>{ tpWoche=wochenSchluessel(new Date()); tpMonat=monatsSchluessel(new Date()); R.planer(); });
  V.querySelectorAll("[data-tpm]").forEach(b=>b.onclick=()=>{
    if(b.dataset.tpm===tpModus) return;
    tpModus=b.dataset.tpm; tpMark=null;
    try{ localStorage.setItem("nova_tp_modus",tpModus); }catch(e){}
    /* Der Umschalter bleibt in der Zeit, die gerade zu sehen ist */
    const wochenMonat=monatsSchluessel(addD(parsedk(tpWoche),3));
    if(tpModus==="monat") tpMonat=wochenMonat;
    else if(wochenMonat!==tpMonat) tpWoche=wochenSchluessel(tpMonat===monatsSchluessel(new Date())?new Date():parsedk(tpMonat));
    R.planer();
  });
  monatWiring(V);
  V.querySelector("#tpGanz").onclick=()=>ganzModal(null,today());
  V.querySelectorAll("[data-ganzneu]").forEach(z=>z.onclick=e=>{ if(e.target.closest("[data-ganz]")) return; ganzModal(null,z.dataset.ganzneu); });
  V.querySelectorAll("[data-ganz]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); ganzModal(b.dataset.ganz); });
  V.querySelectorAll("[data-pf]").forEach(b=>b.onclick=()=>{ planFilter=b.dataset.pf||null; R.planer(); });
  V.querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>{
    katOffen = katOffen===b.dataset.pk ? null : b.dataset.pk; R.planer(); });
  V.querySelectorAll("[data-neuart]").forEach(b=>b.onclick=()=>neueArt(b.dataset.neuart));
  V.querySelectorAll("[data-ausz]").forEach(b=>b.onclick=()=>ausgesetztModal(b.dataset.ausz));
  tplanWiring(V);
  V.querySelectorAll("[data-todo]").forEach(t=>{
    t.ondragstart=()=>{ plDragTodo=t.dataset.todo; plDragType=null; };
    t.onclick=e=>{
      if(e.target.closest("[data-tdone],[data-tdel],[data-tcyc],[data-tfok]")) return;
      if(monatlich) return;              /* Stunden gibt es nur in der Wochenansicht */
      const id=t.dataset.todo;
      plDragTodo = plDragTodo===id ? null : id;
      if(plDragTodo){ plDragType=null;
        const auf=(S.todos||[]).find(x=>x.id===plDragTodo);
        toast(`„${auf?auf.text.slice(0,22):""}“ gewählt — jetzt oben im Plan eine Stunde antippen`); }
      R.planer();
    };
  });
  V.querySelectorAll("[data-tdone]").forEach(b=>b.onclick=()=>{
    todoErledigt(b.dataset.tdone);
    const n=todoWocheFertig();
    toast(n>1?`Erledigt — ${n} diese Woche`:"Erledigt");
    R.planer(); });
  V.querySelectorAll("[data-tfok]").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); if(fokusToggle(b.dataset.tfok)) R.planer(); });
  V.querySelector("#tdMerge")?.addEventListener("click",()=>{
    const n=todoZusammenlegen();
    toast(n?`${n} ${n===1?"Doppelten":"Doppelte"} zusammengelegt`:"Nichts zusammenzulegen");
    R.planer(); });
  V.querySelector("#tdAufraeum")?.addEventListener("click",aufraeumModal);
  V.querySelector("#tdArchiv")?.addEventListener("click",archivModal);
  V.querySelectorAll("[data-tdel]").forEach(b=>b.onclick=()=>{
    S.todos=(S.todos||[]).filter(x=>x.id!==b.dataset.tdel); save(); R.planer(); });
