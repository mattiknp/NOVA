<script>
/* ============================================================
   9 — NEXUS
   Rotierende Sphäre: jeder Hauptknoten ein Lebensbereich,
   Trabanten sind die einzelnen Gewohnheiten. Tiefe entscheidet
   über Größe, Deckkraft und Unschärfe.
   ============================================================ */
/* Mehrere Nexus-Instanzen möglich: eine große Ansicht, eine kleine
   auf der Startseite. Jede hält ihren eigenen Zustand. */
function nexusData(){
  const k=today(), m=S.metrics[k]||{}, g=G();
  const {done,total,pct}=completion(k);
  const sm=sportMin(k);
  const openTodos=(S.todos||[]).filter(t=>!t.done).length;
  const plan=planDay(k).length;
  /* Wie viele Tage liegt der letzte Eintrag in diesem Bereich zurück?
     Vernachlässigtes soll auffallen, nicht still bleiben. */
  const stale=(fn)=>{ for(let i=0;i<30;i++){ if(fn(dk(addD(new Date(),-i)))) return i; } return 30; };
  const N=[
    {key:"Gewohnheiten",sub:total?`${done}/${total}`:"–",v:total?pct/100:0,color:"#4fe3d2",
     lat:.30,lon:0.0, stale:stale(d=>Object.keys(S.habitLog[d]||{}).length>0)},
    {key:"Schlaf",sub:nv(m.sleepHours)?f(m.sleepHours)+" h":"–",v:nv(m.sleepHours)?clamp(m.sleepHours/g.sleep,0,1):0,color:"#5a9ded",
     lat:-.36,lon:0.9, stale:stale(d=>nv((S.metrics[d]||{}).sleepHours))},
    {key:"Lernen",sub:nv(m.study)?f(m.study)+" h":"–",v:nv(m.study)?clamp(m.study/g.study,0,1):0,color:"#9d7bff",
     lat:.54,lon:1.9, stale:stale(d=>nv((S.metrics[d]||{}).study)&&(S.metrics[d]||{}).study>0)},
    {key:"Handy",sub:nv(m.phone)?f(m.phone)+" h":"–",v:nv(m.phone)?phoneAnteil(m.phone):0,color:"#ff7a5c",
     lat:-.18,lon:2.8, stale:stale(d=>nv((S.metrics[d]||{}).phone))},
    {key:"Training",sub:sm?sm+" min":"–",v:clamp(sm/60,0,1),color:"#34d99a",
     lat:.12,lon:3.8, stale:stale(d=>sportMin(d)>0)},
    {key:"Planer",sub:plan?plan+" Blöcke":"–",v:clamp(plan/5,0,1),color:"#7c5cff",
     lat:-.48,lon:4.7, stale:stale(d=>planDay(d).length>0)},
    {key:"Aufgaben",sub:openTodos?openTodos+" offen":"frei",v:openTodos?clamp(1-openTodos/8,0,1):1,color:"#ff6b9d",
     lat:.46,lon:5.5, stale:0},
  ];
  const log=S.habitLog[k]||{};
  const hs=activeHabits().slice(0,14);
  const sats=hs.map((h,i)=>{
    const a=i/Math.max(1,hs.length)*6.2832;
    return {label:h.name.replace(/[^\p{L}\p{N} ]/gu,"").trim().slice(0,13),
      color:h.color,on:!!log[h.id],parent:0,
      lat:N[0].lat+Math.sin(a)*.42, lon:N[0].lon+Math.cos(a)*.62};
  });
  return {nodes:N,sats,score:score3()??0};
}

/* Raumfähre von oben, Nase nach rechts. Alle Maße relativ zur Länge L,
   damit sie in jeder Größe stimmig bleibt. Gezeichnet wird von hinten
   nach vorn: erst Flügel, dann Rumpf, dann Aufbauten. */
function zeichneShuttle(ctx,L){
  const B=L*0.30;          /* halbe Spannweite am Heck */

  /* Deltaflügel */
  ctx.beginPath();
  ctx.moveTo( L*0.18,        0);
  ctx.lineTo(-L*0.30,  B*1.00);
  ctx.lineTo(-L*0.46,  B*1.02);
  ctx.lineTo(-L*0.46, -B*1.02);
  ctx.lineTo(-L*0.30, -B*1.00);
  ctx.closePath();
  ctx.fillStyle="#dfe8ee"; ctx.fill();
  /* Schwarze Flügelvorderkanten, der Hitzeschutz */
  ctx.beginPath();
  ctx.moveTo( L*0.18, 0);
  ctx.lineTo(-L*0.30,  B*1.00);
  ctx.lineTo(-L*0.30,  B*0.86);
  ctx.lineTo( L*0.13, 0);
  ctx.lineTo(-L*0.30, -B*0.86);
  ctx.lineTo(-L*0.30, -B*1.00);
  ctx.closePath();
  ctx.fillStyle="#1d2632"; ctx.fill();

  /* Dunkle Flügelhinterkante */
  ctx.fillStyle="#39434f";
  ctx.fillRect(-L*0.46, -B*1.02, L*0.035, B*2.04);

  /* Rumpf */
  ctx.beginPath();
  ctx.moveTo( L*0.50,        0);
  ctx.quadraticCurveTo(L*0.42, -B*0.30, L*0.24, -B*0.34);
  ctx.lineTo(-L*0.44, -B*0.36);
  ctx.lineTo(-L*0.48, -B*0.26);
  ctx.lineTo(-L*0.48,  B*0.26);
  ctx.lineTo(-L*0.44,  B*0.36);
  ctx.lineTo( L*0.24,  B*0.34);
  ctx.quadraticCurveTo(L*0.42,  B*0.30, L*0.50, 0);
  ctx.closePath();
  ctx.fillStyle="#f2f6f8"; ctx.fill();

  /* Bugpartie geschwärzt */
  ctx.beginPath();
  ctx.moveTo( L*0.50, 0);
  ctx.quadraticCurveTo(L*0.42, -B*0.30, L*0.30, -B*0.33);
  ctx.lineTo( L*0.30,  B*0.33);
  ctx.quadraticCurveTo(L*0.42,  B*0.30, L*0.50, 0);
  ctx.closePath();
  ctx.fillStyle="#232d3a"; ctx.fill();

  /* Windschutz: durchgehendes Band, in der Aufsicht ein Trapez */
  ctx.beginPath();
  ctx.moveTo(L*0.28, -B*0.22);
  ctx.lineTo(L*0.33, -B*0.13);
  ctx.lineTo(L*0.33,  B*0.13);
  ctx.lineTo(L*0.28,  B*0.22);
  ctx.closePath();
  ctx.fillStyle="#8fdcee"; ctx.fill();
  /* Streben zwischen den Scheiben */
  ctx.strokeStyle="#232d3a"; ctx.lineWidth=Math.max(.4,L*0.008);
  [-1,1].forEach(i=>{
    ctx.beginPath();
    ctx.moveTo(L*0.283, i*B*0.075); ctx.lineTo(L*0.33, i*B*0.070);
    ctx.stroke();
  });

  /* Frachtraum, geöffnet */
  ctx.fillStyle="#0f1620";
  ctx.beginPath();
  ctx.moveTo(-L*0.40, -B*0.22); ctx.lineTo( L*0.16, -B*0.20);
  ctx.lineTo( L*0.16,  B*0.20); ctx.lineTo(-L*0.40,  B*0.22);
  ctx.closePath(); ctx.fill();
  /* Innenrippen */
  ctx.strokeStyle="rgba(150,190,210,.45)"; ctx.lineWidth=Math.max(.4,L*0.008);
  for(let i=0;i<5;i++){
    const x=-L*0.36 + i*(L*0.50/5);
    ctx.beginPath(); ctx.moveTo(x,-B*0.20); ctx.lineTo(x,B*0.20); ctx.stroke();
  }
  /* Torflügel als helle Kanten */
  ctx.strokeStyle="#ffffff"; ctx.lineWidth=Math.max(.5,L*0.012);
  ctx.beginPath(); ctx.moveTo(-L*0.40,-B*0.22); ctx.lineTo(L*0.16,-B*0.20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-L*0.40, B*0.22); ctx.lineTo(L*0.16, B*0.20); ctx.stroke();

  /* Seitenleitwerk. In der Aufsicht steht es hochkant, deshalb schmal —
     mit dunkler Kante, sonst geht es im hellen Rumpf unter. */
  ctx.beginPath();
  ctx.moveTo(-L*0.38, 0);
  ctx.lineTo(-L*0.46, -B*0.11);
  ctx.lineTo(-L*0.56, -B*0.09);
  ctx.lineTo(-L*0.56,  B*0.09);
  ctx.lineTo(-L*0.46,  B*0.11);
  ctx.closePath();
  ctx.fillStyle="#aebdc9"; ctx.fill();
  ctx.strokeStyle="#39434f"; ctx.lineWidth=Math.max(.5,L*0.010); ctx.stroke();
  /* Ruder an der Hinterkante */
  ctx.fillStyle="#39434f";
  ctx.fillRect(-L*0.56,-B*0.09,L*0.035,B*0.18);

  /* Steuerklappen am Heck */
  ctx.fillStyle="#1d2632";
  ctx.fillRect(-L*0.50, -B*0.98, L*0.05, B*0.34);
  ctx.fillRect(-L*0.50,  B*0.64, L*0.05, B*0.34);

  /* Haupttriebwerke: drei Düsen */
  const duese=(y,r)=>{
    ctx.beginPath(); ctx.ellipse(-L*0.50,y,r*0.9,r,0,0,6.2832);
    ctx.fillStyle="#39434f"; ctx.fill();
    ctx.beginPath(); ctx.ellipse(-L*0.50,y,r*0.5,r*0.58,0,0,6.2832);
    ctx.fillStyle="#11161d"; ctx.fill();
  };
  duese(-B*0.17, B*0.13); duese(B*0.17, B*0.13); duese(0, B*0.15);

  /* Manövriertriebwerke seitlich */
  ctx.fillStyle="#e6edf1";
  ctx.beginPath(); ctx.ellipse(-L*0.42,-B*0.30,L*0.06,B*0.10,-0.2,0,6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-L*0.42, B*0.30,L*0.06,B*0.10, 0.2,0,6.2832); ctx.fill();

  /* Abgasfahne */
  const g=ctx.createLinearGradient(-L*0.50,0,-L*0.95,0);
  g.addColorStop(0,"rgba(160,225,255,.75)");
  g.addColorStop(1,"rgba(120,200,255,0)");
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(-L*0.50,-B*0.26); ctx.lineTo(-L*0.95,0); ctx.lineTo(-L*0.50,B*0.26);
  ctx.closePath(); ctx.fill();

  /* Rumpfnaht */
  ctx.strokeStyle="rgba(60,80,100,.35)"; ctx.lineWidth=Math.max(.35,L*0.006);
  ctx.beginPath(); ctx.moveTo(L*0.17,0); ctx.lineTo(L*0.27,0); ctx.stroke();
}

function makeNexus(cv,opt={}){
  const X={cv,ctx:cv.getContext("2d"),w:0,h:0,dpr:1,eng:false,
    yaw:.6,pitch:-.36,vy:0,vp:0,drag:false,lx:0,ly:0,
    stars:[],dust:[],hover:-1,mx:-1,my:-1,run:false,t0:performance.now(),
    mini:!!opt.mini, ratio:opt.ratio||.62, maxH:opt.maxH||660,
    onHover:opt.onHover||null, P:[] };
  const D=nexusData();
  X.nodes=D.nodes; X.sats=D.sats; X.score=D.score;

  function size(){
    const wrap=cv.parentElement; if(!wrap) return;
    const r=wrap.getBoundingClientRect();
    const dpr=Math.min(2,devicePixelRatio||1);
    const w=Math.max(200,r.width);
    const h=Math.max(X.mini?230:340,Math.min(X.maxH,w*X.ratio));
    if(w===X.w&&h===X.h&&dpr===X.dpr) return;
    X.w=w; X.h=h; X.dpr=dpr;
    /* Auf schmalen Schirmen ist kein Platz für Trabantennamen und
       Kerntext — sie überlagern sonst die Zahl. */
    X.eng = w<430;
    cv.width=w*dpr; cv.height=h*dpr;
    cv.style.width=w+"px"; cv.style.height=h+"px";
    const sn=X.mini?90:110;
    X.stars=[...Array(sn)].map(()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.1+.25,a:Math.random()*.5+.15,p:Math.random()*6.28}));
    X.dust=[...Array(X.mini?34:44)].map(()=>({a:Math.random()*6.28,rad:.6+Math.random()*.75,sp:.0002+Math.random()*.0005,lat:(Math.random()-.5)*1.6}));
  }

  function proj(lat,lon,cx,cy,R){
    const cl=Math.cos(lat);
    const x0=cl*Math.cos(lon+X.yaw), y0=Math.sin(lat), z0=cl*Math.sin(lon+X.yaw);
    const cp=Math.cos(X.pitch), sp=Math.sin(X.pitch);
    const y=y0*cp-z0*sp, z=y0*sp+z0*cp;
    const s=1/(1-z*.36);
    return {x:cx+x0*R*s, y:cy+y*R*s*.92, z, s};
  }

  function draw(now){
    if(!X.run) return;
    const wrap=cv.parentElement;
    if(!wrap||!wrap.offsetParent){ X.run=false; return; }
    size();
    const ctx=X.ctx,w=X.w,h=X.h,cx=w/2,cy=h/2;
    const R=Math.min(w*(X.mini?.30:.30),h*(X.mini?.34:.40));
    ctx.setTransform(X.dpr,0,0,X.dpr,0,0);
    ctx.clearRect(0,0,w,h);
    const tm=(now-X.t0)*.001;

    if(!X.drag){
      X.yaw+=X.vy; X.pitch+=X.vp; X.vy*=.94; X.vp*=.9;
      if(Math.abs(X.vy)<.0011) X.yaw+=X.mini?.0009:.0013;
      X.pitch=clamp(X.pitch,-1.05,.5);
    }

    X.stars.forEach(s=>{
      ctx.globalAlpha=s.a*(.55+.45*Math.sin(tm*1.2+s.p));
      ctx.fillStyle="#bfe8ea";
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.2832); ctx.fill();
    });
    ctx.globalAlpha=1;

    {
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(tm*.06);
      const N=72, RR=R*(X.mini?1.58:1.42);
      for(let i=0;i<N;i++){
        const a=i/N*6.2832, long=i%6===0;
        const r2=RR+(long?(X.mini?7:9):(X.mini?3.5:4.5));
        ctx.strokeStyle=`rgba(79,227,210,${long?.26:.11})`;
        ctx.lineWidth=long?1.2:.75;
        ctx.beginPath(); ctx.moveTo(Math.cos(a)*RR,Math.sin(a)*RR);
        ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2); ctx.stroke();
      }
      ctx.restore();
    }

    const lats=X.mini?[-.95,-.62,-.31,0,.31,.62,.95]:[-.95,-.62,-.31,0,.31,.62,.95];
    const lons=[0,.524,1.047,1.571,2.094,2.618];
    const grid=[];
    lats.forEach(la=>{ const rg=[]; for(let i=0;i<=40;i++) rg.push(proj(la,i*.1571,cx,cy,R)); grid.push(rg); });
    lons.forEach(lo=>{ const rg=[]; for(let i=0;i<=40;i++) rg.push(proj(-1.5708+i*.0785,lo,cx,cy,R)); grid.push(rg); });
    grid.forEach(rg=>{ for(let i=0;i<rg.length-1;i++){
      const a=rg[i],b=rg[i+1],z=(a.z+b.z)/2;
      ctx.strokeStyle=`rgba(110,190,200,${(.03+.115*(z+1)/2).toFixed(3)})`;
      ctx.lineWidth=.85; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }});

    X.dust.forEach(d=>{ d.a+=d.sp*16;
      const p=proj(d.lat,d.a,cx,cy,R*d.rad*1.25);
      ctx.globalAlpha=.16+.34*(p.z+1)/2; ctx.fillStyle="#8fe3e0";
      ctx.beginPath(); ctx.arc(p.x,p.y,1.1*p.s,0,6.2832); ctx.fill(); });
    ctx.globalAlpha=1;

    /* In der kleinen Fassung kreisen die Knoten weiter außen, sonst
       schiebt sich einer vor die Zahl im Kern. */
    const NR=R*(X.eng?1.62:X.mini?1.42:1);
    const P=X.nodes.map(n=>proj(n.lat,n.lon,cx,cy,NR)); X.P=P;
    const PS=X.sats.map(s=>proj(s.lat,s.lon,cx,cy,R*1.02));

    X.nodes.forEach((n,i)=>{
      const p=P[i], al=.14+.4*(p.z+1)/2;
      const mx=(cx+p.x)/2+(p.x-cx)*.18, my=(cy+p.y)/2+(p.y-cy)*.18;
      ctx.strokeStyle=n.color; ctx.globalAlpha=al*(.4+.6*n.v); ctx.lineWidth=.9+1.5*n.v;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.quadraticCurveTo(mx,my,p.x,p.y); ctx.stroke();
      const flows=X.mini?1:1+Math.round(n.v*2);
      for(let q=0;q<flows;q++){
        const t2=(tm*.16+i*.31+q/flows)%1, u=1-t2;
        const bx=u*u*cx+2*u*t2*mx+t2*t2*p.x, by=u*u*cy+2*u*t2*my+t2*t2*p.y;
        ctx.globalAlpha=al*1.7; ctx.fillStyle=n.color;
        ctx.beginPath(); ctx.arc(bx,by,1.4+1.1*n.v,0,6.2832); ctx.fill();
      }
      ctx.globalAlpha=1;
    });

    {
      PS.map((p,i)=>({p,i})).sort((a,b)=>a.p.z-b.p.z).forEach(({p,i})=>{
        const s=X.sats[i], pp=P[s.parent], al=.2+.65*(p.z+1)/2;
        ctx.strokeStyle=s.color; ctx.globalAlpha=al*.28; ctx.lineWidth=.7;
        ctx.beginPath(); ctx.moveTo(pp.x,pp.y); ctx.lineTo(p.x,p.y); ctx.stroke();
        ctx.globalAlpha=al;
        if(s.on){ ctx.shadowColor=s.color; ctx.shadowBlur=9; }
        ctx.fillStyle=s.on?s.color:"rgba(140,160,180,.5)";
        ctx.beginPath(); ctx.arc(p.x,p.y,(s.on?(X.mini?2.4:3.1):(X.mini?1.7:2.1))*p.s,0,6.2832); ctx.fill();
        ctx.shadowBlur=0;
        if(!X.eng&&p.z>(X.mini?.55:.25)&&s.label){
          ctx.globalAlpha=al*.75; ctx.fillStyle="#8ea3b5";
          ctx.font=`${X.mini?7.5:9}px ui-monospace, monospace`; ctx.textAlign="center";
          ctx.fillText(s.label,p.x,p.y+11*p.s);
        }
        ctx.globalAlpha=1;
      });
    }

    P.map((p,i)=>({p,i})).sort((a,b)=>a.p.z-b.p.z).forEach(({p,i})=>{
      const n=X.nodes[i], al=.38+.62*(p.z+1)/2;
      const base=X.mini?6.5:9, add=X.mini?4.5:7;
      const r=(base+add*n.v)*p.s, hov=i===X.hover;
      /* Vernachlässigte Bereiche atmen sichtbar */
      const neglect=n.stale>=3?(.5+.5*Math.sin(tm*2.2+i)):1;
      ctx.globalAlpha=al;
      const gr=ctx.createRadialGradient(p.x,p.y,r*.4,p.x,p.y,r*2.6);
      gr.addColorStop(0,n.color+(n.stale>=3?"22":"44")); gr.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(p.x,p.y,r*2.6,0,6.2832); ctx.fill();
      ctx.shadowColor=n.color; ctx.shadowBlur=hov?22:(X.mini?7:11)*neglect;
      ctx.beginPath();
      for(let q=0;q<6;q++){ const a=(60*q-30)*Math.PI/180;
        const px=p.x+r*Math.cos(a), py=p.y+r*Math.sin(a); q?ctx.lineTo(px,py):ctx.moveTo(px,py); }
      ctx.closePath();
      ctx.fillStyle="rgba(7,10,16,.9)"; ctx.fill();
      ctx.strokeStyle=n.color; ctx.globalAlpha=al*(n.stale>=3?neglect:1);
      ctx.lineWidth=hov?2.4:1.6; ctx.stroke();
      ctx.shadowBlur=0; ctx.globalAlpha=al;
      if(n.v>0){
        ctx.beginPath();
        const ri=r*.62*Math.max(.18,n.v);
        for(let q=0;q<6;q++){ const a=(60*q-30)*Math.PI/180;
          const px=p.x+ri*Math.cos(a), py=p.y+ri*Math.sin(a); q?ctx.lineTo(px,py):ctx.moveTo(px,py); }
        ctx.closePath(); ctx.fillStyle=n.color; ctx.globalAlpha=al*.9; ctx.fill();
      }
      ctx.globalAlpha=al;
      {
        const below=p.y>cy;
        const ly=below?p.y+r+(X.mini?11:14):p.y-r-(X.mini?13:18);
        ctx.textAlign="center";
        if(X.eng){
          /* Auf schmalen Schirmen bleibt die Kugel stumm — die Werte
             stehen darunter als Leiste, dort kollidiert nichts. */
        } else {
          ctx.fillStyle="#93a7b8"; ctx.font=`${X.mini?8.5:10}px system-ui, sans-serif`;
          ctx.fillText(n.key,p.x,ly);
          ctx.fillStyle="#eaf2f6"; ctx.font=`700 ${X.mini?10:12}px system-ui, sans-serif`;
          ctx.fillText(n.sub,p.x,ly+(X.mini?11:14));
        }
        if(!X.mini&&n.stale>=3){
          ctx.fillStyle="#c48a3a"; ctx.font='9px system-ui, sans-serif';
          ctx.fillText(n.stale>=30?"lange nichts":`${n.stale} Tage her`,p.x,ly+27);
        }
      }
      ctx.globalAlpha=1;
    });

    /* Raumfähre auf geneigter Bahn. Der Schweif wird nicht aus vergangenen
       Bildern gesammelt, sondern rückwärts aus der Bahn gerechnet — so ist er
       unabhängig von der Bildrate immer gleich lang und glatt. */
    {
      const bahn=tm*.26, N=30, SPANNE=.62;
      const bp=b2=>proj(Math.sin(b2*.65)*.55, b2, cx,cy, R*1.34);
      const p0=bp(bahn), p1=bp(bahn+.04);

      ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.lineCap="round";
      let vor=null;
      for(let j=N;j>=0;j--){
        const f=1-j/N;                       /* 0 am Ende, 1 an der Fähre */
        const p=bp(bahn - j/N*SPANNE);
        if(vor && p.z>-.55 && vor.z>-.55){
          const breit=(X.mini?2.6:4.0)*f*f*p.s;
          ctx.globalAlpha=.13*f*f;
          ctx.strokeStyle="#6cc0ff"; ctx.lineWidth=breit*3.2;
          ctx.beginPath(); ctx.moveTo(vor.x,vor.y); ctx.lineTo(p.x,p.y); ctx.stroke();
          ctx.globalAlpha=.40*f*f;
          ctx.strokeStyle="#c8ecff"; ctx.lineWidth=breit;
          ctx.beginPath(); ctx.moveTo(vor.x,vor.y); ctx.lineTo(p.x,p.y); ctx.stroke();
          if(f>.6){
            ctx.globalAlpha=.6*(f-.6)/.4;
            ctx.strokeStyle="#ffffff"; ctx.lineWidth=Math.max(.6,breit*.3);
            ctx.beginPath(); ctx.moveTo(vor.x,vor.y); ctx.lineTo(p.x,p.y); ctx.stroke();
          }
          /* Funken, die sich vom Schweif lösen */
          if(j%5===0){
            const s2=Math.sin(tm*2.4+j*1.7);
            ctx.globalAlpha=.26*f;
            ctx.fillStyle="#9fd8ea";
            ctx.beginPath();
            ctx.arc(p.x+s2*4*(1-f), p.y+Math.cos(tm*2.1+j)*4*(1-f), 1.2*f, 0, 6.2832);
            ctx.fill();
          }
        }
        vor=p;
      }
      ctx.restore(); ctx.globalAlpha=1;

      if(p0.z>-.5){
        const sicht=clamp((p0.z+.5)/1.5,.3,1);
        ctx.save();
        ctx.translate(p0.x,p0.y);
        ctx.rotate(Math.atan2(p1.y-p0.y, p1.x-p0.x));
        ctx.globalAlpha=sicht;
        ctx.shadowColor="rgba(190,235,250,.85)"; ctx.shadowBlur=11*sicht;
        zeichneShuttle(ctx,(X.mini?15:24)*p0.s);
        ctx.restore(); ctx.globalAlpha=1; ctx.shadowBlur=0;
      }
    }

    const coreR=Math.min(X.mini?24:46,R*(X.mini?.36:.42)), ratio=clamp(X.score/100,0,1);
    const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,coreR*1.8);
    cg.addColorStop(0,"rgba(79,227,210,.20)"); cg.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(cx,cy,coreR*1.8,0,6.2832); ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.07)"; ctx.lineWidth=X.mini?3.4:5;
    ctx.beginPath(); ctx.arc(cx,cy,coreR,0,6.2832); ctx.stroke();
    const col=X.score>=75?"#52c98a":X.score>=45?"#4fe3d2":"#d9a441";
    ctx.strokeStyle=col; ctx.shadowColor=col; ctx.shadowBlur=X.mini?10:17;
    ctx.lineCap="round"; ctx.lineWidth=X.mini?3.4:5;
    ctx.beginPath(); ctx.arc(cx,cy,coreR,-Math.PI/2,-Math.PI/2+ratio*6.2832); ctx.stroke();
    ctx.shadowBlur=0; ctx.lineCap="butt";
    ctx.strokeStyle="rgba(79,227,210,.22)"; ctx.lineWidth=1;
    [0,3.14].forEach(o=>{ ctx.beginPath(); ctx.arc(cx,cy,coreR+(X.mini?8:10),tm*.42+o,tm*.42+o+1.15); ctx.stroke(); });
    ctx.textAlign="center";
    ctx.fillStyle=col; ctx.font=`700 ${X.mini?26:30}px system-ui, sans-serif`;
    ctx.fillText(String(X.score),cx,cy+(X.mini?9:6));
    if(!X.eng){
      ctx.fillStyle="#7d92a4"; ctx.font=`${X.mini?7.5:9}px system-ui, sans-serif`;
      ctx.fillText("3-TAGE-SCHNITT",cx,cy+(X.mini?21:22));
    }

    let hv=-1;
    if(X.mx>=0){ let best=1e9;
      P.forEach((p,i)=>{ const d=Math.hypot(p.x-X.mx,p.y-X.my); if(d<(X.mini?18:26)&&d<best){best=d;hv=i;} }); }
    if(hv!==X.hover){ X.hover=hv; X.onHover&&X.onHover(hv>=0?X.nodes[hv]:null, hv>=0?P[hv]:null); }
    cv.style.cursor=X.drag?"grabbing":(X.hover>=0?"pointer":"grab");

    requestAnimationFrame(draw);
  }

  const pos=e=>{ const r=cv.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left,y:t.clientY-r.top}; };
  cv.addEventListener("mousedown",e=>{ X.drag=true; const p=pos(e); X.lx=p.x; X.ly=p.y; });
  cv.addEventListener("mousemove",e=>{ const p=pos(e); X.mx=p.x; X.my=p.y;
    if(X.drag){ const dx=p.x-X.lx, dy=p.y-X.ly;
      X.yaw+=dx*.0065; X.pitch=clamp(X.pitch+dy*.005,-1.05,.5);
      X.vy=dx*.0065; X.vp=dy*.005; X.lx=p.x; X.ly=p.y; e.preventDefault(); } });
  cv.addEventListener("mouseleave",()=>{ X.mx=-1; X.my=-1; });
  addEventListener("mouseup",()=>{ X.drag=false; });
  cv.addEventListener("touchstart",e=>{ X.drag=true; const p=pos(e); X.lx=p.x; X.ly=p.y; },{passive:true});
  cv.addEventListener("touchmove",e=>{ const p=pos(e);
    if(X.drag){ const dx=p.x-X.lx, dy=p.y-X.ly;
      X.yaw+=dx*.0065; X.pitch=clamp(X.pitch+dy*.005,-1.05,.5);
      X.vy=dx*.0065; X.vp=dy*.005; X.lx=p.x; X.ly=p.y; e.preventDefault(); } },{passive:false});
  cv.addEventListener("touchend",()=>{ X.drag=false; });

  X.start=()=>{ if(X.run) return; X.run=true; X.w=0; X.h=0; X.t0=performance.now(); requestAnimationFrame(draw); };
  X.refresh=()=>{ const D2=nexusData(); X.nodes=D2.nodes; X.sats=D2.sats; X.score=D2.score; };
  return X;
}

let NEXUS_BIG=null, NEXUS_MINI=null;


/* ============================================================
   11b — JOURNAL
   Stimmung und Tageslernen. Bewusst schmal gehalten: eine Zahl,
   ein Textfeld, und danach die Rückschau.
   ============================================================ */
const MOODS=[
  {v:1,l:"mies",   c:"#e0697c", i:"face1"},
  {v:2,l:"zäh",    c:"#d9a441", i:"face2"},
  {v:3,l:"okay",   c:"#8b96a8", i:"face2"},
  {v:4,l:"gut",    c:"#3fc9a4", i:"face3"},
  {v:5,l:"stark",  c:"#4fe3d2", i:"face3"},
];
const moodOf=k=>(S.mood||{})[k]||null;
function setMood(k,v){ if(!S.mood)S.mood={}; const e=S.mood[k]||(S.mood[k]={});
  e.v=(e.v===v?null:v); if(e.v===null) delete e.v;
  if(!e.v&&!e.note) delete S.mood[k]; save(); }
function setNote(k,t){ if(!S.mood)S.mood={}; const e=S.mood[k]||(S.mood[k]={});
  t=t.trim(); if(t) e.note=t; else delete e.note;
  if(!e.v&&!e.note) delete S.mood[k]; save(); }

/* Die Journal-Seite ist entfernt; Stimmungen und Notizen bleiben in
   den Daten erhalten und zählen weiter als „Eingetragen". */

/* ============================================================
   12 — RÜCKBLICK
   Ersetzt Woche, Monat, Jahr und Verlauf. Die vier Seiten zeigten
   größtenteils dasselbe (Schlaf auf allen vier, Training auf dreien,
   den Tageswert auf dreien) und wurden deshalb kaum geöffnet.
   Jetzt eine Seite in vier Teilen, vom Großen ins Kleine:
     1. das Jahr als Kachelraster — jedes Kästchen ein Tag
     2. ein Zeitraum (Woche, Monat, Jahr) als Zahlen mit Vergleich
     3. alle Serien an einem Ort
     4. Pausen, damit Ferien keine Lücke reißen
   ============================================================ */
let rbMetrik="score", rbZeit="woche", rbVersatz=0, rbTag=null;

const RB_METRIKEN=[
  {id:"score",  l:"Tageswert",    farbe:"var(--c1)",
   wert:k=>dayScore(k), stufe:v=>v/100, txt:v=>String(v)},
  {id:"habits", l:"Gewohnheiten", farbe:"var(--m-habit)",
   wert:k=>{ if(!dayHasData(k)) return null; const c=completion(k); return c.total?c.pct:null; },
   stufe:v=>v/100, txt:v=>v+" %"},
  {id:"study",  l:"Lernen",       farbe:"var(--m-study)",
   wert:k=>{ const v=(S.metrics[k]||{}).study; return nv(v)?v:null; },
   stufe:v=>v/Math.max(G().study,1), txt:v=>f(v)+" h"},
  {id:"sport",  l:"Training",     farbe:"var(--m-sport)",
   wert:k=>{ const m=sportMin(k); return m?m:(dayHasData(k)?0:null); },
   stufe:v=>v/90, txt:v=>v?sbDauer(v):"keins"},
  {id:"sleep",  l:"Schlaf",       farbe:"var(--m-sleep)",
   wert:k=>{ const v=(S.metrics[k]||{}).sleepHours; return nv(v)?v:null; },
   stufe:v=>clamp((v-5)/Math.max(G().sleep-5,1),0,1), txt:v=>f(v)+" h"},
];
const rbM=()=>RB_METRIKEN.find(m=>m.id===rbMetrik)||RB_METRIKEN[0];
const WTL=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const tagLang=k=>{ const d=parsedk(k); return `${WD[wtagIdx(d)]}, ${fmtShort(d)}`; };

/* Stufe 0–4 wie bei GitHub. Ein Tag ohne Eintrag ist keine Null,
   sondern unbekannt — er bleibt leer statt dunkel. */
function rbStufe(m,k){
  if(k>today()) return "z";
  if(istPause(k)) return "p";
  const v=m.wert(k);
  if(v===null) return "x";
  if(v<=0) return "0";
  return String(clamp(Math.ceil(clamp(m.stufe(v),0,1)*4),1,4));
}

function rbKarte(){
  const m=rbM(), heute=parsedk(today());
  const start=addD(sow(heute),-52*7);
  const zellen=[], monate=[];
  let letzterMonat=-1, mitDaten=0;
  for(let w=0;w<53;w++){
    for(let t=0;t<7;t++){
      const d=addD(start,w*7+t), k=dk(d), st=rbStufe(m,k);
      if(st!=="z"&&st!=="x"&&st!=="p") mitDaten++;
      const p=st==="p"?pauseAm(k):null;
      const gold=k<=today()&&solideTag(k);
      zellen.push(`<i class="rb-z s${st}${gold?" gold":""}${k===rbTag?" sel":""}${k===today()?" heute":""}" data-rbk="${k}"
        title="${tagLang(k)}${gold?" · solider Tag":""}${p?` · Pause: ${esc(p.name)}`:st==="x"?" · kein Eintrag":st==="z"?"":` · ${m.l} ${m.txt(m.wert(k))}`}"></i>`);
      if(t===0&&d.getMonth()!==letzterMonat){
        if(w<52||d.getDate()<=7) monate.push(`<span style="grid-column:${w+1}">${MS[d.getMonth()]}</span>`);
        letzterMonat=d.getMonth();
      }
    }
  }
  return {html:`
    <div class="rb-karte" style="--rbf:${m.farbe}">
      <div class="rb-scroll" id="rbScroll">
        <div class="rb-innen">
          <div class="rb-monate">${monate.join("")}</div>
          <div class="rb-zeile">
            <div class="rb-wt"><span>Mo</span><span></span><span>Mi</span><span></span><span>Fr</span><span></span><span></span></div>
            <div class="rb-raster" id="rbRaster">${zellen.join("")}</div>
          </div>
        </div>
      </div>
      <div class="rb-fuss">
        <span>${mitDaten} Tage mit Einträgen</span>
        <span class="rb-leg">weniger <i class="rb-z s0"></i><i class="rb-z s1"></i><i class="rb-z s2"></i><i class="rb-z s3"></i><i class="rb-z s4"></i> mehr
          <i class="rb-z sp" style="margin-left:10px"></i> Pause
          <i class="rb-z s0 gold" style="margin-left:10px"></i> Solider Tag</span>
      </div>
    </div>`};
}

/* Die Zeile unter dem Raster: was war an diesem Tag? */
function rbTagDetail(k){
  if(!k) return `<span class="rb-hinweis">Tippe auf ein Kästchen, um den Tag zu sehen.</span>`;
  const p=pauseAm(k);
  const teile=RB_METRIKEN.map(m=>{ const v=m.wert(k); return v===null?null:`<span><b>${m.txt(v)}</b> ${m.l}</span>`; }).filter(Boolean);
  return `<b class="rb-dt">${tagLang(k)}</b>${p?`<span class="tag">Pause · ${esc(p.name)}</span>`:""}
    ${teile.length?teile.join(""):`<span class="rb-hinweis">Kein Eintrag.</span>`}`;
}

/* ── Zeitraum ── */
function rbSpanne(zeit,versatz){
  const h=parsedk(today());
  let von,bis,vorVon,label;
  if(zeit==="woche"){
    von=addD(sow(h),versatz*7); bis=addD(von,6); vorVon=addD(von,-7);
    label= versatz===0?"Diese Woche": versatz===-1?"Letzte Woche": `${fmtShort(von)} – ${fmtShort(bis)}`;
  } else if(zeit==="monat"){
    von=new Date(h.getFullYear(),h.getMonth()+versatz,1); bis=new Date(von.getFullYear(),von.getMonth()+1,0);
    vorVon=new Date(von.getFullYear(),von.getMonth()-1,1);
    label=`${["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"][von.getMonth()]} ${von.getFullYear()}`;
  } else {
    von=new Date(h.getFullYear()+versatz,0,1); bis=new Date(von.getFullYear(),11,31);
    vorVon=new Date(von.getFullYear()-1,0,1); label=String(von.getFullYear());
  }
  /* Ein laufender Zeitraum wird nur mit gleich vielen Tagen des
     vorigen verglichen — sonst verliert jede Woche am Mittwoch. */
  const ende = dk(bis)>today()? h : bis;
  const tage=Math.round((ende-von)/86400000)+1;
  const vorEnde=addD(vorVon,tage-1);
  return {von,bis,ende,vorVon,vorEnde,tage,label,laufend:dk(bis)>=today()&&dk(von)<=today()};
}
function rbTage(von,ende){
  const out=[];
  for(let d=new Date(von); dk(d)<=dk(ende); d=addD(d,1)){ const k=dk(d); if(!istPause(k)) out.push(k); }
  return out;
}
function rbZahlen(tage){
  const m=k=>S.metrics[k]||{};
  const sc=tage.map(dayScore).filter(v=>v!==null);
  const hb=tage.filter(dayHasData).map(k=>completion(k)).filter(c=>c.total).map(c=>c.pct);
  const st=tage.map(k=>m(k).study).filter(nv);
  const sl=tage.map(k=>m(k).sleepHours).filter(nv);
  return {
    score: sc.length?Math.round(avg(sc)):null,
    habits: hb.length?Math.round(avg(hb)):null,
    study: st.length?st.reduce((a,b)=>a+b,0):null,
    sport: tage.reduce((a,k)=>a+sportMin(k),0),
    sleep: sl.length?avg(sl):null,
    solid: tage.filter(solideTag).length,
    mitDaten: tage.filter(dayHasData).length
  };
}

function rbKachel(label,wert,jetzt,vor,fmt,farbe){
  let delta="";
  if(jetzt!==null&&vor!==null&&vor!==undefined){
    const d=jetzt-vor;
    if(Math.abs(d)>=0.05){
      delta=`<span class="rb-d ${d>0?"plus":"minus"}">${d>0?"▲":"▼"} ${fmt(Math.abs(d))}</span>`;
    } else delta=`<span class="rb-d">gleich</span>`;
  }
  return `<div class="rb-kz" style="--kf:${farbe}">
    <span class="rb-kz-l">${label}</span>
    <span class="rb-kz-v">${wert}</span>${delta}</div>`;
}

/* Höchstens zwei Sätze — nur, was die Daten wirklich tragen. */
function rbEinsichten(tage,sp){
  const out=[];
  let best=null;
  tage.forEach(k=>{ const v=dayScore(k); if(v!==null&&(!best||v>best.v)) best={k,v}; });
  if(best&&tage.filter(k=>dayScore(k)!==null).length>=3)
    out.push(`Bester Tag: <b>${tagLang(best.k)}</b> mit Tageswert ${best.v}.`);
  /* Schlaf und Lernen über die letzten 120 Tage, Pausen ausgenommen.
     Erst ab je fünf Tagen pro Gruppe — darunter wäre es Rauschen. */
  const lang=rbTage(addD(parsedk(today()),-119),parsedk(today()));
  const g=G().sleep>=7?7:G().sleep;
  const viel=[],wenig=[];
  lang.forEach(k=>{ const m=S.metrics[k]||{}; if(!nv(m.sleepHours)||!nv(m.study)) return;
    (m.sleepHours>=g?viel:wenig).push(m.study); });
  if(viel.length>=5&&wenig.length>=5){
    const a=avg(viel), b=avg(wenig);
    if(Math.abs(a-b)>=0.3)
      out.push(`An Tagen nach mindestens ${g} h Schlaf hast du im Schnitt <b>${f(a)} h</b> gelernt, sonst ${f(b)} h.`);
  }
  return out;
}

function rbZeitraum(){
  const sp=rbSpanne(rbZeit,rbVersatz);
  const tage=rbTage(sp.von,sp.ende), vor=rbTage(sp.vorVon,sp.vorEnde);
  const a=rbZahlen(tage), b=rbZahlen(vor);
  const pausenTage=Math.round((sp.ende-sp.von)/86400000)+1-tage.length;

  /* Lernen und Training je Tag (Woche, Monat) bzw. je Monat (Jahr). */
  let labels=[], lern=[], trn=[], tips=[];
  if(rbZeit==="jahr"){
    for(let mo=0;mo<12;mo++){
      const v=new Date(sp.von.getFullYear(),mo,1), e=new Date(sp.von.getFullYear(),mo+1,0);
      if(dk(v)>today()){ labels.push(MS[mo]); lern.push(0); trn.push(0); tips.push(`<b>${MS[mo]}</b><div class="sb-tip-r">noch offen</div>`); continue; }
      const tt=rbTage(v, dk(e)>today()?parsedk(today()):e);
      const l=tt.reduce((x,k)=>x+((S.metrics[k]||{}).study||0),0)*60, s2=tt.reduce((x,k)=>x+sportMin(k),0);
      labels.push(MS[mo]); lern.push(l); trn.push(s2);
      tips.push(`<b>${MS[mo]} ${v.getFullYear()}</b><div class="sb-tip-r"><i style="background:var(--m-study)"></i>Lernen<span class="sb-tip-z">${sbDauer(l)}</span></div><div class="sb-tip-r"><i style="background:var(--m-sport)"></i>Training<span class="sb-tip-z">${sbDauer(s2)}</span></div>`);
    }
  } else {
    for(let d=new Date(sp.von); dk(d)<=dk(sp.bis); d=addD(d,1)){
      const k=dk(d), l=((S.metrics[k]||{}).study||0)*60, s2=sportMin(k);
      labels.push(rbZeit==="woche"?WD[wtagIdx(d)]:String(d.getDate()));
      lern.push(istPause(k)?0:l); trn.push(istPause(k)?0:s2);
      tips.push(`<b>${tagLang(k)}</b>${k>today()?`<div class="sb-tip-r">noch offen</div>`:istPause(k)?`<div class="sb-tip-r">Pause</div>`:
        `<div class="sb-tip-r"><i style="background:var(--m-study)"></i>Lernen<span class="sb-tip-z">${l?sbDauer(l):"–"}</span></div><div class="sb-tip-r"><i style="background:var(--m-sport)"></i>Training<span class="sb-tip-z">${s2?sbDauer(s2):"–"}</span></div>`}`);
    }
  }
  const ein=rbEinsichten(tage,sp);
  const leer=!a.mitDaten;

  return `
    <div class="p">
      <div class="rb-kopf">
        <div class="seg" id="rbZeit">${[["woche","Woche"],["monat","Monat"],["jahr","Jahr"]].map(([id,l])=>
          `<button class="${rbZeit===id?"on":""}" data-rbz="${id}">${l}</button>`).join("")}</div>
        <div class="rb-nav">
          <button class="b b-i" id="rbVor" aria-label="Zurück">${ico("left")}</button>
          <span class="rb-label">${sp.label}${sp.laufend?` <i>läuft</i>`:""}</span>
          <button class="b b-i" id="rbNach" aria-label="Weiter" ${rbVersatz>=0?"disabled":""}>${ico("right")}</button>
        </div>
      </div>
      ${leer?`<div class="empty" style="padding:26px 10px">${ico("chart")}<div>${pausenTage>=sp.tage?
          "Dieser Zeitraum liegt in einer Pause.":"In diesem Zeitraum gibt es keine Einträge."}</div></div>`:`
      <div class="rb-zr"><div>
      <div class="rb-kacheln rb-k3">
        ${rbKachel("Tageswert", a.score!==null?a.score:"–", a.score, b.score, v=>String(Math.round(v)), "var(--c1)")}
        ${rbKachel("Gewohnheiten", a.habits!==null?a.habits+" %":"–", a.habits, b.habits, v=>Math.round(v)+" %", "var(--m-habit)")}
        ${rbKachel("Lernen", a.study!==null?f(a.study)+" h":"–", a.study, b.study, v=>f(v)+" h", "var(--m-study)")}
        ${rbKachel("Training", a.sport?sbDauer(a.sport):"–", a.sport, b.sport, v=>sbDauer(v), "var(--m-sport)")}
        ${rbKachel("Ø Schlaf", a.sleep!==null?f(a.sleep)+" h":"–", a.sleep, b.sleep, v=>f(v)+" h", "var(--m-sleep)")}
        ${rbKachel("Solide Tage", a.solid, a.solid, b.solid, v=>String(Math.round(v)), "var(--gold)")}
      </div>
      <p class="rb-vgl">Vergleich mit ${rbZeit==="woche"?"der Vorwoche":rbZeit==="monat"?"dem Vormonat":"dem Vorjahr"}${sp.laufend?`, jeweils die ersten ${sp.tage} Tage`:""}${pausenTage>0?` · ${pausenTage} Pausentage nicht mitgezählt`:""}.</p>
      ${ein.length?`<div class="rb-ein">${ein.map(e=>`<p>${e}</p>`).join("")}</div>`:""}
      </div><div>
      <div class="rb-chart-t">Lernen und Training</div>
      ${stackBar(labels,[{color:"var(--m-study)",data:lern},{color:"var(--m-sport)",data:trn}],
        {unit:60,h:200,emptyText:"Weder gelernt noch trainiert.",tip:tips})}
      ${legend([{color:"var(--m-study)",label:"Lernen"},{color:"var(--m-sport)",label:"Training"}])}
      </div></div>`}
    </div>`;
}

/* ── Serien ──
   Alles, was „in Folge" zählt, an einer Stelle. Neu ist „Eingetragen":
   genau das, worum es geht — NOVA jeden Tag benutzen. */
function serienListe(){
  const OK=zielPruefer(), so=solideSerie();
  const zeilen=[{label:"Solider Tag", regel:"alle vier Ziele erfüllt", farbe:"var(--gold)", ok:solideTag,
      serie:so.serie, best:so.best, schutz:so.schutz, gold:true}]
    .concat(buildGoals().map(g=>({label:g.label, regel:g.regel, farbe:g.color, ok:OK[g.key],
      serie:g.serie, best:g.best, schutz:g.schutz})));
  const habits=activeHabits().map(h=>{ const se=habitSerie(h); return {h,se}; })
    .filter(x=>x.se.n>0).sort((a,b)=>b.se.n-a.se.n).slice(0,5);
  return {zeilen,habits};
}
function serieStreifen(ok){
  /* Die letzten 14 Tage als Punkte: erfüllt, verpasst, Pause, heute offen. */
  return `<span class="se-str">${[...Array(14)].map((_,i)=>{
    const k=dk(addD(parsedk(today()),-13+i));
    /* Eigene Präfixe: ein nacktes „p" erbte die Panel-Klasse .p. */
    const c= istPause(k)?"pz": ok(k)?"ja": k===today()?"of":"ne";
    return `<i class="${c}" title="${tagLang(k)}"></i>`;}).join("")}</span>`;
}
function rbSerien(){
  const {zeilen,habits}=serienListe();
  return `<div class="p">
    <div class="p-head"><div class="p-title">${ico("flame")}Serien</div>
      <span class="p-note">Schutztage fangen einen verpassten Tag ab · Pausen zählen nicht mit, außer bei „Eingetragen"</span></div>
    <div class="se-liste">
      ${zeilen.map(z=>`<div class="se-z${z.gold?" se-gold":""}" style="--sf:${z.farbe}">
        <div class="se-n"><b>${z.label}</b><span>${z.regel}</span></div>
        ${serieStreifen(z.ok)}
        <div class="se-w"><b>${z.serie}</b><span>${z.serie===1?"Tag":"Tage"}</span></div>
        <div class="se-r">${z.best>0?(z.serie>=z.best&&z.serie>0?`<span class="se-best">Rekord</span>`:`Rekord ${z.best}`):"–"}
          ${z.schutz?`<span class="se-schutz" title="Schutztage auf Vorrat">${"●".repeat(z.schutz)}</span>`:""}</div>
      </div>`).join("")}
    </div>
    ${habits.length?`<div class="se-hab">
      <span class="se-hab-t">Gewohnheiten</span>
      ${habits.map(({h,se})=>`<span class="se-hab-c" style="--sf:${h.color}"><i></i>${esc(h.name)} <b>${se.n} ${se.kurz}</b></span>`).join("")}
    </div>`:""}
  </div>`;
}

/* ── Pausen ── */
function luecken(){
  /* Zeiträume ab fünf Tagen ohne jeden Eintrag, die noch keine Pause
     sind — Kandidaten, die man mit einem Tipp als Pause markiert. */
  const von=ersterTag(), out=[];
  let start=null;
  for(let d=parsedk(von); dk(d)<today(); d=addD(d,1)){
    const k=dk(d), leer=!tagGenutzt(k)&&!istPause(k);
    if(leer&&!start) start=k;
    if(!leer&&start){ const n=Math.round((d-parsedk(start))/86400000); if(n>=5) out.push({von:start,bis:dk(addD(d,-1)),n}); start=null; }
  }
  if(start){ const n=Math.round((parsedk(today())-parsedk(start))/86400000); if(n>=5) out.push({von:start,bis:dk(addD(parsedk(today()),-1)),n}); }
  return out.slice(-3);
}
function rbPausen(){
  const pl=pausenAlle(), lk=luecken();
  return `<div class="p">
    <div class="p-head"><div class="p-title">${ico("moon")}Pausen</div>
      <button class="b b-sm" id="psNeu">+ Pause</button></div>
    <p class="p-note" style="margin:-4px 0 12px">Ferien, Urlaub, krank: In einer Pause verzerrt kein Schnitt, und die Ziel-Serien laufen nicht aus. „Eingetragen" zählt trotzdem weiter — wer nichts einträgt, beginnt dort von vorn.</p>
    ${lk.length?`<div class="ps-luecken">${lk.map(l=>`<div class="ps-l">
      <span>Lücke <b>${fmtShort(parsedk(l.von))} – ${fmtShort(parsedk(l.bis))}</b> · ${l.n} Tage ohne Eintrag</span>
      <button class="b b-sm" data-lueckepause="${l.von}|${l.bis}">Als Pause markieren</button></div>`).join("")}</div>`:""}
    ${pl.length?`<div class="ps-liste">${pl.map(p=>{
      const n=Math.round((parsedk(p.bis)-parsedk(p.von))/86400000)+1;
      return `<div class="ps-z"><span><b>${esc(p.name)}</b> ${fmtShort(parsedk(p.von))} – ${fmtShort(parsedk(p.bis))} · ${n} Tage</span>
        <button class="b b-i" data-psweg="${p.id}" aria-label="Pause ${esc(p.name)} löschen" style="width:28px;height:28px">${ico("x")}</button></div>`;}).join("")}</div>`
      :(lk.length?"":`<div class="rb-hinweis" style="padding:4px 0">Noch keine Pause eingetragen.</div>`)}
  </div>`;
}
function pauseModal(von,bis){
  modal(`<h3>Pause eintragen</h3>
    <label>Name</label><input id="psName" value="${von?"Semesterferien":""}" placeholder="z. B. Semesterferien">
    <div style="display:flex;gap:10px">
      <div style="flex:1"><label>Von</label><input type="date" id="psVon" value="${von||today()}"></div>
      <div style="flex:1"><label>Bis</label><input type="date" id="psBis" value="${bis||today()}"></div></div>
    <div class="mo-act"><button class="b" onclick="closeModal()">Abbrechen</button>
      <button class="b b-1" id="psOk">Eintragen</button></div>`);
  document.getElementById("psOk").onclick=()=>{
    const name=document.getElementById("psName").value.trim()||"Pause";
    let v=document.getElementById("psVon").value, b=document.getElementById("psBis").value;
    if(!v||!b){ toast("Datum fehlt","x"); return; }
    if(b<v) [v,b]=[b,v];
    S.pausen=S.pausen||[]; S.pausen.push({id:uid(),name,von:v,bis:b});
    save(); closeModal(); toast(`„${name}" eingetragen`); R.rueckblick(); paintOrb();
  };
}

  const karte=rbKarte();
  el.innerHTML=`
  <div class="p-head" style="margin-bottom:14px">
    <div><div style="font-family:var(--f-disp);font-size:var(--t-xl);font-weight:600">Rückblick</div>
    <div class="p-note">Das Jahr auf einen Blick, darunter Zeitraum, Serien und Pausen.</div></div>
  </div>
  <div class="p">

      style="${rbMetrik===m.id?`border-color:${m.farbe};color:${m.farbe};background:color-mix(in srgb, ${m.farbe} 14%, transparent)`:""}">${m.l}</button>`).join("")}</div>
    ${karte.html}
    <div class="rb-detail" id="rbDetail">${rbTagDetail(rbTag)}</div>
  </div>
  ${rbZeitraum()}
  <div class="grid c2 rb-unten">${rbSerien()}${rbPausen()}</div>`;

    rbTag=z.dataset.rbk;

    el.querySelector("#rbDetail").innerHTML=rbTagDetail(rbTag);
  };
  el.querySelectorAll("[data-rbz]").forEach(b=>b.onclick=()=>{ rbZeit=b.dataset.rbz; rbVersatz=0; R.rueckblick(); });
  el.querySelector("#rbVor").onclick=()=>{ rbVersatz--; R.rueckblick(); };

  el.querySelector("#psNeu").onclick=()=>pauseModal();

/* ============================================================
   13 — SCHLAF
   Eine Seite nur für den Schlaf: was letzte Nacht war, wie es im
   Schnitt aussieht, wann du ins Bett gehst — und eintragen, morgens,
   mit zwei Feldern.
   ============================================================ */
let slTage=30;
function schlafNaechte(n){
  const out=[];
  for(let i=n-1;i>=0;i--){
    const k=dk(addD(parsedk(today()),-i)), m=S.metrics[k]||{};
    out.push({k,h:nv(m.sleepHours)?m.sleepHours:null,sc:nv(m.sleepScore)?m.sleepScore:null,
              von:m.sleepFrom||null,bis:m.sleepTo||null,pause:istPause(k)});
  }
  return out;
}
/* Uhrzeit auf einer Achse, die abends beginnt: 18:00 = 0. Sonst liegt
   23:30 hinter 01:00 und jeder Schnitt über Mitternacht ist Unsinn. */
const nachtMin=t=>(hm2min(t)-18*60+1440)%1440;
const nachtUhr=v=>min2hm((v+18*60)%1440);
function streuung(a){ if(a.length<2) return null; const m=avg(a); return Math.sqrt(avg(a.map(x=>(x-m)**2))); }

/* ── Wann du schläfst ───────────────────────────────────
   Das Herz der Seite: je Nacht ein Balken vom Einschlafen bis zum
   Aufwachen. Eine Stundenzahl sagt, wie viel — erst die Lage zeigt,
   ob der Rhythmus hält. Dazu:
   - die Achse passt sich deinen Zeiten an, statt starr 20–12 Uhr
   - ein Band um deine übliche Einschlaf- und Aufwachzeit
   - Wochenend-Nächte leicht hinterlegt (Fr→Sa, Sa→So)
   - Nächte unter dem Ziel blasser, die Stunden stehen über dem Balken
   - antippen zeigt die Nacht im Detail
   ──────────────────────────────────────────────────────── */
let slNacht=null;
const istWeNacht=k=>{ const d=parsedk(k).getDay(); return d===6||d===0; };
function schlafRhythmus(nae){
  const mit=nae.filter(n=>n.von&&n.bis);
  const bett=mit.map(n=>nachtMin(n.von)), auf=mit.map(n=>nachtMin(n.bis));
  const mitte=n=>{ const a=nachtMin(n.von); return a+((hm2min(n.bis)-hm2min(n.von)+1440)%1440)/2; };
  const we=mit.filter(n=>istWeNacht(n.k)).map(mitte), wt=mit.filter(n=>!istWeNacht(n.k)).map(mitte);
  return { n:mit.length,
    bett: bett.length?avg(bett):null, auf: auf.length?avg(auf):null,
    sBett: streuung(bett), sAuf: streuung(auf),
    jetlag: we.length>=2&&wt.length>=2 ? avg(we)-avg(wt) : null };
}
function schlafZeitenChart(nae,ziel,r){
  const mit=nae.filter(n=>n.von&&n.bis);
  if(mit.length<2){
    const aelter=Object.values(S.metrics||{}).filter(m=>m.sleepFrom&&m.sleepTo).length;
    return `<div class="empty">${ico("clock")}<div>Trag beim Schlaf „Ins Bett“ und „Aufgewacht“ ein —
      ab zwei Nächten entsteht hier dein Rhythmus.</div>
      ${aelter>=2&&slTage<90?`<button class="b b-sm" data-slt="90" style="margin-top:10px">${aelter} ältere Nächte mit Uhrzeit zeigen</button>`:""}</div>`;
  }
  /* Schmal (Handy): eigenes, höheres Seitenverhältnis — sonst wird die
     Grafik flach und die Schrift winzig. */
  const eng=window.innerWidth<640;
  const W=eng?390:760,H=eng?380:350,pL=eng?40:46,pR=eng?48:58,pT=14,pB=30, pw=W-pL-pR, ph=H-pT-pB;
  const n=nae.length, slot=pw/n, bw=clamp(slot*.62,2.5,22);
  /* Beschriftung über jedem Balken: Stunden und Score. Bei breiten
     Spalten zweizeilig, bei schmalen hochkant, bei ganz schmalen
     (90 Nächte auf dem Handy) passt nichts mehr — dann per Antippen. */
  const art= slot>=19?"zwei" : slot>=5.5?"hoch" : "keine";
  const kopf= art==="zwei"?28 : art==="hoch"?50 : 0;          /* Platz über dem frühesten Balken, in px */
  const zb=nachtMin(ZG().bettZiel), za=nachtMin(ZG().aufZiel);
  const lo=Math.min(zb,...mit.map(n=>nachtMin(n.von))), hi=Math.max(za,...mit.map(n=>nachtMin(n.bis)));
  const span0=Math.max(240,hi-lo+60);
  const vorlauf=Math.round(kopf/ph*span0)+30;
  const a0=Math.max(0,Math.floor((lo-vorlauf)/60)*60), a1=Math.min(1440,Math.ceil((hi+30)/60)*60);
  const y=v=>pT+(clamp(v,a0,a1)-a0)/(a1-a0)*ph;
  const x=i=>pL+slot*(i+.5);
  let g="";
  /* Wochenende hinterlegen */
  nae.forEach((nn,i)=>{ if(istWeNacht(nn.k))
    g+=`<rect x="${(pL+slot*i).toFixed(1)}" y="${pT}" width="${slot.toFixed(1)}" height="${ph}" fill="rgba(255,255,255,.028)"/>`; });
  /* Stundenlinien */
  const schritt=(a1-a0)>12*60?120:60;
  for(let v=a0; v<=a1; v+=schritt){
    g+=`<line x1="${pL}" y1="${y(v)}" x2="${W-pR}" y2="${y(v)}" stroke="var(--track)" stroke-dasharray="2 6"/>
      <text x="${pL-8}" y="${y(v)+3.5}" text-anchor="end" font-family="var(--f-mono)" font-size="10" fill="var(--text-faint)">${nachtUhr(v)}</text>`;
  }
  /* Rechte Randbeschriftung sammeln und danach entzerren, damit sich
     „Ø auf 07:28" und „Ziel 07:00" nie überdecken. */
  const marken=[];
  /* Übliche Zeiten als Band (Schnitt ± Streuung) */
  const band=(m,sd,txt)=>{ if(m===null) return "";
    const s=Math.max(sd||0,8);
    marken.push({y:y(m),h:24,html:yy=>`<text x="${W-pR+6}" y="${yy-2}" font-family="var(--f-mono)" font-size="10.5" font-weight="600" fill="var(--m-sleep)">${nachtUhr(Math.round(m))}</text>
      <text x="${W-pR+6}" y="${yy+10}" font-size="9" fill="var(--text-faint)">${txt}</text>`});
    return `<rect x="${pL}" y="${y(m-s)}" width="${pw}" height="${Math.max(2,y(m+s)-y(m-s))}" fill="var(--m-sleep)" opacity=".07"/>
      <line x1="${pL}" y1="${y(m)}" x2="${W-pR}" y2="${y(m)}" stroke="var(--m-sleep)" stroke-opacity=".55" stroke-dasharray="5 4"/>`; };
  g+=band(r.bett,r.sBett,"Ø Bett")+band(r.auf,r.sAuf,"Ø auf");
  /* Zielfenster: grüne Linien und ein Hauch Grün dazwischen */
  g+=`<rect x="${pL}" y="${y(zb)}" width="${pw}" height="${Math.max(0,y(za)-y(zb))}" fill="var(--good)" opacity=".035"/>`;
  [[zb,ZG().bettZiel],[za,ZG().aufZiel]].forEach(([v,t])=>{
    g+=`<line x1="${pL}" y1="${y(v)}" x2="${W-pR}" y2="${y(v)}" stroke="var(--good)" stroke-opacity=".7" stroke-width="1.2"/>`;
    marken.push({y:y(v),h:24,html:yy=>`<text x="${W-pR+6}" y="${yy-2}" font-family="var(--f-mono)" font-size="10.5" font-weight="600" fill="var(--good)">${t}</text>
      <text x="${W-pR+6}" y="${yy+10}" font-size="9" fill="var(--text-faint)">Ziel</text>`}); });
  marken.sort((a,b)=>a.y-b.y);
  for(let i=1;i<marken.length;i++){
    const min=marken[i-1].y+marken[i-1].h;
    if(marken[i].y<min) marken[i].y=min;
  }
  /* Was unten über den Rand geschoben wurde, wieder nach oben schieben */
  for(let i=marken.length-1;i>=0;i--){
    const max= i===marken.length-1 ? H-pB-4 : marken[i+1].y-marken[i].h;
    if(marken[i].y>max) marken[i].y=max;
  }
  g+=marken.map(mk=>mk.html(mk.y)).join("");
  /* Balken */
  let b="";
  nae.forEach((nn,i)=>{
    const sel=nn.k===slNacht;
    if(nn.von&&nn.bis){
      const y1=y(nachtMin(nn.von)), y2=y(nachtMin(nn.bis)), hoch=Math.max(3,y2-y1);
      const gut=schlafOk(nn.k);
      b+=`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${hoch.toFixed(1)}"
        rx="${Math.min(5,bw/2).toFixed(1)}" fill="var(--m-sleep)" opacity="${nn.pause?.28:gut?.95:.5}"
        ${sel?`stroke="var(--text)" stroke-width="1.6"`:""}/>`;
      const hTxt=nn.h!==null?f(nn.h):"–", sTxt=nn.sc!==null?String(nn.sc):"–";
      const sFarbe=nn.sc!==null&&nn.sc>ZG().scoreMin?"var(--m-sleep)":"var(--text-faint)";
      if(art==="zwei")
        b+=`<text x="${x(i).toFixed(1)}" y="${(y1-17).toFixed(1)}" text-anchor="middle" font-family="var(--f-mono)" font-size="9.5"
            fill="${nn.h!==null&&nn.h>=ziel?"var(--text)":"var(--text-faint)"}">${hTxt}</text>
          <text x="${x(i).toFixed(1)}" y="${(y1-6).toFixed(1)}" text-anchor="middle" font-family="var(--f-mono)" font-size="8.5" fill="${sFarbe}">${sTxt}</text>`;
      else if(art==="hoch")
        b+=`<text transform="translate(${(x(i)+(slot>=12?3:2.5)).toFixed(1)} ${(y1-5).toFixed(1)}) rotate(-90)" font-family="var(--f-mono)" font-size="${slot>=12?9:slot>=8?8:7}">
            <tspan fill="${nn.h!==null&&nn.h>=ziel?"var(--text)":"var(--text-faint)"}">${hTxt}</tspan><tspan fill="${sFarbe}"> · ${sTxt}</tspan></text>`;
    } else if(nn.h!==null){
      /* Nur die Dauer bekannt: kleiner Ring unten, damit die Nacht nicht verschwindet */
      b+=`<circle cx="${x(i).toFixed(1)}" cy="${H-pB-5}" r="${slot>=10?2.6:1.8}" fill="none" stroke="var(--m-sleep)" stroke-opacity=".4"/>`;
    }
    /* Datumsachse: bei wenigen Nächten jede, sonst jeder Montag */
    const d=parsedk(nn.k);
    /* Datum je nach Spaltenbreite: „Mi 30.", „30." oder nur montags */
    const dTxt= slot>=40 ? `${WD[wtagIdx(d)]} ${d.getDate()}.` : slot>=17 ? `${d.getDate()}.` : d.getDay()===1 ? `${d.getDate()}.` : "";
    if(dTxt)
      b+=`<text x="${x(i).toFixed(1)}" y="${H-9}" text-anchor="middle" font-family="var(--f-mono)" font-size="9.5"
        fill="${nn.k===today()?"var(--text)":istWeNacht(nn.k)?"var(--text-dim)":"var(--text-faint)"}">${dTxt}</text>`;
    /* Trefferfläche über die volle Höhe — schmale Balken sind sonst kaum zu treffen */
    b+=`<rect data-sln="${nn.k}" x="${(pL+slot*i).toFixed(1)}" y="${pT}" width="${slot.toFixed(1)}" height="${ph}" fill="transparent" style="cursor:pointer">
      <title>${tagLang(nn.k)}${nn.von?`: ${nn.von}–${nn.bis}`:""}${nn.h!==null?` · ${f(nn.h)} h`:""}</title></rect>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="sl-wann-svg" role="img" aria-label="Schlafzeiten je Nacht">${g}${b}</svg>`;
}
function schlafNachtDetail(nae,r,ziel){
  const nn=nae.find(x=>x.k===slNacht);
  if(!nn) return `<span class="rb-hinweis">Tippe auf eine Nacht, um sie im Detail zu sehen.</span>`;
  const teile=[];
  if(nn.von) teile.push(`<span><b>${nn.von} – ${nn.bis}</b></span>`);
  if(nn.h!==null) teile.push(`<span><b>${f(nn.h)} h</b>${nn.h>=ziel?"":` · ${f(ziel-nn.h)} h unter dem Ziel`}</span>`);
  if(nn.h!==null) teile.push(`<span>${schlafOk(nn.k)?"<b>Ziel erreicht</b>":"Ziel nicht erreicht"}</span>`);
  if(nn.sc!==null) teile.push(`<span>Score <b>${nn.sc}</b></span>`);
  if(nn.von&&r.bett!==null){
    const d=Math.round(nachtMin(nn.von)-r.bett);
    if(Math.abs(d)>=10) teile.push(`<span>${Math.abs(d)} min ${d>0?"später":"früher"} ins Bett als sonst</span>`);
  }
  return `<b class="rb-dt">Nacht auf ${tagLang(nn.k)}</b>${nn.pause?`<span class="tag">Pause</span>`:""}
    ${teile.length?teile.join(""):`<span class="rb-hinweis">Für diese Nacht ist nichts eingetragen.</span>`}`;
}

R.schlaf=function(){
  const el=document.getElementById("v-schlaf");
  const g=G(), k=today(), m=S.metrics[k]||{};
  const alleN=schlafNaechte(slTage);
  const nae=alleN.filter(n=>!n.pause);
  const h=nae.map(n=>n.h).filter(v=>v!==null);
  const sc=nae.map(n=>n.sc).filter(v=>v!==null);
  const w7=schlafNaechte(7).filter(n=>!n.pause).map(n=>n.h).filter(v=>v!==null);
  const ziel=nae.filter(n=>schlafOk(n.k)).length;
  const r=schlafRhythmus(nae);
  const letzte=[...schlafNaechte(14)].reverse().find(n=>n.h!==null);
  const serie=buildGoals().find(x=>x.key==="sleep");
  const regel= r.sBett===null?null : r.sBett<30?"sehr regelmäßig" : r.sBett<60?"recht regelmäßig" : "unregelmäßig";

  el.innerHTML=`
  <div class="p-head" style="margin-bottom:14px">
    <div><div style="font-family:var(--f-disp);font-size:var(--t-xl);font-weight:600">Schlaf</div>
    <div class="p-note">Ziel ${f(g.sleep)} h · ${slTage} Nächte${nae.length<alleN.length?`, Pausen ausgenommen`:""}</div></div>
    <div class="seg" id="slSeg">${[14,30,90].map(n=>`<button class="${slTage===n?"on":""}" data-slt="${n}">${n} T</button>`).join("")}</div>
  </div>

  <div class="p sl-wann">
    <div class="p-head"><div class="p-title">${ico("clock")}Wann du schläfst</div>
      <span class="p-note">über jedem Balken: Stunden, darunter Score · grün: dein Zielfenster · Wochenende hinterlegt</span></div>
    <div class="sl-rhythmus">
      <div><span>Ø ins Bett</span><b>${r.bett!==null?nachtUhr(Math.round(r.bett)):"–"}</b>
        <em>${r.sBett!==null?`± ${Math.round(r.sBett)} min`:""}</em></div>
      <div><span>Ø aufgewacht</span><b>${r.auf!==null?nachtUhr(Math.round(r.auf)):"–"}</b>
        <em>${r.sAuf!==null?`± ${Math.round(r.sAuf)} min`:""}</em></div>
      <div><span>Rhythmus</span><b>${regel||"–"}</b>
        <em>${r.sBett!==null?"nach der Einschlafzeit":""}</em></div>
      <div title="Verschiebung der Schlafmitte am Wochenende gegenüber unter der Woche"><span>Wochenende</span>
        <b>${r.jetlag===null?"–":Math.abs(r.jetlag)<15?"wie unter der Woche":`${Math.round(Math.abs(r.jetlag))} min ${r.jetlag>0?"später":"früher"}`}</b>
        <em>${r.jetlag===null?"zu wenig Nächte":"Schlafmitte"}</em></div>
    </div>
    ${schlafZeitenChart(alleN,g.sleep,r)}
    ${r.n>=2?`<div class="rb-detail" id="slDetail">${schlafNachtDetail(alleN,r,g.sleep)}</div>`:""}
    ${r.n<alleN.filter(n=>n.h!==null).length?`<div class="sl-fuss">○ Nächte nur mit Dauer, ohne Uhrzeiten · ${r.n} von ${alleN.filter(n=>n.h!==null).length} Nächten mit Zeiten</div>`:""}
  </div>

  <div class="sl-oben">
    <div class="p sl-nacht">
      <div class="sl-nacht-t">${letzte?(letzte.k===k?"Letzte Nacht":"Nacht auf "+tagLang(letzte.k)):"Letzte Nacht"}</div>
      <div class="sl-nacht-v">${letzte?`${f(letzte.h)}<span>h</span>`:"–"}</div>
      <div class="sl-nacht-s">${letzte&&letzte.von?`${letzte.von} – ${letzte.bis}`:""}${letzte&&letzte.sc!==null?`${letzte.von?" · ":""}Score ${letzte.sc}`:""}</div>
      ${letzte?`<div class="bar" style="margin-top:12px"><i style="width:${clamp(letzte.h/g.sleep*100,0,100)}%;background:var(--m-sleep)"></i></div>`:""}
      <div class="sl-serie"><span>${ico("moon")}</span><b>${serie.serie}</b> ${serie.serie===1?"Nacht":"Nächte"} in Folge mit ${f(g.sleep)} h und Score über ${ZG().scoreMin}
        <em>${serie.best>0?(serie.serie>=serie.best&&serie.serie>0?"Bestwert":"Rekord "+serie.best):""}</em></div>
    </div>
    <div class="p sl-eintrag">
      <div class="p-head" style="margin-bottom:10px"><div class="p-title">${ico("moon")}Schlaf eintragen</div>
        <span class="p-note">Nacht auf heute</span></div>
      <div class="sl-felder">
        <label>Ins Bett<input type="time" id="slVon" value="${m.sleepFrom||""}"></label>
        <label>Aufgewacht<input type="time" id="slBis" value="${m.sleepTo||""}"></label>
        <label>Stunden<input type="text" inputmode="decimal" autocomplete="off" id="slH" value="${nv(m.sleepHours)?m.sleepHours:""}" placeholder="aus den Zeiten"></label>
        <label>Score<input type="number" inputmode="numeric" min="0" max="100" id="slS" value="${nv(m.sleepScore)?m.sleepScore:""}" placeholder="optional"></label>
      </div>
      <button class="b b-1" id="slOk" style="width:100%;margin-top:10px">${nv(m.sleepHours)?"Ändern":"Eintragen"}</button>
    </div>
  </div>

  <div class="rb-kacheln sl-kacheln">
    ${rbKachel("Ø 7 Nächte", w7.length?f(avg(w7))+" h":"–", null,null,null,"var(--m-sleep)")}
    ${rbKachel(`Ø ${slTage} Nächte`, h.length?f(avg(h))+" h":"–", null,null,null,"var(--m-sleep)")}
    ${rbKachel("Ø Score", sc.length?Math.round(avg(sc)):"–", null,null,null,"var(--m-sleep)")}
    ${rbKachel("Ziel erreicht", h.length?`${ziel}<small> / ${h.length}</small>`:"–", null,null,null,"var(--m-sleep)")}
  </div>`;

  el.querySelectorAll("[data-slt]").forEach(b=>b.onclick=()=>{ slTage=+b.dataset.slt; R.schlaf(); });
  el.querySelectorAll("[data-sln]").forEach(b=>b.onclick=()=>{
    slNacht = slNacht===b.dataset.sln ? null : b.dataset.sln;
    const top=document.getElementById("views").scrollTop; R.schlaf(); document.getElementById("views").scrollTop=top; });
  el.querySelector("#slOk").onclick=()=>{
    let hv=parseFloat(el.querySelector("#slH").value.replace(",","."));
    const sv=parseFloat(el.querySelector("#slS").value);
    const von=el.querySelector("#slVon").value, bis=el.querySelector("#slBis").value;
    const e={};
    if(von&&bis){
      e.sleepFrom=von; e.sleepTo=bis;
      if(isNaN(hv)){ const zu=t=>{ const [a,b]=t.split(":").map(Number); return a*60+b; };
        hv=Math.round(((zu(bis)-zu(von)+1440)%1440)/15)/4; }
    }
    if(isNaN(hv)&&isNaN(sv)&&!e.sleepFrom){ toast("Erst Zeiten oder Stunden eintragen","x"); return; }
    if(!isNaN(hv)) e.sleepHours=clamp(hv,0,16); if(!isNaN(sv)) e.sleepScore=clamp(Math.round(sv),0,100);
    S.metrics[k]=Object.assign({},S.metrics[k],e); save();
    toast("Schlaf eingetragen"); R.schlaf(); paintOrb();
  };
};

/* ============================================================
   15 — UNI
   Alles fürs Studium an einer Stelle, gespeist aus dem, was schon da
   ist: die Uni-Blöcke im Planer werden zu Modulen (die Notiz am
   Block ist der Modulname — „TM3 Vorlesung", „TM 3" und „tm3"
   landen im selben Modul), die Lernzeit aus den Tageswerten, die
   Semesterwoche aus dem Ende der letzten Pause. Neu einzutragen sind
   nur Termine: Klausuren und Abgaben mit Countdown.
   ============================================================ */
const UNI_FARBEN=["#3683db","#4fb3e8","#8ea4f5","#56c2c9","#a08ff0","#6a9be0","#9dd5f2"];
const UNI_ARTEN=[["klausur","Klausur"],["abgabe","Abgabe"],["termin","Termin"]];
const uniTermine=()=>(S.uniTermine||[]).slice().sort((a,b)=>a.datum.localeCompare(b.datum));

function modulName(note){
  const w=String(note||"").trim().split(/\s+/).filter(Boolean);
  if(!w.length) return null;
  return w[1]&&/^\d+$/.test(w[1]) ? w[0]+w[1] : w[0];
}
const modulKey=n=>String(n||"").toLowerCase().replace(/[^a-z0-9äöüß]/g,"");
function uniArt(b){
  const n=(b.note||"").toLowerCase();
  if(/übung|uebung|tutorium/.test(n)) return "Übung";
  return blockById(b.type).label;
}
/* Uni-Blöcke einer Woche, ohne reine Lernblöcke */
function uniBloecke(mk){
  const out=[];
  for(let i=0;i<7;i++) wocheTag(mk,i).forEach(b=>{
    const t=blockById(b.type);
    if(katVon(t)!=="uni"||b.type==="lernen") return;
    out.push({...b,tag:i});
  });
  return out;
}
function uniModule(){
  const map=new Map();
  uniBloecke(wochenSchluessel(new Date())).forEach(b=>{
    const n=modulName(b.note)||blockById(b.type).label, key=modulKey(n);
    if(!map.has(key)) map.set(key,{key,namen:{},slots:[],min:0});
    const m=map.get(key);
    m.namen[n]=(m.namen[n]||0)+1;
    m.slots.push({tag:b.tag,start:b.start,end:b.end,art:uniArt(b)});
    m.min+=(hm2min(b.end)-hm2min(b.start)+1440)%1440;
  });
  return [...map.values()].map(m=>{
    /* Häufigste Schreibweise, bei Gleichstand die mit Großbuchstaben */
    m.name=Object.entries(m.namen).sort((a,b)=>b[1]-a[1]||(/[A-ZÄÖÜ]/.test(b[0][0])-/[A-ZÄÖÜ]/.test(a[0][0])))[0][0];
    if(m.name===m.name.toLowerCase()) m.name=m.name[0].toUpperCase()+m.name.slice(1);
    m.slots.sort((a,b)=>a.tag-b.tag||a.start.localeCompare(b.start));
    return m;
  }).sort((a,b)=>b.min-a.min).map((m,i)=>({...m,farbe:UNI_FARBEN[i%UNI_FARBEN.length]}));
}
/* Nächster Uni-Termin im Plan ab jetzt (diese und nächste Woche) */
function uniNaechster(){
  const jetzt=new Date(), nowMin=jetzt.getHours()*60+jetzt.getMinutes();
  const mo=sow(jetzt);
  for(let w=0;w<2;w++){
    const mk=dk(addD(mo,w*7));
    const l=uniBloecke(mk).map(b=>({...b,datum:dk(addD(mo,w*7+b.tag))}))
      .filter(b=>b.datum>today()||(b.datum===today()&&hm2min(b.end)>nowMin))
      .sort((a,b)=>a.datum.localeCompare(b.datum)||a.start.localeCompare(b.start));
    if(l.length) return l[0];
  }
  return null;
}
/* Semesterwoche: gezählt ab dem Tag nach den letzten Semesterferien —
   nur Pausen mit „Semester" im Namen, ein Urlaub mittendrin zählt nicht. */
function semesterWoche(){
  const vorbei=pausenAlle().filter(p=>p.bis<today()&&/semester/i.test(p.name||""));
  if(!vorbei.length) return null;
  const start=addD(parsedk(vorbei[vorbei.length-1].bis),1);
  const w=Math.floor((sow(parsedk(today()))-sow(start))/(7*86400000))+1;
  return w>=1&&w<=26 ? {w,start} : null;
}
const tageBis=k=>Math.round((parsedk(k)-parsedk(today()))/86400000);
function countdownText(n){
  if(n===0) return "heute"; if(n===1) return "morgen";
  if(n<0) return n===-1?"gestern":`vor ${-n} Tagen`;
  if(n<14) return `in ${n} Tagen`;
  return `in ${Math.round(n/7)} Wochen`;
}
const wannText=b=>{
  const n=tageBis(b.datum);
  return `${n===0?"heute":n===1?"morgen":TWD[b.tag]} ${b.start}`;
};

const studium=()=>Object.assign({semester:3,status:{}},S.studium||{});
const STATUS_TXT={offen:"offen",laeuft:"läuft",bestanden:"bestanden"};
function modStatus(m){
  const st=studium(), e=st.status[m.id];
  if(e&&e.s) return e.s;
  return m.sem===st.semester?"laeuft":"offen";
}
/* Planer-Modul („tm3") → Modul im Studienplan, nur im laufenden Semester */
function planModul(key){
  if(!key) return null;
  const sem=studium().semester;
  return STUDIENPLAN.find(m=>m.sem===sem&&(m.a.includes(key)||modulKey(m.n)===key))||null;
}
function studiumZahlen(){
  let cp=0, cpLauf=0, n=0, noteSum=0, noteCp=0;
  const proKat={};
  STUDIENPLAN.forEach(m=>{
    const s=modStatus(m);
    if(s==="bestanden"){ cp+=m.cp; n++; proKat[m.kat]=(proKat[m.kat]||0)+m.cp;
      const note=(studium().status[m.id]||{}).note;
      if(nv(note)){ noteSum+=note*m.cp; noteCp+=m.cp; } }
    if(s==="laeuft") cpLauf+=m.cp;
  });
  return {cp, cpLauf, n, proKat, note: noteCp?noteSum/noteCp:null};
}

/* ============================================================
   14 — PLANER
   ============================================================ */
let plDate=today(), plSel=0, plDragType=null, plDragTodo=null, todoPrio="mid";
let planFilter=null, katOffen="sport";
const PL_H0=6, PL_H1=24, PL_HH=34;

const TP_HH=30;                       /* etwas flacher als der Tagesplan: 7 Spalten */

/* ── Zwei Wochen nebeneinander ──────────────────────────
   Kein Vorlagen-Stundenplan mehr, sondern zwei echte Wochen — wie im
   Tagesplaner oben, nur eine Stufe gröber. Was sich wiederholt,
   heftest du an: angeheftete Blöcke stehen in jeder Woche, alles
   andere gilt nur für die Woche, in der es steht.

   Ablage:
     S.tplan[wochentag]        angeheftet, gilt immer
     S.tplanWoche[montag][tag] nur diese eine Woche
   ──────────────────────────────────────────────────────── */
let tpWoche=dk(sow(new Date()));          /* linke Spalte = diese Woche */
const wochenSchluessel=d=>dk(sow(d));

/* Alles, was in einer bestimmten Woche an einem Tag steht. */
const istAus=(mk,id)=>((S.tplanAus||{})[mk]||[]).includes(id);
function wocheTag(mk,i,mitAusgesetzten){
  const fest=tplanTag(i).map(b=>({...b,fix:true,aus:istAus(mk,b.id)}))
    .filter(b=>mitAusgesetzten||!b.aus);
  const eigen=(((S.tplanWoche||{})[mk]||{})[i]||[]).map(b=>({...b,fix:false,aus:false}));
  return fest.concat(eigen).sort((a,b)=>(a.start||"").localeCompare(b.start||""));
}
/* Angeheftetes für eine Woche aussetzen, ohne die Anheftung zu
   verlieren: der Block bleibt in der Vorlage, steht aber in dieser
   einen Woche auf der Ausnahmeliste. */
function ausSchalten(mk,id,an){
  S.tplanAus=S.tplanAus||{};
  const l=S.tplanAus[mk]=S.tplanAus[mk]||[];
  const i=l.indexOf(id);
  if(an&&i<0) l.push(id);
  if(!an&&i>=0) l.splice(i,1);
  if(!l.length) delete S.tplanAus[mk];
  save();
}
/* Zeigt der Filter diesen Baustein gerade? */
const imFilter=b=>!planFilter||katVon(blockById(b.type))===planFilter;
function blockSuchen(mk,i,id){
  return wocheTag(mk,i,true).find(b=>b.id===id)||null;
}
/* Aus beiden Ablagen entfernen — beim Umhängen, Anheften und Löschen
   ist das der sichere Weg, sonst bliebe eine Kopie zurück. */
function blockRaus(mk,id){
  for(let x=0;x<7;x++){
    if(S.tplan&&S.tplan[x]){ S.tplan[x]=S.tplan[x].filter(b=>b.id!==id);
      if(!S.tplan[x].length) delete S.tplan[x]; }
    const W=(S.tplanWoche||{})[mk];
    if(W&&W[x]){ W[x]=W[x].filter(b=>b.id!==id);
      if(!W[x].length) delete W[x]; }
  }
  if(S.tplanWoche&&S.tplanWoche[mk]&&!Object.keys(S.tplanWoche[mk]).length)
    delete S.tplanWoche[mk];
}

function tplanStunden(){
  /* Beide gezeigten Wochen zusammen, damit die Raster gleich hoch
     bleiben und man sie nebeneinander lesen kann. */
  let von=24, bis=0;
  const mk2=dk(addD(parsedk(tpWoche),7));
  const sieh=b=>{ von=Math.min(von,Math.floor(hm2min(b.start)/60));
                  bis=Math.max(bis,Math.ceil(hm2min(b.end)/60)); };
  for(let i=0;i<7;i++){ wocheTag(tpWoche,i).forEach(sieh); wocheTag(mk2,i).forEach(sieh); }
  if(von>bis) return [6,23];
  return [Math.max(0,Math.min(von-1,22)), Math.min(24,Math.max(bis+1,von+3))];
}

function wochenRaster(mk,H0,H1){
  const mo=parsedk(mk);
  let stunden="";
  for(let h=H0;h<H1;h++)
    stunden+=`<div style="height:${TP_HH}px;border-top:1px solid var(--line);font-family:var(--f-mono);
      font-size:9px;color:var(--text-faint);padding-right:5px;text-align:right;line-height:1">${p2(h)}</div>`;

  const spalte=i=>{
    const tag=dk(addD(mo,i));
    let rows="";
    for(let h=H0;h<H1;h++)
      rows+=`<div data-wslot="${mk}|${i}|${h}" style="height:${TP_HH}px;border-top:1px solid var(--line);cursor:pointer"></div>`;
    let bl="";
    wocheTag(mk,i).filter(imFilter).forEach(b=>{
      const t=blockById(b.type), sperre=IST_SPERRE(b.type);
      const von=hm2min(b.start), bis=Math.max(von+15,hm2min(b.end));
      const top=(von/60-H0)*TP_HH, hh=Math.max(15,(bis-von)/60*TP_HH);
      bl+=`<div data-wblk="${mk}|${i}|${b.id}" class="${sperre?"tp-sperre":""}${b.fix?" tp-fix":""}"
        title="${esc(b.note||t.label)} · ${b.start}–${b.end}${
          b.fix?" · angeheftet, steht jede Woche":""}${sperre?" · gesperrte Zeit":""}"
        style="position:absolute;left:2px;right:2px;top:${top}px;height:${hh-2}px;border-radius:var(--r-xs);
        ${sperre?"":`background:${t.bg};`}padding:${hh>28?"4px 6px":"0 6px"};overflow:hidden;cursor:pointer;
        box-shadow:var(--sh-1);color:${sperre?"var(--text-dim)":"#08111a"};font-size:${hh>28?"11px":"9.5px"};line-height:1.2">
        ${b.fix?`<span class="tp-nadel" aria-label="angeheftet">📌</span>`:""}
        <b style="font-weight:700">${esc(b.note||t.label)}</b>${
          hh>40?`<div style="opacity:.75;font-size:9px;margin-top:1px">${b.start}–${b.end}</div>`:""}</div>`;
    });
    return `<div class="tp-sp${tag===today()?" heute":""}">
      <div class="tp-kopf">
        <span>${TWD[i]} <i>${addD(mo,i).getDate()}.</i></span>
        ${tag<=today()&&solideTag(tag)?`<span class="tp-solid" title="Solider Tag — alle vier Ziele erfüllt">${ico("star")}</span>`:""}
      </div>
      <div class="tp-spalte">${rows}${bl}</div>
    </div>`;
  };
  return `<div class="tp-scroll"><div class="tp-raster">
    <div class="tp-uhr"><div class="tp-kopf">&nbsp;</div>${stunden}</div>
    ${[...Array(7)].map((_,i)=>spalte(i)).join("")}
  </div></div>`;
}

function wochenTitel(mk){
  const mo=parsedk(mk), so=addD(mo,6);
  const jetzt=wochenSchluessel(new Date());
  const diff=Math.round((mo-parsedk(jetzt))/604800000);
  const name = diff===0?"Diese Woche" : diff===1?"Nächste Woche"
             : diff===-1?"Letzte Woche" : diff>0?`In ${diff} Wochen` : `Vor ${-diff} Wochen`;
  /* Beide Zahlen müssen dasselbe meinen: Sperren sind kein Training,
     also zählen sie weder zur Anzahl noch zu den Stunden. Vorher war
     die Anzahl inklusive Sperren — das passte nicht zusammen. */
  const training=[...Array(7)].flatMap((_,i)=>wocheTag(mk,i))
    .filter(imFilter).filter(b=>!IST_SPERRE(b.type));
  const ausgesetzt=((S.tplanAus||{})[mk]||[]).length;
  const anzahl=training.length;
  const min=training.reduce((x,b)=>x+Math.max(0,hm2min(b.end)-hm2min(b.start)),0);
  const std=Math.round(min/6)/10;
  return `<div class="tp-titel">
    <span class="tp-titel-n">${name}<i>${fmtShort(mo)} – ${fmtShort(so)}</i></span>
    <span class="tag" title="Geplante Trainings dieser Woche und ihre Dauer zusammengerechnet. Gesperrte Zeiten zählen nicht mit.">${
      anzahl?`${anzahl} ${anzahl===1?"Eintrag":"Einträge"} · ${std} h`:"nichts geplant"}</span>
    ${ausgesetzt?`<button class="tag tp-aus-z" data-ausz="${mk}"
      title="Angeheftetes, das in dieser Woche nicht stattfindet — antippen zum Zurückholen">${ausgesetzt} ausgesetzt</button>`:""}
  </div>`;
}

function tplanWiring(V){
  V.querySelectorAll("[data-bt]").forEach(b=>{
    b.onclick=()=>{ plDragType=b.dataset.bt;
      V.querySelectorAll("[data-bt]").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      toast(blockById(plDragType).label+" gewählt, jetzt eine Stunde antippen"); };
    b.ondragstart=()=>{ plDragType=b.dataset.bt; };
  });
  V.querySelectorAll("[data-wslot]").forEach(s=>s.onclick=()=>{
    const [mk,i,h]=s.dataset.wslot.split("|");
    if(!plDragType){ toast("Erst einen Baustein wählen","x"); return; }
    openTBlock(mk,+i,plDragType,p2(+h)+":00",p2(Math.min(23,+h+1))+":00",null,null,false);
  });
  V.querySelectorAll("[data-wblk]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const [mk,i,id]=b.dataset.wblk.split("|");
    const bl=blockSuchen(mk,+i,id);
    if(bl) openTBlock(mk,+i,bl.type,bl.start,bl.end,bl.note,id,bl.fix);
  });
}

/* Eigener Baustein, etwa ein Uni-Modul. Farbe aus einer Palette, die
   sich von den bestehenden abhebt — freie Farbwahl führt erfahrungs-
   gemäß zu zwei kaum unterscheidbaren Tönen. */
/* Palette für eigene Bausteine: nach Farbfamilien sortiert, damit man
   gezielt „noch ein Blau" findet statt zwischen Zufallstönen zu suchen.
   Jede Zeile ist eine Familie von hell nach kräftig. Alle Töne sind auf
   Lesbarkeit der dunklen Blockschrift geprüft. */
const FARB_FAMILIEN=[
  ["Blau",   ["#9dd5f2","#6ab7e8","#3091c1","#3683db","#5f7fe0","#9db4f2"]],
  ["Grün",   ["#a8e0b4","#7ad194","#5ec47a","#3fae63","#4d9e6e","#7fc9a8"]],
  ["Türkis", ["#9df0e6","#4fe3d2","#35bfb2","#3fc9a4","#6fd9c0","#2aa697"]],
  ["Gelb",   ["#f0d58a","#e8c35c","#d9a441","#c9892e","#b2906e","#e0b878"]],
  ["Orange", ["#f5c0a8","#eda893","#ed7134","#e8825e","#d4612c","#c47a4a"]],
  ["Rot",    ["#f09aa2","#e35d6a","#cf4453","#e07a85","#b83d4a","#f0b5bb"]],
  ["Violett",["#c9b0f5","#9d8cf0","#8b7cf0","#a86fe0","#7c5fd0","#bb70e0"]],
  ["Rosa",   ["#f0b8d8","#d488b8","#c96fa8","#e09ec9","#b05890","#f0a0c8"]],
  ["Grau",   ["#b8c2cc","#9aa6b2","#7d8899","#5f6b7a","#a8b4c0","#6e7a88"]],
];
const EIGEN_FARBEN=FARB_FAMILIEN.flatMap(([,l])=>l);

/* Was ist in dieser Woche ausgesetzt — und wie hole ich es zurück?
   Ohne diesen Weg wäre „nur diese Woche aussetzen" eine Einbahnstraße,
   seit das Ausgesetzte nicht mehr blass im Raster steht. */
function ausgesetztModal(mk){
  const ids=((S.tplanAus||{})[mk]||[]);
  const liste=ids.map(id=>{
    for(let i=0;i<7;i++){
      const b=(tplanTag(i)||[]).find(x=>x.id===id);
      if(b) return {b,tag:i};
    }
    return null;
  }).filter(Boolean);
  if(!liste.length){ toast("Nichts ausgesetzt"); return; }
  modal(`<h3>Diese Woche ausgesetzt</h3>
    <p style="color:var(--text-dim);font-size:var(--t-sm);line-height:1.5;margin-bottom:12px">
      Angeheftetes, das in der Woche ab ${fmtShort(parsedk(mk))} nicht stattfindet.
      Es steht weiter in jeder anderen Woche.</p>
    <div class="aus-liste">${liste.map(({b,tag})=>{
      const t=blockById(b.type);
      return `<button class="aus-zeile" data-zurueck="${b.id}">
        <i style="background:${t.bg}"></i>
        <span>${esc(b.note||t.label)}<small>${TWDL[tag]} · ${b.start}–${b.end}</small></span>
        <b>zurückholen</b></button>`;}).join("")}</div>
    <div class="mo-act">
      <button class="b" onclick="closeModal()">Schließen</button>
      ${liste.length>1?`<button class="b b-1" id="ausAlle">Alle zurückholen</button>`:""}</div>`);
  document.querySelectorAll("[data-zurueck]").forEach(b=>b.onclick=()=>{
    ausSchalten(mk,b.dataset.zurueck,false);
    closeModal(); toast("Wieder in dieser Woche"); R.planer();
  });
  document.getElementById("ausAlle")?.addEventListener("click",()=>{
    delete S.tplanAus[mk]; save(); closeModal();
    toast("Alles zurückgeholt"); R.planer();
  });
}

function neueArt(kat){
  const belegt=new Set(blockTypes().map(t=>t.bg));
  /* Vorschlag: erster freier Ton der Familie, die zur Kategorie passt —
     Uni-Module bekommen also von sich aus ein Blau. */
  const heim={uni:"Blau",sport:"Grün",alltag:"Gelb"}[kat]||"Blau";
  const heimfam=FARB_FAMILIEN.find(([n])=>n===heim)[1];
  let farbe=heimfam.find(c=>!belegt.has(c))||EIGEN_FARBEN.find(c=>!belegt.has(c))||EIGEN_FARBEN[0];
  modal(`<h3>Eigener Baustein</h3>
    <p style="color:var(--text-dim);font-size:var(--t-sm);margin-bottom:12px">
      Kommt unter „${esc(KATEGORIEN.find(k=>k[0]===kat)?.[1]||kat)}".</p>
    <label>Name</label><input id="naName" placeholder="z. B. Technische Mechanik" autofocus>
    <label>Farbe</label>
    <div id="naFarben">${FARB_FAMILIEN.map(([name,liste])=>
      `<div class="na-fam"><span class="na-fam-n">${name}</span>
        <div class="na-reihe">${liste.map(c=>
          `<button class="na-farbe${c===farbe?" on":""}${belegt.has(c)?" belegt":""}" data-naf="${c}"
            style="background:${c}" title="${c}${belegt.has(c)?" — schon vergeben":""}"></button>`).join("")}</div>
      </div>`).join("")}</div>
    <div class="mo-act">
      <button class="b" onclick="closeModal()">Abbrechen</button>
      <button class="b b-1" id="naOk">Anlegen</button></div>`);
  const M=document.getElementById("naFarben");
  M.querySelectorAll("[data-naf]").forEach(b=>b.onclick=()=>{
    farbe=b.dataset.naf;
    M.querySelectorAll("[data-naf]").forEach(x=>x.classList.remove("on"));

/* ── Eintragen von außen ────────────────────────────────
   Damit man vom Sperrbildschirm oder per Siri etwas eintragen kann,
   ohne die App zu durchsuchen. Ein Kurzbefehl braucht dafür nur
   „URL öffnen" — kein Zugangsschlüssel, keine Schnittstelle: NOVA
   liest den Anhang der Adresse, trägt ein und speichert.

   Beispiele:
     #haken=<kennung>     Gewohnheit für heute umschalten
     #wert=schlaf:7.5     Schlaf, lernen, handy oder score setzen
     #aufgabe=Milch       neue Aufgabe anlegen
   ──────────────────────────────────────────────────────── */
const URL_WERTE={schlaf:"sleepHours", lernen:"study", handy:"phone", score:"sleepScore"};

function ausUrl(){
  const roh=(location.hash||"").replace(/^#/,"");
  if(!roh) return;
  history.replaceState(null,"",location.pathname+location.search);
  let meldung=null;
  try{
    const [feld,...rest]=decodeURIComponent(roh).split("=");
    const wert=rest.join("=");
    if(feld==="haken"){
      const h=activeHabits().find(x=>x.id===wert||x.name===wert);
      if(!h) meldung=["Gewohnheit nicht gefunden","x"];
      else{ toggleHabit(today(),h.id);
        meldung=[`${h.name} ${S.habitLog[today()]?.[h.id]?"abgehakt":"zurückgenommen"}`]; }
    }
    else if(feld==="wert"){
      const [was,zahl]=wert.split(":");
      const f2=URL_WERTE[String(was).toLowerCase()];
      const v=parseFloat(String(zahl).replace(",","."));
      if(!f2||isNaN(v)) meldung=["Wert nicht verstanden","x"];
      else{ S.metrics[today()]=Object.assign({},S.metrics[today()],{[f2]:v});
        save(); meldung=[`${was} auf ${v} gesetzt`]; }
    }
    else if(feld==="aufgabe"&&wert.trim()){
      S.todos.push({id:uid(),text:wert.trim(),done:false,type:"short",
        priority:"mid",date:today(),createdAt:Date.now()});
      save(); meldung=["Aufgabe angelegt"];
    }
  }catch(e){ meldung=["Konnte den Aufruf nicht lesen","x"]; }
  if(meldung) setTimeout(()=>toast(meldung[0],meldung[1]||"check"),700);
}

      Lege in der Kurzbefehle-App einen Kurzbefehl mit der einzigen Aktion
      <b>„URL öffnen"</b> an und setze eine dieser Adressen ein. NOVA öffnet sich,
      trägt ein und speichert. Dein Zugangsschlüssel bleibt außen vor — die App
      hat ihn auf diesem Gerät ohnehin.</p>
    <div style="display:flex;flex-direction:column;gap:7px;max-height:46vh;overflow-y:auto">
      ${activeHabits().map(h=>zeile(h.name, `${basis}#haken=${h.id}`)).join("")}
      ${zeile("Schlaf eintragen (Zahl anpassen)", basis+"#wert=schlaf:7.5")}
      ${zeile("Lernzeit eintragen", basis+"#wert=lernen:3")}
      ${zeile("Aufgabe anlegen", basis+"#aufgabe=Text%20hier")}
    </div>
    <p style="font-size:var(--t-xs);color:var(--text-faint);line-height:1.55;margin-top:13px">
      Jeder Aufruf wirkt sofort. Ein versehentlicher Haken lässt sich in der App
      mit einem Tipp zurücknehmen — öffne solche Adressen trotzdem nur, wenn du
      sie selbst angelegt hast.</p>
    <div class="mo-act"><button class="b b-1" onclick="closeModal()">Schließen</button></div>`);
  document.querySelectorAll("[data-kb]").forEach(bt=>bt.onclick=()=>{
    navigator.clipboard?.writeText(bt.dataset.kb)
      .then(()=>toast("Adresse kopiert"))
      .catch(()=>toast("Kopieren ging nicht — Adresse von Hand übernehmen","x"));
  });
}

/* ============================================================
   15 — START
   ============================================================ */
load();
garminNeu=mergeGarmin();
if(garminNeu) persist();
shell();
if(cloudOn()){
  setSync("busy");
  pullCloud().then(async ok=>{
    const n=await holeSatz();
    if(ok||n) go(VIEW);
    if(n) setTimeout(()=>toast(`${n} Einheit${n===1?"":"en"} aus SATZ übernommen`,"run"),1000);
  });
} else setSync("off");
ausUrl();

/* ── Zwei Absicherungen für Handy und Rechner gleichzeitig ──────
   1. Eigene Sicherung im Hintergrund: Ist noch eine verzögerte
      Sicherung fällig, wenn die Seite verschwindet — Handy gesperrt,
      App gewechselt —, wird sofort hochgeladen statt zu warten.
      iOS pausiert Zeitgeber im Hintergrund fast augenblicklich.
   2. Wechselst du zurück zu NOVA, holt es sich unaufgefordert nach,
      was inzwischen aus SATZ dazukam — sonst müsste man von Hand
      neu laden, um Trainingsdaten vom Handy zu sehen. */
window.addEventListener("pagehide",()=>{ if(syncTimer){ clearTimeout(syncTimer); pushCloud(); } });
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ if(syncTimer){ clearTimeout(syncTimer); pushCloud(); } return; }
  if(!cloudOn()) return;
  holeSatz().then(n=>{ if(n){ go(VIEW); toast(`${n} Einheit${n===1?"":"en"} aus SATZ übernommen`,"run"); } });
});
if(garminNeu) setTimeout(()=>toast(`${garminNeu} Werte von Garmin ergänzt`,"heart"),1400);
if(imported) setTimeout(()=>toast(imported==="seed"
  ? "Dein Stand vom 1. August geladen" : "Daten aus deinem Tracker übernommen","cloud"),600);
</script>
