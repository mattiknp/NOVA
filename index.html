/* ── Eintragen von außen ────────────────────────────────
   Damit man vom Sperrbildschirm oder per Siri etwas eintragen kann,
   ohne die App zu durchsuchen. Ein Kurzbefehl braucht dafür nur
   „URL öffnen" — kein Zugangsschlüssel, keine Schnittstelle: NOVA
   liest den Anhang der Adresse, trägt ein und speichert.

   Beispiele:
     #haken=<kennung>     Gewohnheit für heute umschalten
     #wert=schlaf:7.5     Schlaf, lernen, handy oder score setzen
     #aufgabe=Milch       neue Aufgabe anlegen
   ──────────────────────────────────────────────────────── */
const URL_WERTE={schlaf:"sleepHours", lernen:"study", handy:"phone", score:"sleepScore"};

function ausUrl(){
  const roh=(location.hash||"").replace(/^#/,"");
  if(!roh) return;
  history.replaceState(null,"",location.pathname+location.search);
  let meldung=null;
  try{
    const [feld,...rest]=decodeURIComponent(roh).split("=");
    const wert=rest.join("=");
    if(feld==="haken"){
      const h=activeHabits().find(x=>x.id===wert||x.name===wert);
      if(!h) meldung=["Gewohnheit nicht gefunden","x"];
      else{ toggleHabit(today(),h.id);
        meldung=[`${h.name} ${S.habitLog[today()]?.[h.id]?"abgehakt":"zurückgenommen"}`]; }
    }
    else if(feld==="wert"){
      const [was,zahl]=wert.split(":");
      const f2=URL_WERTE[String(was).toLowerCase()];
      const v=parseFloat(String(zahl).replace(",","."));
      if(!f2||isNaN(v)) meldung=["Wert nicht verstanden","x"];
      else{ S.metrics[today()]=Object.assign({},S.metrics[today()],{[f2]:v});
        save(); meldung=[`${was} auf ${v} gesetzt`]; }
    }
    else if(feld==="aufgabe"&&wert.trim()){
      S.todos.push({id:uid(),text:wert.trim(),done:false,type:"short",
        priority:"mid",date:today(),createdAt:Date.now()});
      save(); meldung=["Aufgabe angelegt"];
    }
  }catch(e){ meldung=["Konnte den Aufruf nicht lesen","x"]; }
  if(meldung) setTimeout(()=>toast(meldung[0],meldung[1]||"check"),700);
}

<script type="module" id="glas3d" data-schlank>
/* NOVA · Thema „Glas“ (schlank, seit 12.11.2026)
   Hinter den Glasscheiben liegen die Modellwelten als eigene Seiten: welt/modell.html (Lichtwiese mit deiner Stadt)
   und welt/woog-modell.html (Training am Großen Woog). NOVA selbst lädt kein three.js und hat keinen eigenen
   WebGL-Renderer mehr: es schickt den Welten nur Ansicht und Tagesdaten. Die nicht gezeigte Welt wird nach 90 s entladen.
   Gebaut mit proben/welt-modell/nova_schlank.py. */

/* ── Diagramme in 3D: jede Säule bekommt eine Seitenfläche und einen Deckel ──
   Läuft für alle Balkendiagramme (auch ohne 3D-Hintergrund) und ändert nur die Zeichnung. */
(function(){
  const NS="http://www.w3.org/2000/svg";
  function saeulen3d(svg){
    if(svg.dataset.d3) return; const vb=svg.viewBox&&svg.viewBox.baseVal; if(!vb||vb.width<200) return;
    const bars=[...svg.querySelectorAll("rect,path")].filter(el=>{ const f=el.getAttribute("fill");
      if(!f||f==="none"||f==="transparent"||f.startsWith("url")) return false;
      if(el.classList.contains("sb-feld")||el.hasAttribute("data-sln")||el.closest("[data-d3teil]")) return false;
      let b; try{ b=el.getBBox(); }catch(e){ return false; } return b.width>2&&b.width<=60&&b.height>.5; });
    if(!bars.length) return; svg.dataset.d3="1"; svg.style.overflow="visible";
    bars.forEach(el=>{ const b=el.getBBox(), f=el.getAttribute("fill"), t=Math.min(5,Math.max(2,b.width*.16)), dy=t*.5;
      const g=document.createElementNS(NS,"g"); g.setAttribute("data-d3teil",""); g.setAttribute("pointer-events","none");
      const op=el.getAttribute("opacity"); if(op) g.setAttribute("opacity",op);
      const flaeche=(pts,fill,deck)=>{ const p=document.createElementNS(NS,"polygon"); p.setAttribute("points",pts.map(q=>q.map(v=>v.toFixed(1)).join(",")).join(" "));
        p.setAttribute("fill",fill); if(deck!=null) p.setAttribute("fill-opacity",deck); g.append(p); };
      const {x,y,width:w,height:h}=b;
      const seite=[[x+w,y],[x+w+t,y-dy],[x+w+t,y+h-dy],[x+w,y+h]], deckel=[[x,y],[x+t,y-dy],[x+w+t,y-dy],[x+w,y]];
      flaeche(seite,f); flaeche(seite,"#000",.34); flaeche(deckel,f); flaeche(deckel,"#fff",.34);
      el.parentNode.insertBefore(g,el); });
  }
  let plan=0; const alle=()=>{ plan=0; document.querySelectorAll(".views svg").forEach(saeulen3d); };
  const bald=()=>{ if(!plan) plan=setTimeout(alle,60); };
  const start=()=>{ const v=document.getElementById("views"); if(!v) return setTimeout(start,300);
    new MutationObserver(bald).observe(v,{childList:true,subtree:true}); bald(); };
  start();
})();

const farbwert=c=>{ const m=/var\((--[\w-]+)\)/.exec(c||""); return (m?getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim():c)||"#f69646"; };
const zahl=v=>Number(v).toLocaleString("de-DE",{maximumFractionDigits:1});

      return {farbe:farbwert(z.color), anteil:z.todayOk?1:Math.max(.3,Math.min(.9,teil)), an:z.todayOk}; }); }catch(e){}
  /* Uni: das Hörsaalzentrum füllt sich mit der Lernzeit von heute bis zum Tagesziel */

   nur dass jeder Tag seinen Platz bekommt: ein Haus, ein Park oder das Ende eines Blocks */
function stadtDaten(){

  const heuteOk=ok(t), ende=heuteOk?t:dk(addD(parsedk(t),-1));

  for(let d=parsedk(von);;d=addD(d,1)){ const k=dk(d); if(k>ende) break;
    const o=ok(k);

    if(o){ serie++; seit++; if(seit>=SCHUTZ_ALLE&&schutz<SCHUTZ_MAX){ schutz++; seit=0; }

    else { serie=0; schutz=0; seit=0; lauf=null; }

  let ziele=[false,false,false,false], farben=["#efb756","#a594f7","#62b0f5","#f2906b"];
  try{ const g=buildGoals(); ziele=g.map(z=>!!z.todayOk); farben=g.map(z=>farbwert(z.color)); }catch(e){}
  return {runs, heuteOk, laufAktiv:!!lauf, ziele, farben};
}

  try{ d.training=sportOn(today()).some(e=>!String(e.id||"").startsWith("stretch_")); }catch(e){ d.training=true; }
  try{ const st=stadtDaten(); d.solide=!!st.heuteOk; if(mitStadt) d.stadt=st; }catch(e){ d.solide=false; }
  try{ d.lernen=luLaeuft(); d.lernFach=d.lernen&&S.lernUhr.modul?luFachName(S.lernUhr.modul):""; }catch(e){}
  return d; }
const anWelt=(k,m)=>{ try{ const f=welten2[k].el; if(f.contentWindow) f.contentWindow.postMessage(m,"*"); }catch(e){} };
function weltZeigen(v){
  const k=v==="sport"?"sport":"campus", w=welten2[k];
  if(!w.geladen){ w.geladen=true;
    w.el.onload=()=>{ if(w.geladen) anWelt(k,{...weltDaten(k==="campus"),ansicht:VIEW,sofort:true,pause:weltAktiv!==k}); };
    w.el.src=new URL(w.datei+"?eingebettet=1&ansicht="+encodeURIComponent(v),location.href).href; }
  clearTimeout(w.weg);
  for(const kk in welten2) if(kk!==k){ const a=welten2[kk]; anWelt(kk,{novaWelt:1,pause:true}); clearTimeout(a.weg);
    /* die nicht gezeigte Welt nach 90 s ganz entladen: ihr WebGL-Speicher wird frei, beim nächsten Besuch lädt sie neu */
    if(a.geladen) a.weg=setTimeout(()=>{ if(weltAktiv===kk) return; a.geladen=false; a.el.onload=null; a.el.src="about:blank"; },90000); }
  weltAktiv=k;
  document.body.classList.add("gl-iframewelt");
  document.body.classList.toggle("gl-sportwelt",k==="sport"); document.body.classList.toggle("gl-campuswelt",k==="campus");
  anWelt(k,{...weltDaten(k==="campus"),ansicht:v,pause:false});
}
setInterval(()=>{ if(weltAktiv&&!document.hidden) anWelt(weltAktiv,weltDaten(weltAktiv==="campus")); },60000);
/* Lernmodus: Lichtrand und Startwelle in NOVA, die Campus-Welt fliegt zum HMZ und lässt es leuchten */
const lernAura=document.createElement("div"); lernAura.id="lernAura";
const lernWelle=document.createElement("div"); lernWelle.id="lernWelle";
for(const e of [lernAura,lernWelle]){ e.setAttribute("aria-hidden","true"); document.body.append(e); }
let weltLernStand=null;
window.weltLernen=function(an){
  if(an===weltLernStand) return; const erstes=weltLernStand===null; weltLernStand=an;
  if(an&&!erstes&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
    const quelle=[document.getElementById("luGross"),document.querySelector("#luLeiste .lu-l-zeit")].find(e=>e&&e.getBoundingClientRect().width);
    if(quelle){ const q=quelle.getBoundingClientRect(); lernWelle.style.setProperty("--wx",(q.left+q.width/2)+"px"); lernWelle.style.setProperty("--wy",(q.top+q.height/2)+"px"); }
    lernWelle.classList.remove("los"); void lernWelle.offsetWidth; lernWelle.classList.add("los"); }
  if(!erstes||an) anWelt("campus",{novaWelt:1,lernen:an,lernFach:an&&S.lernUhr&&S.lernUhr.modul?luFachName(S.lernUhr.modul):""});
};

/* ── Kartenfenster auf Heute, Uni und Training ── */
const ansichten=document.getElementById("views");
function zustand(){
  const offen=!!blickFuer(VIEW).fenster&&(!ansichten||ansichten.scrollTop<70);
  document.body.classList.toggle("gl-karte",offen);
}
const ORTE={heute:"Deine Stadt",uni:"Lichtwiese · TU Darmstadt",sport:"TSG 1846 · am Großen Woog"};
function ortText(){ const el=document.querySelector("#v-heute .gl-ort"); if(!el) return;
  try{ const n=stadtDaten().runs.reduce((a,r)=>a+r.filter(x=>x.typ==="haus").length,0);
    el.textContent=n?`Deine Stadt · ${n} ${n===1?"Haus":"Häuser"}`:"Deine Stadt · der erste solide Tag legt den Grundstein"; }catch(e){} }
function fenster(ansicht){
  const v=document.getElementById("v-"+ansicht), art=blickFuer(ansicht).fenster; if(!v||!art) return;
  if(!v.firstElementChild||!v.firstElementChild.classList.contains("gl-fenster")){
    const f=document.createElement("div"); f.className="gl-fenster"+(art==="kurz"?" kurz":"");
    f.innerHTML=`${ORTE[ansicht]?`<span class="gl-ort">${ORTE[ansicht]}</span>`:""}<span class="gl-tipp">Doppelklick: Karte erkunden</span><span class="gl-quelle">Kartendaten © OpenStreetMap-Mitwirkende</span>`;
    v.prepend(f); f.addEventListener("dblclick",()=>erkundenAn());
  }
  if(ansicht==="heute") ortText();
}
/* NOVA meldet neue Daten: die gezeigte Welt sofort aktualisieren (statt erst beim Minutentakt) */
let bestPlan=0;
function bestuecke(){ clearTimeout(bestPlan); bestPlan=setTimeout(()=>{ if(weltAktiv) anWelt(weltAktiv,weltDaten(weltAktiv==="campus")); ortText(); },400); }

/* ── Kartenmodus: Doppelklick auf die Karte gibt die Welt frei (bewegen, drehen, zoomen macht die Welt selbst).
   Fertig oder Esc führt zurück. ── */
const erk=document.createElement("div"); erk.id="glasErkunden"; erk.hidden=true;
erk.innerHTML=`<div class="ge-leiste"><span>Ziehen verschiebt · Umschalt oder rechte Maustaste dreht · Scrollen zoomt</span><button type="button" class="ge-zu">Fertig</button></div>`;
document.body.append(erk);
let erkunden=false;
function erkundenAn(){ if(erkunden||!weltAktiv) return; erkunden=true; document.body.classList.add("gl-erkunden"); erk.hidden=false;
  anWelt(weltAktiv,{novaWelt:1,erkunden:true}); }
function erkundenAus(){ if(!erkunden) return; erkunden=false; document.body.classList.remove("gl-erkunden"); erk.hidden=true;
  if(weltAktiv) anWelt(weltAktiv,{novaWelt:1,erkunden:false}); }
erk.querySelector(".ge-zu").addEventListener("click",e=>{ e.stopPropagation(); erkundenAus(); });
erk.querySelector(".ge-leiste").addEventListener("pointerdown",e=>e.stopPropagation());
addEventListener("keydown",e=>{ if(e.key==="Escape"&&erkunden) erkundenAus(); });

for(const a of Object.keys(BLICKE)){
  if(typeof R[a]!=="function") continue;
  const alt=R[a]; R[a]=function(){ const r=alt.apply(this,arguments); try{ fenster(a); }catch(e){ console.warn(e); } return r; };
}
ansichten&&ansichten.addEventListener("scroll",zustand,{passive:true});
window.glasBestuecke=bestuecke;

/* ── Seitenwechsel: Glas tritt zurück, Kamera zieht weiter, die neue Seite baut sich gestaffelt auf ── */
let wechselZeit=0;
function einblenden(){
  document.body.classList.remove("gl-wechsel");
  const v=document.querySelector(".view.on"); if(!v||RUHIG) return;
  const teile=[...v.children].flatMap(k=>k.classList.contains("grid")&&k.children.length<7?[...k.children]:[k]).slice(0,9);
  teile.forEach((el,i)=>el.animate([{opacity:0,transform:"translateY(18px) scale(.985)",filter:"blur(7px)"},{opacity:1,transform:"none",filter:"blur(0)"}],
    {duration:480,delay:i*42,easing:AUS,fill:"backwards"}));
}
function wechsel(v){
  erkundenAus();
  weltZeigen(v); zustand();
}
const altGo=window.go;
if(typeof altGo==="function"){
  window.go=function(v){
    const vor=VIEW;
    /* Das Glas tritt zurück, bevor NOVA die neue Seite zeichnet */
    if(!RUHIG&&v!==vor&&NAV.some(n=>n.id===v)){ document.body.classList.add("gl-wechsel"); void document.body.offsetWidth; }
    /* Das Einblenden ist fest eingeplant, bevor irgendetwas anderes läuft: selbst bei einem Fehler bleibt die Seite nie verborgen */
    clearTimeout(wechselZeit); wechselZeit=setTimeout(einblenden,RUHIG?0:240);
    const r=altGo.apply(this,arguments);
    if(VIEW!==vor){ try{ wechsel(VIEW); }catch(e){ console.warn(e); } }
    return r;
  };
}

/* Im schmalen Dock zeigt die Beschriftung sich als Hinweis neben der Kachel; der Browser-Hinweis wäre doppelt */
function ohneTitel(){ document.querySelectorAll(".rail .rl[title]").forEach(b=>{ b.setAttribute("aria-label",b.title); b.removeAttribute("title"); }); }
ohneTitel(); new MutationObserver(ohneTitel).observe(document.getElementById("app"),{childList:true});

const startAnsicht=typeof VIEW==="string"?VIEW:"heute";
try{ fenster(startAnsicht); }catch(e){}
zustand();
weltZeigen(startAnsicht);
}
</script>
</body>
</html>
