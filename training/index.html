<!--
THESIS: Ein Trainingsbuch, das weiß, dass Tennis und Kniebeugen nicht dasselbe
sind. Es verweigert das eine Formular für alles: Disziplinen mit Sätzen bekommen
ein Satzprotokoll, Disziplinen mit Dauer bekommen eine Uhr. Kein Dashboard voran.
OWN-WORLD: Teil der NOVA-Familie — Grund #080b12, Flächen aus Weiß bei 3 %,
Avenir Next als Anzeigeschrift, Ziffern in Mono. Je Disziplin eine eigene Farbe,
die die ganze laufende Einheit einfärbt. Keine Karten als Seitengerüst.
STORY: Er kommt in die Halle, tippt eine Disziplin, trainiert, tippt fertig.
Die Einheit landet ohne Zutun in NOVA.
FIRST VIEWPORT: Sechs Disziplinen als volle Reihen über den Schirm, jede in
ihrer Farbe, Daumen erreicht alle. Darunter der heutige Tag in einer Zeile.
Läuft eine Einheit, ersetzt sie alles und der aktuelle Satz füllt den Schirm.
FORM: Satzprotokoll als Vollbild-Schrittwerk. Dauer-Disziplinen werden
nachgetragen statt mitgestoppt — beim Tennis steht man nicht am Handy.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<style>
:root{
  --bg:#080b12; --surf:rgba(255,255,255,.035); --surf-2:rgba(255,255,255,.06);
  --line:rgba(120,160,190,.13); --line-2:rgba(120,160,190,.26);
  --text:#e8eef4; --dim:#9fb2c4; --faint:#6a7d91;
  --c1:#4fe3d2;
  --tennis:#4fe3d2; --kraft:#ff7a5c;
  --athletik:#ffd166; --zone2:#5a9ded; --mobility:#ff6b9d;
  /* Diagrammfarben — nicht dieselben wie oben. Flächen auf dunklem
     Grund brauchen andere Werte als Symbole. Gegen Rotgrün- und
     Blaugelbschwäche geprüft, schlechtestes Paar ΔE 11,2. */
  --k-tennis:#00ab9a; --k-athletik:#af9100; --k-kraft:#bb4717;
  --k-mobility:#ac3c8a; --k-zone2:#2d74ca;
  --good:#52c98a; --warn:#d9a441; --bad:#e0697c;
  --f-disp:"Avenir Next","Futura","Segoe UI",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px; --r-s:9px; --r-pill:999px;
  --ez:cubic-bezier(.22,.61,.36,1); --d1:.16s; --d2:.28s;
  --pad-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); font-family:var(--f-disp);
  font-size:16px; line-height:1.5; overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
input,select,textarea{
  width:100%; background:var(--surf); border:1px solid var(--line);
  border-radius:var(--r-s); padding:12px 13px;
}
input:focus,select,textarea:focus{outline:none;border-color:var(--line-2)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ── Gerüst ────────────────────────────────────────── */
#app{min-height:100%;display:flex;flex-direction:column}
.kopf{
  display:flex;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 12px;
}
.marke{font-family:var(--f-disp);font-size:19px;font-weight:700;letter-spacing:.16em;
  display:flex;align-items:baseline;gap:9px}
.marke i{font-style:normal;font-size:13px;font-weight:500;letter-spacing:.06em;color:var(--faint)}
.kopf-sub{margin-left:auto;font-size:12px;color:var(--faint)}
.kopf-akt{display:flex;gap:6px}
.ib{
  width:38px;height:38px;border-radius:var(--r-s);display:grid;place-items:center;
  border:1px solid var(--line);color:var(--dim);
  transition:border-color var(--d1) var(--ez),color var(--d1) var(--ez);
}
.ib:hover{border-color:var(--line-2);color:var(--text)}
.ib svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;padding:0 18px calc(24px + var(--pad-b))}
.b{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 18px;border-radius:var(--r-s);border:1px solid var(--line);
  font-size:15px;font-weight:500;color:var(--dim);
  transition:all var(--d1) var(--ez);
}
.b:hover{border-color:var(--line-2);color:var(--text);background:var(--surf)}
.b:active{transform:scale(.98)}
.b-1{background:var(--c1);border-color:var(--c1);color:#04231f;font-weight:700}
/* In einer laufenden Einheit trägt die Hauptaktion die Farbe der
   Disziplin — sonst hätte der Schirm zwei konkurrierende Signale. */
.b-dz{background:var(--dc);border-color:var(--dc);color:#0b1016;font-weight:700}
.b-dz:hover{filter:brightness(1.08)}
.b-1:hover{background:#63ead9;border-color:#63ead9;color:#04231f}
.b-w{width:100%}
.b-gr{padding:17px 20px;font-size:17px}
.b svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── Startschirm: die sechs Disziplinen ─────────────
   Volle Reihen statt Kachelraster. Der Daumen erreicht jede,
   und der Name steht groß genug, um ihn im Halbdunkel zu lesen. */
.frage{font-size:13px;color:var(--faint);margin:6px 0 14px;letter-spacing:.02em}
.disz{display:flex;flex-direction:column;gap:8px;margin-bottom:26px}
.dz{
  position:relative;display:flex;align-items:center;gap:15px;
  padding:19px 18px;border-radius:var(--r);overflow:hidden;
  border:1px solid color-mix(in srgb,var(--dc) 24%,transparent);
  background:color-mix(in srgb,var(--dc) 7%,transparent);
  transition:transform var(--d1) var(--ez),background-color var(--d2) var(--ez);
}
.dz:active{transform:scale(.985)}
.dz:hover{background:color-mix(in srgb,var(--dc) 13%,transparent)}
.dz-ico{
  width:40px;height:40px;flex:0 0 auto;border-radius:11px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--dc) 16%,transparent);color:var(--dc);
}
.dz-ico svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dz-n{font-size:18px;font-weight:600;letter-spacing:-.01em}
.dz-s{font-size:12.5px;color:var(--faint);margin-top:2px}
.dz-z{margin-left:auto;text-align:right;flex:0 0 auto}
.dz-z b{font-family:var(--f-mono);font-size:15px;font-weight:600;color:var(--dc);display:block}
.dz-z span{font-size:11px;color:var(--faint)}

/* ── Tagesleiste ───────────────────────────────────── */
.tag{border-top:1px solid var(--line);padding-top:16px}
.tag-k{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px}
.tag-t{font-size:14px;font-weight:600}
.tag-w{font-size:12px;color:var(--faint)}
.eintrag{
  display:flex;align-items:center;gap:12px;padding:12px 2px;
  border-bottom:1px solid var(--line);
}
.eintrag:last-child{border-bottom:0}
.e-punkt{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--dc)}
.e-n{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.e-d{font-family:var(--f-mono);font-size:14px;color:var(--dim)}
.e-x{color:var(--faint);width:28px;height:28px;display:grid;place-items:center;flex:0 0 auto}
.e-x svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.leer{padding:22px 4px;color:var(--faint);font-size:14px;line-height:1.6}

/* ── Laufende Einheit ──────────────────────────────── */
.lauf-kopf{
  display:flex;align-items:center;gap:13px;padding:16px 18px;
  background:color-mix(in srgb,var(--dc) 11%,transparent);
  border-bottom:1px solid color-mix(in srgb,var(--dc) 22%,transparent);
}
.lauf-n{font-size:17px;font-weight:600}
.lauf-uhr{margin-left:auto;font-family:var(--f-mono);font-size:22px;font-weight:600;color:var(--dc);font-variant-numeric:tabular-nums}

/* Das Satzwerk: der aktuelle Satz füllt den Schirm.
   Zwei Zahlen, vier Daumenflächen, ein Knopf. */
.satzwerk{padding:8px 0 0}
.sw-ueb{
  display:flex;align-items:center;gap:10px;justify-content:space-between;
  margin:14px 0 4px;
}
.sw-name{font-size:19px;font-weight:600;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw-satz{font-family:var(--f-mono);font-size:12.5px;color:var(--faint);flex:0 0 auto}
.sw-gitter{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.sw-feld{
  border:1px solid var(--line);border-radius:var(--r);padding:13px 12px 15px;
  background:var(--surf);text-align:center;
}
.sw-lab{font-size:11.5px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.sw-wert{
  font-family:var(--f-mono);font-size:2.9rem;font-weight:600;line-height:1.05;
  color:var(--dc);margin:7px 0 11px;font-variant-numeric:tabular-nums;
}
.sw-steu{display:flex;gap:8px}
.sw-steu button{
  flex:1;height:46px;border-radius:var(--r-s);border:1px solid var(--line);
  font-size:21px;font-weight:400;color:var(--dim);
  transition:all var(--d1) var(--ez);
}
.sw-steu button:hover{border-color:var(--dc);color:var(--dc)}
.sw-steu button:active{transform:scale(.95);background:color-mix(in srgb,var(--dc) 14%,transparent)}

/* Gemachte Sätze: als Liste, nicht als Tabelle — auf dem Handy
   liest man Zeilen, keine Spalten. */
.sw-liste{display:flex;flex-direction:column;gap:5px;margin:16px 0}
.sw-z{
  display:flex;align-items:center;gap:12px;padding:10px 13px;
  border-radius:var(--r-s);background:var(--surf);font-family:var(--f-mono);font-size:14px;
}
.sw-z-i{color:var(--faint);width:20px;flex:0 0 auto}
.sw-z-w{flex:1}
.sw-z-v{color:var(--faint);font-size:12px}
.sw-z.rekord{background:color-mix(in srgb,var(--dc) 13%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--dc) 30%,transparent)}
.sw-z.rekord .sw-z-v{color:var(--dc)}

/* Pausenuhr: läuft als Ring hinter der Zahl, nicht als Balken daneben */
.pause{
  display:grid;place-items:center;padding:22px 0 10px;position:relative;
}
.pause svg{position:absolute;width:132px;height:132px;transform:rotate(-90deg)}
.pause circle{fill:none;stroke-width:3}
.pause .spur{stroke:var(--line)}
.pause .voll{stroke:var(--dc);transition:stroke-dashoffset .95s linear}
.pause-z{font-family:var(--f-mono);font-size:2.1rem;font-weight:600;color:var(--dc);position:relative}
.pause-l{font-size:12px;color:var(--faint);margin-top:4px;position:relative}

/* ── Dauer-Erfassung (Tennis, Zone 2, Mobility) ────── */
.dauer{display:grid;place-items:center;padding:30px 0 22px}
.dauer-z{
  font-family:var(--f-mono);font-size:4.2rem;font-weight:600;line-height:1;
  color:var(--dc);font-variant-numeric:tabular-nums;letter-spacing:-.03em;
}
.dauer-l{font-size:13px;color:var(--faint);margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:9px 14px;border-radius:var(--r-pill);border:1px solid var(--line);
  font-size:14px;color:var(--dim);transition:all var(--d1) var(--ez);
}
.chip:hover{border-color:var(--line-2);color:var(--text)}
.chip.on{
  border-color:var(--dc);color:var(--dc);
  background:color-mix(in srgb,var(--dc) 13%,transparent);
}
.feldblock{margin:20px 0}
.feldblock label{display:block;font-size:12.5px;color:var(--faint);margin-bottom:8px}

/* Dauer beim Nachtragen: großes Schrittwerk, damit man sie
   mit dem Daumen trifft, ohne die Tastatur zu öffnen. */
.nt-dauer{display:flex;align-items:center;gap:10px}
.nt-dauer button{
  width:52px;height:52px;flex:0 0 auto;border-radius:var(--r-s);
  border:1px solid var(--line);font-size:23px;color:var(--dim);
  transition:all var(--d1) var(--ez);
}
.nt-dauer button:hover{border-color:var(--dc);color:var(--dc)}
.nt-dauer button:active{transform:scale(.94);background:color-mix(in srgb,var(--dc) 14%,transparent)}
.nt-z{
  flex:1;text-align:center;font-size:2rem;font-weight:600;color:var(--dc);
  font-variant-numeric:tabular-nums;
}

/* Vorschlag und RIR ─────────────────────────────────── */
.sw-koerper{flex:0 0 auto;display:grid;place-items:center;opacity:.9}
.sw-vor{
  display:grid;grid-template-columns:auto 1fr;gap:2px 12px;width:100%;text-align:left;
  padding:12px 14px;border-radius:var(--r);margin:12px 0 2px;
  border:1px dashed color-mix(in srgb,var(--dc) 46%,transparent);
  background:color-mix(in srgb,var(--dc) 9%,transparent);
  transition:background-color var(--d1) var(--ez);
}
.sw-vor:hover{background:color-mix(in srgb,var(--dc) 16%,transparent)}
.sw-vor-l{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);align-self:center}
.sw-vor-w{font-size:17px;font-weight:600;color:var(--dc)}
.sw-vor-g{grid-column:1/-1;font-size:12px;color:var(--faint);line-height:1.45}
.rir{margin:14px 0}
.rir-l{display:block;font-size:12.5px;color:var(--faint);margin-bottom:8px}

/* ── Verlauf ───────────────────────────────────────── */
/* ── Auswertung ──────────────────────────────────────
   Marken dünn, Gitter zurückhaltend, Zahlen in Textfarbe —
   nie in der Serienfarbe. */
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 26px}
.kpi-t{background:var(--surf);border-radius:var(--r);padding:13px 12px}
.kpi-v{font-size:1.45rem;font-weight:600;line-height:1.1;letter-spacing:-.02em}
.kpi-l{font-size:12.5px;color:var(--dim);margin-top:5px}
.kpi-s{font-size:11px;color:var(--faint);margin-top:2px}
.kpi-s .auf{color:var(--good)}
.kpi-s .ab{color:var(--warn)}

.dia{margin-bottom:32px}
.dia-t{font-size:15px;font-weight:600;letter-spacing:-.01em}
.dia-u{font-size:12.5px;color:var(--faint);margin:3px 0 14px;line-height:1.45}

.stap{display:flex;align-items:flex-end;gap:5px}
.stap-s{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.stap-b{width:100%;display:flex;flex-direction:column-reverse;justify-content:flex-start;gap:2px}
.stap-b i{display:block;width:100%;min-height:2px;border-radius:1px}
.stap-l{font-size:9.5px;color:var(--faint)}
.legende{display:flex;flex-wrap:wrap;gap:7px 15px;margin-top:14px}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.lg i{width:9px;height:9px;border-radius:3px;display:block;flex:0 0 auto}

/* Muskelverteilung: ein Farbton, mehr ist mehr — es geht um Menge,
   nicht um Zugehörigkeit. Deshalb kein Farbkreis. */
.mus{display:flex;flex-direction:column;gap:7px}
.mus-z{display:grid;grid-template-columns:74px 1fr 28px;align-items:center;gap:10px}
.mus-n{font-size:13px;color:var(--dim)}
.mus-b{height:14px;background:var(--surf);border-radius:4px;overflow:hidden}
.mus-b i{display:block;height:100%;background:var(--k-kraft);border-radius:0 4px 4px 0}
.mus-v{font-size:12px;color:var(--faint);text-align:right}

.lin{width:100%;height:auto;display:block;overflow:visible}
.lin-gitter{stroke:var(--line);stroke-width:1}
.lin-ax{fill:var(--faint);font-family:var(--f-mono);font-size:9.5px}
.lin-p{fill:none;stroke:var(--k-kraft);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.lin-pt{fill:var(--k-kraft);stroke:var(--bg);stroke-width:2;cursor:help}

/* ── Wochenplan ──────────────────────────────────────
   Punkte statt Häkchen: bei „2× pro Woche" sieht man auf einen
   Blick, ob eins oder beide stehen. */
.wp{margin-bottom:24px}
.wp-kopf{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px}
.wp-t{font-size:14px;font-weight:600}
.wp-z{font-size:12px;color:var(--faint)}
.wp-row{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:14px 15px;border-radius:var(--r);margin-bottom:6px;
  border:1px solid color-mix(in srgb,var(--dc) 22%,transparent);
  background:color-mix(in srgb,var(--dc) 6%,transparent);
  transition:transform var(--d1) var(--ez),opacity var(--d2) var(--ez);
}
.wp-row:active{transform:scale(.985)}
.wp-row.fertig{opacity:.5;border-style:dashed}
.wp-row.fertig:hover{opacity:1}
.wp-punkte{display:flex;gap:4px;flex:0 0 auto}
.wp-punkte i{
  width:9px;height:9px;border-radius:50%;display:block;
  border:1.5px solid color-mix(in srgb,var(--dc) 45%,transparent);
}
.wp-punkte i.voll{background:var(--dc);border-color:var(--dc)}
.wp-n{flex:1;min-width:0;font-size:16px;font-weight:600}
.wp-s{display:block;font-size:12px;font-weight:400;color:var(--faint);margin-top:2px}
.wp-st{flex:0 0 auto;font-family:var(--f-mono);font-size:12px;color:var(--dc);display:grid;place-items:center}
.wp-st svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* Übungsliste innerhalb eines laufenden Programms */
.prog-liste{display:flex;flex-direction:column;gap:3px;margin:14px 0 4px}
.prog-z{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:10px 12px;border-radius:var(--r-s);font-size:14px;color:var(--dim);
  transition:background-color var(--d1) var(--ez);
}
.prog-z:hover{background:var(--surf)}
.prog-z.jetzt{background:color-mix(in srgb,var(--dc) 13%,transparent);color:var(--text)}
.prog-z.fertig .prog-n{color:var(--faint)}
.prog-i{
  width:22px;height:22px;flex:0 0 auto;border-radius:7px;display:grid;place-items:center;
  font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);color:var(--faint);
}
.prog-z.jetzt .prog-i{border-color:var(--dc);color:var(--dc)}
.prog-z.fertig .prog-i{background:color-mix(in srgb,var(--dc) 20%,transparent);border-color:transparent;color:var(--dc)}
.prog-i svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.prog-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog-s{flex:0 0 auto;font-size:12px;color:var(--faint)}

.vtag{border-bottom:1px solid var(--line);padding:14px 0}
.vtag-k{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.vtag-d{font-size:14px;font-weight:600}
.vtag-s{font-family:var(--f-mono);font-size:12px;color:var(--faint);margin-left:auto}

/* ── Übungen ───────────────────────────────────────── */
.ub-gr{margin-bottom:22px}
.ub-t{font-size:12px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin-bottom:9px}
.ub{
  display:flex;align-items:center;gap:12px;padding:13px 14px;
  border-radius:var(--r-s);background:var(--surf);margin-bottom:5px;
  transition:background-color var(--d1) var(--ez);
}
.ub:hover{background:var(--surf-2)}
.ub-k{flex:0 0 auto;display:grid;place-items:center;width:26px}
.ub-n{flex:1;min-width:0;font-size:15px}
.ub-pr{font-family:var(--f-mono);font-size:13px;color:var(--dim)}
.ub-pr b{color:var(--kraft);font-weight:600}

/* ── Blatt (Dialog) ────────────────────────────────── */
.ov{
  position:fixed;inset:0;background:rgba(4,7,12,.72);backdrop-filter:blur(7px);
  display:none;align-items:flex-end;justify-content:center;z-index:60;
}

<script>
/* ============================================================
   NOVA Training — das Trainingsbuch

   Alles landet am Ende im selben Format, das NOVA lesen kann.
   ============================================================ */
const KEY="novatraining_v1", KEY_ALT="satz_v1";
const GH_USER="mattiknp", GH_REPO="routine-tracker", GH_FILE="training.json";
const GH_API=`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${GH_FILE}`;
const TOK_KEY="novatraining_gh_token", SYNC_KEY="novatraining_sync_on";
const TOK_ALT="satz_gh_token", SYNC_ALT="satz_sync_on";

/* ── Disziplinen ────────────────────────────────────
   `nova` ist die Art, unter der die Einheit in NOVA landet —
   deshalb genau die Kürzel, die dort schon existieren. */
/* `art` entscheidet den ganzen Ablauf:
   „satz"  — Einheit läuft mit, Sätze werden während des Trainings erfasst.
             Nur hier ist eine Uhr nützlich, weil zwischen den Sätzen Pause ist.
   „dauer" — nichts läuft. Man trägt hinterher ein, wie lange es ging.
             Beim Tennis steht man nicht am Handy, um eine Uhr zu starten. */
const DISZ=[
  {id:"tennis",   n:"Tennis",       nova:"tennis",   art:"dauer", farbe:"var(--tennis)", kf:"var(--k-tennis)", ico:"tennis",
   sub:["Training","Match","Medenspiel","Turnier","Paddel"], std:120},
  {id:"kraft",    n:"Kraft",        nova:"kraft",    art:"satz",  farbe:"var(--kraft)", kf:"var(--k-kraft)", ico:"hantel",
   sub:["Oberkörper","Unterkörper","Rumpf","Ganzkörper"], std:60},
  {id:"athletik", n:"Athletik",     nova:"kraft",    art:"dauer", farbe:"var(--athletik)", kf:"var(--k-athletik)", ico:"blitz",
   sub:["Sprünge","Würfe","Antritte","Koordination","Kondition"], std:45},

   sub:["Laufen","Rad","Ergometer","Schwimmen"], std:45},

/* ── Muskelkarte ────────────────────────────────────────

const MUSKEL={

  ruecken:"M35,44 h13 a3,3 0 0 1 3,3 v13 a3,3 0 0 1 -3,3 h-13 a3,3 0 0 1 -3,-3 v-13 a3,3 0 0 1 3,-3 z",
  schulter:"M25,42 a6,6 0 0 1 7,3 l-1,7 a6,6 0 0 1 -7,-3 z|M58,42 a6,6 0 0 0 -7,3 l1,7 a6,6 0 0 0 7,-3 z",

  waden:"M34,108 h5 l-1,12 h-4 z|M44,108 h5 l1,12 h-4 z",

};
const UEB_MUSKEL={

/* ── Programme ──────────────────────────────────────────
   Was du machst, steht fest. Wann, nicht.

   Jedes Programm hat eine feste Übungsliste und eine feste Anzahl
   pro Woche. Der Wochentag ist ein Vorschlag, keine Vorschrift —
   die Woche gilt als erfüllt, sobald die Anzahl steht, egal an
   welchen Tagen. Dieselbe Logik wie bei den Wochenzielen in NOVA,
   und sie passt zu einem Trainingsalltag, der sich verschiebt.
   ──────────────────────────────────────────────────────── */
const PROG_STD=[
  {id:"p_ok", name:"Oberkörper", disz:"kraft", proWoche:1, tag:"Mo",
   uebungen:[["Bankdrücken",4,8],["Klimmzüge",4,6],["Schulterdrücken",3,10],

             ["Bulgarian Split Squat",3,10],["Nordic Curls",3,6],["Wadenheben",3,15]]},
  {id:"p_a1", name:"Athletik 1", disz:"athletik", proWoche:1, tag:"Di",

   uebungen:[["Pallof Press",3,12],["Hanging Leg Raise",3,10],
             ["Seitstütz",3,45],["Bird Dog",3,10]]}
];
const progAlle=()=>S.programme&&S.programme.length?S.programme:PROG_STD;
const progById=id=>progAlle().find(p=>p.id===id)||null;
function progDieseWoche(id){
  const mo=dk(mow(new Date())), bis=dk(addT(mow(new Date()),6));
  return S.einheiten.filter(e=>e.programm===id&&e.datum>=mo&&e.datum<=bis).length;
}
function wochenPlan(){
  return progAlle().map(p=>{
    const ist=progDieseWoche(p.id);
    return {...p, ist, offen:Math.max(0,p.proWoche-ist), fertig:ist>=p.proWoche};
  });

/* ── Zustand ───────────────────────────────────────── */
const leer=()=>({einheiten:[],uebungen:UEB_STD.map(([g,n,kg])=>({id:uid(),gruppe:g,name:n,kg:!!kg})),

let S=leer(), VIEW="start", TICK=null;

function laden(){
  /* Wer die Vorfassung unter dem alten Namen schon benutzt hat,
     verliert dabei nichts — der Stand wandert einmalig mit. */
  try{
    if(!localStorage.getItem(KEY)&&localStorage.getItem(KEY_ALT)){
      localStorage.setItem(KEY,localStorage.getItem(KEY_ALT));
      if(localStorage.getItem(TOK_ALT)) localStorage.setItem(TOK_KEY,localStorage.getItem(TOK_ALT));
      if(localStorage.getItem(SYNC_ALT)) localStorage.setItem(SYNC_KEY,localStorage.getItem(SYNC_ALT));
    }
  }catch(e){}
  try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(leer(),JSON.parse(r));}catch(e){}
  if(!S.uebungen||!S.uebungen.length) S.uebungen=leer().uebungen;
}
function sichern(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(syncAn()) syncPlanen();
}
/* Für die Stellen, an denen wirklich etwas Bedeutsames entsteht:
   eine fertige Einheit, ein Nachtrag, eine Löschung. Kein Warten —
   auf dem Handy ist die App oft schon weggewischt, bevor der
   Zeitgeber unten losläuft. */
function sichernSofort(){

const I={

/* ── Auswertung ────────────────────────────────────── */
const minuten=e=>e.dauer||0;
const tagesMin=k=>S.einheiten.filter(e=>e.datum===k).reduce((a,e)=>a+minuten(e),0);
function wochenMin(mo){
  const bis=dk(addT(mo,6)), von=dk(mo);
  const o={};
  S.einheiten.filter(e=>e.datum>=von&&e.datum<=bis).forEach(e=>{ o[e.disz]=(o[e.disz]||0)+minuten(e); });
  return o;
}
/* Bestleistung je Übung: höchstes Gewicht, und dazu die
   Wiederholungen, die dabei geschafft wurden. */
function rekord(name){
  let best=null;
  S.einheiten.forEach(e=>(e.uebungen||[]).forEach(u=>{
    if(u.name!==name) return;
    (u.saetze||[]).forEach(s=>{
      if(!s.kg) return;
      if(!best||s.kg>best.kg||(s.kg===best.kg&&s.wdh>best.wdh)) best={kg:s.kg,wdh:s.wdh,datum:e.datum};
    });
  }));
  return best;
}
/* Was war vor diesem Satz das Beste? Zählt die abgeschlossenen
   Einheiten UND die Sätze der laufenden — sonst wäre in einer Einheit
   jeder Satz ein Bestwert, weil die Historie ihn noch nicht kennt. */
function bisherBest(name,laufend){
  let best=rekord(name);
  (laufend||[]).forEach(x=>{
    if(!x.kg) return;
    if(!best||x.kg>best.kg||(x.kg===best.kg&&x.wdh>best.wdh)) best={kg:x.kg,wdh:x.wdh};
  });
  return best;
}

/* Was schlägt die App für den nächsten Satz vor?
   Die Regel ist bewusst schlicht und nachvollziehbar: Hast du beim
   letzten Mal alle Sätze mit RIR 2 oder mehr geschafft, kannst du
   drauflegen. War es knapp, bleibt das Gewicht. Kein Algorithmus,
   den man nicht nachrechnen kann. */
function vorschlag(name){
  const l=letzteSaetze(name);
  if(!l||!l.saetze.length) return null;
  const mitKg=l.saetze.some(x=>x.kg);
  const best=l.saetze.reduce((a,x)=>!a||x.kg>a.kg?x:a,null);
  if(!mitKg) return {wdh:Math.max(...l.saetze.map(x=>x.wdh))+1, grund:"eine Wiederholung mehr als zuletzt"};
  const rirs=l.saetze.map(x=>x.rir).filter(x=>x!=null);
  const locker = rirs.length && rirs.every(r=>r>=2);
  const schritt = best.kg>=60?5:2.5;
  return locker
    ? {kg:best.kg+schritt, wdh:best.wdh, grund:`zuletzt alle Sätze mit RIR ${Math.min(...rirs)} — leg drauf`}
    : {kg:best.kg, wdh:best.wdh, grund:"zuletzt am Limit — Gewicht halten"};
}

const letzteSaetze=name=>{
  for(let i=S.einheiten.length-1;i>=0;i--){
    const u=(S.einheiten[i].uebungen||[]).find(x=>x.name===name);
    if(u&&u.saetze&&u.saetze.length) return {saetze:u.saetze,datum:S.einheiten[i].datum};
  }
  return null;
};

/* ── Verlauf ───────────────────────────────────────── */
/* ── Auswertung ─────────────────────────────────────────
   Vier Fragen, vier Formen. Die Form kommt aus der Frage:
     Wie viel pro Woche, woraus?  → gestapelte Balken
     Wie oft?                     → Kennzahl, kein Diagramm
     Welche Muskeln kommen dran?  → liegende Balken, sortiert
     Werde ich stärker?           → Linie je Übung
   ──────────────────────────────────────────────────────── */
const tonnage=e=>(e.uebungen||[]).reduce((a,u)=>
  a+u.saetze.reduce((x,s)=>x+((s.kg||0)*(s.wdh||0)),0),0);

const MUSKEL_NAME={brust:"Brust",ruecken:"Rücken",schulter:"Schulter",arme:"Arme",
  bauch:"Rumpf",beine:"Beine",po:"Gesäß",waden:"Waden"};

function muskelVerteilung(wochen){
  const ab=dk(addT(mow(new Date()),-7*(wochen-1)));
  const o={};
  S.einheiten.filter(e=>e.datum>=ab).forEach(e=>(e.uebungen||[]).forEach(u=>{
    const m=UEB_MUSKEL[u.name]||[];
    const ziele=m.includes("ganz")?Object.keys(MUSKEL).filter(k=>k!=="ganz"):m;
    ziele.forEach(k=>{ o[k]=(o[k]||0)+u.saetze.length; });
  }));
  return Object.entries(o).sort((a,b)=>b[1]-a[1]);
}

function uebungenMitVerlauf(){
  const z={};
  S.einheiten.forEach(e=>(e.uebungen||[]).forEach(u=>{
    if(u.saetze.some(x=>x.kg)) z[u.name]=(z[u.name]||0)+1;
  }));
  return Object.entries(z).filter(([,n])=>n>=3).sort((a,b)=>b[1]-a[1]).map(([n])=>n);
}
function uebungVerlauf(name){
  const p=[];
  S.einheiten.forEach(e=>{
    const u=(e.uebungen||[]).find(x=>x.name===name);
    if(!u) return;
    const t=u.saetze.reduce((a,s)=>a+((s.kg||0)*(s.wdh||0)),0);
    const best=u.saetze.reduce((a,s)=>Math.max(a,s.kg||0),0);
    if(t>0) p.push({datum:e.datum,tonnage:t,best});
  });
  return p;
}

const STAT_WOCHEN=10;

/* Gestapelte Balken. 2 px Luft zwischen den Abschnitten, damit
   angrenzende Farben sich nie berühren — das trägt neben der Legende
   als zweites Unterscheidungsmerkmal. */
function stapelBalken(daten,max){
  const H=110;
  return `<div class="stap">
    ${daten.map(w=>{
      const ges=Object.values(w.m).reduce((a,b)=>a+b,0);
      const teile=DISZ.filter(d=>w.m[d.id]);

        <div class="stap-b" style="height:${H}px">

            i===teile.length-1?"border-radius:4px 4px 0 0;":""}"></i>`).join("")}
        </div>
        <span class="stap-l mono">${w.mo.getDate()}.${w.mo.getMonth()+1}</span>
      </div>`;}).join("")}
  </div>`;
}

/* Eine Linie, eine Serie — keine Legende nötig, die Überschrift nennt
   sie. Punkte 8 px im Durchmesser, damit man sie trifft. */
function linie(p){
  if(p.length<2) return `<div class="leer">Noch zu wenige Einheiten für einen Verlauf.</div>`;
  const W=320,H=124,L=36,R=10,T=12,B=24;
  const werte=p.map(x=>x.best);
  const min=Math.min(...werte), max=Math.max(...werte);
  const spanne=Math.max(1,max-min);
  const x=i=>L+(W-L-R)*(p.length===1?0.5:i/(p.length-1));
  const y=v=>T+(H-T-B)*(1-(v-min)/spanne);
  const d=p.map((q,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(q.best).toFixed(1)}`).join(" ");
  return `<svg class="lin" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Bestes Gewicht je Einheit, ${p.length} Einheiten von ${zahl(min)} bis ${zahl(max)} Kilo">
    ${[0,0.5,1].map(t=>{const v=min+spanne*t;return `
      <line x1="${L}" y1="${y(v).toFixed(1)}" x2="${W-R}" y2="${y(v).toFixed(1)}" class="lin-gitter"/>
      <text x="${L-6}" y="${(y(v)+3.5).toFixed(1)}" class="lin-ax" text-anchor="end">${zahl(Math.round(v*10)/10)}</text>`;}).join("")}
    <path d="${d}" class="lin-p"/>
    ${p.map((q,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(q.best).toFixed(1)}" r="4" class="lin-pt">
      <title>${kurz(pdk(q.datum))}: ${zahl(q.best)} kg · ${Math.round(q.tonnage)} kg gesamt</title></circle>`).join("")}
    <text x="${L}" y="${H-6}" class="lin-ax" text-anchor="start">${kurz(pdk(p[0].datum))}</text>
    <text x="${W-R}" y="${H-6}" class="lin-ax" text-anchor="end">${kurz(pdk(p[p.length-1].datum))}</text>
  </svg>`;
}

R.verlauf=function(){
  const wochen=[...Array(STAT_WOCHEN)].map((_,i)=>mow(addT(new Date(),-7*(STAT_WOCHEN-1-i))));
  const daten=wochen.map(mo=>({mo,m:wochenMin(mo)}));

  const mo=mow(new Date()), voche=addT(mo,-7);

  const nJetzt=inWoche(mo).length, nVor=inWoche(voche).length;
  const tJetzt=inWoche(mo).reduce((a,e)=>a+tonnage(e),0);
  const aktiv=summen.filter(x=>x>0).length;
  const schnitt=aktiv?Math.round(summen.reduce((a,b)=>a+b,0)/aktiv):0;

  const mus=muskelVerteilung(4);
  const maxMus=Math.max(1,...mus.map(m=>m[1]));
  const ueList=uebungenMitVerlauf();
  if(statUeb&&!ueList.includes(statUeb)) statUeb=null;
  const uebung=statUeb||ueList[0]||null;
  const verlauf=uebung?uebungVerlauf(uebung):[];
  const tage=[...new Set(S.einheiten.map(e=>e.datum))].sort().reverse().slice(0,20);

  return `
  <div class="kopf">

    <div class="kpi">
      ${[[nJetzt,"Einheiten","diese Woche",nJetzt-nVor],
         [hmm(schnitt),"Schnitt","je aktive Woche",null],

        .map(([v,l,s2,dd])=>`<div class="kpi-t">
          <div class="kpi-v mono">${v}</div>
          <div class="kpi-l">${l}</div>
          <div class="kpi-s">${s2}${dd!==null&&dd!==0?` · <span class="${dd>0?"auf":"ab"}">${dd>0?"+":""}${dd}</span>`:""}</div>
        </div>`).join("")}
    </div>

    <section class="dia">
      <h2 class="dia-t">Minuten je Woche</h2>
      <p class="dia-u">Woraus sich dein Umfang zusammensetzt</p>
      ${stapelBalken(daten,max)}
      <div class="legende">
        ${DISZ.map(d=>`<span class="lg"><i style="background:${d.kf}"></i>${d.n}</span>`).join("")}
      </div>
    </section>

    <section class="dia">
      <h2 class="dia-t">Welche Muskeln kommen dran</h2>
      <p class="dia-u">Sätze der letzten vier Wochen</p>
      ${mus.length?`<div class="mus">
        ${mus.map(([k,n])=>`<div class="mus-z">
          <span class="mus-n">${MUSKEL_NAME[k]||k}</span>
          <span class="mus-b"><i style="width:${(n/maxMus*100).toFixed(1)}%"></i></span>
          <span class="mus-v mono">${n}</span>
        </div>`).join("")}
      </div>`:`<div class="leer">Noch keine Sätze erfasst.</div>`}
    </section>

    ${uebung?`<section class="dia" style="--dc:var(--k-kraft)">

/* ── Navigation ────────────────────────────────────── */
const NAV=[["start","Start","haus"],["verlauf","Verlauf","chart"],
           ["uebungen","Übungen","liste"],["einstellungen","Mehr","zahn"]];
const navi=()=>`<nav>${NAV.map(([id,t,i])=>
  `<button class="${VIEW===id?"on":""}" onclick="R2('${id}')">${ico(i)}<span>${t}</span></button>`).join("")}</nav>`;

function R2(v){ VIEW=v; zeichnen(); }
function zeichnen(){
  const v = S.laufend ? "laufend" : VIEW;
  document.getElementById("app").innerHTML=(R[v]||R.start)();
  uhrLauf();
  window.scrollTo(0,0);
}

/* Die Uhr läuft über setInterval, nicht über ein Neuzeichnen —
   sonst verlöre das Eingabefeld bei jedem Tick den Fokus. */
function uhrLauf(){
  clearInterval(TICK);
  if(!S.laufend) return;
  TICK=setInterval(()=>{
    const L=S.laufend; if(!L) return clearInterval(TICK);
    const s=Math.floor((Date.now()-L.start)/1000);
    const u=document.getElementById("uhr"); if(u) u.textContent=mmss(s);
    const g=document.getElementById("grossUhr"); if(g) g.textContent=mmss(s);
    if(L.pause){
      const rest=Math.max(0,Math.ceil((L.pause-Date.now())/1000));
      const z=document.getElementById("pauseZ"); if(z) z.textContent=mmss(rest);
      const r=document.querySelector(".pause .voll");
      if(r){ const U=2*Math.PI*62, a=rest/(L.pauseGes||90);
        r.setAttribute("stroke-dashoffset",(U*(1-a)).toFixed(1)); }
      if(rest<=0){ L.pause=null; zeichnen(); toast("Pause vorbei"); }
    }
  },1000);
}

/* ── Ablauf ────────────────────────────────────────── */
/* Aus einem Programm heraus starten: die Übungen liegen in der
   richtigen Reihenfolge bereit, die erste ist offen. */
function progStarten(pid){
  const p=progById(pid); if(!p) return;
  if(S.laufend&&!confirm("Es läuft schon eine Einheit. Verwerfen?")) return;
  S.laufend={id:uid(),disz:p.disz,programm:p.id,start:Date.now(),unter:p.name,
    rpe:null,notiz:"",kg:20,wdh:10,rir:null,pause:null,
    uebungen:p.uebungen.map(([n])=>({name:n,saetze:[]})),
    soll:Object.fromEntries(p.uebungen.map(([n,st,w])=>[n,{saetze:st,wdh:w}])),
    aktiv:0};
  sichern(); zuUebung(0);
}
function naechsteUebung(){ zuUebung(S.laufend.aktiv+1); }
function zuUebung(i){
  const L=S.laufend; if(!L||i<0||i>=L.uebungen.length) return;
  L.aktiv=i; L.rir=null;
  const n=L.uebungen[i].name, v=vorschlag(n), letzt=letzteSaetze(n);
  if(v){ L.kg=v.kg??0; L.wdh=v.wdh; }
  else if(letzt&&letzt.saetze.length){ const x=letzt.saetze[0]; L.kg=x.kg??0; L.wdh=x.wdh; }
  else {
    /* Ohne Vorgeschichte bei null anfangen. Das Gewicht der vorigen
       Übung stehen zu lassen wäre falsch — 25 kg vom Bankdrücken
       ergeben bei Klimmzügen keinen Sinn. */
    L.kg=0;
    if(L.soll&&L.soll[n]) L.wdh=L.soll[n].wdh;
  }
  sichern(); zeichnen();
}

function starten(id){
  const d=dz(id);
  if(d.art==="dauer") return nachtragen(id);    /* nichts läuft mit */
  S.laufend={id:uid(),disz:id,start:Date.now(),unter:null,rpe:null,notiz:"",
             uebungen:[],aktiv:-1,kg:20,wdh:10,rir:null,pause:null};
  sichern(); zeichnen();
}

/* ── Nachtragen ─────────────────────────────────────────
   Beim Tennis steht man nicht am Handy, um eine Uhr zu starten,
   und hinterher weiß man ohnehin nur ungefähr, wie lang es war.
   Deshalb: Datum, Dauer, Art — drei Tipper, fertig. */
let NT={disz:null,datum:null,dauer:0,unter:null,rpe:null,bearbeitet:null};
const NT_BEISPIEL={tennis:"Gegner, Ergebnis, wie es lief",zone2:"Strecke, Wetter, wie es lief",
  mobility:"Was gedehnt, wie beweglich",athletik:"Übungen, Bedingungen, wie es lief"};
const ntPlatzhalter=id=>NT_BEISPIEL[id]||"Wie es lief";
function nachtragen(id,vorhandene){
  const d=dz(id);
  NT = vorhandene
    ? {disz:id,datum:vorhandene.datum,dauer:vorhandene.dauer,unter:vorhandene.unter,
       rpe:vorhandene.rpe,bearbeitet:vorhandene.id}
    : {disz:id,datum:heute(),dauer:d.std,unter:null,rpe:null,bearbeitet:null};
  ntBlatt();
}
function ntBlatt(){
  const d=dz(NT.disz);
  const tage=[0,-1,-2,-3].map(t=>{const x=addT(new Date(),t);return {k:dk(x),
    l:t===0?"Heute":t===-1?"Gestern":WD[(x.getDay()+6)%7]};});
  const stufen=[15,30,45,60,90,120,150,180,240];
  return blatt(`<div style="--dc:${d.farbe}">
    <h3 style="display:flex;align-items:center;gap:11px">
      <span class="dz-ico" style="width:32px;height:32px;border-radius:9px">${ico(d.ico)}</span>
      ${NT.bearbeitet?"Einheit ändern":d.n+" eintragen"}</h3>

    <div class="feldblock"><label>Wann?</label>
      <div class="chips">
        ${tage.map(t=>`<button class="chip${NT.datum===t.k?" on":""}" onclick="ntSetz('datum','${t.k}')">${t.l}</button>`).join("")}
        <button class="chip" onclick="ntDatumFrei()">anderer Tag</button>
      </div>
      ${!tage.some(t=>t.k===NT.datum)?`<div class="mono" style="font-size:13px;color:var(--dc);margin-top:8px">${kurz(pdk(NT.datum))}</div>`:""}
    </div>

    <div class="feldblock"><label>Wie lange?</label>
      <div class="nt-dauer">
        <button onclick="ntDauer(-15)" aria-label="15 Minuten weniger">−</button>
        <span class="nt-z mono" id="ntZ">${hmm(NT.dauer)}</span>
        <button onclick="ntDauer(15)" aria-label="15 Minuten mehr">+</button>
      </div>
      <div class="chips" style="margin-top:9px">
        ${stufen.map(m=>`<button class="chip${NT.dauer===m?" on":""}" onclick="ntSetz('dauer',${m})">${m<60?m+" min":hmm(m)}</button>`).join("")}
      </div>
    </div>

    <div class="feldblock"><label>Was genau?</label>
      <div class="chips">
        ${d.sub.map(x=>`<button class="chip${NT.unter===x?" on":""}" onclick="ntSetz('unter','${esc(x)}')">${esc(x)}</button>`).join("")}
      </div>
    </div>

    <div class="feldblock"><label>Wie hart?${NT.rpe?` <span class="mono" style="color:${d.farbe}">RPE ${NT.rpe}</span>`:""}</label>
      <div class="chips">
        ${[3,4,5,6,7,8,9,10].map(n=>`<button class="chip${NT.rpe===n?" on":""}" onclick="ntSetz('rpe',${n})">${n}</button>`).join("")}
      </div>
    </div>

    <div class="feldblock"><label>Notiz</label>
      <textarea id="ntNotiz" rows="2" placeholder="${esc(ntPlatzhalter(NT.disz))}">${esc(NT.notiz||"")}</textarea>
    </div>

    <div class="blatt-akt">
      <button class="b" onclick="zu()">Abbrechen</button>
      <button class="b b-dz" onclick="ntSichern()">${NT.bearbeitet?"Ändern":"Eintragen"}</button>
    </div>
  </div>`);
}
function ntSetz(f,v){
  NT.notiz=document.getElementById("ntNotiz")?.value ?? NT.notiz;
  NT[f]=NT[f]===v?(f==="dauer"?v:null):v;
  ntBlatt();
}
function ntDauer(d){
  NT.dauer=clamp(NT.dauer+d,5,600);
  const e=document.getElementById("ntZ"); if(e) e.textContent=hmm(NT.dauer);
  document.querySelectorAll('[onclick^="ntSetz(\'dauer"]').forEach(b=>b.classList.remove("on"));
}
function ntDatumFrei(){
  NT.notiz=document.getElementById("ntNotiz")?.value ?? NT.notiz;
  const v=prompt("Datum (JJJJ-MM-TT)",NT.datum);
  if(v&&/^\d{4}-\d{2}-\d{2}$/.test(v)) NT.datum=v;
  ntBlatt();
}
function ntSichern(){
  const notiz=document.getElementById("ntNotiz")?.value.trim()||null;
  if(NT.bearbeitet){
    const e=S.einheiten.find(x=>x.id===NT.bearbeitet);
    if(e) Object.assign(e,{datum:NT.datum,dauer:NT.dauer,unter:NT.unter,rpe:NT.rpe,notiz});
  } else {
    S.einheiten.push({id:uid(),datum:NT.datum,disz:NT.disz,unter:NT.unter,
      dauer:NT.dauer,rpe:NT.rpe,notiz,uebungen:[],beendet:Date.now()});
  }
  S.einheiten.sort((a,b)=>a.datum.localeCompare(b.datum)||(a.beendet||0)-(b.beendet||0));
  sichernSofort(); zu(); zeichnen();
  toast(`${dz(NT.disz).n} ${NT.bearbeitet?"geändert":"eingetragen"} — ${hmm(NT.dauer)}`);
}
function setUnter(x){ S.laufend.unter=S.laufend.unter===x?null:x; sichern(); zeichnen(); }
function setRpe(n){ S.laufend.rpe=S.laufend.rpe===n?null:n; sichern(); zeichnen(); }
function stell(feld,d){
  const L=S.laufend;
  if(feld==="kg") L.kg=Math.max(0,Math.round((L.kg+d)*2)/2);
  else L.wdh=clamp(L.wdh+d,1,300);
  const e=document.getElementById(feld==="kg"?"wKg":"wWdh");
  if(e) e.textContent=feld==="kg"?zahl(L.kg):L.wdh;
  sichern();
}
function setRir(n){ S.laufend.rir=S.laufend.rir===n?null:n; sichern(); zeichnen(); }
function vorNehmen(){
  const L=S.laufend, v=vorschlag(L.uebungen[L.aktiv].name);
  if(!v) return;
  if(v.kg) L.kg=v.kg;
  L.wdh=v.wdh; sichern(); zeichnen();
  toast("Vorschlag übernommen");
}
function uebungWechseln(){ S.laufend.aktiv=-1; sichern(); zeichnen(); }
function zurueckZurWahl(){ S.laufend.aktiv=-1; zeichnen(); }
function ubFilter(q){ const e=document.getElementById("ubListe"); if(e) e.innerHTML=ubListeHtml(q); }
function ubStart(name){
  const L=S.laufend;
  let i=L.uebungen.findIndex(u=>u.name===name);
  if(i<0){ L.uebungen.push({name,saetze:[]}); i=L.uebungen.length-1; }
  L.aktiv=i;
  const letzt=letzteSaetze(name);
  if(letzt&&letzt.saetze.length){ const s=letzt.saetze[0]; if(s.kg) L.kg=s.kg; L.wdh=s.wdh; }
  sichern(); zeichnen();
}
function ubNeu(name){
  if(!name) return;
  S.uebungen.push({id:uid(),gruppe:"Eigene",name,kg:true});
  sichern(); ubStart(name);
}
function satzFertig(){
  const L=S.laufend, u=L.uebungen[L.aktiv];
  const kat=S.uebungen.find(x=>x.name===u.name);
  const mitKg=kat?kat.kg:true;
  /* Ohne Vorgeschichte gibt es nichts zu schlagen — der allererste
     Satz einer Übung ist kein Bestwert, sondern der Anfang. */
  const vorher=bisherBest(u.name,u.saetze);
  const satz={kg:mitKg?L.kg:null,wdh:L.wdh,rir:L.rir??null};
  satz.rekord = !!(satz.kg && vorher &&
    (satz.kg>vorher.kg || (satz.kg===vorher.kg && satz.wdh>vorher.wdh)));
  u.saetze.push(satz);
  if(satz.rekord) toast(`Bestwert: ${zahl(satz.kg)} kg × ${satz.wdh}`);
  L.pauseGes=S.pauseStd||90;
  L.pause=Date.now()+L.pauseGes*1000;
  sichern(); zeichnen();
}
function satzWeg(i){ S.laufend.uebungen[S.laufend.aktiv].saetze.splice(i,1); sichern(); zeichnen(); }
function pauseAus(){ S.laufend.pause=null; zeichnen(); }
function pauseStd(n){ S.pauseStd=n; sichern(); zeichnen(); }

function beenden(){
  const L=S.laufend, d=dz(L.disz);
  const min=Math.max(1,Math.round((Date.now()-L.start)/60000));
  const notiz=document.getElementById("notiz")?.value ?? L.notiz;
  const e={id:L.id,datum:dk(new Date(L.start)),disz:L.disz,unter:L.unter,programm:L.programm||null,
           dauer:min,rpe:L.rpe,notiz:notiz||null,
           uebungen:(L.uebungen||[]).filter(u=>u.saetze.length),
           beendet:Date.now()};
  if(d.art==="satz"&&!e.uebungen.length&&min<2){
    if(!confirm("Keine Sätze erfasst. Einheit trotzdem sichern?")) return;
  }
  S.einheiten.push(e);
  S.einheiten.sort((a,b)=>a.datum.localeCompare(b.datum)||a.beendet-b.beendet);
  S.laufend=null; sichernSofort(); VIEW="start"; zeichnen();
  toast(`${d.n} gesichert — ${hmm(min)}`);
}
function abbrechen(){
  if(!confirm("Laufende Einheit verwerfen?")) return;
  S.laufend=null; sichern(); VIEW="start"; zeichnen();
}
/* Angetippte Einheit ändern. Satz-Einheiten zeigen ihr Protokoll,
   Dauer-Einheiten öffnen dasselbe Blatt wie beim Eintragen. */
function einheitOeffnen(id){
  const e=S.einheiten.find(x=>x.id===id); if(!e) return;
  const d=dz(e.disz);
  if(d.art==="dauer"){ NT.notiz=e.notiz||""; return nachtragen(e.disz,e); }
  blatt(`<div style="--dc:${d.farbe}">
    <h3 style="display:flex;align-items:center;gap:11px">
      <span class="dz-ico" style="width:32px;height:32px;border-radius:9px">${ico(d.ico)}</span>
      ${esc(d.n)}${e.unter?" · "+esc(e.unter):""}</h3>
    <p class="mono" style="font-size:13px;color:var(--faint);margin-bottom:14px">
      ${kurz(pdk(e.datum))} · ${hmm(e.dauer)}${e.rpe?` · RPE ${e.rpe}`:""}</p>
    ${(e.uebungen||[]).length?e.uebungen.map(u=>`
      <div class="ub-gr">
        <div class="ub-t">${esc(u.name)}</div>
        ${u.saetze.map((x,i)=>`<div class="sw-z">
          <span class="sw-z-i">${i+1}</span>
          <span class="sw-z-w">${x.kg?`${zahl(x.kg)} kg × ${x.wdh}`:`${x.wdh}`}</span>
          <span class="sw-z-v">${x.rir!=null?`RIR ${x.rir}`:""}</span>
        </div>`).join("")}
      </div>`).join(""):`<div class="leer">Keine Sätze erfasst.</div>`}
    ${e.notiz?`<p style="font-size:14px;color:var(--dim);margin-top:12px">${esc(e.notiz)}</p>`:""}
    <div class="blatt-akt"><button class="b b-w" onclick="zu()">Schließen</button></div>
  </div>`);
}

function loeschen(id){
  if(!confirm("Einheit löschen?")) return;
  S.einheiten=S.einheiten.filter(e=>e.id!==id); sichernSofort(); zeichnen();
}
function ubWeg(id){
  const u=S.uebungen.find(x=>x.id===id); if(!u) return;
  if(!confirm(`„${u.name}" entfernen? Erfasste Sätze bleiben erhalten.`)) return;
  S.uebungen=S.uebungen.filter(x=>x.id!==id); sichern(); zeichnen();
}
function ubNeuDialog(){
  const gruppen=[...new Set(S.uebungen.map(u=>u.gruppe)),"Eigene"];
  blatt(`<h3>Neue Übung</h3>
    <div class="feldblock"><label>Name</label><input id="nName" placeholder="z. B. Landmine Press"></div>
    <div class="feldblock"><label>Gruppe</label>
      <select id="nGr">${[...new Set(gruppen)].map(g=>`<option>${esc(g)}</option>`).join("")}</select></div>
    <div class="feldblock"><label>Womit wird gemessen?</label>
      <div class="chips" id="nKg">
        <button class="chip on" data-kg="1">Gewicht × Wiederholungen</button>
        <button class="chip" data-kg="0">nur Wiederholungen oder Sekunden</button>
      </div></div>
    <div class="blatt-akt">
      <button class="b" onclick="zu()">Abbrechen</button>
      <button class="b b-1" onclick="ubAnlegen()">Anlegen</button>

  document.querySelectorAll("#nKg .chip").forEach(b=>b.onclick=()=>{

function ubAnlegen(){
  const n=document.getElementById("nName").value.trim();

/* ── Sicherung als Datei ───────────────────────────── */
function sichernDatei(){
  const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=`nova-training-${heute()}.json`; a.click();
  toast("Gesichert");
}
function ladenDatei(){
  const i=document.createElement("input"); i.type="file"; i.accept=".json";
  i.onchange=()=>{ const f=i.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{ S=Object.assign(leer(),JSON.parse(r.result)); sichern(); zeichnen(); toast("Geladen"); }
                   catch(e){ toast("Datei nicht lesbar"); } };
    r.readAsText(f); };
  i.click();
}

/* ── Abgleich mit NOVA ──────────────────────────────
   Diese App schreibt eine eigene Datei. NOVA liest sie und trägt
   nach, was dort noch fehlt — so kann keiner den anderen
   überschreiben, auch wenn beide gleichzeitig offen sind. */
const token=()=>localStorage.getItem(TOK_KEY)||"";
const syncAn=()=>localStorage.getItem(SYNC_KEY)==="1"&&!!token();
let syncTimer=null, syncSha=null;
function syncPlanen(){ clearTimeout(syncTimer); syncTimer=setTimeout(hochladen,1800); }
function tokSpeichern(){
  const v=document.getElementById("tok").value.trim();
  if(v) localStorage.setItem(TOK_KEY,v); else localStorage.removeItem(TOK_KEY);
  toast(v?"Schlüssel gesichert":"Schlüssel entfernt"); zeichnen();
}
function syncSchalten(){
  if(!token()) return toast("Erst einen Schlüssel eintragen");
  localStorage.setItem(SYNC_KEY,syncAn()?"0":"1");
  zeichnen();
  if(syncAn()) hochladen();
}
/* Was NOVA lesen soll: genau das Format seiner Sport-Einträge. */
function fuerNova(){
  const o={};
  S.einheiten.forEach(e=>{
    const d=dz(e.disz);
    (o[e.datum]=o[e.datum]||[]).push({
      id:"satz_"+e.id, type:d.nova, duration:e.dauer,
      hr:null, rpe:e.rpe||null,
      notes:[d.n,e.unter,e.notiz,(e.uebungen||[]).map(u=>u.name).join(", ")]
             .filter(Boolean).join(" · ")||null,
      kraftSubtype:e.disz==="kraft"&&e.unter?e.unter.toLowerCase():null
    });
  });
  return {quelle:"NOVA Training", stand:new Date().toISOString(), sport:o};
}
async function hochladen(){
  if(!syncAn()) return;
  try{
    const kopf={Authorization:"Bearer "+token(),Accept:"application/vnd.github+json"};
    if(!syncSha){
      const g=await fetch(GH_API,{headers:kopf});
      if(g.ok) syncSha=(await g.json()).sha;
    }
    const inhalt=btoa(unescape(encodeURIComponent(JSON.stringify(fuerNova()))));
    const r=await fetch(GH_API,{method:"PUT",headers:{...kopf,"Content-Type":"application/json"},
      body:JSON.stringify({message:"NOVA Training "+new Date().toISOString(),content:inhalt,sha:syncSha||undefined})});
    if(r.ok){ syncSha=(await r.json()).content.sha; S.zuletztSync=Date.now();
      try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
    else if(r.status===409){ syncSha=null; setTimeout(hochladen,900); }
    else toast("Abgleich fehlgeschlagen ("+r.status+")");
  }catch(e){ toast("Keine Verbindung"); }
}

/* ── Start ─────────────────────────────────────────── */
laden();
zeichnen();
</script>
