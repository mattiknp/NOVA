<style>
:root{
  --void:#0b0e14; --text:#f7f5f2; --dim:#bdb7b1; --faint:#8f8a85;
  --glass:rgba(16,19,26,.56); --edge:rgba(255,255,255,.12); --c1:#4c86f7;
  --f-ui:"Geist","SF Pro Text",system-ui,sans-serif; --f-disp:"Newsreader",Georgia,serif; --f-mono:"Geist Mono",ui-monospace,monospace;
  --ez:cubic-bezier(.23,1,.32,1);
}
*{ box-sizing:border-box; margin:0; }
html,body{ height:100%; background:var(--void); color:var(--text); font-family:var(--f-ui); overflow:hidden; -webkit-font-smoothing:antialiased; }
canvas#welt{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
.glas{ background:var(--glass); border:1px solid var(--edge); border-radius:22px;
  -webkit-backdrop-filter:blur(22px) saturate(160%); backdrop-filter:blur(22px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 24px 48px -24px rgba(0,0,0,.6); }
.kopf{ position:fixed; top:max(16px,env(safe-area-inset-top)); left:16px; padding:14px 18px 12px; min-width:250px; }
.kopf .marke{ font-size:12px; letter-spacing:.08em; color:var(--dim); }
.kopf .uhr{ font-family:var(--f-disp); font-size:44px; line-height:1; margin-top:4px; font-variant-numeric:tabular-nums lining-nums; }
.kopf .unter{ font-size:13px; color:var(--dim); margin-top:6px; }
.zeile{ display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap; }
.zeile input[type=range]{ flex:1; accent-color:var(--c1); }
.gruppe{ display:flex; gap:4px; padding:5px; border-radius:999px; flex-wrap:wrap; }
.gruppe button{ font:500 13px var(--f-ui); color:var(--dim); background:transparent; border:0; padding:8px 13px; border-radius:999px; cursor:pointer;
  transition:color .2s var(--ez), background-color .2s var(--ez), transform .3s var(--ez); }
.gruppe button:hover{ color:var(--text); }
.gruppe button:active{ transform:scale(.96); }
.gruppe button.an{ color:var(--text); background:rgba(255,255,255,.15); }
.gruppe button:focus-visible, .schalter:focus-visible{ outline:2px solid var(--c1); outline-offset:2px; }
.kopf .gruppe{ padding:3px; background:rgba(255,255,255,.05); }
.kopf .gruppe button{ padding:6px 10px; font-size:12px; }
.kopf .mono button{ font-family:var(--f-mono); }
.leiste{ position:fixed; left:16px; right:16px; bottom:max(16px,env(safe-area-inset-bottom)); display:flex; gap:12px; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; pointer-events:none; }
.leiste > *{ pointer-events:auto; }
.daten{ padding:12px 14px; }
.daten .titel{ font-size:12px; letter-spacing:.06em; color:var(--dim); margin:0 0 8px 4px; }
.schalter{ display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border-radius:14px; border:0; background:transparent; color:var(--text); font:400 14px var(--f-ui); cursor:pointer; text-align:left; }
.schalter:hover{ background:rgba(255,255,255,.06); }
.schalter .knopf{ width:34px; height:20px; border-radius:999px; background:rgba(255,255,255,.16); position:relative; flex:none; transition:background-color .25s var(--ez); }
.schalter .knopf::after{ content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform .3s var(--ez); }
.schalter.an .knopf{ background:var(--c1); }
.schalter.an .knopf::after{ transform:translateX(14px); }
.schalter small{ display:block; font-size:12px; color:var(--faint); }
.schalter[hidden]{ display:none; }
.rechts{ display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
.quelle{ font-size:11px; color:var(--dim); padding:6px 12px; border-radius:999px; }
.schild{ position:fixed; left:0; top:0; padding:10px 14px; border-radius:16px; pointer-events:none; transform:translate(-50%,calc(-100% - 14px)); opacity:0; transition:opacity .25s var(--ez); white-space:nowrap; }
.schild.an{ opacity:1; }
.schild b{ display:block; font-family:var(--f-disp); font-weight:400; font-size:20px; }
.schild span{ font-size:12px; color:var(--dim); }
.lade{ position:fixed; inset:0; display:grid; place-items:center; font-family:var(--f-disp); font-size:26px; color:var(--dim); transition:opacity .6s var(--ez); pointer-events:none; }
.lade.weg{ opacity:0; }
@media (max-width:700px){
  .kopf{ min-width:0; left:12px; right:12px; }
  .kopf .uhr{ font-size:34px; }
  .daten{ width:100%; }
  .leiste{ left:12px; right:12px; }
}
@media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
body.eingebettet .kopf, body.eingebettet .leiste, body.eingebettet .lade{ display:none !important; }
