<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Woche">
<meta name="theme-color" content="#fbf8f3">
<meta name="color-scheme" content="light">
<title>Woche</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ============================================================
   WOCHE — Kalender, Aufgaben, Uni und Geschenke.
   Hell, rund und warm: Babyblau, Bordeaux und Waldgrün auf
   cremigem Weiß. Aufbau nach dem Vorbild des Apple-Kalenders.
   ============================================================ */
:root{
  --bg:#fbf8f3; --bg-2:#f4eee4; --surface:#ffffff; --surface-2:#fdfaf6;
  --ink:#2b2522; --ink-2:#5b524b; --muted:#9a9187; --line:#efe8dd; --line-2:#e2d8ca;
  --blau:#6aa5d8; --blau-tief:#2f6ea8; --blau-hell:#e7f1fb;
  --bordeaux:#8a2c41; --bordeaux-hell:#f7e7eb;
  --wald:#3b7356; --wald-hell:#e4efe8;
  --ocker:#c98b3a; --ocker-hell:#f9efe0;
  --rose:#d6829a; --rose-hell:#fbecf0;
  --rot:#b23a4a;
  --serif:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --r:22px; --r-sm:15px; --r-xs:11px;
  --sh:0 1px 2px rgba(70,50,30,.05), 0 10px 30px -16px rgba(70,50,30,.22);
  --sh-lg:0 30px 70px -24px rgba(60,40,25,.38);
  --ez:cubic-bezier(.2,.8,.2,1);
  --hour:52px; --tabbar:66px;
  --sec:#8a2c41;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%; }
body{ background:var(--bg); color:var(--ink); font:15px/1.45 var(--sans); min-height:100vh; -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(900px 520px at 100% -10%, rgba(106,165,216,.17), transparent 60%),
    radial-gradient(700px 480px at -10% 105%, rgba(214,130,154,.12), transparent 60%),
    radial-gradient(600px 420px at 60% 120%, rgba(59,115,86,.08), transparent 60%);
  background-attachment:fixed; }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none; }
input,select,textarea{ font:inherit; color:var(--ink); background:var(--surface); border:1.5px solid var(--line-2);
  border-radius:var(--r-sm); padding:11px 14px; width:100%; outline:none; transition:border-color .15s, box-shadow .15s; }
textarea{ resize:vertical; }
input:focus,select:focus,textarea:focus{ border-color:var(--sec); box-shadow:0 0 0 4px color-mix(in srgb, var(--sec) 14%, transparent); }
@media (pointer:coarse){ input,select,textarea{ font-size:16px; } }
.ic{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; display:block; flex:0 0 auto; }
.num{ font-variant-numeric:tabular-nums; }

/* ── Gerüst ── */
.app{ display:grid; grid-template-columns:236px minmax(0,1fr); min-height:100vh; }
.side{ position:sticky; top:0; height:100vh; padding:28px 16px 22px; display:flex; flex-direction:column; gap:4px; }
.brand{ font-family:var(--serif); font-size:40px; line-height:1; padding:0 12px 26px; }
.brand i{ color:var(--bordeaux); font-style:normal; }
.nav{ display:flex; align-items:center; gap:12px; padding:9px 14px 9px 9px; border-radius:999px; color:var(--ink-2); text-align:left; font-weight:550;
  transition:background .2s, color .2s; }
.nav .pkt{ width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:color-mix(in srgb, var(--nc) 14%, transparent); color:var(--nc); flex:0 0 auto; transition:background .2s,color .2s; }
.nav.on{ background:var(--surface); color:var(--ink); box-shadow:var(--sh); }
.nav.on .pkt{ background:var(--nc); color:#fff; }
@media (hover:hover) and (pointer:fine){ .nav:not(.on):hover{ background:rgba(255,255,255,.65); } }
.side-fuss{ margin-top:auto; }
.main{ min-width:0; padding:30px 40px 60px; max-width:1300px; width:100%; }
.tabbar{ display:none; }

.kopf{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
.kopf-l{ min-width:0; }
.kopf-l small{ display:block; font-size:13px; color:var(--muted); margin-bottom:5px; }
.kopf-l small b{ color:var(--sec); font-weight:650; }
.titel{ font-family:var(--serif); font-weight:400; font-size:46px; line-height:1; letter-spacing:-.01em; }
.titel em{ font-style:italic; color:var(--sec); }
.kopf-r{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; height:40px; padding:0 17px; border-radius:999px;
  background:var(--surface); color:var(--ink); font-size:14px; font-weight:550; box-shadow:0 0 0 1.5px var(--line-2) inset;
  transition:transform .12s var(--ez), background .15s; white-space:nowrap; }
.btn:active{ transform:scale(.96); }
.btn.prim{ background:var(--sec); color:#fff; box-shadow:0 8px 20px -10px color-mix(in srgb, var(--sec) 80%, transparent); }
.btn.rund{ width:40px; padding:0; }
.btn.klein{ height:32px; padding:0 13px; font-size:13px; }
.btn.klein .ic{ width:15px; height:15px; }
.btn.rund.klein{ width:32px; padding:0; }
.btn.ghost{ box-shadow:none; background:transparent; color:var(--ink-2); }
.btn.gefahr{ color:var(--rot); }
@media (hover:hover) and (pointer:fine){ .btn:not(.prim):hover{ background:var(--surface-2); } .btn.prim:hover{ filter:brightness(1.08); } }

.karte{ background:var(--surface); border-radius:var(--r); padding:20px 22px; box-shadow:var(--sh); min-width:0; }
.k-titel{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
.k-titel h3{ display:flex; align-items:center; gap:9px; font-size:15px; font-weight:650; }
.k-titel h3 i{ width:10px; height:10px; border-radius:50%; background:var(--kc,var(--sec)); }
.leer{ color:var(--muted); font-size:14px; padding:6px 0; line-height:1.55; }
.raster2{ display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:18px; align-items:start; }
.stapel{ display:flex; flex-direction:column; gap:18px; min-width:0; }

.chip{ height:32px; padding:0 13px; border-radius:999px; font-size:13px; color:var(--ink-2); display:inline-flex; align-items:center; gap:7px;
  background:var(--surface); box-shadow:0 0 0 1.5px var(--line-2) inset; white-space:nowrap; transition:background .15s,color .15s; }
.chip.on{ background:var(--kc,var(--sec)); color:#fff; box-shadow:none; }
.chip i.pkt{ width:8px; height:8px; border-radius:50%; background:var(--kc); }
.chip.on i.pkt{ background:#fff; }
.wahl{ display:flex; gap:6px; flex-wrap:wrap; }

/* ── Heute ── */
.jetzt{ position:relative; overflow:hidden; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 20px; align-items:end;
  padding:24px 26px; border-radius:26px; margin-bottom:18px; color:var(--ink);
  background:linear-gradient(135deg, color-mix(in srgb, var(--kc) 24%, #fff), color-mix(in srgb, var(--kc) 7%, #fff)); box-shadow:var(--sh); }
.jetzt::after{ content:""; position:absolute; right:-60px; top:-70px; width:220px; height:220px; border-radius:50%; background:color-mix(in srgb, var(--kc) 14%, transparent); pointer-events:none; }
.jetzt > *{ position:relative; z-index:1; }
.jetzt-l{ font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:color-mix(in srgb, var(--kc) 70%, #000); }
.jetzt-t{ font-family:var(--serif); font-size:36px; line-height:1.05; margin-top:4px; }
.jetzt-s{ color:var(--ink-2); font-size:14px; margin-top:5px; }
.jetzt-r{ text-align:right; }
.jetzt-r b{ font-family:var(--serif); font-size:38px; font-weight:400; line-height:1; display:block; white-space:nowrap; }
.jetzt-r span{ font-size:12px; color:var(--ink-2); }
.jetzt-bar{ grid-column:1/-1; height:6px; border-radius:6px; background:rgba(255,255,255,.75); margin-top:14px; overflow:hidden; }
.jetzt-bar i{ display:block; height:100%; background:var(--kc); border-radius:6px; }
.jetzt-dann{ grid-column:1/-1; font-size:14px; color:var(--ink-2); margin-top:12px; }
.ablauf{ display:flex; flex-direction:column; gap:5px; }
.ab-z{ display:grid; grid-template-columns:50px minmax(0,1fr); gap:12px; padding:10px 12px; border-radius:var(--r-sm); text-align:left; width:100%; align-items:center;
  background:color-mix(in srgb, var(--kc) 10%, #fff); }
.ab-z.vorbei{ opacity:.5; }
.ab-z.live{ box-shadow:0 0 0 2px var(--kc) inset; }
.ab-t{ font-size:13px; color:var(--ink-2); font-variant-numeric:tabular-nums; font-weight:650; }
.ab-n{ min-width:0; }
.ab-n b{ display:block; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ab-n span{ display:block; font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ganz-liste{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.pille{ display:inline-flex; align-items:center; gap:7px; padding:6px 13px 6px 10px; border-radius:999px; font-size:13px; font-weight:600; max-width:100%;
  background:color-mix(in srgb, var(--kc) 17%, #fff); color:color-mix(in srgb, var(--kc) 72%, #000); text-align:left; }
.pille.klausur{ background:var(--bordeaux); color:#fff; }
.pille .ic{ width:14px; height:14px; }
.morgen{ margin-top:14px; padding-top:14px; border-top:1.5px dashed var(--line-2); }
.morgen h4, .a-gruppe h4{ font-size:12px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; display:flex; gap:8px; }
.mo-z{ display:flex; align-items:center; gap:10px; font-size:14px; color:var(--ink-2); padding:3px 2px; min-width:0; }
.mo-z i{ width:8px; height:8px; border-radius:50%; background:var(--kc); flex:0 0 auto; }
.mo-z span{ color:var(--muted); font-size:13px; min-width:58px; font-variant-numeric:tabular-nums; }

/* ── Aufgaben ── */
.neu-a{ display:flex; gap:8px; margin-bottom:10px; }
.neu-a input{ flex:1; min-width:0; }
.neu-opt{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.a-gruppe{ margin-top:18px; }
.a-gruppe:first-child{ margin-top:0; }
.a-gruppe h4.rot{ color:var(--rot); }
.a-z{ display:flex; align-items:flex-start; gap:12px; padding:10px 4px; border-bottom:1.5px solid var(--line); }
.a-z:last-child{ border-bottom:0; }
.a-box{ width:24px; height:24px; flex:0 0 auto; border-radius:50%; border:2px solid color-mix(in srgb, var(--kc,var(--wald)) 55%, var(--line-2)); display:grid; place-items:center;
  color:transparent; position:relative; transition:background .15s, border-color .15s; margin-top:1px; }
.a-box::after{ content:""; position:absolute; inset:-10px; }
.a-box .ic{ width:13px; height:13px; stroke-width:2.8; }
.a-z.fertig .a-box, .fr-z.erledigt .a-box{ background:var(--kc,var(--wald)); border-color:var(--kc,var(--wald)); color:#fff; }
.a-z.fertig .a-t{ color:var(--muted); text-decoration:line-through; }
.a-t{ flex:1; min-width:0; text-align:left; line-height:1.4; padding-top:2px; overflow-wrap:anywhere; }
.a-meta{ display:flex; gap:8px; flex-wrap:wrap; margin-top:3px; font-size:12.5px; color:var(--muted); }
.a-meta .rot{ color:var(--rot); font-weight:600; }
.a-meta .tag{ display:inline-flex; align-items:center; gap:5px; }
.a-meta .tag i{ width:7px; height:7px; border-radius:50%; background:var(--kc); }
.a-stern{ color:var(--ocker); }
details.fertig-liste summary{ cursor:pointer; color:var(--muted); font-size:13px; margin-top:16px; list-style:none; font-weight:550; }
details.fertig-liste summary::-webkit-details-marker{ display:none; }
details.fertig-liste summary::before{ content:"▸ "; }
details.fertig-liste[open] summary::before{ content:"▾ "; }

/* ── Kalender (nach dem Apple-Kalender) ── */
.kal-leiste{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
.seg{ display:inline-flex; padding:4px; border-radius:999px; background:var(--bg-2); box-shadow:0 0 0 1px var(--line) inset; }
.seg button{ height:32px; padding:0 20px; border-radius:999px; font-size:13.5px; font-weight:600; color:var(--ink-2); transition:background .2s, color .2s; }
.seg button.on{ background:var(--surface); color:var(--ink); box-shadow:0 2px 8px -3px rgba(60,40,25,.28); }
.kal-nav{ display:flex; align-items:center; gap:6px; }
.kal{ background:var(--surface); border-radius:var(--r); box-shadow:var(--sh); overflow:clip; min-width:0; }
/* Woche / Tag */
.wk-kopf{ display:grid; grid-template-columns:62px repeat(var(--n),minmax(0,1fr)); border-bottom:1.5px solid var(--line); position:sticky; top:0; z-index:4; background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
.wk-tag{ padding:11px 4px 9px; text-align:center; font-size:12px; font-weight:600; color:var(--muted); line-height:1.2; }
.wk-tag b{ display:inline-grid; place-items:center; margin-top:4px; min-width:34px; height:34px; padding:0 4px; border-radius:50%; font-family:var(--serif); font-size:24px; font-weight:400; color:var(--ink); }
.wk-tag.heute{ color:var(--bordeaux); }
.wk-tag.heute b{ background:var(--bordeaux); color:#fff; }
.wk-ganz{ display:grid; grid-template-columns:62px minmax(0,1fr); border-bottom:1.5px solid var(--line); background:var(--surface-2); }
.wk-ganz-l{ font-size:11px; color:var(--muted); padding:10px 8px 0 0; text-align:right; }
.wk-ganz-r{ display:grid; grid-template-columns:repeat(var(--n),minmax(0,1fr)); gap:3px 0; padding:4px 0 5px; min-height:36px; }
.wk-ganz-r .zelle{ grid-row:1/-1; cursor:copy; border-left:1px solid var(--line); }
.gz{ z-index:1; margin:0 3px; border-radius:8px; padding:0 9px; font-size:12px; font-weight:600; display:flex; align-items:center; gap:6px; overflow:hidden; white-space:nowrap; min-width:0;
  background:color-mix(in srgb, var(--kc) 19%, #fff); color:color-mix(in srgb, var(--kc) 72%, #000); text-align:left; }
.gz span{ overflow:hidden; text-overflow:ellipsis; }
.gz .ic{ width:13px; height:13px; }
.gz.klausur{ background:var(--bordeaux); color:#fff; }
.gz.erledigt{ opacity:.55; }
.gz.erledigt span{ text-decoration:line-through; }
.wk-body{ display:grid; grid-template-columns:62px repeat(var(--n),minmax(0,1fr)); position:relative; }
.wk-uhr{ position:relative; }
.wk-uhr span{ position:absolute; right:10px; font-size:11px; color:var(--muted); transform:translateY(-50%); font-variant-numeric:tabular-nums; }
.wk-uhr .jetzt-zeit{ color:var(--rot); font-weight:700; background:var(--surface); padding:0 2px; z-index:3; }
.wk-sp{ position:relative; border-left:1px solid var(--line); cursor:copy;
  background-image:linear-gradient(to bottom, transparent calc(100% - 1px), var(--line) calc(100% - 1px)); background-size:100% var(--hour); }
.wk-sp.we{ background-color:rgba(244,238,228,.5); }
.blk{ position:absolute; border-radius:10px; padding:5px 8px; overflow:hidden; cursor:pointer; text-align:left;
  background:color-mix(in srgb, var(--kc) 18%, #fff); border-left:3.5px solid var(--kc); color:color-mix(in srgb, var(--kc) 62%, #000);
  font-size:12px; line-height:1.25; transition:transform .12s var(--ez), box-shadow .15s; }
.blk b{ display:block; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.blk span{ display:block; opacity:.85; font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.blk.kurz{ padding:2px 7px; display:flex; gap:6px; align-items:center; }
@media (hover:hover) and (pointer:fine){ .blk:hover{ box-shadow:0 6px 18px -8px color-mix(in srgb, var(--kc) 80%, transparent); transform:translateY(-1px); } }
.jetzt-linie{ position:absolute; left:0; right:0; height:0; border-top:2px solid var(--rot); z-index:2; pointer-events:none; }
.jetzt-linie::before{ content:""; position:absolute; left:-5px; top:-6px; width:10px; height:10px; border-radius:50%; background:var(--rot); }
/* Monat */
.mon-kopf{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-bottom:1.5px solid var(--line); }
.mon-kopf span{ padding:12px 12px 9px; font-size:12px; font-weight:600; color:var(--muted); text-align:right; }
.mon{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); grid-auto-rows:minmax(116px,auto); }
.mz{ border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:6px; display:flex; flex-direction:column; gap:3px; min-width:0; cursor:pointer; text-align:left; transition:background .15s; }
.mz:nth-child(7n){ border-right:0; }
.mz.we{ background:rgba(244,238,228,.45); }
.mz.anders .mz-n{ color:#cbc2b6; }
.mz-n{ align-self:flex-end; min-width:28px; height:28px; display:grid; place-items:center; border-radius:50%; font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; }
.mz.heute .mz-n{ background:var(--bordeaux); color:#fff; }
.mz.wahl{ background:var(--blau-hell); }
.mz-e{ display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-2); white-space:nowrap; overflow:hidden; min-width:0; }
.mz-e i{ width:7px; height:7px; border-radius:50%; background:var(--kc); flex:0 0 auto; }
.mz-e em{ font-style:normal; color:var(--muted); font-variant-numeric:tabular-nums; }
.mz-e span{ overflow:hidden; text-overflow:ellipsis; }
.mz-g{ font-size:11.5px; font-weight:600; padding:2px 7px; border-radius:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  background:color-mix(in srgb, var(--kc) 19%, #fff); color:color-mix(in srgb, var(--kc) 72%, #000); }
.mz-g.klausur{ background:var(--bordeaux); color:#fff; }
.mz-mehr{ font-size:11px; color:var(--muted); padding-left:2px; }
.mz-punkte{ display:none; }
.mon-raster{ display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:18px; align-items:start; }
.mon-tag-k{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px; }
.mon-tag-k h3{ font-family:var(--serif); font-weight:400; font-size:28px; line-height:1.1; }
@media (max-width:1100px){ .mon-raster{ grid-template-columns:minmax(0,1fr); } }

/* ── Uni ── */
.sem{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-bottom:10px; }
.sem-w{ font-family:var(--serif); font-size:32px; line-height:1; }
.sem-w small{ font-family:var(--sans); font-size:13px; color:var(--muted); margin-left:8px; }
.zeitachse{ position:relative; height:86px; margin:6px 10px 4px; }
.za-spur{ position:absolute; left:0; right:0; top:40px; height:8px; border-radius:8px; background:var(--bg-2); }
.za-vorbei{ position:absolute; left:0; top:40px; height:8px; border-radius:8px; background:linear-gradient(90deg, var(--blau-hell), var(--blau)); }
.za-heute{ position:absolute; top:24px; height:40px; width:2px; background:var(--ink); border-radius:2px; transform:translateX(-1px); pointer-events:none; }
.za-heute span{ position:absolute; top:-19px; left:50%; transform:translateX(-50%); font-size:11px; font-weight:700; white-space:nowrap; }
.za-mon{ position:absolute; top:60px; font-size:11px; color:var(--muted); transform:translateX(-50%); }
.za-m{ position:absolute; top:34px; width:20px; height:20px; border-radius:50%; transform:translateX(-50%); border:3px solid #fff;
  background:var(--kc); box-shadow:0 2px 6px rgba(0,0,0,.18); cursor:pointer; z-index:1; }
.za-m::after{ content:""; position:absolute; inset:-8px; }
.za-m.erledigt{ background:#fff; box-shadow:0 0 0 2px var(--kc) inset, 0 2px 6px rgba(0,0,0,.12); }
.za-m.oben{ top:8px; }
.legende{ display:flex; gap:14px; flex-wrap:wrap; margin-top:6px; }
.legende span{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); }
.legende i{ width:10px; height:10px; border-radius:50%; background:var(--kc); }
.fr-monat{ margin-top:16px; }
.fr-monat:first-child{ margin-top:0; }
.fr-monat h4{ font-family:var(--serif); font-weight:400; font-size:22px; margin-bottom:4px; }

<body>
<div class="app" id="app"></div>
<div class="blatt-ov" id="ov"><div class="blatt" id="blatt" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============================================================
   Daten
   ============================================================ */
const KEY="woche_v1", SYNC_KEY="woche_sync", MODUS_KEY="woche_kalmodus";
const F={blau:"#6aa5d8", bordeaux:"#8a2c41", wald:"#3b7356", ocker:"#c98b3a", rose:"#d6829a", lila:"#8a74c0", petrol:"#4a8f94", stein:"#9a9087"};
const KATS=[
  {id:"uni",     l:"Uni",       c:F.blau},
  {id:"lernen",  l:"Lernen",    c:F.petrol},
  {id:"arbeit",  l:"Arbeit",    c:F.ocker},
  {id:"termin",  l:"Termin",    c:F.bordeaux},
  {id:"sport",   l:"Sport",     c:F.wald},
  {id:"freizeit",l:"Freizeit",  c:F.rose},
  {id:"sonst",   l:"Sonstiges", c:F.stein},
];
const MOD_FARBEN=[F.blau,F.bordeaux,F.wald,F.ocker,F.lila,F.rose,F.petrol,"#a0603a","#4f7fb5","#6d8a3e"];
/* Alte Modulfarben (erste Fassung) auf die neue Palette abbilden */
const FARB_ALT={"#4c7dd9":F.blau,"#2e9e8f":F.petrol,"#c9853a":F.ocker,"#7a63cc":F.lila,"#cf5a52":F.bordeaux,"#5d8f3a":F.wald,"#b65fa6":F.rose,"#3a8fb7":"#4f7fb5","#a7713f":"#a0603a","#6b7a8f":F.stein};
const TER_ARTEN=[["abgabe","Abgabe",F.ocker],["klausur","Klausur",F.bordeaux],["praesentation","Präsentation",F.lila],["termin","Termin",F.blau]];
/* Jeder Bereich hat seine Farbe — Navigation, Überschriften, Knöpfe */
const SEITEN=[
  {id:"heute",    l:"Heute",     c:F.bordeaux},
  {id:"kalender", l:"Kalender",  c:"#4a8fca"},
  {id:"aufgaben", l:"Aufgaben",  c:F.wald},
  {id:"uni",      l:"Uni",       c:F.ocker},
  {id:"geschenke",l:"Geschenke", c:"#c4627f"},
];
const SC=id=>SEITEN.find(s=>s.id===id).c;
const leer=()=>({v:2,name:"",sem:{start:"",ende:""},h0:7,h1:22,module:[],fix:[],woche:{},aus:{},ganz:[],todos:[],termine:[],geschenke:[],korr:[],upd:0});
let S=leer();
/* Einmalige Ergänzungen: jede läuft genau einmal (Marke in S.korr) und kommt
   nach dem Löschen nicht wieder. Feste ids verhindern Doppelte beim Abgleich. */
const KORR=[
  ["englisch-c1",()=>{ if(!S.fix.some(b=>b.id==="englisch-c1"))
    S.fix.push({id:"englisch-c1",titel:"Englisch C1",kat:"uni",modul:null,tag:0,start:"12:00",end:"13:30",ort:""}); }],
];
function aufraeumen(){ S.module.forEach(m=>{ if(FARB_ALT[m.farbe]) m.farbe=FARB_ALT[m.farbe]; }); S.v=2;
  S.korr=Array.isArray(S.korr)?S.korr:[]; let neu=false;
  KORR.forEach(([id,fn])=>{ if(S.korr.includes(id)) return; fn(); S.korr.push(id); neu=true; });
  return neu; }
function laden(){ try{ const r=localStorage.getItem(KEY); if(r) S=Object.assign(leer(),JSON.parse(r)); }catch(e){}
  if(aufraeumen()) try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function sichern(ohneSync){ S.upd=Date.now(); try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} if(!ohneSync) syncSpaeter(); }

/* ── Datum ── */
const p2=n=>String(n).padStart(2,"0");
const dk=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const pk=s=>{ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addD=(d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const heute=()=>dk(new Date());
const wtag=d=>(d.getDay()+6)%7;
const mo=d=>{ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); return addD(x,-wtag(x)); };
const mkVon=d=>dk(mo(d));
const tagDiff=(a,b)=>Math.round((pk(b)-pk(a))/86400000);
const hm=t=>{ const [h,m]=String(t||"0:0").split(":").map(Number); return h*60+(m||0); };
const uhr=m=>`${p2(Math.floor(m/60)%24)}:${p2(m%60)}`;
const TAGE=["Mo","Di","Mi","Do","Fr","Sa","So"];
const TAGE_L=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const MON=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const MON_L=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const kurzD=d=>`${d.getDate()}. ${MON[d.getMonth()]}`;
const langD=d=>`${TAGE_L[wtag(d)]}, ${d.getDate()}. ${MON_L[d.getMonth()]}`;
const kw=d=>{ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const n=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-n);
  const y=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y)/86400000+1)/7); };
const tageBis=k=>tagDiff(heute(),k);
const bisText=n=> n===0?"heute": n===1?"morgen": n===-1?"gestern": n<0?`vor ${-n} Tagen`: n<14?`in ${n} Tagen`: n<60?`in ${Math.round(n/7)} Wochen`:`in ${Math.round(n/30)} Monaten`;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const stdDe=min=>String(Math.round(min/6)/10).replace(".",",")+" h";
const hourPx=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hour"))||52;

/* ── Kalender-Daten ──
   fix:   wiederkehrend, jede Woche am selben Tag (tag 0–6)
   woche: { Montag: [Einträge nur dieser Woche] }
   aus:   { Montag: [fix-ids, die diese Woche ausfallen] }
   ganz:  ganztägige Einträge {von, bis} — dazu kommen automatisch
          Geburtstage (Geschenke) und Fristen (Uni) */
function tagEintraege(mk,tag){
  const aus=(S.aus[mk]||[]);
  const f=S.fix.filter(b=>b.tag===tag&&!aus.includes(b.id)).map(b=>({...b,wdh:true}));
  const w=(S.woche[mk]||[]).filter(b=>b.tag===tag).map(b=>({...b,wdh:false}));
  return f.concat(w).sort((a,b)=>hm(a.start)-hm(b.start));
}
const eintraegeAm=k=>{ const d=pk(k); return tagEintraege(mkVon(d),wtag(d)); };
const modVon=id=>S.module.find(m=>m.id===id)||null;
const katVon=id=>KATS.find(k=>k.id===id)||KATS[KATS.length-1];
const farbeVon=b=>{ const m=b.modul&&modVon(b.modul); return m?m.farbe:katVon(b.kat).c; };
const titelVon=(b,kurz)=>{ const m=b.modul&&modVon(b.modul); return m?(kurz&&m.kurz?m.kurz:m.name):(b.titel||katVon(b.kat).l); };
const artVon=b=>(b.modul&&modVon(b.modul)&&b.titel)?b.titel:"";
const mitArt=(b,rest)=>[artVon(b),rest].filter(Boolean).join(" · ");
const terArt=a=>TER_ARTEN.find(x=>x[0]===a)||TER_ARTEN[3];
/* Ganztägiges an einem Tag: eigene Einträge, Geburtstage, Fristen */
function ganzAm(k){
  const d=pk(k), out=[];
  (S.ganz||[]).forEach(g=>{ if(g.von<=k&&g.bis>=k) out.push({typ:"ganz",id:g.id,titel:g.titel,c:katVon(g.kat).c,von:g.von,bis:g.bis}); });
  (S.termine||[]).forEach(t=>{ if(t.datum===k) out.push({typ:"frist",id:t.id,titel:t.titel+(t.zeit?` · ${t.zeit}`:""),c:terArt(t.art)[2],art:t.art,erledigt:!!t.erledigt,von:k,bis:k}); });
  (S.geschenke||[]).forEach(p=>{ if(p.tag===d.getDate()&&p.monat===d.getMonth()+1)
    out.push({typ:"geb",id:p.id,titel:`${p.name}${p.jahr?` wird ${d.getFullYear()-p.jahr}`:" hat Geburtstag"}`,c:F.rose,von:k,bis:k}); });
  return out;
}
const ganzIcon=x=>x.typ==="geb"?"kuchen":x.typ==="frist"?"flagge":"kalender";
const ganzAttr=x=>x.typ==="ganz"?`data-ganz="${x.id}"`:x.typ==="frist"?`data-act="terEdit" data-id="${x.id}"`:`data-gzu="${x.id}" data-go="geschenke"`;
const istKlausur=x=>x.typ==="frist"&&x.art==="klausur"&&!x.erledigt;
function spalten(l){
  const out=l.map(b=>({b,s:hm(b.start),e:Math.max(hm(b.end),hm(b.start)+15),col:0,cols:1}));
  let grp=[], ende=-1;
  const fertig=()=>{ const n=Math.max(1,...grp.map(x=>x.col+1)); grp.forEach(x=>x.cols=n); grp=[]; };
  out.forEach(x=>{
    if(x.s>=ende&&grp.length) fertig();
    const belegt=new Set(grp.filter(y=>y.e>x.s).map(y=>y.col));
    let c=0; while(belegt.has(c)) c++; x.col=c; grp.push(x); ende=Math.max(ende,x.e);
  });
  if(grp.length) fertig();
  return out;
}
function semInfo(){
  const {start,ende}=S.sem||{};
  if(!start) return null;
  const s=mo(pk(start)), h=pk(heute());
  const w=Math.floor((mo(h)-s)/(7*86400000))+1;
  const gesamt=ende?Math.floor((mo(pk(ende))-s)/(7*86400000))+1:null;
  if(h<pk(start)) return {vor:true,tage:tageBis(start),gesamt};
  if(ende&&h>pk(ende)) return {nach:true,gesamt};
  return {w,gesamt};
}

function gruss(){ const h=new Date().getHours(); return h<5?"Gute Nacht":h<11?"Guten Morgen":h<17?"Hallo":h<22?"Guten Abend":"Gute Nacht"; }
function pilleHtml(x){ return `<button class="pille${istKlausur(x)?" klausur":""}" style="--kc:${x.c}" ${ganzAttr(x)}>${ic(ganzIcon(x))}${esc(x.titel)}</button>`; }

/* ============================================================
   Kalender: Tag, Woche, Monat
   ============================================================ */
function kalSchritt(r){
  const d=pk(kalDatum);
  if(kalModus==="tag") kalDatum=dk(addD(d,r));
  else if(kalModus==="woche") kalDatum=dk(addD(d,7*r));
  else { const n=new Date(d.getFullYear(),d.getMonth()+r,1); kalDatum=dk(n); monWahl=dk(n); }
  zeige();
}
function vKalender(){
  const d=pk(kalDatum);
  let titel, unter;
  if(kalModus==="monat"){ titel=`${MON_L[d.getMonth()]} <em>${d.getFullYear()}</em>`; unter=`${S.termine.filter(t=>!t.erledigt&&t.datum.slice(0,7)===kalDatum.slice(0,7)).length||"Keine"} Fristen in diesem Monat`; }
  else if(kalModus==="woche"){ const m=mo(d), e=addD(m,6);
    titel=m.getMonth()===e.getMonth()?`${MON_L[m.getMonth()]} <em>${m.getFullYear()}</em>`:`${MON[m.getMonth()]} – ${MON[e.getMonth()]} <em>${e.getFullYear()}</em>`;
    unter=`KW ${kw(m)} · ${kurzD(m)} – ${kurzD(e)}`; }
  else { titel=`${d.getDate()}. ${MON_L[d.getMonth()]}`; unter=TAGE_L[wtag(d)]+(kalDatum===heute()?" · heute":""); }
  return `
  <div class="kopf"><div class="kopf-l"><small>${unter}</small><h1 class="titel">${titel}</h1></div>
    <div class="kopf-r"><button class="btn prim nur-desk" data-act="neuEintrag">${ic("plus")}Eintrag</button></div></div>
  <div class="kal-leiste">
    <div class="seg" role="tablist">${[["tag","Tag"],["woche","Woche"],["monat","Monat"]].map(([m,l])=>`<button role="tab" aria-selected="${kalModus===m}" class="${kalModus===m?"on":""}" data-modus="${m}">${l}</button>`).join("")}</div>
    <div class="kal-nav"><button class="btn rund" data-act="kalZurueck" aria-label="Zurück">${ic("links")}</button>
      <button class="btn" data-act="kalHeute">Heute</button>
      <button class="btn rund" data-act="kalVor" aria-label="Weiter">${ic("rechts")}</button></div>
  </div>
  ${kalModus==="monat"?monatHtml():kalModus==="woche"?wocheHtml():tagHtml()}`;
}
/* Woche und Tag teilen sich das Raster */
function zeitRaster(tage){
  const H0=S.h0, H1=S.h1, hh=hourPx();
  const hoehe=(H1-H0)*hh, d=new Date(), jetzt=d.getHours()*60+d.getMinutes();
  const n=tage.length, jetztDrin=tage.includes(heute())&&jetzt>=H0*60&&jetzt<=H1*60;
  const uhrSp=`<div class="wk-uhr" style="height:${hoehe}px">${[...Array(H1-H0)].map((_,i)=>i?`<span style="top:${i*hh}px">${p2(H0+i)}:00</span>`:"").join("")}
    ${jetztDrin?`<span class="jetzt-zeit" style="top:${(jetzt-H0*60)/60*hh}px">${uhr(jetzt)}</span>`:""}</div>`;
  const kopf=tage.map(k=>{ const t=pk(k); return `<div class="wk-tag${k===heute()?" heute":""}">${TAGE[wtag(t)]}<br><b>${t.getDate()}</b></div>`; }).join("");
  /* Ganztägiges als durchgehende Streifen über die Tage, in Bahnen gestapelt */
  const gz=[], gesehen=new Set(), idx=k=>tagDiff(tage[0],k);
  tage.forEach(k=>ganzAm(k).forEach(x=>{ const key=x.typ+x.id+(x.typ==="geb"?k:""); if(gesehen.has(key)) return; gesehen.add(key);
    gz.push({x,s:Math.max(0,idx(x.von)),e:Math.min(n-1,idx(x.bis))}); }));
  const bahnen=[];
  gz.sort((a,b)=>a.s-b.s||(b.e-b.s)-(a.e-a.s)).forEach(g=>{ let b=0; while((bahnen[b]||[]).some(o=>!(g.e<o.s||g.s>o.e))) b++; (bahnen[b]=bahnen[b]||[]).push(g); g.b=b; });
  const ganz=`<div class="wk-ganz" style="--n:${n}"><div class="wk-ganz-l">ganztags</div>
    <div class="wk-ganz-r" style="--n:${n};grid-template-rows:repeat(${Math.max(1,bahnen.length)},26px)">
    ${tage.map((k,i)=>`<div class="zelle" data-ganzneu="${k}" style="grid-column:${i+1}" title="Ganztägigen Eintrag anlegen"></div>`).join("")}
    ${gz.map(g=>{ const x=g.x;
      return `<button class="gz${istKlausur(x)?" klausur":""}${x.erledigt?" erledigt":""}" ${ganzAttr(x)} style="--kc:${x.c};grid-column:${g.s+1}/${g.e+2};grid-row:${g.b+1}" title="${esc(x.titel)}">
        ${ic(ganzIcon(x))}<span>${esc(x.titel)}</span></button>`; }).join("")}</div></div>`;
  const spaltenHtml=tage.map(k=>{
    const t=pk(k), mk=mkVon(t), w=wtag(t);
    const bl=spalten(tagEintraege(mk,w)).map(x=>{
      const top=(x.s-H0*60)/60*hh, h=Math.max(20,(x.e-x.s)/60*hh-2), breite=100/x.cols, kurz=h<40;
      return `<button class="blk${kurz?" kurz":""}" data-blk="${mk}|${x.b.id}" style="--kc:${farbeVon(x.b)};top:${top+1}px;height:${h}px;left:calc(${x.col*breite}% + 2px);width:calc(${breite}% - 4px)">
        <b>${esc(titelVon(x.b,n>1))}</b><span>${kurz?x.b.start:esc(mitArt(x.b,`${x.b.start} – ${x.b.end}${x.b.ort?` · ${x.b.ort}`:""}`))}</span></button>`; }).join("");
    const linie=k===heute()&&jetztDrin?`<div class="jetzt-linie" style="top:${(jetzt-H0*60)/60*hh}px"></div>`:"";
    return `<div class="wk-sp${w>=5?" we":""}" data-slot="${k}" style="height:${hoehe}px">${bl}${linie}</div>`; }).join("");
  return `<div class="kal${n===1?" einspaltig":""}">
    <div class="wk-kopf" style="--n:${n}"><div></div>${kopf}</div>${ganz}
    <div class="wk-body" style="--n:${n}">${uhrSp}${spaltenHtml}</div></div>`;
}
const wocheHtml=()=>{ const m=mo(pk(kalDatum)); return zeitRaster([0,1,2,3,4,5,6].map(i=>dk(addD(m,i)))); };
const tagHtml=()=>zeitRaster([kalDatum]);
function monatHtml(){
  const d=pk(kalDatum), erster=new Date(d.getFullYear(),d.getMonth(),1), start=mo(erster);
  const wochen=Math.ceil((wtag(erster)+new Date(d.getFullYear(),d.getMonth()+1,0).getDate())/7);
  const zellen=[];
  for(let i=0;i<wochen*7;i++){
    const t=addD(start,i), k=dk(t), e=eintraegeAm(k), g=ganzAm(k);
    const items=g.map(x=>`<div class="mz-g${istKlausur(x)?" klausur":""}" style="--kc:${x.c}">${esc(x.titel)}</div>`)

function kalNachher(){

const GS_ST={idee:"Idee",gekauft:"gekauft",verschenkt:"verschenkt"};
function gebNaechster(p){ if(!p.tag||!p.monat) return null; const h=pk(heute());
  let d=new Date(h.getFullYear(),p.monat-1,p.tag); if(d<h) d=new Date(h.getFullYear()+1,p.monat-1,p.tag);
  return {d,tage:Math.round((d-h)/86400000),alter:p.jahr?d.getFullYear()-p.jahr:null}; }
const gebBald=n=>(S.geschenke||[]).map(p=>({p,n:gebNaechster(p)})).filter(x=>x.n&&x.n.tage<=n).sort((a,b)=>a.n.tage-b.n.tage);
function xmas(){ const h=pk(heute()); let d=new Date(h.getFullYear(),11,24); if(d<h) d=new Date(h.getFullYear()+1,11,24); return {d,tage:Math.round((d-h)/86400000),jahr:d.getFullYear()}; }
const xmasDabei=p=>p.xmas!==false;
function xmasStand(p){ const j=xmas().jahr, l=(p.ideen||[]).filter(i=>i.anlass==="xmas");
  if(l.some(i=>i.status==="gekauft"||(i.status==="verschenkt"&&i.jahr===j))) return "gekauft"; if(l.some(i=>i.status==="idee")) return "idee"; return "nichts"; }
const anlassWahl={};
const anlassVor=p=>anlassWahl[p.id]||(()=>{ const n=gebNaechster(p), x=xmas(); return xmasDabei(p)&&(!n||x.tage<n.tage)?"xmas":"geb"; })();
const gebDatum=p=>p.tag&&p.monat?`${p.tag}. ${MON_L[p.monat-1]}${p.jahr?" "+p.jahr:""}`:"kein Geburtstag eingetragen";
function vGeschenke(){

  const x=xmas(), dabei=ps.filter(({p})=>xmasDabei(p)), st=dabei.map(({p})=>({p,s:xmasStand(p)})), fertig=st.filter(z=>z.s==="gekauft").length;
  const offeneIdeen=ps.reduce((a,z)=>a+(z.p.ideen||[]).filter(i=>i.status==="idee").length,0);
  const ideeZ=(p,i)=>`<div class="idee ${i.status}">
    <button class="idee-st" data-gst="${p.id}|${i.id}" title="Tippen: Idee → gekauft → verschenkt" aria-label="Status ändern">${ic(i.status==="idee"?"idee":i.status==="gekauft"?"check":"geschenke")}</button>
    <span class="idee-t">${esc(i.text)}${i.preis?`<em>${esc(i.preis)}</em>`:""}${i.anlass==="xmas"?`<span class="idee-a x">Weihnachten</span>`:i.anlass==="geb"?`<span class="idee-a g">Geburtstag</span>`:""}</span>

    <button class="btn rund klein ghost" data-gweg="${p.id}|${i.id}" aria-label="Löschen">${ic("x")}</button></div>`;
  return `
  <div class="kopf"><div class="kopf-l"><small><b>${ps.length} ${ps.length===1?"Mensch":"Menschen"}</b> · ${offeneIdeen} ${offeneIdeen===1?"Idee":"Ideen"} offen</small>
    <h1 class="titel">Geschenke</h1></div>
    <div class="kopf-r"><button class="btn prim" data-act="perNeu">${ic("plus")}Person</button></div></div>
  ${dabei.length&&x.tage<=100?`<div class="xmas"><div class="xmas-k"><span class="xmas-ic">${ic("stern")}</span>
      <div><b>Weihnachten</b><span>${x.tage===0?"heute":bisText(x.tage)} · ${fertig} von ${dabei.length} besorgt</span></div>
      <div class="xmas-bar"><i style="width:${fertig/dabei.length*100}%"></i></div></div>
    <div class="xmas-pers">${st.map(({p,s})=>`<button class="xp s-${s}" data-gzu="${p.id}" data-anl="xmas"><i>${s==="gekauft"?ic("check"):s==="idee"?ic("idee"):""}</i>${esc(p.name)}</button>`).join("")}</div></div>`:""}
  ${ps.some(z=>z.n&&z.n.tage<=60)?`<div class="gb-bald">${ps.filter(z=>z.n&&z.n.tage<=60).map(({p,n})=>`<button class="gb${n.tage<=7?" nah":""}" data-gzu="${p.id}" data-anl="geb">
      <b class="n num">${n.tage===0?ic("kuchen"):n.tage}</b><span><b>${esc(p.name)}</b>${n.tage===0?"hat heute Geburtstag":`${n.tage===1?"Tag":"Tage"} · ${kurzD(n.d)}`}${n.alter?` · wird ${n.alter}`:""}</span></button>`).join("")}</div>`:""}
  ${ps.length?`<div class="pers">${ps.map(({p,n})=>{ const akt=(p.ideen||[]).filter(i=>i.status!=="verschenkt"), alt=(p.ideen||[]).filter(i=>i.status==="verschenkt");
      const warn=n&&n.tage<=21&&!(p.ideen||[]).some(i=>i.anlass!=="xmas"&&(i.status==="gekauft"||(i.status==="verschenkt"&&i.jahr===n.d.getFullYear())));

          ${xmasDabei(p)?`<button class="chip${anlassVor(p)==="xmas"?" on":""}" data-ganl="${p.id}|xmas" style="--kc:${F.wald}">Weihnachten</button>`:""}</div>
        <div class="neu-a" style="margin:0"><input data-gneu="${p.id}" placeholder="Neue Geschenkidee …" autocomplete="off" enterkeyhint="done"><button class="btn rund" data-gadd="${p.id}" aria-label="Hinzufügen">${ic("plus")}</button></div>
        ${alt.length?`<details class="fertig-liste"><summary>${alt.length} schon verschenkt</summary>${alt.map(i=>ideeZ(p,i)).join("")}</details>`:""}
      </div>`; }).join("")}</div>`
    :`<div class="karte"><div class="leer">Noch niemand eingetragen. Leg die Menschen an, die dir wichtig sind — mit Geburtstag und allem, was dir zu Geschenken einfällt. Geburtstage erscheinen dann auch im Kalender.</div></div>`}`;
}

  q("eExp")?.addEventListener("click",()=>{ const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"})); a.download=`woche-${heute()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); });
  q("eImp")?.addEventListener("click",()=>{ const i=document.createElement("input"); i.type="file"; i.accept="application/json,.json";
    i.onchange=()=>{ const f=i.files[0]; if(!f) return; const r=new FileReader();
      r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||!Array.isArray(d.fix)) throw 0; if(!confirm("Alles auf diesem Gerät durch die Sicherung ersetzen?")) return;
        S=Object.assign(leer(),d); aufraeumen(); sichern(); zu(); zeige(); toast("Sicherung geladen"); }catch(e){ toast("Das ist keine Woche-Sicherung"); } }; r.readAsText(f); };
    i.click(); });
  q("eSync")?.addEventListener("click",syncBlatt);
  q("eJetzt")?.addEventListener("click",async()=>{ await syncJetzt(true); zu(); zeige(); });
}
const syncCfg=()=>{ try{ return JSON.parse(localStorage.getItem(SYNC_KEY)||"null"); }catch(e){ return null; } };
let syncSha=null, syncT=null;
const api=c=>`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${c.pfad||"woche.json"}`;
const b64=s=>btoa(unescape(encodeURIComponent(s))), unb64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
async function holen(c){ const r=await fetch(api(c)+"?t="+Date.now(),{headers:{Authorization:`token ${c.token}`,Accept:"application/vnd.github+json"}});
  if(r.status===404) return {fehlt:true}; if(!r.ok) throw new Error(r.status); const j=await r.json(); syncSha=j.sha; return {daten:JSON.parse(unb64(j.content))}; }
async function hochladen(c){
  const body={message:`woche ${new Date().toISOString()}`,content:b64(JSON.stringify(S)),...(syncSha?{sha:syncSha}:{})};
  const r=await fetch(api(c),{method:"PUT",headers:{Authorization:`token ${c.token}`,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});
  if(r.status===409||r.status===422){ syncSha=null; const h=await holen(c); if(h.daten&&h.daten.upd>S.upd){ S=Object.assign(leer(),h.daten); aufraeumen(); sichern(true); zeige(); return; } return hochladen(c); }
  if(!r.ok) throw new Error(r.status); syncSha=(await r.json()).content.sha; }
function syncSpaeter(){ const c=syncCfg(); if(!c) return; clearTimeout(syncT); syncT=setTimeout(()=>hochladen(c).catch(()=>toast("Abgleich fehlgeschlagen")),1500); }
async function syncJetzt(laut){ const c=syncCfg(); if(!c) return;
  try{ const h=await holen(c);
    if(h.daten&&(h.daten.upd||0)>(S.upd||0)){ S=Object.assign(leer(),h.daten); aufraeumen(); try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} if(!document.getElementById("ov").classList.contains("on")) zeige(); if(laut) toast("Neuester Stand geholt"); }
    else if(h.fehlt||(h.daten&&(h.daten.upd||0)<(S.upd||0))){ await hochladen(c); if(laut) toast("Abgeglichen"); }
    else if(laut) toast("Alles aktuell");
  }catch(e){ if(laut) toast("Abgleich fehlgeschlagen ("+e.message+")"); } }
function syncBlatt(){
  const c=syncCfg()||{owner:"",repo:"",pfad:"woche.json",token:""};
  blatt(`<h2>Abgleich</h2>
    <p class="hinweis" style="margin-bottom:14px">Lege auf GitHub ein <b>privates</b> Repository an und erstelle einen Token (Fine-grained, nur dieses Repo, „Contents: Read and write“). Der Token bleibt nur auf diesem Gerät.</p>
    <div class="feld zeile"><div><label>GitHub-Name</label><input id="sO" value="${esc(c.owner)}" autocomplete="off" autocapitalize="off"></div><div><label>Repository</label><input id="sR" value="${esc(c.repo)}" autocomplete="off" autocapitalize="off"></div></div>
    <div class="feld"><label>Token</label><input id="sT" type="password" value="${esc(c.token)}" autocomplete="off" placeholder="github_pat_…"></div>
    <div class="blatt-akt">${syncCfg()?`<button class="btn gefahr links" id="sAus">Trennen</button>`:""}<button class="btn" data-act="zu">Abbrechen</button><button class="btn prim" id="sOk">Verbinden</button></div>`);
  const q=s=>document.getElementById(s);
  q("sOk").onclick=async()=>{ const n={owner:q("sO").value.trim(),repo:q("sR").value.trim(),pfad:"woche.json",token:q("sT").value.trim()};
    if(!n.owner||!n.repo||!n.token){ toast("Alle drei Felder ausfüllen"); return; }
    try{ await holen(n); }catch(e){ toast("Keine Verbindung — stimmen Name, Repo und Token?"); return; }
    localStorage.setItem(SYNC_KEY,JSON.stringify(n)); zu(); toast("Verbunden"); await syncJetzt(true); };
  q("sAus")?.addEventListener("click",()=>{ localStorage.removeItem(SYNC_KEY); syncSha=null; zu(); toast("Getrennt — Daten bleiben auf diesem Gerät"); });
}

/* ============================================================
   Blatt, Toast, Klicks
   ============================================================ */
function blatt(html){ const b=document.getElementById("blatt"); b.innerHTML=html; document.getElementById("ov").classList.add("on");
  setTimeout(()=>{ const f=b.querySelector("input:not([type=date]):not([type=time])"); if(f&&!f.value&&matchMedia("(pointer:fine)").matches) f.focus(); },60); }
function zu(){ document.getElementById("ov").classList.remove("on"); }
let toastT=null;
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),2200); }
const behalte=(id,fn)=>{ const v=document.getElementById(id)?.value; fn(); if(v){ const n=document.getElementById(id); if(n) n.value=v; } };
const nachOben=()=>window.scrollTo({top:0});

document.addEventListener("click",e=>{
  if(e.target===document.getElementById("ov")){ zu(); return; }
  if(e.target.closest("#blatt")&&!e.target.closest('[data-act="zu"]')) return;
  const gzu=e.target.closest("[data-gzu]");
  if(gzu){ const pid=gzu.dataset.gzu; if(gzu.dataset.anl) anlassWahl[pid]=gzu.dataset.anl;
    if(SEITE!=="geschenke"){ zeige("geschenke"); }
    const k=document.querySelector(`[data-person="${pid}"]`);
    if(k){ if(gzu.dataset.anl) k.querySelectorAll("[data-ganl]").forEach(c=>c.classList.toggle("on",c.dataset.ganl.endsWith("|"+gzu.dataset.anl)));
      k.scrollIntoView({behavior:"smooth",block:"center"}); setTimeout(()=>k.querySelector("[data-gneu]")?.focus({preventScroll:true}),350); } return; }
  const go=e.target.closest("[data-go]"); if(go){ zeige(go.dataset.go); nachOben(); return; }
  const blk=e.target.closest("[data-blk]"); if(blk){ eintragBlatt({blk:blk.dataset.blk.split("|")}); return; }
  const gz=e.target.closest("[data-ganz]"); if(gz){ eintragBlatt({ganz:gz.dataset.ganz}); return; }
  const gn=e.target.closest("[data-ganzneu]"); if(gn){ eintragBlatt({datum:gn.dataset.ganzneu,ganztags:true}); return; }
  const slot=e.target.closest("[data-slot]");
  if(slot&&!e.target.closest("[data-act]")){ const r=slot.getBoundingClientRect(), hh=hourPx();
    let min=S.h0*60+Math.floor((e.clientY-r.top)/hh*2)*30; min=Math.max(S.h0*60,Math.min(S.h1*60-60,min));
    eintragBlatt({datum:slot.dataset.slot,start:uhr(min),end:uhr(min+60)}); return; }
  const mt=e.target.closest("[data-mtag]");
  if(mt){ /* Zweimal auf denselben Tag: Tagesansicht, wie im Apple-Kalender */
    if(monWahl===mt.dataset.mtag&&matchMedia("(max-width:820px)").matches){ kalDatum=monWahl; kalModus="tag"; zeige(); nachOben(); return; }
    monWahl=mt.dataset.mtag; zeige();
    if(matchMedia("(max-width:820px)").matches) document.querySelector(".mon-raster > .karte")?.scrollIntoView({behavior:"smooth",block:"nearest"});
    return; }
  const mod=e.target.closest("[data-modus]");
  if(mod){ const alt=kalModus; kalModus=mod.dataset.modus; try{ localStorage.setItem(MODUS_KEY,kalModus); }catch(_){}
    if(kalModus==="monat"&&alt!=="monat") monWahl=kalDatum; if(alt==="monat"&&kalModus!=="monat") kalDatum=monWahl; zeige(); return; }
  const uf=e.target.closest("[data-ufilter]"); if(uf){ uniFilter=uf.dataset.ufilter; zeige(); return; }
  const adat=e.target.closest("[data-adat]"); if(adat){ aDatum=adat.dataset.adat; behalte("neuA",zeige); return; }
  const amod=e.target.closest("[data-amod]"); if(amod){ aModul=aModul===amod.dataset.amod?null:amod.dataset.amod; behalte("neuA",zeige); return; }
  const gst=e.target.closest("[data-gst]");
  if(gst){ const [pid,iid]=gst.dataset.gst.split("|"), p=S.geschenke.find(x=>x.id===pid), i=p&&p.ideen.find(x=>x.id===iid); if(!i) return;
    i.status=({idee:"gekauft",gekauft:"verschenkt",verschenkt:"idee"})[i.status]; i.jahr=i.status==="verschenkt"?new Date().getFullYear():null; sichern(); zeige();
    toast(i.status==="gekauft"?"Besorgt":i.status==="verschenkt"?"Verschenkt — bleibt als Erinnerung stehen":"Wieder Idee"); return; }
  const gweg=e.target.closest("[data-gweg]"); if(gweg){ const [pid,iid]=gweg.dataset.gweg.split("|"), p=S.geschenke.find(x=>x.id===pid); if(!p) return; p.ideen=p.ideen.filter(x=>x.id!==iid); sichern(); zeige(); return; }
  const ganl=e.target.closest("[data-ganl]"); if(ganl){ const [pid,a]=ganl.dataset.ganl.split("|"); anlassWahl[pid]=a; ganl.parentElement.querySelectorAll("[data-ganl]").forEach(c=>c.classList.toggle("on",c===ganl)); return; }
  const gadd=e.target.closest("[data-gadd]"); if(gadd){ ideeNeu(gadd.dataset.gadd); return; }
  const a=e.target.closest("[data-act]"); if(!a) return;
  const id=a.dataset.id, aktTag=()=>SEITE==="kalender"?(kalModus==="monat"?monWahl:kalModus==="tag"?kalDatum:(mkVon(pk(kalDatum))===mkVon(new Date())?heute():mkVon(pk(kalDatum)))):heute();
  switch(a.dataset.act){
    case "zu": zu(); break;
    case "einst": einstBlatt(false); break;
    case "neu":
      if(SEITE==="aufgaben"){ const i=document.getElementById("neuA"); nachOben(); i?.focus(); break; }
      if(SEITE==="uni"){ terBlatt(null); break; }
      if(SEITE==="geschenke"){ personBlatt(null); break; }
      eintragBlatt({datum:aktTag()}); break;
    case "neuEintrag": eintragBlatt({datum:aktTag()}); break;
    case "neuAm": eintragBlatt({datum:a.dataset.tag}); break;
    case "zumTag": kalDatum=a.dataset.tag; kalModus="tag"; zeige(); nachOben(); break;
    case "kalZurueck": kalSchritt(-1); break;
    case "kalVor": kalSchritt(1); break;
    case "kalHeute": kalDatum=heute(); monWahl=heute(); zeige(); break;
    case "schnellA": { const i=document.getElementById("schnellA"); if(aufgabeNeu(i.value,heute())){ zeige(); toast("Für heute notiert"); } break; }
    case "neuA": { const i=document.getElementById("neuA"); if(aufgabeNeu(i.value,datumAus(aDatum),aModul,aWichtig)){ zeige(); document.getElementById("neuA")?.focus(); } break; }
    case "aWichtig": aWichtig=!aWichtig; behalte("neuA",zeige); break;
    case "aHaken": { const t=S.todos.find(x=>x.id===id); if(!t) break; t.done=!t.done; t.doneAt=t.done?Date.now():null; sichern(); zeige(); if(t.done) toast("Erledigt"); break; }
    case "aEdit": aufgabeBlatt(id); break;
    case "terHaken": { const t=S.termine.find(x=>x.id===id); if(!t) break; t.erledigt=!t.erledigt; sichern(); zeige(); if(t.erledigt) toast(t.art==="klausur"?"Geschrieben — stark!":"Abgegeben — stark!"); break; }
    case "modNeu": modBlatt(null); break;
    case "modEdit": modBlatt(id); break;
    case "terNeu": terBlatt(null,a.dataset.art); break;
    case "terEdit": terBlatt(id); break;
    case "perNeu": personBlatt(null); break;
    case "perEdit": personBlatt(id); break;
  }
});
document.addEventListener("change",e=>{ const n=e.target.closest("[data-gnotiz]"); if(n){ const p=S.geschenke.find(x=>x.id===n.dataset.gnotiz); if(p){ p.notiz=n.value.trim(); sichern(); toast("Notiz gespeichert"); } } });
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") zu();
  if(e.key!=="Enter"||e.isComposing) return;
  if(e.target.id==="neuA"){ e.preventDefault(); document.querySelector('[data-act="neuA"]').click(); }
  if(e.target.id==="schnellA"){ e.preventDefault(); document.querySelector('[data-act="schnellA"]').click(); }
  if(e.target.dataset&&e.target.dataset.gneu){ e.preventDefault(); ideeNeu(e.target.dataset.gneu); }
});
/* Frisch bleiben: Die App bleibt auf dem Handy oft über Nacht offen */
const darfNeu=()=>!document.getElementById("ov").classList.contains("on")&&!document.activeElement?.matches("input,textarea,select");
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState!=="visible") return; syncJetzt(false); if(darfNeu()) zeige(); });
window.addEventListener("pageshow",()=>{ if(darfNeu()) zeige(); });
setInterval(()=>{ if(document.visibilityState==="visible"&&darfNeu()&&(SEITE==="heute"||SEITE==="kalender"||heute()!==renderTag)) zeige(); },60000);

laden(); huelle(); zeige("heute");
if(!S.gesehen) einstBlatt(true);
syncJetzt(false);
</script>
