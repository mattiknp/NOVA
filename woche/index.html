<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Woche">
<meta name="theme-color" content="#fcf8f1">
<meta name="color-scheme" content="light">
<title>Woche</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
/* ============================================================
   WOCHE — ein Papierplaner zum Antippen.
   Große kontrastreiche Serif-Titel über Streifenbändern, feine
   altrosa Linien, puderrosa Kästen mit kursiven Beschriftungen.
   Farben: Pflaume #61122b, Altrosa #b46a6a, Butter #ffd983,
   Oliv #333700 und ihre Verwandten. Einträge sind vollflächig
   gefärbt, mit Kontrastschrift. Jeder Monat hat sein Farbpaar.
   ============================================================ */
:root{
  --papier:#fcf8f1; --papier-2:#f5ede2; --weiss:#fffdf9;
  --tinte:#2b1419; --tinte-2:#5f454a; --leise:#7d6368;
  --linie:#eedcd3; --linie-2:#e0c3b9; --raster:#e6b3aa;
  --plum:#61122b; --wein:#8e2c48; --rose:#b46a6a; --rose-dunkel:#9a4c4f; --blush:#e9a5a5; --puder:#f4cfd6; --puder-2:#faeaed;
  --baby:#a9cbe8; --baby-2:#e6f0f9; --butter:#ffd983; --butter-2:#fff1cc; --senf:#d6a33a; --senf-dunkel:#8f6200;
  --oliv:#333700; --moos:#6f6c1e; --salbei:#a7a77a; --kakao:#5b3a29; --sand:#d8c3a5;
  --gut:#6f6c1e; --rot:#a8323f;
  --disp:"Gloock","Bodoni 72","Didot",Georgia,serif;
  --kursiv:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --r:20px; --r-sm:14px; --r-xs:10px;
  --ez:cubic-bezier(.23,1,.32,1); --drawer:cubic-bezier(.32,.72,0,1);
  --hour:52px; --tabbar:68px;
  /* Bereich: Füllung, Schrift auf der Füllung, Akzentschrift auf Papier, Streifen */
  --sec:var(--plum); --sec-ink:var(--butter); --sec-text:var(--plum); --sa:var(--plum); --sb:var(--puder);
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%; }
body{ background:var(--papier); color:var(--tinte); font:15px/1.45 var(--sans); min-height:100vh; -webkit-font-smoothing:antialiased; }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none; }
input,select,textarea{ font:inherit; color:var(--tinte); background:var(--weiss); border:1.5px solid var(--linie-2);
  border-radius:var(--r-sm); padding:11px 14px; width:100%; outline:none; transition:border-color .15s ease, box-shadow .15s ease; }
textarea{ resize:vertical; }
input::placeholder,textarea::placeholder{ color:#7d6368; }
input:focus,select:focus,textarea:focus{ border-color:var(--sec-text); box-shadow:0 0 0 4px color-mix(in srgb, var(--sec-text) 14%, transparent); }
@media (pointer:coarse){ input,select,textarea{ font-size:16px; } }
.ic{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; display:block; flex:0 0 auto; }
.num{ font-variant-numeric:tabular-nums; }
.lab{ font-family:var(--kursiv); font-style:italic; font-weight:400; font-size:23px; line-height:1.1; color:var(--kc,var(--sec-text)); }

/* ── Gerüst ── */
.app{ display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100vh; }
.side{ position:sticky; top:0; height:100vh; padding:26px 14px 20px; display:flex; flex-direction:column; gap:3px; border-right:1.5px solid var(--linie); }
.brand{ font-family:var(--disp); font-size:42px; line-height:1; padding:0 12px 26px; color:var(--plum); }
.brand i{ color:var(--rose); font-style:normal; }
.nav{ display:flex; align-items:center; gap:12px; padding:8px 14px 8px 8px; border-radius:999px; color:var(--tinte-2); text-align:left; font-weight:550;
  transition:background-color .18s ease, color .18s ease, transform .16s var(--ez); }
.nav .pkt{ width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:var(--papier-2); color:var(--nt); flex:0 0 auto; }
.nav.on{ background:var(--nc); color:var(--ni); }
.nav.on .pkt{ background:color-mix(in srgb, var(--ni) 16%, transparent); color:var(--ni); }
.nav:active{ transform:scale(.97); }
@media (hover:hover) and (pointer:fine){ .nav:not(.on):hover{ background:var(--papier-2); } }
.side-fuss{ margin-top:auto; }
.main{ min-width:0; padding:26px 40px 60px; max-width:1320px; width:100%; }
.tabbar{ display:none; }

/* Kopf: Streifenband, darüber halb der große Titel — wie im Papierplaner */
.kopf{ position:relative; padding-top:50px; margin-bottom:24px; }
.kopf::before{ content:""; position:absolute; left:0; right:0; top:0; height:84px; border-radius:var(--r);
  background:repeating-linear-gradient(90deg, var(--sa) 0 26px, var(--sb) 26px 52px); }
.kopf-r{ position:absolute; top:22px; right:20px; display:flex; gap:8px; z-index:1; }
.titel{ position:relative; font-family:var(--disp); font-weight:400; font-size:clamp(52px,6.4vw,88px); line-height:.92; letter-spacing:-.015em;
  color:var(--sec-text); padding:0 18px; text-wrap:balance; }
.titel em{ font-style:normal; color:var(--rose); }
.titel.lang{ font-size:clamp(44px,5vw,70px); }
.unter{ padding:10px 20px 0; color:var(--tinte-2); font-size:14px; }
.unter b{ color:var(--sec-text); font-weight:650; }
.neu-seite .titel{ animation:druck .34s var(--ez) both; }
@keyframes druck{ from{ clip-path:inset(0 0 100% 0); transform:translateY(10px); } to{ clip-path:inset(0 0 -10% 0); transform:none; } }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; height:40px; padding:0 17px; border-radius:999px;
  background:var(--weiss); color:var(--tinte); font-size:14px; font-weight:600; box-shadow:0 0 0 1.5px var(--linie-2) inset;
  transition:transform .16s var(--ez), background-color .15s ease; white-space:nowrap; }
.btn:active{ transform:scale(.97); }
.btn.prim{ background:var(--sec); color:var(--sec-ink); box-shadow:none; }
.btn.rund{ width:40px; padding:0; }
.btn.klein{ height:32px; padding:0 13px; font-size:13px; }
.btn.klein .ic{ width:15px; height:15px; }
.btn.rund.klein{ width:32px; padding:0; }
.btn.ghost{ box-shadow:none; background:transparent; color:var(--tinte-2); }
.btn.gefahr{ color:var(--rot); }
@media (hover:hover) and (pointer:fine){ .btn:not(.prim):hover{ background:var(--papier-2); } .btn.prim:hover{ filter:brightness(1.1); } }

.karte{ background:var(--weiss); border-radius:var(--r); padding:20px 22px; box-shadow:0 0 0 1.5px var(--linie) inset; min-width:0; }
.kasten{ background:var(--puder-2); border-radius:var(--r); padding:18px 20px; min-width:0; }
.k-kopf{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px; }
.leer{ color:var(--leise); font-size:14px; padding:4px 0; line-height:1.55; }
.raster2{ display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:18px; align-items:start; }
.stapel{ display:flex; flex-direction:column; gap:18px; min-width:0; }
.heute-raster{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
.heute-raster .spalte{ display:flex; flex-direction:column; gap:18px; min-width:0; }
.heute-raster .spalte:empty{ display:none; }

/* Linierte Felder wie im Planer */
.liniert{ background-color:transparent; border:0; border-radius:0; padding:4px 2px; line-height:32px; min-height:136px; box-shadow:none;
  background-image:repeating-linear-gradient(to bottom, transparent 0 31px, color-mix(in srgb, var(--rose) 45%, transparent) 31px 32px); }
.liniert:focus{ box-shadow:none; }

.chip{ height:32px; padding:0 13px; border-radius:999px; font-size:13px; color:var(--tinte-2); display:inline-flex; align-items:center; gap:7px;
  background:var(--weiss); box-shadow:0 0 0 1.5px var(--linie-2) inset; white-space:nowrap; transition:background-color .15s ease, color .15s ease, transform .16s var(--ez); }
.chip:active{ transform:scale(.97); }
.chip.on{ background:var(--kc,var(--sec)); color:var(--ki,var(--sec-ink)); box-shadow:none; }
.chip i.pkt{ width:9px; height:9px; border-radius:50%; background:var(--kc); }
.chip.on i.pkt{ background:var(--ki); }
.wahl{ display:flex; gap:6px; flex-wrap:wrap; }

/* ── Heute ── */
.jetzt{ position:relative; overflow:hidden; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 20px; align-items:end;
  padding:24px 26px 22px; border-radius:24px; margin-bottom:18px; background:var(--kc); color:var(--ki); }
.jetzt::after{ content:""; position:absolute; right:-10px; top:0; bottom:0; width:120px; opacity:.16; pointer-events:none;
  background:repeating-linear-gradient(90deg, var(--ki) 0 14px, transparent 14px 28px); }
.jetzt > *{ position:relative; z-index:1; }
.jetzt .lab{ color:var(--ki); opacity:.85; font-size:21px; }
.jetzt-t{ font-family:var(--disp); font-size:44px; line-height:1; margin-top:2px; }
.jetzt-s{ font-size:14px; margin-top:7px; opacity:.85; }
.jetzt-r{ text-align:right; padding-right:60px; }
.jetzt-r b{ font-family:var(--disp); font-size:42px; font-weight:400; line-height:1; display:block; white-space:nowrap; }
.jetzt-r span{ font-size:12px; opacity:.8; }
.jetzt-bar{ grid-column:1/-1; height:5px; border-radius:5px; background:color-mix(in srgb, var(--ki) 22%, transparent); margin-top:16px; overflow:hidden; }
.jetzt-bar i{ display:block; height:100%; background:var(--ki); border-radius:5px; }
.jetzt-dann{ grid-column:1/-1; font-size:14px; margin-top:12px; opacity:.9; }
.ablauf{ display:flex; flex-direction:column; gap:5px; }
.ab-z{ display:grid; grid-template-columns:52px minmax(0,1fr); gap:12px; padding:10px 14px; border-radius:var(--r-sm); text-align:left; width:100%; align-items:center;
  background:var(--kc); color:var(--ki); transition:transform .16s var(--ez); }
.ab-z:active{ transform:scale(.985); }
.ab-z.vorbei{ background:color-mix(in srgb, var(--kc) 16%, var(--weiss)); color:var(--tinte-2); }
.ab-z.vorbei .ab-n b{ text-decoration:line-through; text-decoration-color:color-mix(in srgb, var(--kc) 70%, transparent); text-decoration-thickness:1.5px; }
.ab-z.live{ box-shadow:0 0 0 2.5px var(--papier), 0 0 0 4.5px var(--kc); }
.ab-t{ font-size:13px; font-variant-numeric:tabular-nums; font-weight:700; opacity:.9; }
.ab-n{ min-width:0; }
.ab-n b{ display:block; font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ab-n span{ display:block; font-size:13px; opacity:.8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ganz-liste{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.pille{ display:inline-flex; align-items:center; gap:7px; padding:6px 13px 6px 10px; border-radius:999px; font-size:13px; font-weight:650; max-width:100%;
  background:var(--kc); color:var(--ki); text-align:left; }
.pille .ic{ width:14px; height:14px; }
.morgen{ margin-top:16px; padding-top:12px; border-top:1.5px dashed var(--linie-2); }
.morgen .lab{ font-size:20px; margin-bottom:6px; }
.mo-z{ display:flex; align-items:center; gap:10px; font-size:14px; color:var(--tinte-2); padding:3px 2px; min-width:0; }
.mo-z i{ width:9px; height:9px; border-radius:50%; background:var(--kc); flex:0 0 auto; }
.mo-z span{ color:var(--leise); font-size:13px; min-width:62px; font-variant-numeric:tabular-nums; }

/* ── Aufgaben ── */
.neu-a{ display:flex; gap:8px; margin-bottom:10px; }
.neu-a input{ flex:1; min-width:0; }
.neu-opt{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.a-gruppe{ margin-top:16px; }
.a-gruppe:first-child{ margin-top:0; }
.a-gruppe .lab{ font-size:21px; margin-bottom:2px; display:flex; gap:8px; align-items:baseline; }
.a-gruppe .lab small{ font-family:var(--sans); font-style:normal; font-size:12px; color:var(--leise); }
.a-gruppe .lab.rot{ color:var(--rot); }
.a-z{ display:flex; align-items:flex-start; gap:12px; padding:10px 2px; border-bottom:1.5px solid var(--linie); }
.a-z:last-child{ border-bottom:0; }
.a-box{ width:24px; height:24px; flex:0 0 auto; border-radius:50%; border:2px solid var(--kc,var(--oliv)); display:grid; place-items:center;
  color:transparent; position:relative; transition:background-color .15s ease, transform .16s var(--ez); margin-top:1px; }
.a-box::after{ content:""; position:absolute; inset:-10px; }
.a-box:active{ transform:scale(.9); }
.a-box .ic{ width:13px; height:13px; stroke-width:2.8; }
.a-z.fertig .a-box, .tr.erledigt .a-box{ background:var(--kc,var(--oliv)); color:var(--ki,var(--puder)); }
.a-z.fertig .a-t{ color:var(--leise); text-decoration:line-through; }
.a-t{ flex:1; min-width:0; text-align:left; line-height:1.4; padding-top:2px; overflow-wrap:anywhere; }
.a-meta{ display:flex; gap:8px; flex-wrap:wrap; margin-top:3px; font-size:12.5px; color:var(--leise); }
.a-meta .rot{ color:var(--rot); font-weight:650; }
.a-meta .tag{ display:inline-flex; align-items:center; gap:5px; }
.a-meta .tag i{ width:8px; height:8px; border-radius:50%; background:var(--kc); }
.a-stern{ color:var(--senf-dunkel); }
.a-zeile{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.alter{ font-size:11px; font-weight:650; padding:1px 8px; border-radius:999px; background:var(--papier-2); color:var(--tinte-2); white-space:nowrap; }
.alter.mittel{ background:var(--butter); color:var(--plum); }
.alter.alt{ background:var(--plum); color:var(--butter); }
.a-meta .tag .ic{ width:13px; height:13px; }
.notiz-vor{ font-style:italic; color:var(--tinte-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
.a-meta{ min-width:0; }
.a-anh{ flex:0 0 auto; align-self:center; display:inline-flex; align-items:center; gap:3px; height:28px; padding:0 9px; border-radius:999px;
  background:var(--weiss); color:var(--wein); font-size:12px; font-weight:700; box-shadow:0 0 0 1.5px color-mix(in srgb, var(--wein) 30%, transparent) inset; }
.a-anh .ic{ width:14px; height:14px; }
/* Zu erledigen auf Heute: zwei Stufen derselben Farbe, wichtig dunkel oben, der Rest hell darunter */
.a-z.stufe{ align-items:center; gap:10px; padding:9px 6px 9px 12px; margin-bottom:6px; border-bottom:0; border-radius:10px; background:var(--kc); color:var(--ki); }
.a-z.stufe:last-child{ margin-bottom:0; }
.a-z.stufe + .a-z.fertig{ margin-top:6px; }
.a-z.stufe .a-box{ border-color:var(--ki); }
.a-z.stufe .a-t{ padding-top:0; font-weight:600; }
.a-z.stufe .a-meta, .a-z.stufe .notiz-vor{ color:var(--ki); }
.a-z.stufe .a-meta .rot{ color:var(--ki); text-decoration:underline; text-underline-offset:3px; }
.a-z.stufe .alter{ background:color-mix(in srgb, var(--ki) 18%, transparent); color:var(--ki); }
.a-z.stufe .alter.alt{ background:var(--ki); color:var(--kc); }
.a-stufe{ flex:0 0 auto; width:36px; height:36px; display:grid; place-items:center; border-radius:50%; color:var(--ki); transition:transform 160ms cubic-bezier(.23,1,.32,1), background-color 160ms ease; }
.a-stufe .ic{ width:18px; height:18px; }
.a-stufe[aria-pressed="false"] .ic{ opacity:.6; }
.a-stufe[aria-pressed="true"] .ic path{ fill:currentColor; }
.a-stufe:active{ transform:scale(.9); }
@media (hover:hover){ .a-stufe:hover{ background:color-mix(in srgb, var(--ki) 14%, transparent); } }
.u-neu{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
.weg-chip{ padding:0 4px 0 13px; gap:4px; background:var(--kc); color:var(--ki); box-shadow:none; }
.weg-chip .weg-n{ display:inline-flex; align-items:center; gap:7px; color:inherit; font:inherit; height:100%; }
.weg-chip .weg-n i.pkt{ background:var(--ki); }
.weg{ width:24px; height:24px; border-radius:50%; display:grid; place-items:center; color:inherit; background:color-mix(in srgb, var(--ki) 22%, transparent); position:relative; }
.weg::after{ content:""; position:absolute; inset:-6px; }
.weg .ic{ width:12px; height:12px; stroke-width:2.6; }
.chip.fest{ opacity:.6; }
.u-neu.bearb .wahl{ animation:wackel .3s var(--ez); }
@keyframes wackel{ 30%{ transform:translateX(-2px); } 60%{ transform:translateX(2px); } }
.u-pfeil{ color:var(--leise); transform:rotate(90deg); width:18px; margin-left:6px; }
.h2-mod{ display:inline-block; vertical-align:middle; font-family:var(--sans); font-size:14px; font-weight:700; padding:4px 12px; border-radius:999px; background:var(--kc); color:var(--ki); }
.u-mini{ display:flex; flex-direction:column; gap:2px; }
.u-mini-z{ display:flex; align-items:center; gap:10px; padding:7px 4px; text-align:left; border-bottom:1px solid color-mix(in srgb, var(--rose) 25%, transparent); min-width:0; }
.u-mini-z:last-child{ border-bottom:0; }
.u-mini-z > i{ width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
.u-mini-t{ flex:1; min-width:0; font-size:14px; color:var(--tinte-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.u-mini-t b{ color:var(--tinte); font-weight:650; }
.u-mini-c{ display:inline-flex; align-items:center; gap:2px; font-size:12px; font-weight:700; color:var(--wein); }
.u-mini-c .ic{ width:13px; height:13px; }
.leer-linien{ min-height:96px; pointer-events:none; }
/* Termine: Datumsblock, Titel, Countdown, Haken */
.tr-gruppe{ margin-top:14px; }
.tr-gruppe:first-of-type{ margin-top:0; }
.tr-lab{ font-size:20px; color:var(--rose-dunkel); margin-bottom:6px; }
.tr{ display:grid; grid-template-columns:58px minmax(0,1fr) auto 28px; gap:4px 14px; align-items:center; padding:8px 0; border-bottom:1.5px solid var(--linie); }
.tr:last-child{ border-bottom:0; }
.tr-dat{ display:flex; flex-direction:column; align-items:center; justify-content:center; width:58px; height:64px; border-radius:14px; background:var(--kc); color:var(--ki); line-height:1; gap:2px; transition:transform .16s var(--ez); }
.tr-dat:active{ transform:scale(.96); }
.tr-dat small{ font-size:10.5px; font-weight:650; opacity:.85; }
.tr-dat b{ font-family:var(--disp); font-weight:400; font-size:28px; }
.tr-dat span{ font-size:11px; font-weight:650; }
.tr-n{ text-align:left; min-width:0; }
.tr-n b{ display:block; font-weight:650; font-size:15px; overflow-wrap:anywhere; }
.tr-n span{ font-size:13px; color:var(--tinte-2); }
.tr-n em{ font-style:normal; font-weight:650; }
.tr-cd{ font-size:13px; color:var(--tinte-2); white-space:nowrap; }
.tr.bald .tr-cd{ color:var(--rot); font-weight:700; }
.tr.erledigt .tr-dat{ opacity:.45; }
.tr.erledigt .tr-n b{ text-decoration:line-through; color:var(--leise); }
/* Zwei Farbwelten: Klausuren (Pflaume/Butter), Abgaben (Puder/Oliv) */
.reiter{ display:grid; grid-template-columns:1fr 1fr; padding:4px; border-radius:999px; background:var(--papier-2); margin-bottom:14px; }
.reiter button{ height:40px; border-radius:999px; font-weight:700; font-size:14px; color:var(--tinte-2); display:flex; align-items:center; justify-content:center; gap:7px; transition:background-color .18s ease, color .18s ease; }
.reiter button.on[data-ureiter="klausur"]{ background:var(--plum); color:var(--butter); }
.reiter button.on[data-ureiter="abgabe"]{ background:var(--oliv); color:var(--puder); }
.reiter em{ font-style:normal; font-size:11px; min-width:20px; height:20px; padding:0 5px; display:inline-grid; place-items:center; border-radius:999px; background:var(--butter); color:var(--plum); }
.reiter [data-ureiter="abgabe"] em{ background:var(--oliv); color:var(--puder); }
.reiter [data-ureiter="abgabe"].on em{ background:var(--puder); color:var(--oliv); }
.welten{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px; align-items:start; margin-bottom:18px; }
.welt{ border-radius:24px; padding:18px 18px 14px; min-width:0; }
.welt.kl{ background:var(--plum); color:var(--butter); }
.welt.ab{ background:var(--puder); color:var(--oliv); }
.welt-k{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:6px; }
.welt.kl .lab{ color:var(--butter); } .welt.ab .lab{ color:var(--oliv); }
.welt-k span{ font-size:12.5px; opacity:.9; }
.welt .leer{ color:inherit; opacity:.85; padding:8px 0; }
.welt.kl details.fertig-liste summary{ color:var(--puder); } .welt.ab details.fertig-liste summary{ color:var(--tinte-2); }
.kz{ display:grid; grid-template-columns:76px minmax(0,1fr) 28px; gap:14px; align-items:center; padding:12px 0; border-top:1.5px solid rgba(255,217,131,.22); }
.kz-cd{ width:76px; height:76px; border-radius:50%; background:var(--butter); color:var(--plum); display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; transition:transform .16s var(--ez); }
.kz-cd:active{ transform:scale(.96); }
.kz-cd b{ font-family:var(--disp); font-weight:400; font-size:30px; } .kz-cd b.wort{ font-size:19px; }
.kz-cd small{ font-size:10.5px; font-weight:750; margin-top:3px; }
.kz-t{ text-align:left; min-width:0; color:var(--butter); }
.kz-t b{ display:block; font-family:var(--disp); font-weight:400; font-size:22px; line-height:1.05; color:#fff4ec; overflow-wrap:anywhere; }
.kz-t span{ display:block; font-size:12.5px; color:var(--puder); margin-top:5px; }
.kz-t i{ display:inline-block; font-style:normal; margin-top:7px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; border:1.5px solid rgba(255,217,131,.6); }
.kz-t i.laeuft{ background:var(--butter); color:var(--plum); border-color:var(--butter); }
.kz-box{ width:26px; height:26px; border-radius:50%; border:2px solid rgba(255,217,131,.7); display:grid; place-items:center; color:transparent; position:relative; transition:transform .16s var(--ez); }
.kz-box::after{ content:""; position:absolute; inset:-10px; }
.kz-box:active{ transform:scale(.9); }
.kz-box .ic{ width:13px; height:13px; stroke-width:2.8; }
.kz.erledigt .kz-box{ background:var(--butter); color:var(--plum); border-color:var(--butter); }
.kz.erledigt .kz-t b{ text-decoration:line-through; opacity:.6; } .kz.erledigt .kz-cd{ opacity:.6; }
.az{ display:grid; grid-template-columns:44px minmax(0,1fr) auto 26px; gap:4px 12px; align-items:center; padding:9px 0; border-top:1.5px solid rgba(51,55,0,.14); }
.az-d{ text-align:center; line-height:1; color:var(--oliv); }
.az-d b{ display:block; font-family:var(--disp); font-weight:400; font-size:28px; } .az-d small{ font-size:10.5px; font-weight:750; }
.az-n{ text-align:left; min-width:0; } .az-n b{ display:block; font-size:14.5px; font-weight:650; color:var(--tinte); overflow-wrap:anywhere; }
.az-n span{ display:block; font-size:12.5px; color:var(--tinte-2); }
.az-cd{ font-size:12.5px; font-weight:700; white-space:nowrap; color:var(--oliv); } .az-cd.rot{ color:var(--rot); }
.az .a-box{ --kc:#333700; --ki:#f4cfd6; }
.az.erledigt .a-box{ background:var(--oliv); color:var(--puder); }
.az.erledigt .az-n b{ text-decoration:line-through; color:var(--leise); }
.uni-auf .a-z{ border-bottom-color:color-mix(in srgb, var(--rose) 25%, transparent); }
.uni-auf .neu-a input{ background:var(--weiss); }
/* Dateien an Uni-Aufgaben */
.dateien{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
.datei{ display:flex; align-items:center; gap:10px; padding:6px 6px 6px 8px; border-radius:var(--r-sm); background:var(--weiss); box-shadow:0 0 0 1.5px var(--linie) inset; }
.datei img,.datei-ic{ width:40px; height:40px; flex:0 0 auto; border-radius:8px; object-fit:cover; display:grid; place-items:center; background:var(--puder-2); color:var(--wein); }
.datei-n{ flex:1; min-width:0; text-align:left; display:flex; flex-direction:column; }
.datei-n b{ font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.datei-n span{ font-size:12px; color:var(--leise); }
.datei-neu{ position:relative; overflow:hidden; cursor:pointer; }
.datei-neu input{ position:absolute; inset:0; opacity:0; cursor:pointer; }
.anl-in{ width:130px; height:28px; padding:0 10px; border-radius:999px; font-size:12px; }
.idee-a.o{ background:var(--baby); color:var(--plum); }
details.fertig-liste summary{ cursor:pointer; color:var(--leise); font-size:13px; margin-top:16px; list-style:none; font-weight:600; }
details.fertig-liste summary::-webkit-details-marker{ display:none; }
details.fertig-liste summary::before{ content:"+ "; }
details.fertig-liste[open] summary::before{ content:"- "; }

/* ── Kalender ── */
.kal-leiste{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
.seg{ display:inline-flex; padding:4px; border-radius:999px; background:var(--papier-2); }
.seg button{ height:32px; padding:0 20px; border-radius:999px; font-size:13.5px; font-weight:650; color:var(--tinte-2); transition:background-color .18s ease, color .18s ease; }
.seg button.on{ background:var(--sec); color:var(--sec-ink); }
.kal-nav{ display:flex; align-items:center; gap:6px; }
.kal{ background:var(--weiss); border-radius:var(--r); box-shadow:0 0 0 1.5px var(--raster) inset; overflow:clip; min-width:0; }
/* Woche / Tag */
.wk-kopf{ display:grid; grid-template-columns:62px repeat(var(--n),minmax(0,1fr)); border-bottom:1.5px solid var(--raster); position:sticky; top:0; z-index:4; background:var(--weiss); }
.wk-tag{ padding:10px 4px 8px; text-align:center; font-size:12px; color:var(--rose-dunkel); line-height:1.15; }
.wk-tag b{ display:inline-grid; place-items:center; margin-top:3px; min-width:36px; height:36px; padding:0 4px; border-radius:50%; font-family:var(--disp); font-size:24px; font-weight:400; color:var(--tinte); }
.wk-tag.heute b{ background:var(--plum); color:var(--butter); }
.wk-ganz{ display:grid; grid-template-columns:62px minmax(0,1fr); border-bottom:1.5px solid var(--raster); background:var(--puder-2); }
.wk-ganz-l{ font-family:var(--kursiv); font-style:italic; font-size:14px; color:var(--rose-dunkel); padding:8px 8px 0 0; text-align:right; }
.wk-ganz-r{ display:grid; grid-template-columns:repeat(var(--n),minmax(0,1fr)); gap:3px 0; padding:4px 0 5px; min-height:36px; }
.wk-ganz-r .zelle{ grid-row:1/-1; cursor:copy; border-left:1px solid var(--linie); }
.gz{ z-index:1; margin:0 3px; border-radius:8px; padding:0 9px; font-size:12px; font-weight:650; display:flex; align-items:center; gap:6px; overflow:hidden; white-space:nowrap; min-width:0;
  background:var(--kc); color:var(--ki); text-align:left; }
.gz span{ overflow:hidden; text-overflow:ellipsis; }
.gz .ic{ width:13px; height:13px; }
.gz.erledigt{ opacity:.5; }
.gz.erledigt span{ text-decoration:line-through; }
.wk-body{ display:grid; grid-template-columns:62px repeat(var(--n),minmax(0,1fr)); position:relative; }
.wk-uhr{ position:relative; }
.wk-uhr span{ position:absolute; right:10px; font-size:11px; color:var(--leise); transform:translateY(-50%); font-variant-numeric:tabular-nums; }
.wk-uhr .jetzt-zeit{ color:var(--rot); font-weight:700; background:var(--weiss); padding:0 2px; z-index:3; }
.wk-sp{ position:relative; border-left:1px solid var(--linie); cursor:copy;
  background-image:linear-gradient(to bottom, transparent calc(100% - 1px), color-mix(in srgb, var(--raster) 60%, transparent) calc(100% - 1px)); background-size:100% var(--hour); }
.wk-sp.we{ background-color:color-mix(in srgb, var(--puder-2) 55%, transparent); }
.blk{ position:absolute; border-radius:10px; padding:5px 8px; overflow:hidden; cursor:pointer; text-align:left;
  background:var(--kc); color:var(--ki); box-shadow:0 0 0 1.5px var(--weiss);
  font-size:12px; line-height:1.25; transition:transform .16s var(--ez), filter .15s ease; }
.blk b{ display:block; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.blk span{ display:block; opacity:.85; font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.blk.kurz{ padding:2px 7px; display:flex; gap:6px; align-items:center; }
.blk:active{ transform:scale(.97); }
@media (hover:hover) and (pointer:fine){ .blk:hover{ filter:brightness(1.08); } }
.jetzt-linie{ position:absolute; left:0; right:0; height:0; border-top:2px solid var(--rot); z-index:2; pointer-events:none; }
.jetzt-linie::before{ content:""; position:absolute; left:-5px; top:-6px; width:10px; height:10px; border-radius:50%; background:var(--rot); }
/* Monat */
.mon-kopf{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-bottom:1.5px solid var(--raster); }
.mon-kopf span{ padding:12px 12px 8px; font-size:13px; color:var(--rose-dunkel); text-align:right; }
.mon{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); grid-auto-rows:minmax(120px,auto); }
.mz{ position:relative; border-right:1px solid var(--raster); border-bottom:1px solid var(--raster); padding:6px 6px 8px; display:flex; flex-direction:column; gap:3px; min-width:0;
  cursor:pointer; text-align:left; transition:background-color .15s ease; }
.mz:nth-child(7n){ border-right:0; }
.mz.we{ background:color-mix(in srgb, var(--puder-2) 60%, transparent); }
.mz.anders .mz-n{ color:#d6bdb6; }
.mz-k{ display:flex; align-items:center; justify-content:flex-end; gap:5px; }
.mz-n{ min-width:30px; height:30px; display:grid; place-items:center; border-radius:50%; font-size:16px; color:var(--rose-dunkel); font-variant-numeric:tabular-nums; }
.mz.heute .mz-n{ background:var(--plum); color:var(--butter); font-weight:650; }
.mz.wahl{ background:var(--butter-2); }
.mond{ width:12px; height:12px; flex:0 0 auto; }
.mz-e{ display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--tinte-2); white-space:nowrap; overflow:hidden; min-width:0; }
.mz-e i{ width:8px; height:8px; border-radius:50%; background:var(--kc); flex:0 0 auto; }
.mz-e em{ font-style:normal; color:var(--leise); font-variant-numeric:tabular-nums; }
.mz-e span{ overflow:hidden; text-overflow:ellipsis; }
.mz-g{ font-size:11.5px; font-weight:650; padding:2px 7px; border-radius:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:var(--kc); color:var(--ki); }
.mz-mehr{ font-size:11px; color:var(--leise); padding-left:2px; }
.mz-fest{ margin-top:auto; font-size:10.5px; color:var(--rose-dunkel); text-align:right; line-height:1.2; padding-top:2px; }
.mz-punkte{ display:none; }
.mon-raster{ display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:18px; align-items:start; }
.mon-seite{ display:flex; flex-direction:column; gap:14px; min-width:0; }
.tag-titel{ font-family:var(--disp); font-weight:400; font-size:28px; line-height:1.05; color:var(--tinte); }
.geb-z{ display:flex; gap:10px; align-items:baseline; padding:5px 0; border-bottom:1px solid color-mix(in srgb, var(--rose) 35%, transparent); font-size:14px; }
.geb-z b{ font-family:var(--disp); font-weight:400; font-size:18px; color:var(--plum); min-width:28px; }
.geb-z span{ color:var(--leise); font-size:12.5px; margin-left:auto; }
@media (max-width:1100px){ .mon-raster{ grid-template-columns:minmax(0,1fr); } }

/* ── Geschenke ── */
/* ── Seine Woche: sein Planer im Zeitraster, nur zum Ansehen ── */
.pw-nav{ display:flex; gap:8px; }
.pw-leiste{ margin-bottom:12px; }
.pw-kal .wk-sp, .pw-kal .wk-ganz-r{ cursor:default; }
.pw-kal .blk{ cursor:default; }
.pw-kal .blk:active{ transform:none; }
.pw-kal button.wk-tag{ cursor:pointer; border-radius:12px; }
@media (hover:hover){ .pw-kal button.wk-tag:hover b{ background:var(--puder-2); } .pw-kal button.wk-tag.heute:hover b{ background:var(--plum); } }
.pw-name{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:18px; }
.pw-name .lab{ margin:0; font-size:20px; }
.pw-name input{ width:180px; }
@media (max-width:820px){ .pw-leiste .seg{ grid-template-columns:repeat(2,1fr); } }
.seite-partner .fab{ display:none; }
.xmas{ position:relative; overflow:hidden; border-radius:24px; padding:20px 22px; margin-bottom:18px; background:var(--oliv); color:var(--puder); }
.xmas::after{ content:""; position:absolute; right:0; top:0; bottom:0; width:110px; opacity:.2; background:repeating-linear-gradient(90deg, var(--blush) 0 13px, transparent 13px 26px); pointer-events:none; }
.xmas > *{ position:relative; z-index:1; }
.xmas-k{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px; padding-right:90px; }
.xmas-ic{ width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--butter); color:var(--oliv); flex:0 0 auto; }
.xmas-k > div{ display:flex; flex-direction:column; }
.xmas-k b{ font-family:var(--disp); font-size:32px; font-weight:400; line-height:1; color:var(--butter); }
.xmas-k span{ font-size:13px; margin-top:4px; }
.xmas-bar{ flex:1; min-width:140px; height:6px; border-radius:6px; background:color-mix(in srgb, var(--puder) 25%, transparent); overflow:hidden; }
.xmas-bar i{ display:block; height:100%; background:var(--butter); border-radius:6px; }
.xmas-pers{ display:flex; flex-wrap:wrap; gap:6px; }
.xp{ display:inline-flex; align-items:center; gap:7px; padding:5px 12px 5px 5px; border-radius:999px; font-size:13px; background:color-mix(in srgb, var(--puder) 14%, transparent); color:var(--puder); }
.xp > i{ width:22px; height:22px; border-radius:50%; display:grid; place-items:center; border:2px dashed color-mix(in srgb, var(--puder) 55%, transparent); }
.xp > i .ic{ width:12px; height:12px; stroke-width:2.6; }
.xp.s-idee > i{ border-style:solid; border-color:var(--butter); color:var(--butter); }
.xp.s-gekauft{ background:var(--butter); color:var(--oliv); } .xp.s-gekauft > i{ border:0; background:var(--oliv); color:var(--butter); }
.gb-bald{ display:flex; gap:10px; overflow-x:auto; padding:2px 2px 8px; margin-bottom:12px; scrollbar-width:none; }
.gb-bald::-webkit-scrollbar{ display:none; }
.gb{ flex:0 0 auto; display:flex; align-items:center; gap:11px; padding:8px 18px 8px 8px; border-radius:999px; background:var(--puder); text-align:left; transition:transform .16s var(--ez); }
.gb:active{ transform:scale(.97); }
.gb b.n{ display:grid; place-items:center; width:42px; height:42px; border-radius:50%; font-family:var(--disp); font-size:21px; font-weight:400; background:var(--weiss); color:var(--plum); }
.gb.nah{ background:var(--plum); color:var(--puder); }
.gb.nah b.n{ background:var(--butter); }
.gb span{ display:flex; flex-direction:column; line-height:1.25; font-size:12.5px; opacity:.85; }
.gb span b{ font-size:14px; opacity:1; }
.pers{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; align-items:start; }
.per{ display:flex; flex-direction:column; gap:10px; }
.per-k{ display:flex; align-items:center; gap:12px; }
.per-av{ width:46px; height:46px; flex:0 0 auto; border-radius:50%; display:grid; place-items:center; font-family:var(--disp); font-size:24px; background:var(--plum); color:var(--butter); }
.per-n{ flex:1; min-width:0; display:flex; flex-direction:column; }
.per-n b{ font-family:var(--disp); font-weight:400; font-size:22px; line-height:1.1; }
.per-n span{ font-size:12.5px; color:var(--tinte-2); }
.per-n span i{ font-style:normal; color:var(--wein); font-weight:650; }
.per-warn{ font-size:12.5px; color:var(--plum); background:var(--butter); border-radius:999px; padding:5px 12px; align-self:flex-start; font-weight:600; }
.idee{ display:flex; align-items:center; gap:10px; padding:6px 4px 6px 7px; border-radius:var(--r-xs); background:var(--weiss); }
.idee-st{ width:30px; height:30px; flex:0 0 auto; border-radius:50%; display:grid; place-items:center; box-shadow:0 0 0 1.5px var(--linie-2) inset; color:var(--senf-dunkel); background:var(--weiss); transition:transform .16s var(--ez); }
.idee-st:active{ transform:scale(.9); }
.idee-st .ic{ width:15px; height:15px; }
.idee.gekauft .idee-st{ background:var(--oliv); color:var(--butter); box-shadow:none; }
.idee.verschenkt .idee-st{ background:var(--puder); color:var(--plum); box-shadow:none; }
.idee-t{ flex:1; min-width:0; font-size:14px; overflow-wrap:anywhere; }
.idee-t em{ font-style:normal; color:var(--leise); font-size:12.5px; margin-left:6px; }
.idee-a{ font-size:10.5px; font-weight:650; padding:2px 8px; border-radius:999px; margin-left:6px; white-space:nowrap; }
.idee-a.x{ background:var(--oliv); color:var(--puder); } .idee-a.g{ background:var(--plum); color:var(--butter); }
.idee-s{ font-size:11px; color:var(--leise); white-space:nowrap; }
.anl{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--tinte-2); }
.anl .chip{ height:28px; font-size:12px; padding:0 11px; }

/* ── Blatt (Dialog) ── */
.blatt-ov{ position:fixed; inset:0; z-index:50; background:rgba(55,20,28,.28);
  display:flex; align-items:center; justify-content:center; padding:24px; opacity:0; pointer-events:none; transition:opacity .2s ease; }
.blatt-ov.on{ opacity:1; pointer-events:auto; }
.blatt{ width:100%; max-width:500px; max-height:min(88vh,820px); overflow:auto; overscroll-behavior:contain; background:var(--papier); border-radius:28px; padding:26px;
  box-shadow:0 30px 70px -24px rgba(60,20,30,.45); transform:translateY(12px) scale(.98); transition:transform .3s var(--drawer); }
.blatt-ov.on .blatt{ transform:none; }
.blatt h2{ font-family:var(--disp); font-weight:400; font-size:34px; line-height:1.05; margin-bottom:18px; color:var(--sec-text); }
.feld{ margin-bottom:14px; }
.feld > label, .zeile label{ display:block; font-size:12.5px; color:var(--tinte-2); margin-bottom:6px; font-weight:650; }
.zeile{ display:flex; gap:10px; }
.zeile > *{ flex:1; min-width:0; }
.schalter{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 16px; border-radius:var(--r-sm); background:var(--weiss); text-align:left; width:100%;
  box-shadow:0 0 0 1.5px var(--linie) inset; font-weight:600; }
.schalter small{ display:block; color:var(--leise); font-size:12.5px; margin-top:1px; font-weight:400; }
.sw{ width:46px; height:28px; border-radius:999px; background:var(--linie-2); position:relative; flex:0 0 auto; transition:background-color .2s ease; }
.sw::after{ content:""; position:absolute; left:3px; top:3px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(40,10,20,.25); transition:transform .22s var(--ez); }
.schalter.an .sw{ background:var(--oliv); }
.schalter.an .sw::after{ transform:translateX(18px); }
.blatt-akt{ display:flex; gap:8px; justify-content:flex-end; margin-top:22px; flex-wrap:wrap; }
.blatt-akt .links{ margin-right:auto; }
.farb-kopf{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.farb-opt{ position:relative; display:inline-flex; align-items:center; gap:8px; height:34px; padding:0 13px 0 6px; border-radius:999px; font-size:13px; font-weight:600;
  background:var(--weiss); color:var(--tinte-2); box-shadow:0 0 0 1.5px var(--linie-2) inset; cursor:pointer; transition:transform .16s var(--ez); }
.farb-opt:active{ transform:scale(.97); }
.farb-opt i{ width:22px; height:22px; border-radius:50%; background:var(--kc); box-shadow:0 0 0 1px color-mix(in srgb, var(--tinte) 12%, transparent) inset; }
.farb-opt.on{ box-shadow:0 0 0 2px var(--tinte) inset; color:var(--tinte); }
.farb-opt input[type=color]{ position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; padding:0; border:0; }
.farben{ display:grid; grid-template-columns:repeat(9,minmax(0,1fr)); grid-auto-flow:column; grid-template-rows:repeat(4,auto); gap:7px; max-width:420px; }
.farbe{ position:relative; aspect-ratio:1; border-radius:50%; background:var(--kc); color:var(--ki); display:grid; place-items:center;
  box-shadow:0 0 0 1px color-mix(in srgb, var(--tinte) 12%, transparent) inset; transition:transform .16s var(--ez); }
.farbe:active{ transform:scale(.9); }

<script>
/* ============================================================

const FAMILIEN=[

  ["Koralle",   [["#8c3b24","Rost"],["#b4573a","Terrakotta"],["#e39a7e","Koralle"],["#f6d2c2","Pfirsich"]]],

  ["Oliv",      [["#333700","Oliv","#f4cfd6"],["#6f6c1e","Moos","#ffe9b0"],["#a7a77a","Salbei","#333700"],["#dcdcbc","Pistazie"]]],
  ["Petrol",    [["#234a44","Tanne"],["#4f7d73","Petrol"],["#8fb5a8","Eukalyptus"],["#d3e6dd","Minze"]]],
  ["Blau",      [["#2f4f73","Nachtblau"],["#5f87ad","Taubenblau"],["#a9cbe8","Babyblau","#61122b"],["#dcebf7","Himmel"]]],
  ["Flieder",   [["#4b2f5e","Aubergine"],["#7d5f94","Flieder"],["#b9a3cf","Lavendel"],["#e6dcf0","Lila Hauch"]]],
  ["Erde",      [["#5b3a29","Kakao","#f4cfd6"],["#8c6a4f","Karamell"],["#d8c3a5","Sand","#61122b"],["#f1e6d6","Leinen"]]],
];
const lum=c=>{ const n=parseInt(String(c).slice(1),16), lin=v=>{ v/=255; return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4); };
  return .2126*lin(n>>16)+.7152*lin((n>>8)&255)+.0722*lin(n&255); };

/* ============================================================
   Daten
   ============================================================ */
const KEY="woche_v1", SYNC_KEY="woche_sync", MODUS_KEY="woche_kalmodus";

const leer=()=>({uniArten:[],v:3,name:"",sem:{start:"",ende:""},h0:7,h1:22,module:[],fix:[],woche:{},aus:{},ganz:[],todos:[],termine:[],geschenke:[],monNotiz:{},korr:[],upd:0});

/* ── Datum ── */
const p2=n=>String(n).padStart(2,"0");

const festCache={};
function feste(y){
  if(festCache[y]) return festCache[y];
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
    i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mon=Math.floor((h+l-7*m+114)/31),tag=((h+l-7*m+114)%31)+1;
  const ostern=new Date(y,mon-1,tag), o=n=>dk(addD(ostern,n));
  const mai=new Date(y,4,1), muttertag=dk(addD(mai,((7-mai.getDay())%7)+7));
  const r={[`${y}-01-01`]:"Neujahr",[`${y}-02-14`]:"Valentinstag",[o(-2)]:"Karfreitag",[o(0)]:"Ostersonntag",[o(1)]:"Ostermontag",[`${y}-05-01`]:"Tag der Arbeit",
    [muttertag]:"Muttertag",[o(39)]:"Himmelfahrt",[o(50)]:"Pfingstmontag",[`${y}-10-03`]:"Tag der Einheit",[`${y}-10-31`]:"Halloween",
    [`${y}-12-06`]:"Nikolaus",[`${y}-12-24`]:"Heiligabend",[`${y}-12-25`]:"1. Weihnachtstag",[`${y}-12-26`]:"2. Weihnachtstag",[`${y}-12-31`]:"Silvester"};
  return festCache[y]=r;
}

/* ── Mondphasen wie im Planer: Neumond, zunehmend, Vollmond, abnehmend ──
   Zeitpunkte nach Meeus (Astronomical Algorithms, Kap. 49, gekürzt):
   auf wenige Minuten genau, dann auf den lokalen Kalendertag gelegt. */
const mondCache={};
function mondJahr(y){
  if(mondCache[y]) return mondCache[y];
  const r={}, rad=Math.PI/180, k0=Math.floor((y-2000)*12.3685)-2;
  for(let k=k0;k<k0+16;k++) for(const [q,n] of [[0,"neu"],[.25,"zu"],[.5,"voll"],[.75,"ab"]]){
    const kk=k+q, T=kk/1236.85;
    let jde=2451550.09766+29.530588861*kk+0.00015437*T*T;
    const M=(2.5534+29.1053567*kk)*rad, Mp=(201.5643+385.81693528*kk)*rad, F=(160.7108+390.67050284*kk)*rad, E=1-0.002516*T, sn=Math.sin;
    if(q===0) jde+=-0.4072*sn(Mp)+0.17241*E*sn(M)+0.01608*sn(2*Mp)+0.01039*sn(2*F)+0.00739*E*sn(Mp-M)-0.00514*E*sn(Mp+M)+0.00208*E*E*sn(2*M);
    else if(q===.5) jde+=-0.40614*sn(Mp)+0.17302*E*sn(M)+0.01614*sn(2*Mp)+0.01043*sn(2*F)+0.00734*E*sn(Mp-M)-0.00515*E*sn(Mp+M)+0.00209*E*E*sn(2*M);
    else { const W=0.00306-0.00038*E*Math.cos(M)+0.00026*Math.cos(Mp)-0.00002*Math.cos(Mp-M)+0.00002*Math.cos(Mp+M)+0.00002*Math.cos(2*F);
      jde+=-0.62801*sn(Mp)+0.17172*E*sn(M)-0.01183*E*sn(Mp+M)+0.00862*sn(2*Mp)+0.00804*sn(2*F)+0.00454*E*sn(Mp-M)+0.00204*E*E*sn(2*M)+(q===.25?W:-W); }
    const d=new Date((jde-2440587.5)*86400000-69000); r[dk(d)]=n;
  }
  return mondCache[y]=r;
}
const mondAm=k=>mondJahr(+k.slice(0,4))[k]||null;
const MOND_N={neu:"Neumond",zu:"zunehmender Halbmond",voll:"Vollmond",ab:"abnehmender Halbmond"};

  return `<svg class="mond" viewBox="0 0 12 12" aria-label="${MOND_N[p]}" role="img"><title>${MOND_N[p]}</title><circle cx="6" cy="6" r="5" fill="none" stroke="${f}" stroke-width="1.2"/>${inn}</svg>`;
}

/* ── Kalender-Daten ──
   fix:   wiederkehrend, jede Woche am selben Tag (tag 0–6)
   woche: { Montag: [Einträge nur dieser Woche] }
   aus:   { Montag: [fix-ids, die diese Woche ausfallen] }
   ganz:  ganztägige Einträge {von, bis} — dazu kommen automatisch
          Geburtstage (Geschenke) und Fristen (Uni)
   farbe: jeder Eintrag darf eine eigene Farbe tragen */
function tagEintraege(mk,tag){
  const aus=(S.aus[mk]||[]);
  const f=S.fix.filter(b=>b.tag===tag&&!aus.includes(b.id)).map(b=>({...b,wdh:true}));
  const w=(S.woche[mk]||[]).filter(b=>b.tag===tag).map(b=>({...b,wdh:false}));
  return f.concat(w).sort((a,b)=>hm(a.start)-hm(b.start));
}
const eintraegeAm=k=>{ const d=pk(k); return tagEintraege(mkVon(d),wtag(d)); };
const modVon=id=>S.module.find(m=>m.id===id)||null;
const katVon=id=>KATS.find(k=>k.id===id)||KATS[KATS.length-1];
const autoFarbe=b=>{ const m=b.modul&&modVon(b.modul); return m?m.farbe:katVon(b.kat).c; };
const farbeVon=b=>b.farbe||autoFarbe(b);
const titelVon=(b,kurz)=>{ const m=b.modul&&modVon(b.modul); return m?(kurz&&m.kurz?m.kurz:m.name):(b.titel||katVon(b.kat).l); };

/* Ganztägiges an einem Tag: eigene Einträge, Fristen, Geburtstage */
function ganzAm(k){
  const d=pk(k), out=[];
  (S.ganz||[]).forEach(g=>{ if(g.von<=k&&g.bis>=k) out.push({typ:"ganz",id:g.id,titel:g.titel,c:g.farbe||katVon(g.kat).c,von:g.von,bis:g.bis}); });
  (S.termine||[]).forEach(t=>{ if(t.datum===k) out.push({typ:"frist",id:t.id,titel:t.titel+(t.zeit?` · ${t.zeit}`:""),c:terArt(t.art)[2],art:t.art,erledigt:!!t.erledigt,von:k,bis:k}); });
  (S.geschenke||[]).forEach(p=>{ if(p.tag===d.getDate()&&p.monat===d.getMonth()+1)
    out.push({typ:"geb",id:p.id,titel:`${p.name}${p.jahr?` wird ${d.getFullYear()-p.jahr}`:" hat Geburtstag"}`,c:P.Blush,von:k,bis:k}); });
  return out;
}
const ganzIcon=x=>x.typ==="geb"?"kuchen":x.typ==="frist"?"flagge":"kalender";
const ganzAttr=x=>x.typ==="ganz"?`data-ganz="${x.id}"`:x.typ==="frist"?`data-act="terEdit" data-id="${x.id}"`:`data-gzu="${x.id}" data-go="geschenke"`;
function spalten(l){
  const out=l.map(b=>({b,s:hm(b.start),e:Math.max(hm(b.end),hm(b.start)+15),col:0,cols:1}));
  let grp=[], ende=-1;
  const fertig=()=>{ const n=Math.max(1,...grp.map(x=>x.col+1)); grp.forEach(x=>x.cols=n); grp=[]; };
  out.forEach(x=>{
    if(x.s>=ende&&grp.length) fertig();
    const belegt=new Set(grp.filter(y=>y.e>x.s).map(y=>y.col));
    let c=0; while(belegt.has(c)) c++; x.col=c; grp.push(x); ende=Math.max(ende,x.e);
  });
  if(grp.length) fertig();
  return out;
}
function semInfo(){
  const {start,ende}=S.sem||{};
  if(!start) return null;
  const s=mo(pk(start)), h=pk(heute());
  const w=Math.floor((mo(h)-s)/(7*86400000))+1;
  const gesamt=ende?Math.floor((mo(pk(ende))-s)/(7*86400000))+1:null;
  if(h<pk(start)) return {vor:true,tage:tageBis(start),gesamt};
  if(ende&&h>pk(ende)) return {nach:true,gesamt};
  return {w,gesamt};
}

/* Heute am Laptop: die Karten der Reihe nach immer in die gerade kürzere

const breit=matchMedia("(min-width:821px)");
function heuteAusgleich(){
  const r=document.querySelector(".heute-raster"); if(!r) return;
  const [a,b]=r.querySelectorAll(".spalte");
  /* die ursprüngliche Reihenfolge merken, sonst verdreht ein zweiter Durchlauf sie */
  if(!r.dataset.n){ [...a.children].forEach((k,i)=>k.dataset.n=i); r.dataset.n=1; }
  const karten=[...r.querySelectorAll(".spalte > *")].sort((x,y)=>x.dataset.n-y.dataset.n);
  karten.forEach(k=>a.appendChild(k));
  if(!breit.matches) return;
  const hoehe=karten.map(k=>k.getBoundingClientRect().height), gap=18;
  let ha=0, hb=0;
  karten.forEach((k,i)=>{ if(ha<=hb){ a.appendChild(k); ha+=hoehe[i]+gap; } else { b.appendChild(k); hb+=hoehe[i]+gap; } });
}

      ${naechst?`<div class="jetzt-dann">Danach ${esc(titelVon(naechst))} um ${naechst.start}${naechst.ort?` · ${esc(naechst.ort)}`:""}</div>`:""}</div>`;
  } else if(naechst){
    karte=`<div class="jetzt" style="${kv(farbeVon(naechst))}">
      <div><div class="lab">als nächstes:</div><div class="jetzt-t">${esc(titelVon(naechst))}</div>
        <div class="jetzt-s">${esc(mitArt(naechst,`${naechst.start} bis ${naechst.end}${naechst.ort?` · ${naechst.ort}`:""}`))}</div></div>
      <div class="jetzt-r"><b class="num">${dauerText(hm(naechst.start)-jetzt)}</b><span>bis dahin</span></div></div>`;
  } else {
    karte=`<div class="jetzt" style="${kv(P.Oliv)}">

        <div class="jetzt-s">${l.length?"Zeit für dich, oder ein Blick auf morgen.":"Im Kalender trägst du deine Woche ein."}</div></div></div>`;
  }
  const aufg=alltagListe();
  const fristen=S.termine.filter(t=>!t.erledigt&&tageBis(t.datum)>=0&&tageBis(t.datum)<=21).sort((a,b)=>a.datum.localeCompare(b.datum));
  const geb=gebBald(14);
  const k2=dk(addD(d,1)), morgen=eintraegeAm(k2), gMorgen=ganzAm(k2);
  const morgenZeilen=(morgen.length||gMorgen.length)?`
        ${gMorgen.map(x=>`<div class="mo-z" style="--kc:${x.c}"><i></i><span>ganztags</span>${esc(x.titel)}</div>`).join("")}
        ${morgen.slice(0,4).map(b=>`<div class="mo-z" style="--kc:${farbeVon(b)}"><i></i><span>${b.start}</span>${esc(titelVon(b))}</div>`).join("")}
        ${morgen.length>4?`<div class="mo-z" style="--kc:transparent"><i></i><span></span>und ${morgen.length-4} weitere</div>`:""}`:"";
  const morgenHtml=morgenZeilen?`<div class="morgen"><div class="lab" style="--kc:#9a4c4f">morgen:</div>${morgenZeilen}</div>`:"";
  /* Ein leerer Tag braucht keinen Tagesablauf (die Karte oben sagt es schon):
     dann rücken die Aufgaben nach oben, und nur „morgen“ steht am Ende. */
  const tagLeer=!l.length&&!g.length;
  const ablaufKarte=`<div class="karte">
      <div class="k-kopf"><h3 class="lab" style="--kc:#9a4c4f">tagesablauf:</h3><button class="btn klein ghost" data-go="kalender">Kalender ${ic("rechts")}</button></div>
      ${g.length?`<div class="ganz-liste">${g.map(pilleHtml).join("")}</div>`:""}
      ${l.length?ablaufHtml(l,k,jetzt):""}
      ${morgenHtml}

  const morgenKarte=morgenZeilen?`<div class="karte"><div class="k-kopf"><h3 class="lab" style="--kc:#9a4c4f">morgen:</h3><button class="btn klein ghost" data-go="kalender">Kalender ${ic("rechts")}</button></div>${morgenZeilen}</div>`:"";
  const offenN=aufg.filter(t=>!t.done).length;
  const karten=[
    tagLeer?"":ablaufKarte,
    `<div class="karte">

        <div class="neu-a"><input id="schnellA" placeholder="Neue Aufgabe" autocomplete="off" enterkeyhint="done" aria-label="Neue Aufgabe">
          <button class="btn rund" data-act="schnellA" aria-label="Hinzufügen" style="background:var(--oliv);color:var(--puder);box-shadow:none">${ic("plus")}</button></div>
        ${aufg.map(t=>aZeile(t,true)).join("")}

    uniMini(),
    fristen.length?`<div class="karte"><div class="k-kopf"><h3 class="lab" style="--kc:#8f6200">fristen:</h3><button class="btn klein ghost" data-go="uni">Uni ${ic("rechts")}</button></div>
        ${fristen.slice(0,5).map(terZeile).join("")}</div>`:"",
    geb.length?`<div class="kasten"><div class="k-kopf"><h3 class="lab" style="--kc:${P.Wein}">geburtstage:</h3><button class="btn klein ghost" data-go="geschenke">Geschenke ${ic("rechts")}</button></div>
        ${geb.map(({p,n})=>`<div class="geb-z"><b>${n.d.getDate()}.</b>${esc(p.name)}${n.alter?` wird ${n.alter}`:""}<span>${bisText(n.tage)}</span></div>`).join("")}</div>`:"",
    tagLeer?morgenKarte:""
  ].filter(Boolean);

  ${karte}

/* ============================================================
   Kalender: Tag, Woche, Monat
   ============================================================ */
function kalSchritt(r){
  const d=pk(kalDatum), altM=d.getMonth();
  if(kalModus==="tag") kalDatum=dk(addD(d,r));
  else if(kalModus==="woche") kalDatum=dk(addD(d,7*r));
  else { const n=new Date(d.getFullYear(),d.getMonth()+r,1); kalDatum=dk(n); monWahl=dk(n); }
  zeige(null, pk(kalDatum).getMonth()!==altM);
}
function vKalender(){
  const d=pk(kalDatum);
  let titel, unter;
  if(kalModus==="monat"){ titel=`${MON_L[d.getMonth()]} <em>${d.getFullYear()}</em>`;
    const n=S.termine.filter(t=>!t.erledigt&&t.datum.slice(0,7)===kalDatum.slice(0,7)).length;
    unter=n?`<b>${n} ${n===1?"Frist":"Fristen"}</b> in diesem Monat`:"Keine Fristen in diesem Monat"; }
  else if(kalModus==="woche"){ const m=mo(d), e=addD(m,6);
    titel=m.getMonth()===e.getMonth()?MON_L[m.getMonth()]:`${MON[m.getMonth()]} / ${MON[e.getMonth()]}`;
    unter=`KW ${kw(m)} · ${kurzD(m)} bis ${kurzD(e)} ${e.getFullYear()}`; }
  else { titel=`${d.getDate()}. ${MON_L[d.getMonth()]}`; unter=TAGE_L[wtag(d)]+(kalDatum===heute()?" · heute":""); }
  return `
  ${kopf(titel,unter,`<button class="btn prim nur-desk" data-act="neuEintrag">${ic("plus")}Eintrag</button>`)}
  <div class="kal-leiste">
    <div class="seg" role="tablist">${[["tag","Tag"],["woche","Woche"],["monat","Monat"]].map(([m,l])=>`<button role="tab" aria-selected="${kalModus===m}" class="${kalModus===m?"on":""}" data-modus="${m}">${l}</button>`).join("")}</div>
    <div class="kal-nav"><button class="btn rund" data-act="kalZurueck" aria-label="Zurück">${ic("links")}</button>
      <button class="btn" data-act="kalHeute">Heute</button>
      <button class="btn rund" data-act="kalVor" aria-label="Weiter">${ic("rechts")}</button></div>
  </div>
  ${kalModus==="monat"?monatHtml():kalModus==="woche"?wocheHtml():tagHtml()}`;
}
/* Woche und Tag teilen sich das Raster */
function zeitRaster(tage){
  const H0=S.h0, H1=S.h1, hh=hourPx();
  const hoehe=(H1-H0)*hh, d=new Date(), jetzt=d.getHours()*60+d.getMinutes();
  const n=tage.length, jetztDrin=tage.includes(heute())&&jetzt>=H0*60&&jetzt<=H1*60;
  const uhrSp=`<div class="wk-uhr" style="height:${hoehe}px">${[...Array(H1-H0)].map((_,i)=>i?`<span style="top:${i*hh}px">${p2(H0+i)}:00</span>`:"").join("")}
    ${jetztDrin?`<span class="jetzt-zeit" style="top:${(jetzt-H0*60)/60*hh}px">${uhr(jetzt)}</span>`:""}</div>`;
  const kopfZ=tage.map(k=>{ const t=pk(k); return `<div class="wk-tag${k===heute()?" heute":""}">${TAGE[wtag(t)].toLowerCase()}<br><b>${t.getDate()}</b></div>`; }).join("");
  /* Ganztägiges als durchgehende Streifen über die Tage, in Bahnen gestapelt */
  const gz=[], gesehen=new Set(), idx=k=>tagDiff(tage[0],k);
  tage.forEach(k=>ganzAm(k).forEach(x=>{ const key=x.typ+x.id+(x.typ==="geb"?k:""); if(gesehen.has(key)) return; gesehen.add(key);
    gz.push({x,s:Math.max(0,idx(x.von)),e:Math.min(n-1,idx(x.bis))}); }));
  const bahnen=[];
  gz.sort((a,b)=>a.s-b.s||(b.e-b.s)-(a.e-a.s)).forEach(g=>{ let b=0; while((bahnen[b]||[]).some(o=>!(g.e<o.s||g.s>o.e))) b++; (bahnen[b]=bahnen[b]||[]).push(g); g.b=b; });
  const ganz=`<div class="wk-ganz"><div class="wk-ganz-l">ganztags</div>
    <div class="wk-ganz-r" style="--n:${n};grid-template-rows:repeat(${Math.max(1,bahnen.length)},26px)">
    ${tage.map((k,i)=>`<div class="zelle" data-ganzneu="${k}" style="grid-column:${i+1}" title="Ganztägigen Eintrag anlegen"></div>`).join("")}
    ${gz.map(g=>{ const x=g.x;
      return `<button class="gz${x.erledigt?" erledigt":""}" ${ganzAttr(x)} style="${kv(x.c)};grid-column:${g.s+1}/${g.e+2};grid-row:${g.b+1}" title="${esc(x.titel)}">
        ${ic(ganzIcon(x))}<span>${esc(x.titel)}</span></button>`; }).join("")}</div></div>`;
  const spaltenHtml=tage.map(k=>{
    const t=pk(k), mk=mkVon(t), w=wtag(t);
    const bl=spalten(tagEintraege(mk,w)).map(x=>{
      const top=(x.s-H0*60)/60*hh, h=Math.max(20,(x.e-x.s)/60*hh-2), breite=100/x.cols, kurz=h<40;
      return `<button class="blk${kurz?" kurz":""}" data-blk="${mk}|${x.b.id}" style="${kv(farbeVon(x.b))};top:${top+1}px;height:${h}px;left:calc(${x.col*breite}% + 2px);width:calc(${breite}% - 4px)">
        <b>${esc(titelVon(x.b,n>1))}</b><span>${kurz?x.b.start:esc(mitArt(x.b,`${x.b.start}-${x.b.end}${x.b.ort?` · ${x.b.ort}`:""}`))}</span></button>`; }).join("");
    const linie=k===heute()&&jetztDrin?`<div class="jetzt-linie" style="top:${(jetzt-H0*60)/60*hh}px"></div>`:"";
    return `<div class="wk-sp${w>=5?" we":""}" data-slot="${k}" style="height:${hoehe}px">${bl}${linie}</div>`; }).join("");
  return `<div class="kal${n===1?" einspaltig":""}">
    <div class="wk-kopf" style="--n:${n}"><div></div>${kopfZ}</div>${ganz}
    <div class="wk-body" style="--n:${n}">${uhrSp}${spaltenHtml}</div></div>`;
}
const wocheHtml=()=>{ const m=mo(pk(kalDatum)); return zeitRaster([0,1,2,3,4,5,6].map(i=>dk(addD(m,i)))); };
const tagHtml=()=>zeitRaster([kalDatum]);
function monatHtml(){
  const d=pk(kalDatum), erster=new Date(d.getFullYear(),d.getMonth(),1), start=mo(erster);
  const wochen=Math.ceil((wtag(erster)+new Date(d.getFullYear(),d.getMonth()+1,0).getDate())/7);
  const zellen=[];
  for(let i=0;i<wochen*7;i++){
    const t=addD(start,i), k=dk(t), e=eintraegeAm(k), g=ganzAm(k), mond=mondAm(k), fest=festAm(k);
    const items=g.map(x=>`<div class="mz-g" style="${kv(x.c)}">${esc(x.titel)}</div>`)
      .concat(e.map(b=>`<div class="mz-e" style="--kc:${farbeVon(b)}"><i></i><em>${b.start}</em><span>${esc(titelVon(b,true))}</span></div>`));
    const punkte=[...g.map(x=>x.c),...e.map(b=>farbeVon(b))].filter((c,j,a)=>a.indexOf(c)===j).slice(0,4);
    zellen.push(`<button class="mz${t.getMonth()!==d.getMonth()?" anders":""}${wtag(t)>=5?" we":""}${k===heute()?" heute":""}${k===monWahl?" wahl":""}" data-mtag="${k}" aria-label="${langD(t)}${fest?", "+fest:""}">
      <span class="mz-k">${mond?mondSvg(mond):""}<span class="mz-n">${t.getDate()}</span></span>
      ${items.slice(0,3).join("")}${items.length>3?`<span class="mz-mehr">und ${items.length-3} weitere</span>`:""}
      ${fest?`<span class="mz-fest">${fest}</span>`:""}
      <span class="mz-punkte">${punkte.map(c=>`<i style="--kc:${c}"></i>`).join("")}</span></button>`);
  }
  const w=pk(monWahl), e=eintraegeAm(monWahl), g=ganzAm(monWahl), fest=festAm(monWahl), mond=mondAm(monWahl);
  const mKey=kalDatum.slice(0,7);
  const gebs=(S.geschenke||[]).filter(p=>p.monat===d.getMonth()+1&&p.tag).sort((a,b)=>a.tag-b.tag);
  return `<div class="mon-raster">
    <div class="kal"><div class="mon-kopf">${TAGE_L.map((t,i)=>`<span><span class="nur-desk">${t.toLowerCase()}</span><span class="nur-handy">${TAGE[i].toLowerCase()}</span></span>`).join("")}</div><div class="mon">${zellen.join("")}</div></div>
    <div class="mon-seite">
      <div class="karte">
        <div class="k-kopf"><h3 class="tag-titel">${monWahl===heute()?"Heute":langD(w)}</h3>
          <div class="wahl"><button class="btn klein" data-act="zumTag" data-tag="${monWahl}">Tag</button><button class="btn klein" data-act="neuAm" data-tag="${monWahl}">${ic("plus")}Eintrag</button></div></div>
        ${fest||mond?`<p class="hinweis" style="margin:-4px 0 10px">${[fest,mond?MOND_N[mond]:null].filter(Boolean).join(" · ")}</p>`:""}
        ${g.length?`<div class="ganz-liste">${g.map(pilleHtml).join("")}</div>`:""}
        ${e.length?ablaufHtml(e,monWahl,monWahl===heute()?new Date().getHours()*60+new Date().getMinutes():null):(g.length?"":`<div class="leer">Nichts eingetragen.</div>`)}
      </div>
      <div class="kasten">
        <h3 class="lab" style="--kc:${P.Wein};margin-bottom:6px">geburtstage:</h3>
        ${gebs.length?gebs.map(p=>`<div class="geb-z"><b>${p.tag}.</b>${esc(p.name)}${p.jahr?` wird ${d.getFullYear()-p.jahr}`:""}</div>`).join("")
          :`<div class="liniert leer-linien"></div>`}
      </div>
      <div class="kasten">
        <h3 class="lab" style="--kc:${P.Wein}">notizen:</h3>
        <textarea class="liniert" data-mnotiz="${mKey}" rows="5" aria-label="Notizen für ${MON_L[d.getMonth()]}">${esc((S.monNotiz||{})[mKey]||"")}</textarea>
      </div>
    </div></div>`;
}
function kalNachher(){
  /* Wischen wechselt Tag, Woche oder Monat */
  const k=document.querySelector(".kal"); if(!k) return;
  let x0=null,y0=null;
  k.addEventListener("touchstart",e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  k.addEventListener("touchend",e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6) kalSchritt(dx<0?1:-1); x0=null; },{passive:true});
}

/* Farbwahl: „Automatisch“ (Modul oder Art) oder eine der Planerfarben */
function farbWahlHtml(gewaehlt,auto,mitAuto=true){
  const g=(gewaehlt||"").toLowerCase(), treffer=PAL.find(p=>p.c===g), eigen=g&&!treffer;

      ${mitAuto?`<button class="farb-opt${!g?" on":""}" data-farbe="" style="${kv(auto)}"><i></i>Automatisch</button>`:""}

        <i></i>Eigene Farbe<input type="color" id="fEigen" value="${eigen?g:(treffer?g:auto)}" aria-label="Eigene Farbe wählen"></label>
    </div>

/* Verdrahtung der Farbwahl in einem Blatt */
function farbWahlWiring(setze){
  document.querySelectorAll("#blatt [data-farbe]").forEach(c=>c.onclick=()=>setze(c.dataset.farbe||null));

/* Eintrag anlegen / bearbeiten — mit Uhrzeit oder ganztägig, mit eigener Farbe */
function eintragBlatt(opt){
  opt=opt||{};
  let b=null, istFix=false, mkAlt=null;
  if(opt.blk){ const [mk,id]=opt.blk; mkAlt=mk; b=S.fix.find(x=>x.id===id); istFix=!!b; if(!b) b=(S.woche[mk]||[]).find(x=>x.id===id)||null; }
  const g=opt.ganz?(S.ganz||[]).find(x=>x.id===opt.ganz):null;
  if(opt.blk&&!b) return; if(opt.ganz&&!g) return;
  const datumAlt=b?dk(addD(pk(mkAlt),b.tag)):null;
  const tag0=opt.datum||heute();
  const e=Object.assign({titel:"",kat:opt.ganztags?"termin":"uni",modul:null,datum:tag0,bis:tag0,start:opt.start||"10:00",end:opt.end||"11:30",ort:"",ganz:!!opt.ganztags,farbe:null},
    b?{titel:b.titel||"",kat:b.kat,modul:b.modul,datum:datumAlt,bis:datumAlt,start:b.start,end:b.end,ort:b.ort||"",ganz:false,farbe:b.farbe||null}:{},
    g?{titel:g.titel,kat:g.kat,datum:g.von,bis:g.bis,ganz:true,ort:g.ort||"",farbe:g.farbe||null}:{});
  let wdh=istFix;

    blatt(`<h2>${b||g?"Eintrag bearbeiten":"Neuer Eintrag"}</h2>

      ${(!e.ganz&&(e.kat==="uni"||e.kat==="lernen"))?`<div class="feld"><label>Modul</label>
        ${S.module.length?`<div class="wahl" id="bMod">${S.module.map(m=>`<button class="chip${m.id===e.modul?" on":""}" data-m="${m.id}" style="${kv(m.farbe)}"><i class="pkt"></i>${esc(m.kurz||m.name)}</button>`).join("")}</div>`
          :`<div class="hinweis">Noch keine Module. Unter „Uni“ legst du sie an, dann bekommen Vorlesungen ihre Farbe.</div>`}</div>`:""}
      <div class="feld"><label for="bTitel">${uniArt?"Veranstaltung":"Titel"}${uniArt&&e.modul?" (optional)":""}</label>
        <input id="bTitel" value="${esc(e.titel)}" placeholder="${uniArt?"z. B. Vorlesung, Übung, Tutorium":e.ganz?"z. B. Urlaub, Exkursion, Umzug":"Worum geht es?"}" autocomplete="off">
        ${uniArt?`<div class="wahl" style="margin-top:8px">${["Vorlesung","Übung","Tutorium","Seminar","Praktikum"].map(a=>`<button class="chip${e.titel===a?" on":""}" data-art="${a}">${a}</button>`).join("")}</div>`:""}</div>
      <div class="feld"><label>Farbe</label>${farbWahlHtml(e.farbe,auto)}</div>
      <div class="feld"><button class="schalter${e.ganz?" an":""}" id="bGanz"><span>Ganztägig<small>${e.ganz?"Ohne Uhrzeit, gern auch über mehrere Tage":"Aus: mit Uhrzeit"}</small></span><span class="sw"></span></button></div>
      ${e.ganz?`<div class="feld zeile"><div><label for="bD">Von</label><input type="date" id="bD" value="${e.datum}"></div><div><label for="bB">Bis</label><input type="date" id="bB" value="${e.bis}"></div></div>`
        :`<div class="feld"><label for="bD">Tag</label><input type="date" id="bD" value="${e.datum}"></div>
          <div class="feld zeile"><div><label for="bVon">Von</label><input type="time" id="bVon" value="${e.start}"></div><div><label for="bBis">Bis</label><input type="time" id="bBis" value="${e.end}"></div></div>`}
      <div class="feld"><label for="bOrt">Ort</label><input id="bOrt" value="${esc(e.ort||"")}" placeholder="Raum, Gebäude, Link" autocomplete="off"></div>

      <div class="blatt-akt">${b||g?`<button class="btn gefahr links" id="bDel">Löschen</button>`:""}

/* ============================================================

   Alltag: stehen bei „Heute“ und bleiben, bis sie abgehakt sind;

const istUni=t=>t.bereich==="uni"||(!!t.modul&&t.bereich!=="alltag");

  if(!Array.isArray(S.uniArtenListe)) S.uniArtenListe=[...UNI_ARTEN,...(S.uniArten||[]).filter(a=>!UNI_ARTEN.includes(a))];

}
let uniBearbeiten=false;

/* ── Dateien zu Uni-Aufgaben: liegen im Browser-Speicher dieses Geräts (IndexedDB),
   in den Daten steht nur, welche es gibt. Zu groß für den Abgleich. ── */
const DB={ db:null,
  open(){ if(this.db) return Promise.resolve(this.db);
    return new Promise((res,rej)=>{ const r=indexedDB.open("woche_dateien",1); r.onupgradeneeded=()=>r.result.createObjectStore("dateien");
      r.onsuccess=()=>{ this.db=r.result; res(this.db); }; r.onerror=()=>rej(r.error); }); },
  async tx(mode,fn){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction("dateien",mode), st=t.objectStore("dateien"), r=fn(st);
    t.oncomplete=()=>res(r&&r.result); t.onerror=()=>rej(t.error); }); },
  put(id,v){ return this.tx("readwrite",st=>st.put(v,id)); },
  get(id){ return this.tx("readonly",st=>st.get(id)); },
  del(id){ return this.tx("readwrite",st=>st.delete(id)); },
};
async function oeffneDatei(id){
  const d=await DB.get(id).catch(()=>null);
  if(!d){ toast("Die Datei liegt nur auf dem Gerät, auf dem du sie hinzugefügt hast"); return; }
  const url=URL.createObjectURL(d.blob), a=document.createElement("a"); a.href=url; a.target="_blank"; a.rel="noopener";
  if(!/^(image\/|application\/pdf|text\/)/.test(d.typ||"")) a.download=d.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000);
}

function vUni(){

    return [o,l.filter(t=>!o.includes(t)).sort((a,b)=>b.datum.localeCompare(a.datum))]; };
  const [klO,klR]=teil(S.termine.filter(t=>t.art==="klausur")), [abO,abR]=teil(S.termine.filter(t=>t.art!=="klausur"));
  /* Uni-Aufgaben nach Modul gruppiert, ohne Modul zuletzt */
  const uniOffen=S.todos.filter(t=>istUni(t)&&!t.done).sort(aufSort), uniFertig=S.todos.filter(t=>istUni(t)&&t.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  const ag=[...S.module.map(m=>[m,uniOffen.filter(t=>t.modul===m.id)]),[null,uniOffen.filter(t=>!t.modul||!modVon(t.modul))]].filter(g=>g[1].length);

    `${uniOffen.length} ${uniOffen.length===1?"Aufgabe":"Aufgaben"} offen`].filter(Boolean).join(" · ");

/* ── Planer teilen: Jede App legt nur einen Auszug ihres Kalenders ab
   (Datum, Uhrzeit, Titel, Farbe), nie den ganzen Stand. Woche schreibt
   woche-planer.json und liest matti-planer.json, beides im Abgleich-Repo.
   Geburtstage aus der Geschenkeliste bleiben draußen. ── */
const TEIL_MEIN="woche-planer.json", TEIL_PARTNER="matti-planer.json", TEIL_CACHE="woche_partner", TEIL_LETZT="woche_teil_letzt";
const teilApi=(c,pfad)=>`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${pfad}`;
const partnerDaten=()=>{ try{ return JSON.parse(localStorage.getItem(TEIL_CACHE)||"null"); }catch(e){ return null; } };
const partnerName=()=>{ const d=partnerDaten(); return (d&&String(d.von||"").trim())||"Er"; };
const teilName=()=>String(S.teilName||S.name||"").trim();
const genitiv=n=>/[sßxz]$/i.test(n)?`${n}’`:`${n}s`;
function teilAuszug(){
  const tage={}, h=pk(heute());
  for(let i=-7;i<=62;i++){ const k=dk(addD(h,i));
    const b=eintraegeAm(k).map(x=>({start:x.start,end:x.end,titel:titelVon(x),farbe:farbeVon(x),...(artVon(x)?{art:artVon(x)}:{}),...(x.ort?{ort:x.ort}:{})}));
    const g=ganzAm(k).filter(x=>x.typ!=="geb").map(x=>({titel:x.titel,farbe:x.c}));
    if(b.length||g.length) tage[k]={b,g};
  }
  return {v:1,app:"woche",von:teilName(),tage};
}
let teilSha=null;
async function teilHoch(c){
  const a=teilAuszug(), roh=JSON.stringify(a);
  let alt=null; try{ alt=localStorage.getItem(TEIL_LETZT); }catch(e){}
  if(alt===roh) return;
  const url=teilApi(c,TEIL_MEIN), kopfz={Authorization:`token ${c.token}`,Accept:"application/vnd.github+json"};
  const shaHolen=async()=>{ const r=await fetch(url+"?t="+Date.now(),{headers:kopfz}); teilSha=r.ok?(await r.json()).sha:null; };
  if(!teilSha) await shaHolen();
  const senden=()=>fetch(url,{method:"PUT",headers:{...kopfz,"Content-Type":"application/json"},
    body:JSON.stringify({message:`planer ${new Date().toISOString()}`,content:b64(JSON.stringify({...a,stand:new Date().toISOString()})),...(teilSha?{sha:teilSha}:{})})});
  let r=await senden();
  if(r.status===409||r.status===422){ await shaHolen(); r=await senden(); }
  if(!r.ok) throw new Error(r.status);
  teilSha=(await r.json()).content.sha; try{ localStorage.setItem(TEIL_LETZT,roh); }catch(e){}
}
let teilFehler="";
async function teilHolen(c){
  try{
    const r=await fetch(teilApi(c,TEIL_PARTNER)+"?t="+Date.now(),{headers:{Authorization:`token ${c.token}`,Accept:"application/vnd.github+json"}});
    if(r.status===404){ teilFehler="fehlt"; return false; }
    if(!r.ok){ teilFehler=String(r.status); return false; }
    const d=JSON.parse(unb64((await r.json()).content)), vorher=localStorage.getItem(TEIL_CACHE), nameVorher=partnerName();
    teilFehler=""; const neu=JSON.stringify(d); if(neu===vorher) return false;
    localStorage.setItem(TEIL_CACHE,neu);
    if(partnerName()!==nameVorher) huelle();
    return true;
  }catch(e){ teilFehler="netz"; return false; }
}

/* Seine Woche als Zeitraster wie der eigene Kalender: freie Zeit bleibt als Lücke sichtbar.

function pwSchritt(r){

function partnerRaster(tage,d){
  const n=tage.length, hh=hourPx(), tagD=k=>(d.tage&&d.tage[k])||{b:[],g:[]};
  const norm=b=>({...b,end:hm(b.end)<=hm(b.start)?"24:00":b.end});
  const alle=tage.flatMap(k=>(tagD(k).b||[]).map(norm));
  const H0=Math.max(0,Math.min(S.h0,...alle.map(b=>Math.floor(hm(b.start)/60))));
  const H1=Math.min(24,Math.max(S.h1,...alle.map(b=>Math.ceil(hm(b.end)/60))));
  const hoehe=(H1-H0)*hh, jd=new Date(), jetzt=jd.getHours()*60+jd.getMinutes();
  const jetztDrin=tage.includes(heute())&&jetzt>=H0*60&&jetzt<=H1*60;
  const uhrSp=`<div class="wk-uhr" style="height:${hoehe}px">${[...Array(H1-H0)].map((_,i)=>i?`<span style="top:${i*hh}px">${p2(H0+i)}:00</span>`:"").join("")}
    ${jetztDrin?`<span class="jetzt-zeit" style="top:${(jetzt-H0*60)/60*hh}px">${uhr(jetzt)}</span>`:""}</div>`;
  const kopfZ=tage.map(k=>{ const t=pk(k), inner=`${TAGE[wtag(t)].toLowerCase()}<br><b>${t.getDate()}</b>`;
    return n>1?`<button class="wk-tag${k===heute()?" heute":""}" data-act="pwTag" data-tag="${k}" aria-label="${langD(t)} ansehen">${inner}</button>`
      :`<div class="wk-tag${k===heute()?" heute":""}">${inner}</div>`; }).join("");
  const ganzListe=tage.map(k=>tagD(k).g||[]), zeilen=Math.max(0,...ganzListe.map(l=>l.length));
  const ganz=zeilen?`<div class="wk-ganz"><div class="wk-ganz-l">ganztags</div>
    <div class="wk-ganz-r" style="--n:${n};grid-template-rows:repeat(${zeilen},26px)">
    ${ganzListe.map((l,i)=>l.map((g,j)=>`<div class="gz" style="${kv(g.farbe||P.Babyblau)};grid-column:${i+1};grid-row:${j+1}" title="${esc(g.titel)}"><span>${esc(g.titel)}</span></div>`).join("")).join("")}</div></div>`:"";
  const spaltenHtml=tage.map(k=>{
    const t=pk(k), w=wtag(t);
    const bl=spalten((tagD(k).b||[]).map(norm)).map(x=>{
      const top=(x.s-H0*60)/60*hh, h=Math.max(20,(x.e-x.s)/60*hh-2), breite=100/x.cols, kurz=h<40;
      const zusatz=[x.b.art,x.b.ort].filter(Boolean).join(" · ");
      return `<div class="blk${kurz?" kurz":""}" style="${kv(x.b.farbe||P.Babyblau)};top:${top+1}px;height:${h}px;left:calc(${x.col*breite}% + 2px);width:calc(${breite}% - 4px)" title="${esc(`${x.b.start}–${x.b.end} ${x.b.titel}${zusatz?` · ${zusatz}`:""}`)}">
        <b>${esc(x.b.titel)}</b><span>${kurz?esc(x.b.start):esc(`${x.b.start}–${x.b.end==="24:00"?"0:00":x.b.end}${zusatz?` · ${zusatz}`:""}`)}</span></div>`; }).join("");
    const linie=k===heute()&&jetztDrin?`<div class="jetzt-linie" style="top:${(jetzt-H0*60)/60*hh}px"></div>`:"";
    return `<div class="wk-sp${w>=5?" we":""}" style="height:${hoehe}px">${bl}${linie}</div>`; }).join("");
  return `<div class="kal pw-kal${n===1?" einspaltig":""}">
    <div class="wk-kopf" style="--n:${n}"><div></div>${kopfZ}</div>${ganz}
    <div class="wk-body" style="--n:${n}">${uhrSp}${spaltenHtml}</div></div>`;
}

const syncCfg=()=>{ try{ return JSON.parse(localStorage.getItem(SYNC_KEY)||"null"); }catch(e){ return null; } };
let syncSha=null, syncT=null;
const api=c=>`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${c.pfad||"woche.json"}`;
const b64=s=>btoa(unescape(encodeURIComponent(s))), unb64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
async function holen(c){ const r=await fetch(api(c)+"?t="+Date.now(),{headers:{Authorization:`token ${c.token}`,Accept:"application/vnd.github+json"}});
  if(r.status===404) return {fehlt:true}; if(!r.ok) throw new Error(r.status); const j=await r.json(); syncSha=j.sha; return {daten:JSON.parse(unb64(j.content))}; }
async function hochladen(c){
  const body={message:`woche ${new Date().toISOString()}`,content:b64(JSON.stringify(S)),...(syncSha?{sha:syncSha}:{})};
  const r=await fetch(api(c),{method:"PUT",headers:{Authorization:`token ${c.token}`,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});
  if(r.status===409||r.status===422){ syncSha=null; const h=await holen(c); if(h.daten&&h.daten.upd>S.upd){ S=Object.assign(leer(),h.daten); aufraeumen(); sichern(true); zeige(); return; } return hochladen(c); }
  if(!r.ok) throw new Error(r.status); syncSha=(await r.json()).content.sha; }
function syncSpaeter(){ const c=syncCfg(); if(!c) return; clearTimeout(syncT); syncT=setTimeout(()=>hochladen(c).then(()=>teilHoch(c).catch(()=>{})).catch(()=>toast("Abgleich fehlgeschlagen")),1500); }
async function syncJetzt(laut){ const c=syncCfg(); if(!c) return;
  setTimeout(teilAbgleich,1200);
  try{ const h=await holen(c);
    if(h.daten&&(h.daten.upd||0)>(S.upd||0)){ S=Object.assign(leer(),h.daten); aufraeumen(); try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} if(!document.getElementById("ov").classList.contains("on")) zeige(); if(laut) toast("Neuester Stand geholt"); }
    else if(h.fehlt||(h.daten&&(h.daten.upd||0)<(S.upd||0))){ await hochladen(c); if(laut) toast("Abgeglichen"); }
    else if(laut) toast("Alles aktuell");
  }catch(e){ if(laut) toast("Abgleich fehlgeschlagen ("+e.message+")"); } }
function syncBlatt(){
  const c=syncCfg()||{owner:"",repo:"",pfad:"woche.json",token:""};
  blatt(`<h2>Abgleich</h2>
    <p class="hinweis" style="margin-bottom:14px">Lege auf GitHub ein <b>privates</b> Repository an und erstelle einen Token (Fine-grained, nur dieses Repo, „Contents: Read and write“). Der Token bleibt nur auf diesem Gerät.</p>
    <div class="feld zeile"><div><label for="sO">GitHub-Name</label><input id="sO" value="${esc(c.owner)}" autocomplete="off" autocapitalize="off"></div><div><label for="sR">Repository</label><input id="sR" value="${esc(c.repo)}" autocomplete="off" autocapitalize="off"></div></div>
    <div class="feld"><label for="sT">Token</label><input id="sT" type="password" value="${esc(c.token)}" autocomplete="off" placeholder="github_pat_…"></div>
    <div class="blatt-akt">${syncCfg()?`<button class="btn gefahr links" id="sAus">Trennen</button>`:""}<button class="btn" data-act="zu">Abbrechen</button><button class="btn prim" id="sOk">Verbinden</button></div>`);

    if(!n.owner||!n.repo||!n.token){ toast("Alle drei Felder ausfüllen"); return; }
    try{ await holen(n); }catch(e){ toast("Keine Verbindung. Stimmen Name, Repo und Token?"); return; }
    localStorage.setItem(SYNC_KEY,JSON.stringify(n)); zu(); huelle(); zeige(); toast("Verbunden"); await syncJetzt(true); };
  q("sAus")?.addEventListener("click",()=>{ localStorage.removeItem(SYNC_KEY); syncSha=null; zu(); if(SEITE==="partner") SEITE="heute"; huelle(); zeige(); toast("Getrennt, die Daten bleiben auf diesem Gerät"); });
