    sichern(); toast(`„${a}“ entfernt`); zeige(); return; }
  const mweg=e.target.closest("[data-umodweg]");
  if(mweg){ const m=modVon(mweg.dataset.umodweg); if(m&&modulLoeschen(m)) zeige(); return; }
  const unneu=e.target.closest("[data-unartneu]");
  if(unneu){ const inp=Object.assign(document.createElement("input"),{className:"anl-in",maxLength:24,autocomplete:"off"});
    inp.dataset.unartin="1"; inp.setAttribute("aria-label","Eigene Art"); inp.enterKeyHint="done";
    unneu.replaceWith(inp); inp.focus(); inp.addEventListener("blur",()=>uniArtSetzen(inp)); return; }
  const gst=e.target.closest("[data-gst]");
  if(gst){ const [pid,iid]=gst.dataset.gst.split("|"), p=S.geschenke.find(x=>x.id===pid), i=p&&p.ideen.find(x=>x.id===iid); if(!i) return;
    i.status=({idee:"gekauft",gekauft:"verschenkt",verschenkt:"idee"})[i.status]; i.jahr=i.status==="verschenkt"?new Date().getFullYear():null; sichern(); zeige();
    toast(i.status==="gekauft"?"Besorgt":i.status==="verschenkt"?"Verschenkt, bleibt als Erinnerung stehen":"Wieder Idee"); return; }
  const gweg=e.target.closest("[data-gweg]"); if(gweg){ const [pid,iid]=gweg.dataset.gweg.split("|"), p=S.geschenke.find(x=>x.id===pid); if(!p) return; p.ideen=p.ideen.filter(x=>x.id!==iid); sichern(); zeige(); return; }
  const gneuA=e.target.closest("[data-ganlneu]");
  if(gneuA){ const inp=Object.assign(document.createElement("input"),{className:"anl-in",maxLength:24,autocomplete:"off"});
    inp.dataset.ganlin=gneuA.dataset.ganlneu; inp.setAttribute("aria-label","Eigener Anlass"); inp.enterKeyHint="done";
    gneuA.replaceWith(inp); inp.focus(); inp.addEventListener("blur",()=>anlassSetzen(inp)); return; }
  const ganl=e.target.closest("[data-ganl]"); if(ganl){ const [pid,...r]=ganl.dataset.ganl.split("|"), a=r.join("|"); anlassWahl[pid]=a; ganl.parentElement.querySelectorAll("[data-ganl]").forEach(c=>c.classList.toggle("on",c===ganl)); return; }
  const gadd=e.target.closest("[data-gadd]"); if(gadd){ ideeNeu(gadd.dataset.gadd); return; }
  const a=e.target.closest("[data-act]"); if(!a) return;
  const id=a.dataset.id, aktTag=()=>SEITE==="kalender"?(kalModus==="monat"?monWahl:kalModus==="tag"?kalDatum:(mkVon(pk(kalDatum))===mkVon(new Date())?heute():mkVon(pk(kalDatum)))):heute();
  switch(a.dataset.act){
    case "zu": zu(); break;
    case "einst": einstBlatt(false); break;
    case "neu":
      if(SEITE==="uni"){ terBlatt(null,uniReiter==="klausur"?"klausur":"abgabe"); break; }
      if(SEITE==="geschenke"){ personBlatt(null); break; }
      if(SEITE==="partner") break;
      eintragBlatt({datum:aktTag()}); break;
    case "neuEintrag": eintragBlatt({datum:aktTag()}); break;
    case "neuAm": eintragBlatt({datum:a.dataset.tag}); break;
    case "zumTag": kalDatum=a.dataset.tag; kalModus="tag"; zeige(); nachOben(); break;
    case "kalZurueck": kalSchritt(-1); break;
    case "kalVor": kalSchritt(1); break;
    case "kalHeute": { const alt=pk(kalDatum).getMonth(); kalDatum=heute(); monWahl=heute(); zeige(null,pk(kalDatum).getMonth()!==alt); break; }
    case "schnellA": { const i=document.getElementById("schnellA"); if(aufgabeNeu(i.value,{bereich:"alltag"})){ zeige(); document.getElementById("schnellA")?.focus(); } break; }
    case "aStufe": { const t=S.todos.find(x=>x.id===id); if(!t) break; t.wichtig=!t.wichtig; sichern(); zeige(); break; }
    case "aHaken": { const t=S.todos.find(x=>x.id===id); if(!t) break; t.done=!t.done; t.doneAt=t.done?Date.now():null; sichern(); zeige(); if(t.done) toast("Erledigt"); break; }
    case "aEdit": aufgabeBlatt(id); break;
    case "terHaken": { const t=S.termine.find(x=>x.id===id); if(!t) break; t.erledigt=!t.erledigt; sichern(); zeige(); if(t.erledigt) toast(t.art==="klausur"?"Geschrieben. Stark!":"Abgegeben. Stark!"); break; }
    case "modNeu": modBlatt(null); break;
    case "uniBearb": uniBearbeiten=!uniBearbeiten; zeige(); break;
    case "modEdit": modBlatt(id); break;
    case "terNeu": terBlatt(null,a.dataset.art); break;
    case "terEdit": terBlatt(id); break;
    case "perNeu": personBlatt(null); break;
    case "pwZurueck": if(pwSchritt(-1)) zeige(); break;
    case "pwVor": if(pwSchritt(1)) zeige(); break;
    case "pwHeute": pwDatum=null; zeige(); break;
    case "pwMod": pwModus=a.dataset.m; zeige(); break;
    case "pwTag": pwDatum=a.dataset.tag; pwModus="tag"; zeige(); nachOben(); break;
    case "perEdit": personBlatt(id); break;
  }
});
document.addEventListener("change",e=>{
  const n=e.target.closest("[data-gnotiz]"); if(n){ const p=S.geschenke.find(x=>x.id===n.dataset.gnotiz); if(p){ p.notiz=n.value.trim(); sichern(); toast("Notiz gespeichert"); } }
  const mn=e.target.closest("[data-mnotiz]"); if(mn){ S.monNotiz=S.monNotiz||{}; const v=mn.value.trim(); if(v) S.monNotiz[mn.dataset.mnotiz]=v; else delete S.monNotiz[mn.dataset.mnotiz]; sichern(); toast("Notiz gespeichert"); }
});
/* Wie sie bei ihm heißt: eigener Name nur fürs Teilen, die Begrüßung bleibt */
const pwNameSetzen=inp=>{ const v=inp.value.trim(); if(!v){ inp.value=teilName(); return; } if(v===teilName()) return;
  S.teilName=v; sichern(); toast(`Bei ihm heißt du jetzt ${v}`); };
document.addEventListener("change",e=>{ if(e.target.id==="pwName") pwNameSetzen(e.target); });
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") zu();
  if(e.key==="Enter"&&e.target.id==="pwName"){ e.preventDefault(); e.target.blur(); }
  if(e.key!=="Enter"||e.isComposing) return;
  if(e.target.dataset&&e.target.dataset.unartin){ e.preventDefault(); uniArtSetzen(e.target); }
  if(e.target.dataset&&e.target.dataset.ganlin){ e.preventDefault(); anlassSetzen(e.target); }
  if(e.target.id==="schnellA"){ e.preventDefault(); document.querySelector('[data-act="schnellA"]').click(); }
  if(e.target.dataset&&e.target.dataset.gneu){ e.preventDefault(); ideeNeu(e.target.dataset.gneu); }
});
/* Frisch bleiben: Die App bleibt auf dem Handy oft über Nacht offen */
const darfNeu=()=>!document.getElementById("ov").classList.contains("on")&&!document.activeElement?.matches("input,textarea,select");
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState!=="visible") return; syncJetzt(false); if(darfNeu()) zeige(); });
window.addEventListener("pageshow",()=>{ if(darfNeu()) zeige(); });
setInterval(()=>{ if(document.visibilityState==="visible"&&darfNeu()&&(SEITE==="heute"||SEITE==="kalender"||heute()!==renderTag)) zeige(); },60000);

laden(); huelle(); zeige("heute");
if(!S.gesehen) einstBlatt(true);
syncJetzt(false);
</script>
