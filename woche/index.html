<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Woche">
<meta name="theme-color" content="#fcf8f1">
<meta name="color-scheme" content="light">
<title>Woche</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
/* ============================================================
   WOCHE — ein Papierplaner zum Antippen.
   Große kontrastreiche Serif-Titel über Streifenbändern, feine
   altrosa Linien, puderrosa Kästen mit kursiven Beschriftungen.
   Farben: Pflaume #61122b, Altrosa #b46a6a, Butter #ffd983,
   Oliv #333700 und ihre Verwandten. Einträge sind vollflächig
   gefärbt, mit Kontrastschrift. Jeder Monat hat sein Farbpaar.
   ============================================================ */
:root{
  --papier:#fcf8f1; --papier-2:#f5ede2; --weiss:#fffdf9;
  --tinte:#2b1419; --tinte-2:#5f454a; --leise:#7d6368;
  --linie:#eedcd3; --linie-2:#e0c3b9; --raster:#e6b3aa;
  --plum:#61122b; --wein:#8e2c48; --rose:#b46a6a; --rose-dunkel:#9a4c4f; --blush:#e9a5a5; --puder:#f4cfd6; --puder-2:#faeaed;
  --baby:#a9cbe8; --baby-2:#e6f0f9; --butter:#ffd983; --butter-2:#fff1cc; --senf:#d6a33a; --senf-dunkel:#8f6200;
  --oliv:#333700; --moos:#6f6c1e; --salbei:#a7a77a; --kakao:#5b3a29; --sand:#d8c3a5;
  --gut:#6f6c1e; --rot:#a8323f;
  --disp:"Gloock","Bodoni 72","Didot",Georgia,serif;
  --kursiv:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --r:20px; --r-sm:14px; --r-xs:10px;
  --ez:cubic-bezier(.23,1,.32,1); --drawer:cubic-bezier(.32,.72,0,1);
  --hour:52px; --tabbar:68px;
  /* Bereich: Füllung, Schrift auf der Füllung, Akzentschrift auf Papier, Streifen */
  --sec:var(--plum); --sec-ink:var(--butter); --sec-text:var(--plum); --sa:var(--plum); --sb:var(--puder);
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%; }
body{ background:var(--papier); color:var(--tinte); font:15px/1.45 var(--sans); min-height:100vh; -webkit-font-smoothing:antialiased; }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none; }
input,select,textarea{ font:inherit; color:var(--tinte); background:var(--weiss); border:1.5px solid var(--linie-2);
  border-radius:var(--r-sm); padding:11px 14px; width:100%; outline:none; transition:border-color .15s ease, box-shadow .15s ease; }
textarea{ resize:vertical; }
input::placeholder,textarea::placeholder{ color:#7d6368; }
input:focus,select:focus,textarea:focus{ border-color:var(--sec-text); box-shadow:0 0 0 4px color-mix(in srgb, var(--sec-text) 14%, transparent); }
@media (pointer:coarse){ input,select,textarea{ font-size:16px; } }
.ic{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; display:block; flex:0 0 auto; }
.num{ font-variant-numeric:tabular-nums; }
.lab{ font-family:var(--kursiv); font-style:italic; font-weight:400; font-size:23px; line-height:1.1; color:var(--kc,var(--sec-text)); }

/* ── Gerüst ── */
.app{ display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100vh; }
.side{ position:sticky; top:0; height:100vh; padding:26px 14px 20px; display:flex; flex-direction:column; gap:3px; border-right:1.5px solid var(--linie); }
.brand{ font-family:var(--disp); font-size:42px; line-height:1; padding:0 12px 26px; color:var(--plum); }
.brand i{ color:var(--rose); font-style:normal; }
.nav{ display:flex; align-items:center; gap:12px; padding:8px 14px 8px 8px; border-radius:999px; color:var(--tinte-2); text-align:left; font-weight:550;
  transition:background-color .18s ease, color .18s ease, transform .16s var(--ez); }
.nav .pkt{ width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:var(--papier-2); color:var(--nt); flex:0 0 auto; }
.nav.on{ background:var(--nc); color:var(--ni); }
.nav.on .pkt{ background:color-mix(in srgb, var(--ni) 16%, transparent); color:var(--ni); }
.nav:active{ transform:scale(.97); }
@media (hover:hover) and (pointer:fine){ .nav:not(.on):hover{ background:var(--papier-2); } }
.side-fuss{ margin-top:auto; }
.main{ min-width:0; padding:26px 40px 60px; max-width:1320px; width:100%; }
.tabbar{ display:none; }

/* Kopf: Streifenband, darüber halb der große Titel — wie im Papierplaner */
.kopf{ position:relative; padding-top:50px; margin-bottom:24px; }
.kopf::before{ content:""; position:absolute; left:0; right:0; top:0; height:84px; border-radius:var(--r);
  background:repeating-linear-gradient(90deg, var(--sa) 0 26px, var(--sb) 26px 52px); }
.kopf-r{ position:absolute; top:22px; right:20px; display:flex; gap:8px; z-index:1; }
.titel{ position:relative; font-family:var(--disp); font-weight:400; font-size:clamp(52px,6.4vw,88px); line-height:.92; letter-spacing:-.015em;
  color:var(--sec-text); padding:0 18px; text-wrap:balance; }
.titel em{ font-style:normal; color:var(--rose); }
.titel.lang{ font-size:clamp(44px,5vw,70px); }
.unter{ padding:10px 20px 0; color:var(--tinte-2); font-size:14px; }
.unter b{ color:var(--sec-text); font-weight:650; }
.neu-seite .titel{ animation:druck .34s var(--ez) both; }
@keyframes druck{ from{ clip-path:inset(0 0 100% 0); transform:translateY(10px); } to{ clip-path:inset(0 0 -10% 0); transform:none; } }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; height:40px; padding:0 17px; border-radius:999px;
  background:var(--weiss); color:var(--tinte); font-size:14px; font-weight:600; box-shadow:0 0 0 1.5px var(--linie-2) inset;
  transition:transform .16s var(--ez), background-color .15s ease; white-space:nowrap; }
.btn:active{ transform:scale(.97); }
.btn.prim{ background:var(--sec); color:var(--sec-ink); box-shadow:none; }
.btn.rund{ width:40px; padding:0; }
.btn.klein{ height:32px; padding:0 13px; font-size:13px; }
.btn.klein .ic{ width:15px; height:15px; }
.btn.rund.klein{ width:32px; padding:0; }
.btn.ghost{ box-shadow:none; background:transparent; color:var(--tinte-2); }
.btn.gefahr{ color:var(--rot); }
@media (hover:hover) and (pointer:fine){ .btn:not(.prim):hover{ background:var(--papier-2); } .btn.prim:hover{ filter:brightness(1.1); } }

.karte{ background:var(--weiss); border-radius:var(--r); padding:20px 22px; box-shadow:0 0 0 1.5px var(--linie) inset; min-width:0; }
.kasten{ background:var(--puder-2); border-radius:var(--r); padding:18px 20px; min-width:0; }
.k-kopf{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px; }
.leer{ color:var(--leise); font-size:14px; padding:4px 0; line-height:1.55; }
.raster2{ display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:18px; align-items:start; }
.stapel{ display:flex; flex-direction:column; gap:18px; min-width:0; }
/* Linierte Felder wie im Planer */
.liniert{ background-color:transparent; border:0; border-radius:0; padding:4px 2px; line-height:32px; min-height:136px; box-shadow:none;
  background-image:repeating-linear-gradient(to bottom, transparent 0 31px, color-mix(in srgb, var(--rose) 45%, transparent) 31px 32px); }
.liniert:focus{ box-shadow:none; }

.chip{ height:32px; padding:0 13px; border-radius:999px; font-size:13px; color:var(--tinte-2); display:inline-flex; align-items:center; gap:7px;
  background:var(--weiss); box-shadow:0 0 0 1.5px var(--linie-2) inset; white-space:nowrap; transition:background-color .15s ease, color .15s ease, transform .16s var(--ez); }
.chip:active{ transform:scale(.97); }
.chip.on{ background:var(--kc,var(--sec)); color:var(--ki,var(--sec-ink)); box-shadow:none; }
.chip i.pkt{ width:9px; height:9px; border-radius:50%; background:var(--kc); }
.chip.on i.pkt{ background:var(--ki); }
.wahl{ display:flex; gap:6px; flex-wrap:wrap; }

/* ── Heute ── */
.jetzt{ position:relative; overflow:hidden; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 20px; align-items:end;
  padding:24px 26px 22px; border-radius:24px; margin-bottom:18px; background:var(--kc); color:var(--ki); }
.jetzt::after{ content:""; position:absolute; right:-10px; top:0; bottom:0; width:120px; opacity:.16; pointer-events:none;
  background:repeating-linear-gradient(90deg, var(--ki) 0 14px, transparent 14px 28px); }
.jetzt > *{ position:relative; z-index:1; }
.jetzt .lab{ color:var(--ki); opacity:.85; font-size:21px; }
.jetzt-t{ font-family:var(--disp); font-size:44px; line-height:1; margin-top:2px; }
.jetzt-s{ font-size:14px; margin-top:7px; opacity:.85; }
.jetzt-r{ text-align:right; padding-right:60px; }
.jetzt-r b{ font-family:var(--disp); font-size:42px; font-weight:400; line-height:1; display:block; white-space:nowrap; }
.jetzt-r span{ font-size:12px; opacity:.8; }
.jetzt-bar{ grid-column:1/-1; height:5px; border-radius:5px; background:color-mix(in srgb, var(--ki) 22%, transparent); margin-top:16px; overflow:hidden; }
.jetzt-bar i{ display:block; height:100%; background:var(--ki); border-radius:5px; }
.jetzt-dann{ grid-column:1/-1; font-size:14px; margin-top:12px; opacity:.9; }
.ablauf{ display:flex; flex-direction:column; gap:5px; }
.ab-z{ display:grid; grid-template-columns:52px minmax(0,1fr); gap:12px; padding:10px 14px; border-radius:var(--r-sm); text-align:left; width:100%; align-items:center;
  background:var(--kc); color:var(--ki); transition:transform .16s var(--ez); }
.ab-z:active{ transform:scale(.985); }
.ab-z.vorbei{ background:color-mix(in srgb, var(--kc) 16%, var(--weiss)); color:var(--tinte-2); }
.ab-z.vorbei .ab-n b{ text-decoration:line-through; text-decoration-color:color-mix(in srgb, var(--kc) 70%, transparent); text-decoration-thickness:1.5px; }
.ab-z.live{ box-shadow:0 0 0 2.5px var(--papier), 0 0 0 4.5px var(--kc); }
.ab-t{ font-size:13px; font-variant-numeric:tabular-nums; font-weight:700; opacity:.9; }
.ab-n{ min-width:0; }
.ab-n b{ display:block; font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ab-n span{ display:block; font-size:13px; opacity:.8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ganz-liste{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.pille{ display:inline-flex; align-items:center; gap:7px; padding:6px 13px 6px 10px; border-radius:999px; font-size:13px; font-weight:650; max-width:100%;
  background:var(--kc); color:var(--ki); text-align:left; }
.pille .ic{ width:14px; height:14px; }
.morgen{ margin-top:16px; padding-top:12px; border-top:1.5px dashed var(--linie-2); }
.morgen .lab{ font-size:20px; margin-bottom:6px; }
.mo-z{ display:flex; align-items:center; gap:10px; font-size:14px; color:var(--tinte-2); padding:3px 2px; min-width:0; }
.mo-z i{ width:9px; height:9px; border-radius:50%; background:var(--kc); flex:0 0 auto; }
.mo-z span{ color:var(--leise); font-size:13px; min-width:62px; font-variant-numeric:tabular-nums; }

/* ── Aufgaben ── */
.neu-a{ display:flex; gap:8px; margin-bottom:10px; }
.neu-a input{ flex:1; min-width:0; }
.neu-opt{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.a-gruppe{ margin-top:16px; }
.a-gruppe:first-child{ margin-top:0; }
.a-gruppe .lab{ font-size:21px; margin-bottom:2px; display:flex; gap:8px; align-items:baseline; }
.a-gruppe .lab small{ font-family:var(--sans); font-style:normal; font-size:12px; color:var(--leise); }
.a-gruppe .lab.rot{ color:var(--rot); }
.a-z{ display:flex; align-items:flex-start; gap:12px; padding:10px 2px; border-bottom:1.5px solid var(--linie); }
.a-z:last-child{ border-bottom:0; }
.a-box{ width:24px; height:24px; flex:0 0 auto; border-radius:50%; border:2px solid var(--kc,var(--oliv)); display:grid; place-items:center;
  color:transparent; position:relative; transition:background-color .15s ease, transform .16s var(--ez); margin-top:1px; }
.a-box::after{ content:""; position:absolute; inset:-10px; }
.a-box:active{ transform:scale(.9); }
.a-box .ic{ width:13px; height:13px; stroke-width:2.8; }
.a-z.fertig .a-box, .fr-z.erledigt .a-box{ background:var(--kc,var(--oliv)); color:var(--ki,var(--puder)); }
.a-z.fertig .a-t{ color:var(--leise); text-decoration:line-through; }
.a-t{ flex:1; min-width:0; text-align:left; line-height:1.4; padding-top:2px; overflow-wrap:anywhere; }
.a-meta{ display:flex; gap:8px; flex-wrap:wrap; margin-top:3px; font-size:12.5px; color:var(--leise); }
.a-meta .rot{ color:var(--rot); font-weight:650; }
.a-meta .tag{ display:inline-flex; align-items:center; gap:5px; }
.a-meta .tag i{ width:8px; height:8px; border-radius:50%; background:var(--kc); }
.a-stern{ color:var(--senf-dunkel); }
details.fertig-liste summary{ cursor:pointer; color:var(--leise); font-size:13px; margin-top:16px; list-style:none; font-weight:600; }
details.fertig-liste summary::-webkit-details-marker{ display:none; }
details.fertig-liste summary::before{ content:"+ "; }
details.fertig-liste[open] summary::before{ content:"- "; }

/* ── Kalender ── */
.kal-leiste{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
.seg{ display:inline-flex; padding:4px; border-radius:999px; background:var(--papier-2); }
.seg button{ height:32px; padding:0 20px; border-radius:999px; font-size:13.5px; font-weight:650; color:var(--tinte-2); transition:background-color .18s ease, color .18s ease; }
.seg button.on{ background:var(--sec); color:var(--sec-ink); }
.kal-nav{ display:flex; align-items:center; gap:6px; }
.kal{ background:var(--weiss); border-radius:var(--r); box-shadow:0 0 0 1.5px var(--raster) inset; overflow:clip; min-width:0; }
/* Woche / Tag */
.wk-kopf{ display:grid; grid-template-columns:62px repeat(var(--n),minmax(0,1fr)); border-bottom:1.5px solid var(--raster); position:sticky; top:0; z-index:4; background:var(--weiss); }
.wk-tag{ padding:10px 4px 8px; text-align:center; font-size:12px; color:var(--rose-dunkel); line-height:1.15; }
.wk-tag b{ display:inline-grid; place-items:center; margin-top:3px; min-width:36px; height:36px; padding:0 4px; border-radius:50%; font-family:var(--disp); font-size:24px; font-weight:400; color:var(--tinte); }
.wk-tag.heute b{ background:var(--plum); color:var(--butter); }
.wk-ganz{ display:grid; grid-template-columns:62px minmax(0,1fr); border-bottom:1.5px solid var(--raster); background:var(--puder-2); }
.wk-ganz-l{ font-family:var(--kursiv); font-style:italic; font-size:14px; color:var(--rose-dunkel); padding:8px 8px 0 0; text-align:right; }
.wk-ganz-r{ display:grid; grid-template-columns:repeat(var(--n),minmax(0,1fr)); gap:3px 0; padding:4px 0 5px; min-height:36px; }
.wk-ganz-r .zelle{ grid-row:1/-1; cursor:copy; border-left:1px solid var(--linie); }
.gz{ z-index:1; margin:0 3px; border-radius:8px; padding:0 9px; font-size:12px; font-weight:650; display:flex; align-items:center; gap:6px; overflow:hidden; white-space:nowrap; min-width:0;
  background:var(--kc); color:var(--ki); text-align:left; }
.gz span{ overflow:hidden; text-overflow:ellipsis; }
.gz .ic{ width:13px; height:13px; }
.gz.erledigt{ opacity:.5; }
.gz.erledigt span{ text-decoration:line-through; }
.wk-body{ display:grid; grid-template-columns:62px repeat(var(--n),minmax(0,1fr)); position:relative; }
.wk-uhr{ position:relative; }
.wk-uhr span{ position:absolute; right:10px; font-size:11px; color:var(--leise); transform:translateY(-50%); font-variant-numeric:tabular-nums; }
.wk-uhr .jetzt-zeit{ color:var(--rot); font-weight:700; background:var(--weiss); padding:0 2px; z-index:3; }
.wk-sp{ position:relative; border-left:1px solid var(--linie); cursor:copy;
  background-image:linear-gradient(to bottom, transparent calc(100% - 1px), color-mix(in srgb, var(--raster) 60%, transparent) calc(100% - 1px)); background-size:100% var(--hour); }
.wk-sp.we{ background-color:color-mix(in srgb, var(--puder-2) 55%, transparent); }
.blk{ position:absolute; border-radius:10px; padding:5px 8px; overflow:hidden; cursor:pointer; text-align:left;
  background:var(--kc); color:var(--ki); box-shadow:0 0 0 1.5px var(--weiss);
  font-size:12px; line-height:1.25; transition:transform .16s var(--ez), filter .15s ease; }
.blk b{ display:block; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.blk span{ display:block; opacity:.85; font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.blk.kurz{ padding:2px 7px; display:flex; gap:6px; align-items:center; }
.blk:active{ transform:scale(.97); }
@media (hover:hover) and (pointer:fine){ .blk:hover{ filter:brightness(1.08); } }
.jetzt-linie{ position:absolute; left:0; right:0; height:0; border-top:2px solid var(--rot); z-index:2; pointer-events:none; }
.jetzt-linie::before{ content:""; position:absolute; left:-5px; top:-6px; width:10px; height:10px; border-radius:50%; background:var(--rot); }
/* Monat */
.mon-kopf{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-bottom:1.5px solid var(--raster); }
.mon-kopf span{ padding:12px 12px 8px; font-size:13px; color:var(--rose-dunkel); text-align:right; }
.mon{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); grid-auto-rows:minmax(120px,auto); }
.mz{ position:relative; border-right:1px solid var(--raster); border-bottom:1px solid var(--raster); padding:6px 6px 8px; display:flex; flex-direction:column; gap:3px; min-width:0;
  cursor:pointer; text-align:left; transition:background-color .15s ease; }
.mz:nth-child(7n){ border-right:0; }
.mz.we{ background:color-mix(in srgb, var(--puder-2) 60%, transparent); }
.mz.anders .mz-n{ color:#d6bdb6; }
.mz-k{ display:flex; align-items:center; justify-content:flex-end; gap:5px; }
.mz-n{ min-width:30px; height:30px; display:grid; place-items:center; border-radius:50%; font-size:16px; color:var(--rose-dunkel); font-variant-numeric:tabular-nums; }
.mz.heute .mz-n{ background:var(--plum); color:var(--butter); font-weight:650; }
.mz.wahl{ background:var(--butter-2); }
.mond{ width:12px; height:12px; flex:0 0 auto; }
.mz-e{ display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--tinte-2); white-space:nowrap; overflow:hidden; min-width:0; }
.mz-e i{ width:8px; height:8px; border-radius:50%; background:var(--kc); flex:0 0 auto; }
.mz-e em{ font-style:normal; color:var(--leise); font-variant-numeric:tabular-nums; }
.mz-e span{ overflow:hidden; text-overflow:ellipsis; }
.mz-g{ font-size:11.5px; font-weight:650; padding:2px 7px; border-radius:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:var(--kc); color:var(--ki); }
.mz-mehr{ font-size:11px; color:var(--leise); padding-left:2px; }
.mz-fest{ margin-top:auto; font-size:10.5px; color:var(--rose-dunkel); text-align:right; line-height:1.2; padding-top:2px; }
.mz-punkte{ display:none; }
.mon-raster{ display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:18px; align-items:start; }
.mon-seite{ display:flex; flex-direction:column; gap:14px; min-width:0; }
.tag-titel{ font-family:var(--disp); font-weight:400; font-size:28px; line-height:1.05; color:var(--tinte); }
.geb-z{ display:flex; gap:10px; align-items:baseline; padding:5px 0; border-bottom:1px solid color-mix(in srgb, var(--rose) 35%, transparent); font-size:14px; }
.geb-z b{ font-family:var(--disp); font-weight:400; font-size:18px; color:var(--plum); min-width:28px; }
.geb-z span{ color:var(--leise); font-size:12.5px; margin-left:auto; }
@media (max-width:1100px){ .mon-raster{ grid-template-columns:minmax(0,1fr); } }

/* ── Uni ── */

<!--
THESIS: Ein Papierplaner, kein Kalender-Dashboard. Verweigert graue App-Kacheln mit zarten Pastell-Akzenten.
OWN-WORLD: Papier #fcf8f1, Gloock-Titel halb über Streifenbändern, altrosa Rasterlinien, puderrosa Kästen mit kursiven Beschriftungen ("notizen:"), Einträge vollflächig in Pflaume, Butter, Oliv, Altrosa mit Kontrastschrift.
STORY: Sie sieht sofort, was heute dran ist, blättert durch Woche und Monat wie im Planer und färbt Einträge selbst.
FIRST VIEWPORT: Streifenband oben, der große Titel greift hinein, darunter der vollflächige Jetzt-Block in der Farbe des laufenden Eintrags, dann Tagesablauf und Aufgaben.
FORM: vom Nutzer vorgegeben (Cascar-Planer, Palette #333700 #b46a6a #ffd983 #61122b), keine Auslosung.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<div class="app" id="app"></div>
<div class="blatt-ov" id="ov"><div class="blatt" id="blatt" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============================================================
   Farben
   Die Palette stammt aus der Vorlage (Pflaume, Altrosa, Butter,
   Oliv) plus Verwandte. Jede Farbe kennt ihre Kontrastschrift.
   ============================================================ */
const PAL=[
  {c:"#61122b", ki:"#ffd983", n:"Pflaume"},
  {c:"#8e2c48", ki:"#ffe3e8", n:"Wein"},
  {c:"#b46a6a", ki:"#2e0712", n:"Altrosa"},
  {c:"#e9a5a5", ki:"#61122b", n:"Blush"},
  {c:"#f4cfd6", ki:"#61122b", n:"Puder"},
  {c:"#a9cbe8", ki:"#61122b", n:"Babyblau"},
  {c:"#ffd983", ki:"#61122b", n:"Butter"},
  {c:"#d6a33a", ki:"#333700", n:"Senf"},
  {c:"#333700", ki:"#f4cfd6", n:"Oliv"},
  {c:"#6f6c1e", ki:"#ffe9b0", n:"Moos"},
  {c:"#a7a77a", ki:"#333700", n:"Salbei"},
  {c:"#5b3a29", ki:"#f4cfd6", n:"Kakao"},
  {c:"#d8c3a5", ki:"#61122b", n:"Sand"},
];
const P=Object.fromEntries(PAL.map(p=>[p.n,p.c]));
/* Kontrastschrift: aus der Palette, sonst über die Helligkeit */
function inkVon(c){
  const p=PAL.find(x=>x.c.toLowerCase()===String(c).toLowerCase()); if(p) return p.ki;
  const m=String(c).match(/^#?([0-9a-f]{6})$/i); if(!m) return "#fffdf9";
  const n=parseInt(m[1],16), lin=v=>{ v/=255; return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4); };
  const L=.2126*lin(n>>16)+.7152*lin((n>>8)&255)+.0722*lin(n&255);
  return L>.42?"#61122b":"#fff4ec";
}
const kv=c=>`--kc:${c};--ki:${inkVon(c)}`;

/* ============================================================
   Daten
   ============================================================ */
const KEY="woche_v1", SYNC_KEY="woche_sync", MODUS_KEY="woche_kalmodus";
const KATS=[
  {id:"uni",     l:"Uni",       c:P.Pflaume},

/* Farben des Bereichs setzen; im Kalender bestimmt der Monat */
function themaSetzen(){
  const s=SEITEN.find(x=>x.id===SEITE)||SEITEN[0];
  const t=SEITE==="kalender"?MON_THEMEN[pk(kalDatum).getMonth()]:s;
  const r=document.documentElement.style;
  r.setProperty("--sec",t.c); r.setProperty("--sec-ink",inkVon(t.c)); r.setProperty("--sec-text",t.t);
  r.setProperty("--sa",t.a); r.setProperty("--sb",t.b);
}
let renderTag=heute();
function zeige(s,anim){
  const neuSeite=(!!s&&s!==SEITE)||!!anim; if(s) SEITE=s;
  /* Tageswechsel, während die App offen war: „heute“ mitziehen */
  if(heute()!==renderTag){ if(kalDatum===renderTag) kalDatum=heute(); if(monWahl===renderTag) monWahl=heute(); renderTag=heute(); }
  themaSetzen();
  document.querySelectorAll("[data-go]").forEach(b=>{ if(b.closest(".side,.tabbar")) b.classList.toggle("on",b.dataset.go===SEITE); });
  const m=document.getElementById("main");
  m.innerHTML=`<div class="view${neuSeite?" neu-seite":""}">${({heute:vHeute,kalender:vKalender,aufgaben:vAufgaben,uni:vUni,geschenke:vGeschenke})[SEITE]()}</div>`;
  if(SEITE==="kalender") kalNachher();
}
const kopf=(titel,unter,rechts,lang)=>`<header class="kopf">${rechts?`<div class="kopf-r">${rechts}</div>`:""}

/* ============================================================
   Heute
   ============================================================ */
function gruss(){ const h=new Date().getHours(); return h<5?"Gute Nacht":h<11?"Guten Morgen":h<17?"Hallo":h<22?"Guten Abend":"Gute Nacht"; }
function pilleHtml(x){ return `<button class="pille" style="${kv(x.c)}" ${ganzAttr(x)}>${ic(ganzIcon(x))}${esc(x.titel)}</button>`; }
function ablaufHtml(l,k,jetzt){
  const mk=mkVon(pk(k));
  return `<div class="ablauf">${l.map(b=>{ const s=hm(b.start), e=hm(b.end);
    return `<button class="ab-z${jetzt!=null&&e<=jetzt?" vorbei":""}${jetzt!=null&&s<=jetzt&&e>jetzt?" live":""}" style="${kv(farbeVon(b))}" data-blk="${mk}|${b.id}">
      <span class="ab-t">${b.start}</span>
      <span class="ab-n"><b>${esc(titelVon(b))}</b><span>${esc(mitArt(b,`bis ${b.end}${b.ort?` · ${b.ort}`:""}`))}</span></span></button>`;}).join("")}</div>`;
}
const dauerText=min=>min<60?min+" min":Math.floor(min/60)+" h "+p2(min%60);
function vHeute(){
  const k=heute(), d=new Date(), jetzt=d.getHours()*60+d.getMinutes();
  const l=eintraegeAm(k), g=ganzAm(k);
  const live=l.find(b=>hm(b.start)<=jetzt&&hm(b.end)>jetzt), naechst=l.find(b=>hm(b.start)>jetzt);
  const sem=semInfo(), name=(S.name||"").trim();
  let karte;
  if(live){ const s=hm(live.start), e=hm(live.end);
    karte=`<div class="jetzt" style="${kv(farbeVon(live))}">
      <div><div class="lab">gerade:</div><div class="jetzt-t">${esc(titelVon(live))}</div>
        <div class="jetzt-s">${esc(mitArt(live,`${live.start} bis ${live.end}${live.ort?` · ${live.ort}`:""}`))}</div></div>
      <div class="jetzt-r"><b class="num">${dauerText(e-jetzt)}</b><span>übrig</span></div>
      <div class="jetzt-bar"><i style="width:${Math.round((jetzt-s)/(e-s)*100)}%"></i></div>
      ${naechst?`<div class="jetzt-dann">Danach ${esc(titelVon(naechst))} um ${naechst.start}${naechst.ort?` · ${esc(naechst.ort)}`:""}</div>`:""}</div>`;
  } else if(naechst){
    karte=`<div class="jetzt" style="${kv(farbeVon(naechst))}">
      <div><div class="lab">als nächstes:</div><div class="jetzt-t">${esc(titelVon(naechst))}</div>
        <div class="jetzt-s">${esc(mitArt(naechst,`${naechst.start} bis ${naechst.end}${naechst.ort?` · ${naechst.ort}`:""}`))}</div></div>
      <div class="jetzt-r"><b class="num">${dauerText(hm(naechst.start)-jetzt)}</b><span>bis dahin</span></div></div>`;
  } else {
    karte=`<div class="jetzt" style="${kv(P.Oliv)}">
      <div><div class="lab">heute:</div><div class="jetzt-t">${l.length?"Alles geschafft.":"Nichts geplant."}</div>
        <div class="jetzt-s">${l.length?"Zeit für dich, oder ein Blick auf morgen.":"Im Kalender trägst du deine Woche ein."}</div></div></div>`;
  }
  const aufg=aufgabenHeute();
  const fristen=S.termine.filter(t=>!t.erledigt&&tageBis(t.datum)>=0&&tageBis(t.datum)<=21).sort((a,b)=>a.datum.localeCompare(b.datum));
  const geb=gebBald(14);
  const k2=dk(addD(d,1)), morgen=eintraegeAm(k2), gMorgen=ganzAm(k2);
  return `
  ${kopf(`${gruss()}${name?`, <em>${esc(name)}</em>`:""}.`,
    `${langD(d)}${sem&&sem.w?` · <b>Semesterwoche ${sem.w}${sem.gesamt?` von ${sem.gesamt}`:""}</b>`:""}`,
    `<button class="btn nur-desk" data-act="neuEintrag">${ic("plus")}Eintrag</button><button class="btn rund nur-handy" data-act="einst" aria-label="Einstellungen">${ic("gear")}</button>`, true)}
  ${karte}
  <div class="raster2">
    <div class="karte">
      <div class="k-kopf"><h3 class="lab" style="--kc:#9a4c4f">tagesablauf:</h3><button class="btn klein ghost" data-go="kalender">Kalender ${ic("rechts")}</button></div>
      ${g.length?`<div class="ganz-liste">${g.map(pilleHtml).join("")}</div>`:""}
      ${l.length?ablaufHtml(l,k,jetzt):(g.length?"":`<div class="leer">Nichts im Plan.</div>`)}
      ${(morgen.length||gMorgen.length)?`<div class="morgen"><div class="lab" style="--kc:#9a4c4f">morgen:</div>
        ${gMorgen.map(x=>`<div class="mo-z" style="--kc:${x.c}"><i></i><span>ganztags</span>${esc(x.titel)}</div>`).join("")}
        ${morgen.slice(0,4).map(b=>`<div class="mo-z" style="--kc:${farbeVon(b)}"><i></i><span>${b.start}</span>${esc(titelVon(b))}</div>`).join("")}
        ${morgen.length>4?`<div class="mo-z" style="--kc:transparent"><i></i><span></span>und ${morgen.length-4} weitere</div>`:""}</div>`:""}
    </div>
    <div class="stapel">
      <div class="karte">
        <div class="k-kopf"><h3 class="lab" style="--kc:${P.Oliv}">zu erledigen:</h3><button class="btn klein ghost" data-go="aufgaben">Alle ${ic("rechts")}</button></div>
        <div class="neu-a"><input id="schnellA" placeholder="Neue Aufgabe für heute" autocomplete="off" enterkeyhint="done" aria-label="Neue Aufgabe für heute">
          <button class="btn rund" data-act="schnellA" aria-label="Hinzufügen" style="background:var(--oliv);color:var(--puder);box-shadow:none">${ic("plus")}</button></div>

        ${fristen.slice(0,5).map(frZeile).join("")}</div>`:""}
      ${geb.length?`<div class="kasten"><div class="k-kopf"><h3 class="lab" style="--kc:${P.Wein}">geburtstage:</h3><button class="btn klein ghost" data-go="geschenke">Geschenke ${ic("rechts")}</button></div>
        ${geb.map(({p,n})=>`<div class="geb-z"><b>${n.d.getDate()}.</b>${esc(p.name)}${n.alter?` wird ${n.alter}`:""}<span>${bisText(n.tage)}</span></div>`).join("")}</div>`:""}
    </div>
  </div>`;

/* ============================================================
   Kalender: Tag, Woche, Monat
   ============================================================ */
function kalSchritt(r){
  const d=pk(kalDatum), altM=d.getMonth();
  if(kalModus==="tag") kalDatum=dk(addD(d,r));
  else if(kalModus==="woche") kalDatum=dk(addD(d,7*r));
  else { const n=new Date(d.getFullYear(),d.getMonth()+r,1); kalDatum=dk(n); monWahl=dk(n); }
  zeige(null, pk(kalDatum).getMonth()!==altM);
}
function vKalender(){
  const d=pk(kalDatum);
  let titel, unter;
  if(kalModus==="monat"){ titel=`${MON_L[d.getMonth()]} <em>${d.getFullYear()}</em>`;
    const n=S.termine.filter(t=>!t.erledigt&&t.datum.slice(0,7)===kalDatum.slice(0,7)).length;
    unter=n?`<b>${n} ${n===1?"Frist":"Fristen"}</b> in diesem Monat`:"Keine Fristen in diesem Monat"; }
  else if(kalModus==="woche"){ const m=mo(d), e=addD(m,6);
    titel=m.getMonth()===e.getMonth()?MON_L[m.getMonth()]:`${MON[m.getMonth()]} / ${MON[e.getMonth()]}`;
    unter=`KW ${kw(m)} · ${kurzD(m)} bis ${kurzD(e)} ${e.getFullYear()}`; }
  else { titel=`${d.getDate()}. ${MON_L[d.getMonth()]}`; unter=TAGE_L[wtag(d)]+(kalDatum===heute()?" · heute":""); }
  return `
  ${kopf(titel,unter,`<button class="btn prim nur-desk" data-act="neuEintrag">${ic("plus")}Eintrag</button>`)}
  <div class="kal-leiste">
    <div class="seg" role="tablist">${[["tag","Tag"],["woche","Woche"],["monat","Monat"]].map(([m,l])=>`<button role="tab" aria-selected="${kalModus===m}" class="${kalModus===m?"on":""}" data-modus="${m}">${l}</button>`).join("")}</div>
    <div class="kal-nav"><button class="btn rund" data-act="kalZurueck" aria-label="Zurück">${ic("links")}</button>
      <button class="btn" data-act="kalHeute">Heute</button>
      <button class="btn rund" data-act="kalVor" aria-label="Weiter">${ic("rechts")}</button></div>
  </div>
  ${kalModus==="monat"?monatHtml():kalModus==="woche"?wocheHtml():tagHtml()}`;
}
/* Woche und Tag teilen sich das Raster */
function zeitRaster(tage){
  const H0=S.h0, H1=S.h1, hh=hourPx();
  const hoehe=(H1-H0)*hh, d=new Date(), jetzt=d.getHours()*60+d.getMinutes();
  const n=tage.length, jetztDrin=tage.includes(heute())&&jetzt>=H0*60&&jetzt<=H1*60;
  const uhrSp=`<div class="wk-uhr" style="height:${hoehe}px">${[...Array(H1-H0)].map((_,i)=>i?`<span style="top:${i*hh}px">${p2(H0+i)}:00</span>`:"").join("")}
    ${jetztDrin?`<span class="jetzt-zeit" style="top:${(jetzt-H0*60)/60*hh}px">${uhr(jetzt)}</span>`:""}</div>`;
  const kopfZ=tage.map(k=>{ const t=pk(k); return `<div class="wk-tag${k===heute()?" heute":""}">${TAGE[wtag(t)].toLowerCase()}<br><b>${t.getDate()}</b></div>`; }).join("");
  /* Ganztägiges als durchgehende Streifen über die Tage, in Bahnen gestapelt */
  const gz=[], gesehen=new Set(), idx=k=>tagDiff(tage[0],k);
  tage.forEach(k=>ganzAm(k).forEach(x=>{ const key=x.typ+x.id+(x.typ==="geb"?k:""); if(gesehen.has(key)) return; gesehen.add(key);
    gz.push({x,s:Math.max(0,idx(x.von)),e:Math.min(n-1,idx(x.bis))}); }));
  const bahnen=[];
  gz.sort((a,b)=>a.s-b.s||(b.e-b.s)-(a.e-a.s)).forEach(g=>{ let b=0; while((bahnen[b]||[]).some(o=>!(g.e<o.s||g.s>o.e))) b++; (bahnen[b]=bahnen[b]||[]).push(g); g.b=b; });
  const ganz=`<div class="wk-ganz"><div class="wk-ganz-l">ganztags</div>
    <div class="wk-ganz-r" style="--n:${n};grid-template-rows:repeat(${Math.max(1,bahnen.length)},26px)">
    ${tage.map((k,i)=>`<div class="zelle" data-ganzneu="${k}" style="grid-column:${i+1}" title="Ganztägigen Eintrag anlegen"></div>`).join("")}
    ${gz.map(g=>{ const x=g.x;
      return `<button class="gz${x.erledigt?" erledigt":""}" ${ganzAttr(x)} style="${kv(x.c)};grid-column:${g.s+1}/${g.e+2};grid-row:${g.b+1}" title="${esc(x.titel)}">
        ${ic(ganzIcon(x))}<span>${esc(x.titel)}</span></button>`; }).join("")}</div></div>`;
  const spaltenHtml=tage.map(k=>{
    const t=pk(k), mk=mkVon(t), w=wtag(t);
    const bl=spalten(tagEintraege(mk,w)).map(x=>{
      const top=(x.s-H0*60)/60*hh, h=Math.max(20,(x.e-x.s)/60*hh-2), breite=100/x.cols, kurz=h<40;
      return `<button class="blk${kurz?" kurz":""}" data-blk="${mk}|${x.b.id}" style="${kv(farbeVon(x.b))};top:${top+1}px;height:${h}px;left:calc(${x.col*breite}% + 2px);width:calc(${breite}% - 4px)">
        <b>${esc(titelVon(x.b,n>1))}</b><span>${kurz?x.b.start:esc(mitArt(x.b,`${x.b.start}-${x.b.end}${x.b.ort?` · ${x.b.ort}`:""}`))}</span></button>`; }).join("");
    const linie=k===heute()&&jetztDrin?`<div class="jetzt-linie" style="top:${(jetzt-H0*60)/60*hh}px"></div>`:"";
    return `<div class="wk-sp${w>=5?" we":""}" data-slot="${k}" style="height:${hoehe}px">${bl}${linie}</div>`; }).join("");
  return `<div class="kal${n===1?" einspaltig":""}">
    <div class="wk-kopf" style="--n:${n}"><div></div>${kopfZ}</div>${ganz}
    <div class="wk-body" style="--n:${n}">${uhrSp}${spaltenHtml}</div></div>`;
}
const wocheHtml=()=>{ const m=mo(pk(kalDatum)); return zeitRaster([0,1,2,3,4,5,6].map(i=>dk(addD(m,i)))); };
const tagHtml=()=>zeitRaster([kalDatum]);
function monatHtml(){
  const d=pk(kalDatum), erster=new Date(d.getFullYear(),d.getMonth(),1), start=mo(erster);
  const wochen=Math.ceil((wtag(erster)+new Date(d.getFullYear(),d.getMonth()+1,0).getDate())/7);
  const zellen=[];
  for(let i=0;i<wochen*7;i++){
    const t=addD(start,i), k=dk(t), e=eintraegeAm(k), g=ganzAm(k), mond=mondAm(k), fest=festAm(k);
    const items=g.map(x=>`<div class="mz-g" style="${kv(x.c)}">${esc(x.titel)}</div>`)
      .concat(e.map(b=>`<div class="mz-e" style="--kc:${farbeVon(b)}"><i></i><em>${b.start}</em><span>${esc(titelVon(b,true))}</span></div>`));
    const punkte=[...g.map(x=>x.c),...e.map(b=>farbeVon(b))].filter((c,j,a)=>a.indexOf(c)===j).slice(0,4);
    zellen.push(`<button class="mz${t.getMonth()!==d.getMonth()?" anders":""}${wtag(t)>=5?" we":""}${k===heute()?" heute":""}${k===monWahl?" wahl":""}" data-mtag="${k}" aria-label="${langD(t)}${fest?", "+fest:""}">
      <span class="mz-k">${mond?mondSvg(mond):""}<span class="mz-n">${t.getDate()}</span></span>
      ${items.slice(0,3).join("")}${items.length>3?`<span class="mz-mehr">und ${items.length-3} weitere</span>`:""}
      ${fest?`<span class="mz-fest">${fest}</span>`:""}
      <span class="mz-punkte">${punkte.map(c=>`<i style="--kc:${c}"></i>`).join("")}</span></button>`);
  }
  const w=pk(monWahl), e=eintraegeAm(monWahl), g=ganzAm(monWahl), fest=festAm(monWahl), mond=mondAm(monWahl);
  const mKey=kalDatum.slice(0,7);
  const gebs=(S.geschenke||[]).filter(p=>p.monat===d.getMonth()+1&&p.tag).sort((a,b)=>a.tag-b.tag);
  return `<div class="mon-raster">
    <div class="kal"><div class="mon-kopf">${TAGE_L.map((t,i)=>`<span><span class="nur-desk">${t.toLowerCase()}</span><span class="nur-handy">${TAGE[i].toLowerCase()}</span></span>`).join("")}</div><div class="mon">${zellen.join("")}</div></div>
    <div class="mon-seite">
      <div class="karte">
        <div class="k-kopf"><h3 class="tag-titel">${monWahl===heute()?"Heute":langD(w)}</h3>
          <div class="wahl"><button class="btn klein" data-act="zumTag" data-tag="${monWahl}">Tag</button><button class="btn klein" data-act="neuAm" data-tag="${monWahl}">${ic("plus")}Eintrag</button></div></div>
        ${fest||mond?`<p class="hinweis" style="margin:-4px 0 10px">${[fest,mond?MOND_N[mond]:null].filter(Boolean).join(" · ")}</p>`:""}
        ${g.length?`<div class="ganz-liste">${g.map(pilleHtml).join("")}</div>`:""}
        ${e.length?ablaufHtml(e,monWahl,monWahl===heute()?new Date().getHours()*60+new Date().getMinutes():null):(g.length?"":`<div class="leer">Nichts eingetragen.</div>`)}
      </div>
      <div class="kasten">
        <h3 class="lab" style="--kc:${P.Wein};margin-bottom:6px">geburtstage:</h3>
        ${gebs.length?gebs.map(p=>`<div class="geb-z"><b>${p.tag}.</b>${esc(p.name)}${p.jahr?` wird ${d.getFullYear()-p.jahr}`:""}</div>`).join("")
          :`<div class="leer">Keine im ${MON_L[d.getMonth()]}. Unter Geschenke trägst du Menschen mit Geburtstag ein.</div>`}
      </div>
      <div class="kasten">
        <h3 class="lab" style="--kc:${P.Wein}">notizen:</h3>
        <textarea class="liniert" data-mnotiz="${mKey}" rows="5" aria-label="Notizen für ${MON_L[d.getMonth()]}" placeholder="Was du dir für den ${MON_L[d.getMonth()]} merken willst">${esc((S.monNotiz||{})[mKey]||"")}</textarea>
      </div>
    </div></div>`;
}
function kalNachher(){
  /* Wischen wechselt Tag, Woche oder Monat */
  const k=document.querySelector(".kal"); if(!k) return;
  let x0=null,y0=null;
  k.addEventListener("touchstart",e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  k.addEventListener("touchend",e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6) kalSchritt(dx<0?1:-1); x0=null; },{passive:true});
}

const GS_ST={idee:"Idee",gekauft:"gekauft",verschenkt:"verschenkt"};
function gebNaechster(p){ if(!p.tag||!p.monat) return null; const h=pk(heute());
  let d=new Date(h.getFullYear(),p.monat-1,p.tag); if(d<h) d=new Date(h.getFullYear()+1,p.monat-1,p.tag);
  return {d,tage:Math.round((d-h)/86400000),alter:p.jahr?d.getFullYear()-p.jahr:null}; }
const gebBald=n=>(S.geschenke||[]).map(p=>({p,n:gebNaechster(p)})).filter(x=>x.n&&x.n.tage<=n).sort((a,b)=>a.n.tage-b.n.tage);
function xmas(){ const h=pk(heute()); let d=new Date(h.getFullYear(),11,24); if(d<h) d=new Date(h.getFullYear()+1,11,24); return {d,tage:Math.round((d-h)/86400000),jahr:d.getFullYear()}; }
const xmasDabei=p=>p.xmas!==false;
function xmasStand(p){ const j=xmas().jahr, l=(p.ideen||[]).filter(i=>i.anlass==="xmas");
  if(l.some(i=>i.status==="gekauft"||(i.status==="verschenkt"&&i.jahr===j))) return "gekauft"; if(l.some(i=>i.status==="idee")) return "idee"; return "nichts"; }
const anlassWahl={};
const anlassVor=p=>anlassWahl[p.id]||(()=>{ const n=gebNaechster(p), x=xmas(); return xmasDabei(p)&&(!n||x.tage<n.tage)?"xmas":"geb"; })();
const gebDatum=p=>p.tag&&p.monat?`${p.tag}. ${MON_L[p.monat-1]}${p.jahr?" "+p.jahr:""}`:"kein Geburtstag eingetragen";
function vGeschenke(){
  const ps=(S.geschenke||[]).map(p=>({p,n:gebNaechster(p)})).sort((a,b)=>(a.n?a.n.tage:9999)-(b.n?b.n.tage:9999)||a.p.name.localeCompare(b.p.name));
  const x=xmas(), dabei=ps.filter(({p})=>xmasDabei(p)), st=dabei.map(({p})=>({p,s:xmasStand(p)})), fertig=st.filter(z=>z.s==="gekauft").length;
  const offeneIdeen=ps.reduce((a,z)=>a+(z.p.ideen||[]).filter(i=>i.status==="idee").length,0);
  const ideeZ=(p,i)=>`<div class="idee ${i.status}">
    <button class="idee-st" data-gst="${p.id}|${i.id}" title="Tippen: Idee, gekauft, verschenkt" aria-label="Status ändern">${ic(i.status==="idee"?"idee":i.status==="gekauft"?"check":"geschenke")}</button>
    <span class="idee-t">${esc(i.text)}${i.preis?`<em>${esc(i.preis)}</em>`:""}${i.anlass==="xmas"?`<span class="idee-a x">Weihnachten</span>`:i.anlass==="geb"?`<span class="idee-a g">Geburtstag</span>`:""}</span>

    <button class="btn rund klein ghost" data-gweg="${p.id}|${i.id}" aria-label="Löschen">${ic("x")}</button></div>`;
  return `
  ${kopf("Geschenke",`<b>${ps.length} ${ps.length===1?"Mensch":"Menschen"}</b> · ${offeneIdeen} ${offeneIdeen===1?"Idee":"Ideen"} offen`,
    `<button class="btn prim" data-act="perNeu">${ic("plus")}Person</button>`)}
  ${dabei.length&&x.tage<=100?`<div class="xmas"><div class="xmas-k"><span class="xmas-ic">${ic("stern")}</span>
      <div><b>Weihnachten</b><span>${x.tage===0?"heute":bisText(x.tage)} · ${fertig} von ${dabei.length} besorgt</span></div>
      <div class="xmas-bar"><i style="width:${fertig/dabei.length*100}%"></i></div></div>
    <div class="xmas-pers">${st.map(({p,s})=>`<button class="xp s-${s}" data-gzu="${p.id}" data-anl="xmas"><i>${s==="gekauft"?ic("check"):s==="idee"?ic("idee"):""}</i>${esc(p.name)}</button>`).join("")}</div></div>`:""}
  ${ps.some(z=>z.n&&z.n.tage<=60)?`<div class="gb-bald">${ps.filter(z=>z.n&&z.n.tage<=60).map(({p,n})=>`<button class="gb${n.tage<=7?" nah":""}" data-gzu="${p.id}" data-anl="geb">
      <b class="n num">${n.tage===0?ic("kuchen"):n.tage}</b><span><b>${esc(p.name)}</b>${n.tage===0?"hat heute Geburtstag":`${n.tage===1?"Tag":"Tage"} · ${kurzD(n.d)}`}${n.alter?` · wird ${n.alter}`:""}</span></button>`).join("")}</div>`:""}
  ${ps.length?`<div class="pers">${ps.map(({p,n})=>{ const akt=(p.ideen||[]).filter(i=>i.status!=="verschenkt"), alt=(p.ideen||[]).filter(i=>i.status==="verschenkt");
      const warn=n&&n.tage<=21&&!(p.ideen||[]).some(i=>i.anlass!=="xmas"&&(i.status==="gekauft"||(i.status==="verschenkt"&&i.jahr===n.d.getFullYear())));
      return `<div class="kasten per" data-person="${p.id}">

          <div class="per-n"><b>${esc(p.name)}</b><span>${gebDatum(p)}${n?` · <i>${n.tage===0?"heute!":bisText(n.tage)}${n.alter?`, wird ${n.alter}`:""}</i>`:""}</span></div>

        <div class="neu-a" style="margin:0"><input data-gneu="${p.id}" placeholder="Neue Geschenkidee" autocomplete="off" enterkeyhint="done" aria-label="Neue Geschenkidee für ${esc(p.name)}"><button class="btn rund" data-gadd="${p.id}" aria-label="Hinzufügen">${ic("plus")}</button></div>
        ${alt.length?`<details class="fertig-liste"><summary>${alt.length} schon verschenkt</summary>${alt.map(i=>ideeZ(p,i)).join("")}</details>`:""}
      </div>`; }).join("")}</div>`
    :`<div class="kasten"><div class="leer">Noch niemand eingetragen. Leg die Menschen an, die dir wichtig sind, mit Geburtstag und allem, was dir zu Geschenken einfällt. Geburtstage erscheinen dann auch im Kalender.</div></div>`}`;
}

    i.onchange=()=>{ const f=i.files[0]; if(!f) return; const r=new FileReader();
      r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||!Array.isArray(d.fix)) throw 0; if(!confirm("Alles auf diesem Gerät durch die Sicherung ersetzen?")) return;
        S=Object.assign(leer(),d); aufraeumen(); sichern(); zu(); zeige(); toast("Sicherung geladen"); }catch(e){ toast("Das ist keine Woche-Sicherung"); } }; r.readAsText(f); };
    i.click(); });
  q("eSync")?.addEventListener("click",syncBlatt);
  q("eJetzt")?.addEventListener("click",async()=>{ await syncJetzt(true); zu(); zeige(); });
}
const syncCfg=()=>{ try{ return JSON.parse(localStorage.getItem(SYNC_KEY)||"null"); }catch(e){ return null; } };
let syncSha=null, syncT=null;
const api=c=>`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${c.pfad||"woche.json"}`;
const b64=s=>btoa(unescape(encodeURIComponent(s))), unb64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
async function holen(c){ const r=await fetch(api(c)+"?t="+Date.now(),{headers:{Authorization:`token ${c.token}`,Accept:"application/vnd.github+json"}});
  if(r.status===404) return {fehlt:true}; if(!r.ok) throw new Error(r.status); const j=await r.json(); syncSha=j.sha; return {daten:JSON.parse(unb64(j.content))}; }
async function hochladen(c){
  const body={message:`woche ${new Date().toISOString()}`,content:b64(JSON.stringify(S)),...(syncSha?{sha:syncSha}:{})};
  const r=await fetch(api(c),{method:"PUT",headers:{Authorization:`token ${c.token}`,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});
  if(r.status===409||r.status===422){ syncSha=null; const h=await holen(c); if(h.daten&&h.daten.upd>S.upd){ S=Object.assign(leer(),h.daten); aufraeumen(); sichern(true); zeige(); return; } return hochladen(c); }
  if(!r.ok) throw new Error(r.status); syncSha=(await r.json()).content.sha; }
function syncSpaeter(){ const c=syncCfg(); if(!c) return; clearTimeout(syncT); syncT=setTimeout(()=>hochladen(c).catch(()=>toast("Abgleich fehlgeschlagen")),1500); }
async function syncJetzt(laut){ const c=syncCfg(); if(!c) return;
  try{ const h=await holen(c);
    if(h.daten&&(h.daten.upd||0)>(S.upd||0)){ S=Object.assign(leer(),h.daten); aufraeumen(); try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} if(!document.getElementById("ov").classList.contains("on")) zeige(); if(laut) toast("Neuester Stand geholt"); }
    else if(h.fehlt||(h.daten&&(h.daten.upd||0)<(S.upd||0))){ await hochladen(c); if(laut) toast("Abgeglichen"); }
    else if(laut) toast("Alles aktuell");
  }catch(e){ if(laut) toast("Abgleich fehlgeschlagen ("+e.message+")"); } }
function syncBlatt(){
  const c=syncCfg()||{owner:"",repo:"",pfad:"woche.json",token:""};
  blatt(`<h2>Abgleich</h2>
    <p class="hinweis" style="margin-bottom:14px">Lege auf GitHub ein <b>privates</b> Repository an und erstelle einen Token (Fine-grained, nur dieses Repo, „Contents: Read and write“). Der Token bleibt nur auf diesem Gerät.</p>
    <div class="feld zeile"><div><label for="sO">GitHub-Name</label><input id="sO" value="${esc(c.owner)}" autocomplete="off" autocapitalize="off"></div><div><label for="sR">Repository</label><input id="sR" value="${esc(c.repo)}" autocomplete="off" autocapitalize="off"></div></div>
    <div class="feld"><label for="sT">Token</label><input id="sT" type="password" value="${esc(c.token)}" autocomplete="off" placeholder="github_pat_…"></div>
    <div class="blatt-akt">${syncCfg()?`<button class="btn gefahr links" id="sAus">Trennen</button>`:""}<button class="btn" data-act="zu">Abbrechen</button><button class="btn prim" id="sOk">Verbinden</button></div>`);
  const q=s=>document.getElementById(s);
  q("sOk").onclick=async()=>{ const n={owner:q("sO").value.trim(),repo:q("sR").value.trim(),pfad:"woche.json",token:q("sT").value.trim()};
    if(!n.owner||!n.repo||!n.token){ toast("Alle drei Felder ausfüllen"); return; }
    try{ await holen(n); }catch(e){ toast("Keine Verbindung. Stimmen Name, Repo und Token?"); return; }
    localStorage.setItem(SYNC_KEY,JSON.stringify(n)); zu(); toast("Verbunden"); await syncJetzt(true); };
  q("sAus")?.addEventListener("click",()=>{ localStorage.removeItem(SYNC_KEY); syncSha=null; zu(); toast("Getrennt, die Daten bleiben auf diesem Gerät"); });
}

/* ============================================================
   Blatt, Toast, Klicks
   ============================================================ */
function blatt(html){ const b=document.getElementById("blatt"); b.innerHTML=html; document.getElementById("ov").classList.add("on");
  setTimeout(()=>{ const f=b.querySelector("input:not([type=date]):not([type=time])"); if(f&&!f.value&&matchMedia("(pointer:fine)").matches) f.focus(); },60); }
function zu(){ document.getElementById("ov").classList.remove("on"); }
let toastT=null;
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),2200); }
const behalte=(id,fn)=>{ const v=document.getElementById(id)?.value; fn(); if(v){ const n=document.getElementById(id); if(n) n.value=v; } };
const nachOben=()=>window.scrollTo({top:0});

document.addEventListener("click",e=>{
  if(e.target===document.getElementById("ov")){ zu(); return; }
  if(e.target.closest("#blatt")&&!e.target.closest('[data-act="zu"]')) return;
  const gzu=e.target.closest("[data-gzu]");
  if(gzu){ const pid=gzu.dataset.gzu; if(gzu.dataset.anl) anlassWahl[pid]=gzu.dataset.anl;
    if(SEITE!=="geschenke"){ zeige("geschenke"); }
    const k=document.querySelector(`[data-person="${pid}"]`);
    if(k){ if(gzu.dataset.anl) k.querySelectorAll("[data-ganl]").forEach(c=>c.classList.toggle("on",c.dataset.ganl.endsWith("|"+gzu.dataset.anl)));
      k.scrollIntoView({behavior:"smooth",block:"center"}); setTimeout(()=>k.querySelector("[data-gneu]")?.focus({preventScroll:true}),350); } return; }
  const go=e.target.closest("[data-go]"); if(go){ zeige(go.dataset.go); nachOben(); return; }
  const blk=e.target.closest("[data-blk]"); if(blk){ eintragBlatt({blk:blk.dataset.blk.split("|")}); return; }
  const gz=e.target.closest("[data-ganz]"); if(gz){ eintragBlatt({ganz:gz.dataset.ganz}); return; }
  const gn=e.target.closest("[data-ganzneu]"); if(gn){ eintragBlatt({datum:gn.dataset.ganzneu,ganztags:true}); return; }
  const slot=e.target.closest("[data-slot]");
  if(slot&&!e.target.closest("[data-act]")){ const r=slot.getBoundingClientRect(), hh=hourPx();
    let min=S.h0*60+Math.floor((e.clientY-r.top)/hh*2)*30; min=Math.max(S.h0*60,Math.min(S.h1*60-60,min));
    eintragBlatt({datum:slot.dataset.slot,start:uhr(min),end:uhr(min+60)}); return; }
  const mt=e.target.closest("[data-mtag]");
  if(mt){ /* Zweimal auf denselben Tag: Tagesansicht, wie im Apple-Kalender */
    if(monWahl===mt.dataset.mtag&&matchMedia("(max-width:820px)").matches){ kalDatum=monWahl; kalModus="tag"; zeige(); nachOben(); return; }
    monWahl=mt.dataset.mtag; zeige();
    if(matchMedia("(max-width:820px)").matches) document.querySelector(".mon-seite")?.scrollIntoView({behavior:"smooth",block:"nearest"});
    return; }
  const mod=e.target.closest("[data-modus]");
  if(mod){ const alt=kalModus; kalModus=mod.dataset.modus; try{ localStorage.setItem(MODUS_KEY,kalModus); }catch(_){}
    if(kalModus==="monat"&&alt!=="monat") monWahl=kalDatum; if(alt==="monat"&&kalModus!=="monat") kalDatum=monWahl; zeige(); return; }
  const uf=e.target.closest("[data-ufilter]"); if(uf){ uniFilter=uf.dataset.ufilter; zeige(); return; }
  const adat=e.target.closest("[data-adat]"); if(adat){ aDatum=adat.dataset.adat; behalte("neuA",zeige); return; }
  const amod=e.target.closest("[data-amod]"); if(amod){ aModul=aModul===amod.dataset.amod?null:amod.dataset.amod; behalte("neuA",zeige); return; }
  const gst=e.target.closest("[data-gst]");
  if(gst){ const [pid,iid]=gst.dataset.gst.split("|"), p=S.geschenke.find(x=>x.id===pid), i=p&&p.ideen.find(x=>x.id===iid); if(!i) return;
    i.status=({idee:"gekauft",gekauft:"verschenkt",verschenkt:"idee"})[i.status]; i.jahr=i.status==="verschenkt"?new Date().getFullYear():null; sichern(); zeige();
    toast(i.status==="gekauft"?"Besorgt":i.status==="verschenkt"?"Verschenkt, bleibt als Erinnerung stehen":"Wieder Idee"); return; }
  const gweg=e.target.closest("[data-gweg]"); if(gweg){ const [pid,iid]=gweg.dataset.gweg.split("|"), p=S.geschenke.find(x=>x.id===pid); if(!p) return; p.ideen=p.ideen.filter(x=>x.id!==iid); sichern(); zeige(); return; }
  const ganl=e.target.closest("[data-ganl]"); if(ganl){ const [pid,a]=ganl.dataset.ganl.split("|"); anlassWahl[pid]=a; ganl.parentElement.querySelectorAll("[data-ganl]").forEach(c=>c.classList.toggle("on",c===ganl)); return; }
  const gadd=e.target.closest("[data-gadd]"); if(gadd){ ideeNeu(gadd.dataset.gadd); return; }
  const a=e.target.closest("[data-act]"); if(!a) return;
  const id=a.dataset.id, aktTag=()=>SEITE==="kalender"?(kalModus==="monat"?monWahl:kalModus==="tag"?kalDatum:(mkVon(pk(kalDatum))===mkVon(new Date())?heute():mkVon(pk(kalDatum)))):heute();
  switch(a.dataset.act){
    case "zu": zu(); break;
    case "einst": einstBlatt(false); break;
    case "neu":
      if(SEITE==="aufgaben"){ const i=document.getElementById("neuA"); nachOben(); i?.focus(); break; }
      if(SEITE==="uni"){ terBlatt(null); break; }
      if(SEITE==="geschenke"){ personBlatt(null); break; }
      eintragBlatt({datum:aktTag()}); break;
    case "neuEintrag": eintragBlatt({datum:aktTag()}); break;
    case "neuAm": eintragBlatt({datum:a.dataset.tag}); break;
    case "zumTag": kalDatum=a.dataset.tag; kalModus="tag"; zeige(); nachOben(); break;
    case "kalZurueck": kalSchritt(-1); break;
    case "kalVor": kalSchritt(1); break;
    case "kalHeute": { const alt=pk(kalDatum).getMonth(); kalDatum=heute(); monWahl=heute(); zeige(null,pk(kalDatum).getMonth()!==alt); break; }
    case "schnellA": { const i=document.getElementById("schnellA"); if(aufgabeNeu(i.value,heute())){ zeige(); toast("Für heute notiert"); } break; }
    case "neuA": { const i=document.getElementById("neuA"); if(aufgabeNeu(i.value,datumAus(aDatum),aModul,aWichtig)){ zeige(); document.getElementById("neuA")?.focus(); } break; }
    case "aWichtig": aWichtig=!aWichtig; behalte("neuA",zeige); break;
    case "aHaken": { const t=S.todos.find(x=>x.id===id); if(!t) break; t.done=!t.done; t.doneAt=t.done?Date.now():null; sichern(); zeige(); if(t.done) toast("Erledigt"); break; }
    case "aEdit": aufgabeBlatt(id); break;
    case "terHaken": { const t=S.termine.find(x=>x.id===id); if(!t) break; t.erledigt=!t.erledigt; sichern(); zeige(); if(t.erledigt) toast(t.art==="klausur"?"Geschrieben. Stark!":"Abgegeben. Stark!"); break; }
    case "modNeu": modBlatt(null); break;
    case "modEdit": modBlatt(id); break;
    case "terNeu": terBlatt(null,a.dataset.art); break;
    case "terEdit": terBlatt(id); break;
    case "perNeu": personBlatt(null); break;
    case "perEdit": personBlatt(id); break;
  }
});
document.addEventListener("change",e=>{
  const n=e.target.closest("[data-gnotiz]"); if(n){ const p=S.geschenke.find(x=>x.id===n.dataset.gnotiz); if(p){ p.notiz=n.value.trim(); sichern(); toast("Notiz gespeichert"); } }
  const mn=e.target.closest("[data-mnotiz]"); if(mn){ S.monNotiz=S.monNotiz||{}; const v=mn.value.trim(); if(v) S.monNotiz[mn.dataset.mnotiz]=v; else delete S.monNotiz[mn.dataset.mnotiz]; sichern(); toast("Notiz gespeichert"); }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") zu();
  if(e.key!=="Enter"||e.isComposing) return;
  if(e.target.id==="neuA"){ e.preventDefault(); document.querySelector('[data-act="neuA"]').click(); }
  if(e.target.id==="schnellA"){ e.preventDefault(); document.querySelector('[data-act="schnellA"]').click(); }
  if(e.target.dataset&&e.target.dataset.gneu){ e.preventDefault(); ideeNeu(e.target.dataset.gneu); }
});
/* Frisch bleiben: Die App bleibt auf dem Handy oft über Nacht offen */
const darfNeu=()=>!document.getElementById("ov").classList.contains("on")&&!document.activeElement?.matches("input,textarea,select");
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState!=="visible") return; syncJetzt(false); if(darfNeu()) zeige(); });
window.addEventListener("pageshow",()=>{ if(darfNeu()) zeige(); });
setInterval(()=>{ if(document.visibilityState==="visible"&&darfNeu()&&(SEITE==="heute"||SEITE==="kalender"||heute()!==renderTag)) zeige(); },60000);

laden(); huelle(); zeige("heute");
if(!S.gesehen) einstBlatt(true);
syncJetzt(false);
</script>
